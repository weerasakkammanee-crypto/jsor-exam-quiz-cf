ทำขึ้นต้องมีสำเนาคู่ฉบับอย่างน้อย 1 ฉบับ โดยให้ลงลายมือชื่อย่อของ <strong>ผู้ร่าง ผู้พิมพ์ ผู้ทาน และผู้ตรวจ</strong> ไว้ที่ <strong>ขอบล่างด้านขวา</strong> ของสำเนาคู่ฉบับ</li>\n<li><strong>หนังสือปะหน้าต่อจากฉบับเดิม</strong> (เรื่องเดียวกัน ต่อเนื่องกัน): ไม่กำหนดเลขที่หนังสือขึ้นใหม่ คงใช้เลขที่เดิม โดยใช้คำว่า <strong>\"ที่ต่อ กห ...../.....\"</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> หลักการอ้างถึงเฉพาะฉบับที่ผู้รับเคยได้รับมาก่อน รูปแบบย่อของการเขียนอ้างถึง และตำแหน่งลงลายมือชื่อย่อบนสำเนาคู่ฉบับ</p>\n<h2>8. การรับ-ส่งหนังสือ และการลงทะเบียน</h2>\n<p><strong>ขั้นตอนการรับหนังสือที่ถูกต้อง (เรียงลำดับ)</strong>:</p>\n<ol>\n<li>จัดลำดับความสำคัญและเร่งด่วน</li>\n<li>ตรวจเอกสาร</li>\n<li>ประทับตรารับหนังสือ</li>\n<li>ลงทะเบียนรับ</li>\n<li>แยกหนังสือส่งหน่วยที่เกี่ยวข้อง</li>\n</ol>\n<p>ข้อควรรู้เพิ่มเติม: ต้องจัดลำดับความเร่งด่วนของหนังสือเป็นอันดับแรกเสมอ ไม่ใช่ประทับตรารับจากบนลงล่างโดยไม่พิจารณาลำดับความสำคัญ และเมื่อเปิดซองพบว่าเอกสารไม่ถูกต้อง <strong>ห้ามส่งเรื่องคืนทันที</strong> ต้องรายงานผู้บังคับบัญชาก่อน</p>\n<ul>\n<li><strong>การลงทะเบียนหนังสือส่ง ช่อง \"ที่\"</strong>: ให้ลง<strong>รหัสพยัญชนะของหน่วยงานเจ้าของหนังสือและเลขที่หนังสือ</strong></li>\n<li><strong>เลขทะเบียนส่ง</strong>: ให้ลงเลขลำดับของ<strong>ทะเบียนหนังสือส่ง</strong> (คนละทะเบียนกับทะเบียนหนังสือรับ) เรียงลำดับติดต่อกัน — ห้ามใช้เลขทะเบียนหนังสือรับปนกัน</li>\n<li>การส่งหนังสือด้วยวิธี <strong>\"ส่งเองหรือนำสาร\"</strong>: สังเกตได้จากการที่ส่วนราชการเจ้าของหนังสือพิมพ์หรือเขียนชื่อไว้ที่ <strong>มุมบนด้านซ้ายของซองใต้ตราครุฑ</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ลำดับขั้นตอนการรับหนังสือ (สลับลำดับ \"ประทับตรา\" กับ \"ลงทะเบียน\" เป็นตัวลวงหลัก) และการแยกทะเบียนรับกับทะเบียนส่งไม่ให้ปนกัน</p>\n<h2>9. ชั้นความเร็วของหนังสือ</h2>\n<p>ชั้นความเร็วมี 3 ระดับ เรียงจากน้อยไปมาก: <strong>ด่วน → ด่วนมาก → ด่วนที่สุด</strong></p>\n<p><strong>\"ด่วนที่สุด\"</strong> หมายถึง ให้เจ้าหน้าที่ปฏิบัติ<strong>ในทันทีที่ได้รับหนังสือนั้น</strong> — เป็นระดับสูงสุด สูงกว่า \"ให้ปฏิบัติโดยเร็ว\" และ \"ให้ปฏิบัติเร็วกว่าปกติเท่าที่จะทำได้\" ซึ่งเป็นความหมายของด่วน/ด่วนมาก</p>\n<p>การประทับตราชั้นความเร็วในหนังสือภายใน ประทับด้วยหมึกสีแดง ในแนวเดียวกับเท้าครุฑ (ดูรายละเอียดหัวข้อ 2)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ความหมายของแต่ละระดับความเร็ว โดยเฉพาะ \"ด่วนที่สุด\" ต้องตอบว่า = ปฏิบัติทันที (ไม่ใช่แค่ปฏิบัติโดยเร็ว)</p>\n<h2>10. ชั้นความลับและการรักษาความปลอดภัยข้อมูลข่าวสาร</h2>\n<p><strong>องค์การรักษาความปลอดภัยฝ่ายพลเรือน</strong> คือ <strong>สำนักข่าวกรองแห่งชาติ สำนักนายกรัฐมนตรี</strong></p>\n<p><strong>ทะเบียนข้อมูลข่าวสารลับ</strong> ประกอบด้วย 3 ส่วน: <strong>ทะเบียนรับ ทะเบียนส่ง และทะเบียนควบคุมข้อมูลข่าวสารลับ</strong></p>\n<p>การปฏิบัติของนายทะเบียนข้อมูลข่าวสารลับ <strong>ด้านหลังซองชั้นในของเอกสารลับ</strong>: ให้ <strong>ลงชื่อกำกับข้างตราชั้นความลับ ข้างละ 1 ชื่อ ก่อนผนึกด้วยกาวหรือแถบใส</strong> (ไม่ใช่ลงชื่อ 2 ชื่อหลังผนึกกาวใสแล้ว และไม่ใช่การประทับตราชั้นความลับซ้ำบนหน้า/หลังซอง)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ชื่อหน่วยงานที่รับผิดชอบความปลอดภัยฝ่ายพลเรือน องค์ประกอบ 3 ส่วนของทะเบียนข้อมูลข่าวสารลับ และขั้นตอน/ลำดับการลงชื่อกำกับซองเอกสารลับ</p>\n<h2>11. การเก็บ ยืม และทำลายหนังสือราชการ</h2>\n<p><strong>การเก็บหนังสือ</strong> มี <strong>3 ลักษณะ</strong>:</p>\n<ol>\n<li>เก็บระหว่างปฏิบัติ — อยู่ในความรับผิดชอบของเจ้าของเรื่อง</li>\n<li>เก็บเมื่อปฏิบัติเสร็จแล้ว</li>\n<li>เก็บไว้เพื่อการตรวจสอบ</li>\n</ol>\n<p><strong>ตัวเลขสำคัญเรื่องอายุการเก็บ</strong>:</p>\n<ul>\n<li>อายุการเก็บหนังสือโดยปกติ: <strong>ไม่น้อยกว่า 10 ปี</strong></li>\n<li>หนังสือที่มีอายุครบ <strong>20 ปี</strong> นับจากวันที่จัดทำขึ้น เมื่อปฏิบัติตามระเบียบครบถ้วนแล้ว ต้องส่งให้สำนักหอจดหมายเหตุแห่งชาติ<strong>ภายในวันที่ 31 มกราคมของปีถัดไป</strong></li>\n</ul>\n<p><strong>ตราที่ใช้ประทับกำหนดระยะเวลาเก็บรักษา</strong> มี 2 แบบ: <strong>\"ห้ามทำลาย\"</strong> (เก็บตลอดไป) และ <strong>\"เก็บถึง พ.ศ. ...\"</strong> (มีกำหนดเวลา) — หนังสือที่ต้องเก็บไว้ตลอดไป ให้ประทับตราคำว่า <strong>\"ห้ามทำลาย\" ด้วยหมึกสีแดง</strong></p>\n<p><strong>การยืมหนังสือ</strong>:</p>\n<ul>\n<li>ยืมภายในส่วนราชการเดียวกัน: ผู้ยืมและผู้อนุญาตคือ <strong>หัวหน้าส่วนราชการระดับ ผบ.ร้อย. หรือเทียบเท่าขึ้นไป หรือผู้ที่หัวหน้าส่วนราชการนั้นมอบหมาย</strong></li>\n<li><strong>ห้ามบุคคลภายนอกยืมหนังสือราชการโดยเด็ดขาด</strong> ยกเว้นได้รับอนุญาตจากหัวหน้าส่วนราชการระดับ <strong>ผบ.กรม. หรือเทียบเท่าขึ้นไป และให้ดูหรือคัดลอกได้เท่านั้น</strong> (ยืมตัวจริงออกไปไม่ได้)</li>\n</ul>\n<p><strong>การทำลายหนังสือ</strong>:</p>\n<ul>\n<li>คณะกรรมการทำลายหนังสือ ประกอบด้วยประธานกรรมการและกรรมการอย่างน้อย 2 นาย โดยปกติแต่งตั้งจาก <strong>ข้าราชการชั้นสัญญาบัตร</strong> และมติของคณะกรรมการให้<strong>ถือเสียงข้างมากเป็นหลัก</strong></li>\n<li>กรณีประธานกรรมการไม่สามารถปฏิบัติหน้าที่ได้ ให้กรรมการที่มาประชุมเลือกกรรมการคนหนึ่งทำหน้าที่ประธานแทน ถ้ากรรมการผู้ใดไม่เห็นด้วยกับมติ ให้ <strong>บันทึกความเห็นแย้งไว้</strong> (ไม่ใช่งดลงนามหรือขอแต่งตั้งกรรมการเพิ่ม)</li>\n<li>การทำลายหนังสือกระทำได้เมื่อเข้าเงื่อนไขข้อใดข้อหนึ่งต่อไปนี้ (เป็นเงื่อนไข \"หรือ\" ไม่จำเป็นต้องครบทุกข้อ): ได้รับแจ้งจากสำนักหอจดหมายเหตุแห่งชาติว่าเห็นชอบแล้ว, หรือพ้น 60 วันแล้วสำนักหอจดหมายเหตุแห่งชาติไม่ตอบกลับมา, หรือผู้บังคับบัญชาระดับกองพลหรือเทียบเท่าอนุมัติสั่งการทำลาย</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวเลขสำคัญ (10 ปี, 20 ปี, 31 มกราคม, 60 วัน) ระดับผู้มีอำนาจอนุญาตยืมหนังสือ (แยกกรณีภายในหน่วยกับบุคคลภายนอกให้ถูก) และองค์ประกอบ/มติของคณะกรรมการทำลายหนังสือ</p>\n<h2>12. มาตรฐานตรา แบบพิมพ์ กระดาษ และซอง</h2>\n<ul>\n<li><strong>ตราครุฑสำหรับแบบพิมพ์มี 2 ขนาด</strong>: 3 ซม. และ 1.5 ซม.</li>\n<li><strong>มาตรฐานกระดาษโดยปกติมี 3 ขนาด</strong>: เอ4 เอ5 และเอ8</li>\n<li><strong>มาตรฐานซองโดยปกติมี 4 ขนาด</strong>: ซี4 ซี5 ซี6 และดีแอล</li>\n<li><strong>ซองขนาดดีแอล</strong> ใช้บรรจุหนังสือกระดาษตราครุฑโดย<strong>พับ 3</strong> (ไม่ใช่พับ 2 และไม่ใช่ไม่พับ)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนขนาดของตราครุฑ/กระดาษ/ซองให้แม่น และจำคู่ที่ถูกต้องของ \"ขนาดซอง–รูปแบบการพับกระดาษ\" โดยเฉพาะ <strong>ซองดีแอลต้องพับ 3</strong> ระวังตัวลวงที่สลับไปใส่รูปแบบการพับกับซองขนาดอื่น (เช่น ซี6) ให้คลาดเคลื่อน</p>"}, {"subject": 10, "subjectTitle": "วิชาแบบธรรมเนียม", "html": "<p>สรุปนี้สังเคราะห์จากคลังข้อสอบวิชา \"วิชาแบบธรรมเนียม\" จำนวน 82 ข้อ โดยดึงความรู้/หลักการ/ตัวเลขสำคัญที่แฝงอยู่ในคำถามและเฉลยออกมาเรียบเรียงเป็นเนื้อหาให้อ่านทำความเข้าใจก่อนสอบ</p>\n<h2>1. การลาประเภทต่างๆ ของข้าราชการทหาร</h2>\n<ul>\n<li><strong>ลาบวช (อุปสมบท):</strong> ต้องรับราชการมาแล้วไม่น้อยกว่า 3 ปีบริบูรณ์ และต้องเสนอเรื่องขออนุญาตถึงกองทัพบกก่อนวันอุปสมบทไม่น้อยกว่า 30 วัน</li>\n<li><strong>ลากิจไปต่างประเทศในทวีปยุโรป:</strong> สามารถลาเพิ่มจากกำหนดเดิมได้อีกไม่เกิน 10 วันทำการ (เผื่อเวลาเดินทางไกล)</li>\n<li><strong>ลาติดตามคู่สมรสที่ไปปฏิบัติราชการต่างประเทศ:</strong> ต้องรายงานตามลำดับชั้นจนถึง รมว.กห. (รัฐมนตรีว่าการกระทรวงกลาโหม) เป็นผู้อนุญาต ไม่ใช่แค่ระดับผู้บังคับกองพัน/ผู้บังคับการกรม/ผู้บัญชาการเหล่าทัพ</li>\n<li><strong>สิทธิลากิจโดยได้รับเงินเดือน:</strong> ปีละไม่เกิน 45 วันทำการ</li>\n<li><strong>การลากิจแต่ละครั้ง (ยศร้อยตรี):</strong> ลาได้ครั้งละไม่เกิน 1 วันทำการ (ยศยิ่งสูง เพดานวันลาต่อครั้งยิ่งมากขึ้นตามลำดับ)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวเลขจำนวนวัน/จำนวนปีที่กำหนดในระเบียบการลาแต่ละประเภท (บวช, ต่างประเทศ, ลากิจปีละ, ลากิจครั้งละ) และผู้มีอำนาจอนุมัติในแต่ละกรณี มักเอาตัวเลขใกล้เคียงมาสลับหลอก (เช่น 2 ปี/3 ปี, 15 วัน/30 วัน)</p>\n<h2>2. การรายงานตัว และการรายงานด่วน</h2>\n<ul>\n<li><strong>การลงนามในสมุดรายงานเมื่อไปราชการนอกจังหวัด:</strong> ต้องไปรายงานในวันแรกที่ถึง หากทำไม่ได้ให้ไปรายงานในวันรุ่งขึ้นหรือวันเปิดทำการถัดไป</li>\n<li><strong>กรณีไปราชการในกรุงเทพฯ</strong> และหน่วยที่ติดต่อตั้งอยู่ในศาลาว่าการกระทรวงกลาโหม ให้ไปรายงานตนที่ <strong>กรมสารบรรณทหารบก (กองธุรการ)</strong> เว้นวันหยุดราชการ</li>\n<li><strong>วิธีการรายงานด่วน</strong> ทำได้หลายทาง คือ ด้วยหนังสือ ด้วยวาจา และด้วยเครื่องมือสื่อสาร (ใช้วิธีใดก็ได้ตามความเร่งด่วนของสถานการณ์)</li>\n<li><strong>เหตุที่ต้องรายงานด่วน</strong> เช่น เกิดโรคระบาดแก่คนหรือสัตว์ในหรือใกล้ที่ตั้งหน่วย, ทหารถึงแก่ความตายหรือได้รับอันตรายสาหัสจากการทำร้ายตัวเอง, หรือทะเลาะวิวาทจนถึงแก่ความตาย, เหตุที่จะก่อความเสียหายแก่ประเทศชาติอย่างร้ายแรง แต่ <strong>การตายตามปกติทั่วไป ไม่ถือเป็นเหตุรายงานด่วน</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกแยะเหตุการณ์ที่ \"เข้าเกณฑ์รายงานด่วน\" กับเหตุการณ์ปกติที่ไม่เข้าเกณฑ์ (จุดหลอกคือความตาย/เหตุการณ์ที่ดูคล้ายกันแต่สาเหตุต่างกัน) และสถานที่/ขั้นตอนรายงานตัวเมื่อไปราชการต่างพื้นที่</p>\n<h2>3. เครื่องแบบ เครื่องหมาย และธรรมเนียมปฏิบัติ</h2>\n<ul>\n<li><strong>ถุงมือประกอบเครื่องแบบทหาร มี 3 สี</strong> ได้แก่ สีขาว สีนวล สีน้ำตาล โดย <strong>ถุงมือสีน้ำตาลใช้ในเวลาขี่ม้า</strong></li>\n<li><strong>ผ้าพันแขนทุกข์:</strong> ให้พันรอบแขนเสื้อ <strong>ข้างซ้ายเหนือศอก</strong></li>\n<li><strong>กระบี่มี 2 ขนาด</strong> สำหรับนายทหารประทวนชั้นจ่านายสิบ และนายทหารชั้นสัญญาบัตร คือ ความยาว 90 ซม.</li>\n<li><strong>โอกาสคาดกระบี่</strong> เช่น คุม/ประจำแถวกองทหารเกียรติยศหรือแห่นำ/แห่ตามเสด็จ, คุมแถวรับการตรวจพลสวนสนาม, งานพิธีกระทำสัตย์ปฏิญาณตน, งานสโมสรสันนิบาต, งานพระราชทานเพลิงศพเมื่อแต่งชุดปกติขาว, เป็นตุลาการศาลทหารเวลาพิจารณาคดี ณ ที่ตั้งศาลปกติ — <strong>ข้อที่ผิดหลัก</strong> คือ การไปในงานที่ \"ไม่ใช่\" พระราชพิธีหรือรัฐพิธีตามหมายกำหนดการ (ไม่ต้องคาดกระบี่)</li>\n<li><strong>เครื่องแบบปกติขาว</strong> ใช้ในโอกาส เช่น งานพระราชพิธี/รัฐพิธีตามหมายกำหนดการ, เฝ้าละอองธุลีพระบาท, งานพระราชทานเพลิงศพทหาร/ตำรวจตามประเพณี — แต่<strong>ไม่รวม</strong>กรณีการรายงานตนเอง</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ข้อสอบมักถามแบบ \"ข้อใดผิด/ไม่ถูกต้อง\" ต้องแยกโอกาสที่กำหนดให้ปฏิบัติกับข้อยกเว้นให้ชัดเจน โดยเฉพาะเรื่องกระบี่และเครื่องแบบปกติขาว รวมถึงจำสี/จำนวน/ตำแหน่งการสวมใส่อุปกรณ์ให้แม่นยำ</p>\n<h2>4. กองทหารเกียรติยศ และธงไชยเฉลิมพล</h2>\n<ul>\n<li>ผู้รับผิดชอบดูแลรักษาธงไชยเฉลิมพลประจำกองพันไม่ให้เป็นอันตราย คือ <strong>ผู้บังคับกองพัน</strong></li>\n<li>การจัดกองทหารเกียรติยศสำหรับศพทหารที่เสียชีวิตขณะประจำการ จัดในเวลาเผาหรือฝังตามลัทธิศาสนาของผู้ตาย แต่จะ <strong>งดจัด</strong> หากผู้ตายเสียชีวิตเนื่องจาก<strong>กระทำความผิดหรือประพฤติชั่วด้วยตนเอง</strong> (ต่างจากกรณีป่วย อุบัติเหตุ หรือปฏิบัติหน้าที่ราชการซึ่งยังคงจัดให้)</li>\n<li>ศพนายทหารชั้นนายพัน นายนาวา หรือนายนาวาอากาศขึ้นไป จัดทหารกองเกียรติยศ <strong>1 กองร้อย</strong> ถือปืนเล็กล้วน มีแตรเดี่ยว และแตรวง (ถ้ามี)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนกำลังพลที่จัด (1 กองร้อย) ตามชั้นยศผู้วายชนม์ และเงื่อนไขที่จะ \"งดจัด\" กองทหารเกียรติยศ</p>\n<h2>5. วินัยทหาร และการลงทัณฑ์</h2>\n<ul>\n<li>วินัยทหารเป็นหลักสำคัญที่สุดของทหาร มีตัวอย่างวินัยทหาร 9 ข้อ โดย <strong>ข้อ 8 คือ</strong> \"ไม่ตักเตือน สั่งสอน หรือลงทัณฑ์ผู้ใต้บังคับบัญชาที่กระทำผิดตามโทษานุโทษ\" ถือเป็นความผิดวินัยประการหนึ่ง</li>\n<li><strong>\"จำขัง\"</strong> หมายถึง การขังโดยส่งไปฝากให้อยู่ในความควบคุมของเรือนจำทหาร และห้ามคิดทัณฑ์รูปแบบใหม่นอกเหนือจากที่กำหนดไว้แล้วโดยเด็ดขาด (ทัณฑ์แต่ละชื่อมีความหมายต่างกัน เช่น กัก ขัง จำขัง ต้องแยกให้ถูก)</li>\n<li>ทหารกองหนุนที่หลีกเลี่ยงหรือขัดขืนไม่มาเข้ารับการเรียกพลเพื่อฝึกวิชาทหาร (30 วัน) <strong>ต้องถูกดำเนินคดีในชั้นศาล</strong> ไม่ใช่แค่ถูกลงทัณฑ์ทางวินัยหรือปลดออกจากราชการ</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> เนื้อหาวินัยทหาร 9 ข้อ (โดยเฉพาะข้อ 8) ความหมายของทัณฑ์แต่ละชื่อ (โดยเฉพาะ \"จำขัง\") และบทลงโทษกรณีทหารกองหนุนขัดขืนการเรียกพล ซึ่งต้องจำว่าเป็นคดีในชั้นศาล</p>\n<h2>6. ศาลทหาร และอำนาจศาล</h2>\n<ul>\n<li>ส่วนราชการที่มีอำนาจออก <strong>\"ข้อบังคับ\"</strong> คือ <strong>กระทรวงกลาโหม</strong></li>\n<li>ศาลทหารแบ่งออกเป็น <strong>3 ชั้น</strong> คือ ศาลทหารชั้นต้น ศาลทหารชั้นกลาง และศาลทหารสูงสุด</li>\n<li><strong>ศาลทหารกรุงเทพ</strong> จัดเป็น <strong>ศาลทหารชั้นต้น</strong></li>\n<li>ในเวลามีการรบ การสงคราม ประกาศใช้กฎอัยการศึก หรือหน่วยทหารในยุทธบริเวณ สามารถตั้ง <strong>\"ศาลอาญาศึก\"</strong> ได้ (เป็นศาลพิเศษ แยกจากศาลทหาร 3 ชั้นปกติ)</li>\n<li>คดีที่<strong>ไม่</strong>อยู่ในอำนาจศาลทหาร ได้แก่ คดีที่ศาลเห็นว่าไม่อยู่ในอำนาจศาลทหาร, คดีที่ต้องดำเนินในศาลคดีเด็กและเยาวชน, และคดีที่เกี่ยวพันกับคดีที่อยู่ในอำนาจศาลพลเรือน</li>\n<li><strong>การปฏิบัติหน้าที่ราชการสนาม</strong> หมายรวมถึง การปฏิบัติตามคำสั่งยุทธการ, การทำการรบตามคำสั่งที่ชอบด้วยกฎหมาย, และการปราบปรามผู้ก่อการร้ายทุกชนิด</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนชั้นศาลทหาร (3 ชั้น) และชื่อแต่ละชั้น ศาลทหารกรุงเทพอยู่ชั้นใด และเงื่อนไขในการตั้งศาลอาญาศึก</p>\n<h2>7. ยศ เครื่องราชอิสริยาภรณ์ และเหรียญกล้าหาญ</h2>\n<ul>\n<li>นายทหารสัญญาบัตรยศ <strong>พันโท</strong> ขอพระราชทานเครื่องราชอิสริยาภรณ์ชั้น <strong>ต.ช. (ตริตาภรณ์ช้างเผือก)</strong></li>\n<li>นายทหารยศ <strong>ร้อยเอก</strong> ขอพระราชทานเครื่องราชอิสริยาภรณ์ชั้น <strong>จ.ช. (จัตุรถาภรณ์ช้างเผือก)</strong></li>\n<li>ตัวอย่าง <strong>เหรียญกล้าหาญ</strong> คือ <strong>\"เหรียญรามมาลา\"</strong> ต้องแยกให้ออกจากเหรียญอื่นที่ชื่อคล้ายกันแต่ไม่ใช่เหรียญกล้าหาญ เช่น เหรียญรามาธิบดี เหรียญจุลจอมเกล้าวิเศษ เหรียญเบญจมาภรณ์ช้างเผือก</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่ชั้นยศกับชั้นเครื่องราชอิสริยาภรณ์ที่ขอพระราชทานได้ (พ.ท. = ต.ช., ร.อ. = จ.ช.) และชื่อเหรียญกล้าหาญที่ถูกต้อง ระวังสับสนกับเหรียญ/เครื่องราชฯ ประเภทอื่นที่ชื่อคล้ายกัน</p>\n<h2>8. การบรรจุ ปลด อาวุโส และนอกราชการ</h2>\n<ul>\n<li>ผู้มีอำนาจบรรจุและปลดตำแหน่งทหารชั้นสัญญาบัตร คือ <strong>รัฐมนตรีว่าการกระทรวงกลาโหม (รมต.กห.)</strong></li>\n<li>นายทหารนอกราชการชั้นยศ <strong>พ.ต. – พ.ท.</strong> อยู่ในประเภทนอกราชการได้ไม่เกินอายุ <strong>60 ปี</strong></li>\n<li>การจัดลำดับอาวุโสของข้าราชการทหารกรณีมียศเท่ากัน ให้ถือ <strong>ผู้ที่ได้รับยศก่อน เป็นผู้มีอาวุโสสูงกว่า</strong> (ไม่ใช่ผู้ที่รับราชการก่อน เงินเดือนมากกว่า หรืออายุราชการมากกว่า)</li>\n<li>การเดินทางไปราชการโดยเครื่องบิน นายทหารสัญญาบัตรที่รับเงินเดือนระดับ <strong>น.3 ขึ้นไป</strong> จึงจะเดินทางโดยเครื่องบินได้</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> หลักเกณฑ์ตัดสิน \"อาวุโส\" เมื่อยศเท่ากัน (ยึดวันได้รับยศก่อน-หลัง) เกณฑ์อายุนอกราชการตามชั้นยศ และระดับเงินเดือนขั้นต่ำที่เดินทางโดยเครื่องบินได้</p>\n<h2>9. หนังสือราชการ และการรักษาความลับ</h2>\n<ul>\n<li>เอกสารราชการที่มีทั้งตัวเรื่องและรายละเอียดประกอบ ให้เรียงลำดับศักดิ์จากสูงไปต่ำดังนี้: <strong>ตัวเรื่อง → ผนวก → อนุผนวก → ใบแทรก → ใบแนบ</strong></li>\n<li>ประกาศ แถลงการณ์ และข่าว จัดเป็น <strong>\"หนังสือประชาสัมพันธ์\"</strong></li>\n<li><strong>แถลงการณ์</strong> คือข้อความที่ทางราชการแถลงเพื่อทำความเข้าใจในกิจการของทางราชการให้ทราบทั่วกัน หน่วยที่มีอำนาจออกแถลงการณ์คือระดับ <strong>กองทัพบก</strong></li>\n<li>ชั้นความลับ ไล่ระดับผลกระทบจากน้อยไปมาก: <strong>\"ลับ\"</strong> = เปิดเผยแล้วเสียหายแก่ประโยชน์แห่งรัฐ, <strong>\"ลับมาก\"</strong> = เสียหายแก่ประโยชน์แห่งรัฐอย่างมาก, <strong>\"ลับที่สุด\"</strong> = เสียหายแก่ประโยชน์แห่งรัฐอย่างร้ายแรง</li>\n<li>องค์การรักษาความปลอดภัยฝ่ายตำรวจ คือ <strong>กองบัญชาการตำรวจสันติบาล</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ลำดับศักดิ์ของเอกสารแนบ (ตัวเรื่อง-ผนวก-อนุผนวก-ใบแทรก-ใบแนบ) ประเภทของหนังสือราชการ (ประชาสัมพันธ์) และการไล่ระดับชั้นความลับ 3 ระดับตามความรุนแรงของผลกระทบ</p>\n<h2>10. การส่งกำลังบำรุง และสิ่งอุปกรณ์ (สป.)</h2>\n<ul>\n<li><strong>\"สิ่งอุปกรณ์\" (สป.)</strong> หมายถึง สิ่งของที่จำเป็นทั้งมวลสำหรับหน่วยทหาร รวมทั้งที่มีไว้เพื่อการดำรงอยู่และการปฏิบัติการของหน่วยทหาร</li>\n<li>การเบิกใช้ใบเบิกและส่งสิ่งอุปกรณ์ใช้แบบ <strong>ทบ.400-007</strong></li>\n<li>ชื่อระเบียบที่เขียนถูกต้อง: \"ระเบียบ ทบ. ว่าด้วยการส่งกำลังบำรุง สป. ประเภท 2 <strong>และ</strong> 4 พ.ศ.2534\" (สังเกตคำเชื่อม \"และ\" ไม่ใช่เครื่องหมาย \"-\" หรือ \",\")</li>\n<li><strong>กรมสรรพาวุธทหารบก</strong> รับผิดชอบ สป. เช่น รถยนต์สงคราม เครื่องควบคุมการยิง วัสดุทำความสะอาดอาวุธ แต่<strong>ไม่รับผิดชอบ</strong>น้ำกรดกำมะถันและน้ำกลั่นที่ใช้กับแบตเตอรี่</li>\n<li><strong>กรมการทหารสื่อสาร</strong> รับผิดชอบ สป. ที่ใช้สำหรับงานอุตุนิยมวิทยา</li>\n<li><strong>\"การซ่อมแก้\"</strong> คือการซ่อมยุทโธปกรณ์ชำรุดให้ใช้การได้ รวมถึงการปรับ การถอดเปลี่ยน การเชื่อม การย้ำ และการทำให้แข็งแรง (แยกจากการซ่อมใหญ่ การซ่อมสร้าง และการดัดแปลงแก้ไข)</li>\n<li><strong>\"เสบียงประเภท ข.\"</strong> คือ อาหารบรรจุกระป๋องหรือภาชนะทำนองเดียวกัน เก็บรักษาได้นานที่อุณหภูมิปกติ ก่อนรับประทานต้องปรุงหรือประกอบเล็กน้อย</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> นิยามศัพท์เฉพาะด้านส่งกำลังบำรุง (สป., การซ่อมแก้, เสบียงแต่ละประเภท) หน่วยงานที่รับผิดชอบ สป. แต่ละชนิด และเลขแบบฟอร์ม/ชื่อระเบียบที่ต้องจำให้ตรงตัวอักษร</p>\n<h2>11. คำสั่งยุทธการ และกระบวนการตกลงใจทางทหาร</h2>\n<ul>\n<li>คำสั่งยุทธการออกได้ 3 วิธี คือ <strong>ด้วยวาจา, บอกให้จด, และเป็นลายลักษณ์อักษร</strong></li>\n<li>หัวข้อของคำสั่งยุทธการมี <strong>5 หัวข้อ</strong> เรียงตามลำดับ: 1) สถานการณ์ 2) ภารกิจ 3) การปฏิบัติ 4) การช่วยรบ 5) การบังคับบัญชาและการสื่อสาร</li>\n<li>เมื่อได้รับภารกิจ (คำสั่งเตือน/คำสั่งยุทธการ/คำสั่งเป็นส่วนๆ) ต้องเริ่มวิเคราะห์ภารกิจโดยใช้ปัจจัย <strong>METT-T</strong> (Mission-ภารกิจ, Enemy-ข้าศึก, Terrain and weather-ภูมิประเทศและลมฟ้าอากาศ, Troops-กำลังที่มีอยู่, Time available-เวลาที่มีอยู่)</li>\n<li>การพิจารณาผลกระทบของภูมิประเทศและลมฟ้าอากาศต่อกำลังทั้งสองฝ่ายในเชิงยุทธวิธี ใช้หลัก <strong>OCOKA</strong></li>\n<li>ขั้นตอนการแสวงข้อตกลงใจทางทหาร เรียงลำดับ: <strong>วิเคราะห์ภารกิจ → พัฒนาหนทางปฏิบัติ → วิเคราะห์หนทางปฏิบัติ → ตกลงใจ/ปฏิบัติ</strong> (ข้อสอบมักสลับลำดับ \"พัฒนา\" กับ \"วิเคราะห์หนทางปฏิบัติ\" ให้จำผิด)</li>\n<li>ระบบ BOS (Battlefield Operating System) มี 7 ระบบ (BOS7) โดยงานด้าน <strong>\"การควบคุมบังคับบัญชา\"</strong> เป็นงานของ<strong>เหล่าสื่อสาร</strong>โดยตรง</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวย่อ METT-T และ OCOKA ห้ามสลับตัวอักษรหรือความหมาย ลำดับ 5 หัวข้อของคำสั่งยุทธการ และลำดับ 4 ขั้นตอนของกระบวนการแสวงข้อตกลงใจทางทหาร</p>\n<h2>12. การฝึกของกองทัพบก</h2>\n<ul>\n<li>ฝ่ายอำนวยการแบ่งออกเป็น <strong>3 ประเภท</strong></li>\n<li>หน่วยงานรับผิดชอบจัดทำนโยบายการฝึกของ ทบ. คือ <strong>กรมยุทธการทหารบก</strong></li>\n<li>ประเภทของการฝึกแบ่งตามหลักเกณฑ์ 3 แบบ ได้แก่ แบ่งตามขนาดหน่วย, แบ่งตามการจัดสรรงบประมาณ, และแบ่งตามลักษณะการจัดหน่วยเข้ารับการฝึก (<strong>ไม่รวม</strong> \"แบ่งตามความต้องการของหน่วยเหนือ\")</li>\n<li>ระดับการฝึก: การฝึกผู้บังคับบัญชา (ผบ.) และฝ่ายอำนวยการ (ฝอ.) ทุกระดับ จัดอยู่ใน <strong>\"การฝึกเป็นบุคคล\"</strong> ส่วนการฝึกปัญหาที่บังคับการ จัดอยู่ใน <strong>\"การฝึกเป็นหน่วยเบื้องสูง\"</strong></li>\n<li>งานการฝึกหลักในการฝึกประจำปี มี <strong>4 งาน</strong> ได้แก่ การฝึกงานในหน้าที่, การฝึกตามวงรอบประจำปี, การฝึกพิเศษ, และการฝึกเฉพาะหน้าที่ (<strong>ไม่รวม</strong> \"การฝึกทางยุทธวิธี\" ซึ่งเป็นคำกว้างเกินไป)</li>\n<li>ความมุ่งหมายของการฝึกงานในหน้าที่ (นายทหารประทวน/สัญญาบัตร) คือ ฝึกกำลังพลให้มีความรู้ความชำนาญตามงานในหน้าที่และ ชกท. ของตน ให้ปฏิบัติงานร่วมกันได้อย่างสอดคล้อง พร้อมรับภารกิจต่างๆ อยู่ตลอดเวลา</li>\n<li>ตัวอย่างการฝึกเฉพาะหน้าที่ เช่น <strong>การฝึกหลักสูตรทหารมหาดเล็กราชวัลลภฯ</strong></li>\n<li>การฝึกแก้ปัญหาบนโต๊ะทราย และภูมิประเทศจำลอง เป็นการฝึกทางยุทธวิธีที่จำเป็นต้องใช้เครื่องหมายทางทหารแทนหน่วยทหารจริงขณะฝึก</li>\n<li><strong>\"กำหนดการฝึก\"</strong> หมายถึง คำสั่งชี้แจงของผู้บังคับบัญชา ซึ่งกล่าวถึงวิธีที่จะให้หน่วยสำเร็จภารกิจการฝึกหรือบรรลุความมุ่งหมายภายในเวลาที่กำหนดให้</li>\n<li>องค์ประกอบของคำสั่งการฝึก (กำหนดการฝึก) ได้แก่ นโยบายการฝึกของ ทบ., ความมุ่งหมายการฝึกทั่วไป, ข้อแนะนำในการฝึกต่างๆ (<strong>ไม่รวม</strong> \"คำแนะนำในการประสาน\")</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวเลข/รายการจำแนกประเภท (ฝ่ายอำนวยการ 3 ประเภท, หลักเกณฑ์แบ่งประเภทการฝึก 3 แบบ, งานฝึกหลัก 4 งาน) และการจับคู่ระดับการฝึก (บุคคล/หน่วยเบื้องต้น/หน่วยเบื้องสูง) กับกิจกรรมที่ถูกต้อง</p>\n<h2>13. กิจการพลเรือน และการปฏิบัติการจิตวิทยา (ปจว.)</h2>\n<ul>\n<li>สาเหตุที่ฝ่ายทหารต้องเข้าไปดำเนินงานด้านกิจการพลเรือน มีครบทุกด้าน ได้แก่ เพื่อสนับสนุนเจ้าหน้าที่พลเรือนในยามฉุกเฉิน/สงครามให้ปฏิบัติหน้าที่ได้ต่อเนื่อง, เพื่อใช้ประโยชน์จากเจ้าหน้าที่พลเรือน/ประชาชน/ทรัพยากรสนับสนุนภารกิจทางทหาร, และเพื่อช่วยรัฐบาลรักษาความมั่นคงภายใน/พัฒนาประเทศ</li>\n<li>บทบาทของทหารเกี่ยวกับการปกครอง: <strong>ในพื้นที่ฝ่ายเรา</strong> ให้เจ้าหน้าที่พลเรือนรับผิดชอบโดยตรง ทหารเข้าสนับสนุนตามคำร้องขอ หรือเข้ารับผิดชอบเองเมื่อเกินขีดความสามารถของฝ่ายพลเรือนหรือเพื่อหวังผลทางการรบ; <strong>ในพื้นที่ฝ่ายตรงข้าม</strong> ทหารจะเข้าควบคุมอำนาจการปกครองทั้งปวงโดยอาศัยหลักมนุษยธรรม หลักประโยชน์ของผู้ถูกปกครอง และหลักการรับรู้สิทธิซึ่งกันและกัน — <strong>ไม่ใช่</strong>การปล่อยให้ประชาชนในพื้นที่ปกครองตนเอง</li>\n<li>ปัจจัยด้านสังคมจิตวิทยาที่ฝ่ายทหารควรยึดเป็นหลักปฏิบัติ ได้แก่ <strong>ด้านการศึกษา ด้านศิลปวัฒนธรรม ด้านสาธารณสุข</strong></li>\n<li>วัตถุประสงค์การปฏิบัติการจิตวิทยา (ปจว.) เพื่อก่อให้เกิดอิทธิพลเหนือจิตใจกลุ่มเป้าหมาย เป้าหมายสำคัญคือ <strong>การขัดขวาง บั่นทอนการปฏิบัติของฝ่ายตรงข้าม</strong></li>\n<li><strong>\"การปลูกฝังอุดมการณ์ทางทหาร\"</strong> หมายถึง การปลูกฝังความเชื่อในระบอบการปกครองของสังคมหนึ่งเปรียบเทียบกับอีกสังคมหนึ่งว่าแบบใดเหมาะสมกว่ากัน</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ความแตกต่างของบทบาททหารด้านการปกครองในพื้นที่ฝ่ายเรากับพื้นที่ฝ่ายตรงข้าม และการแยกแยะนิยามศัพท์ใกล้เคียงกันมาก เช่น กิจการพลเรือน / สังคมจิตวิทยา / ปจว. / อุดมการณ์ทางทหาร</p>\n<h2>14. งบประมาณ ข่าวกรอง และการสื่อสารทางราชการ</h2>\n<ul>\n<li>ที่มาของงบประมาณกระทรวงกลาโหม ได้รับจาก พ.ร.บ.งบประมาณรายจ่ายประจำปี, พ.ร.บ.งบประมาณรายจ่ายเพิ่มเติม, งบกลาง หรือได้รับโอนจากส่วนราชการอื่น</li>\n<li><strong>เงินนอกงบประมาณ</strong> หมายถึง เงินทั้งปวงที่อยู่ในความรับผิดชอบของส่วนราชการ นอกจากเงินงบประมาณรายจ่าย เงินรายได้แผ่นดิน เงินเบิกเกินส่งคืน และเงินเหลือจ่ายปีเก่าส่งคืน</li>\n<li>งบประมาณแบ่งออกเป็น <strong>2 งวด</strong> คือ งวดที่ 1 (1 ต.ค. – 31 มี.ค.) และงวดที่ 2 (1 เม.ย. – 30 ก.ย.)</li>\n<li>คำนิยามที่ต้องแยกให้ออก: <strong>\"ข่าว\" (news)</strong> = เรื่องราว/การพรรณนาเหตุการณ์ที่เกิดขึ้นผ่านสื่อต่างๆ; <strong>\"ข่าวสาร\" (information)</strong> = ข้อมูลที่ปรากฏในสื่อรูปแบบต่างๆ ที่ได้จากการตรวจการณ์ การรายงานตามสายงาน หรือแหล่งข่าว เพื่อนำไปผลิตเป็นข่าวกรอง; <strong>\"ข่าวกรอง\" (intelligence)</strong> = ผลผลิตจากการรวบรวมและดำเนินกรรมวิธีต่อข่าวสาร (เป็นลำดับการแปรรูปข้อมูลจากดิบไปสุก)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> การแยกความหมายและลำดับการแปรรูป ข่าว → ข่าวสาร → ข่าวกรอง และรายละเอียดงวดงบประมาณ (ช่วงเดือน) กับความหมายของเงินนอกงบประมาณ</p>\n<h2>15. โครงการ และการบรรยายสรุป (ทักษะการบริหารและการสื่อสาร)</h2>\n<ul>\n<li><strong>\"โครงการ\"</strong> คือ งานที่มีลักษณะพิเศษต่างไปจากการดำเนินงานตามปกติของหน่วย</li>\n<li><strong>การบรรยายสรุปทางทหาร</strong> ประกอบด้วยองค์ประกอบหลัก 4 อย่าง คือ การบรรยายสรุปข่าว, การบรรยายสรุปข้อตกลงใจ, การบรรยายสรุปภารกิจ, และการบรรยายสรุปของฝ่ายอำนวยการ</li>\n<li>การบรรยายสรุปของฝ่ายอำนวยการ มีขึ้นเพื่อ <strong>ทบทวนรายละเอียดที่สำคัญ</strong> (ไม่ใช่เพื่อขอข่าวสารหรือขอข้อตกลงใจ)</li>\n<li>เทคนิคการใช้เครื่องช่วยบรรยายสรุป (แผ่นใส/เครื่องฉาย): ควรใช้ข้อความ<strong>ไม่เกิน 9 บรรทัด</strong>ต่อแผ่น, แผ่นต้องไม่เก่าหรือพร่ามัว, และควรใช้<strong>ไม่เกิน 32 แผ่นต่อชั่วโมง</strong></li>\n<li>องค์ประกอบของการศึกษาและการทำงานที่ดี ได้แก่ มีหลักการ มีหลักฐาน และมีประสบการณ์ของตนเอง (<strong>ไม่รวม</strong>ประสบการณ์ของผู้ร่วมงาน)</li>\n<li>คุณสมบัติของ \"การพูดเป็น\" ได้แก่ พูดเรื่องยากให้เป็นเรื่องง่าย, พูดขยายความเล็กให้เป็นเรื่องใหญ่ (เน้นย้ำจุดสำคัญ), พูดไปสู่การบรรลุวัตถุประสงค์ (<strong>ไม่รวม</strong> \"พูดฟังแล้วน่าเชื่อถือ\" ซึ่งไม่ใช่คุณสมบัติที่ระบุในหลักการนี้)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนองค์ประกอบของการบรรยายสรุปทางทหาร (4 อย่าง) ตัวเลขจำกัดของเทคนิคใช้สื่อ (ไม่เกิน 9 บรรทัด/แผ่น, ไม่เกิน 32 แผ่น/ชม.) และตัวเลือกลวงที่ดูใกล้เคียงแต่ไม่ตรงตามหลักการที่กำหนดไว้</p>\n<h2>16. ความรู้ทั่วไป: ประชาคมอาเซียน</h2>\n<ul>\n<li>อาเซียน (สมาคมประชาชาติแห่งเอเชียตะวันออกเฉียงใต้) มี <strong>3 เสาหลัก</strong> ได้แก่ ประชาคมเศรษฐกิจอาเซียน (AEC), ประชาคมการเมืองความมั่นคงอาเซียน (APSC), และประชาคมสังคม-วัฒนธรรมอาเซียน (ASCC)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ต้องจำชื่อ 3 เสาหลักของอาเซียนให้ครบและถูกต้อง ระวังตัวเลือกลวงที่ใส่ \"ประชาคมทางทหารอาเซียน\" ซึ่งไม่มีอยู่จริงในโครงสร้างอาเซียน</p>"}]}</script>

var SERVER_URL = 'https://script.google.com/macros/s/AKfycbyMUjeV7vUYMV6iFd01ZSq_6LUsX5zuylUUVGzZV6_f5AaK57CDxbjDMbYMik5hklO9/exec';

function apiCall(action, payload, cb){
  payload = payload || {};
  payload.action = action;
  fetch(SERVER_URL, {method:'POST', body: JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(data){ cb(null, data); })
    .catch(function(err){ cb(err, null); });
}

function doRegister(username, password, cb){
  apiCall('register', {username:username, password:password}, function(err, data){
    if(err || !data || !data.ok){ cb((data && data.error) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'); return; }
    if(!data.token || !data.username){ cb(STALE_SERVER_MSG); return; }
    auth.username = data.username; auth.token = data.token;
    cb(null, !!data.pending);
  });
}
function doLogin(username, password, cb){
  apiCall('login', {username:username, password:password}, function(err, data){
    if(err || !data || !data.ok){ cb((data && data.error) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'); return; }
    if(!data.token || !data.username){ cb(STALE_SERVER_MSG); return; }
    auth.username = data.username; auth.token = data.token;
    cb(null);
  });
}

// ---- Single Active Session handling ----
// Each account only ever has ONE valid session token stored on the server;
// logging in again (from another device/tab/person) immediately invalidates
// the previous one. When THIS tab's token gets invalidated that way, the
// server marks the error with errorCode:'session_invalid'. Whenever we see
// that, we stop whatever this tab was doing and bounce back to the login
// screen with a clear explanation, instead of leaving a half-broken screen
// showing generic errors.
function handleIfSessionKicked(data){
  if(data && data.errorCode === 'session_invalid'){
    var msg = data.error || 'เซสชันนี้สิ้นสุดการใช้งานแล้ว กรุณาเข้าสู่ระบบใหม่';
    auth.username = null; auth.token = null;
    FULL_QUESTIONS = null; FULL_SUBJECTS = null;
    PLAYERS = []; currentPlayerName = null;
    session = null;
    authState.error = msg; authState.mode='login'; authState.username='';
    authState.busy = false;
    renderAuthScreen();
    return true;
  }
  return false;
}

// ---- full question bank (fetched after login; answers are stripped
// server-side and only revealed per-question via checkAnswer, or after
// a whole exam is submitted via submitExam) ----
var FULL_QUESTIONS = null;
var FULL_SUBJECTS = null;

function fetchFullBank(cb){
  apiCall('getQuestions', {token:auth.token}, function(err, data){
    if(handleIfSessionKicked(data)){ return; }
    if(err || !data || !data.ok){ cb((data && data.error) || 'โหลดคลังข้อสอบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); return; }
    if(!Array.isArray(data.questions)){ cb(STALE_SERVER_MSG); return; }
    FULL_QUESTIONS = data.questions;
    var map = {};
    FULL_QUESTIONS.forEach(function(q){
      if(!map[q.subject]) map[q.subject] = {num:q.subject, title:q.subjectTitle, count:0};
      map[q.subject].count++;
    });
    FULL_SUBJECTS = Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.num-b.num;});
    setupState.selectedSubjects = FULL_SUBJECTS.map(function(s){return s.num;});
    cb(null);
  });
}
function checkAnswer(id, chosen, cb){
  apiCall('checkAnswer', {token:auth.token, id:id, chosen:chosen}, function(err, data){
    if(handleIfSessionKicked(data)){ return; }
    if(err || !data || !data.ok){ cb((data && data.error) || 'ตรวจคำตอบไม่สำเร็จ ลองใหม่อีกครั้ง', null); return; }
    cb(null, data);
  });
}
function submitExamToServer(payload, cb){
  payload.token = auth.token;
  apiCall('submitExam', payload, function(err, data){
    if(handleIfSessionKicked(data)){ return; }
    if(err || !data || !data.ok){ cb((data && data.error) || 'ส่งข้อสอบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', null); return; }
    cb(null, data);
  });
}

var PLAYERS = [];        // {name, createdAt, attempts:[{ts,mode,subjects,subjectLabel,total,correct,pct,passPct,passed}]}
var currentPlayerName = null;

function getPlayer(name){
  return PLAYERS.find(function(p){ return p.name===name; }) || null;
}
function getCurrentPlayer(){
  return currentPlayerName ? getPlayer(currentPlayerName) : null;
}
function slugName(s){ return String(s).trim().replace(/\s+/g,' '); }
function bestAttempt(player){
  var examAttempts = player.attempts.filter(function(a){return a.mode==='exam';});
  if(!examAttempts.length) return null;
  return examAttempts.reduce(function(best,a){ return (!best || a.pct>best.pct) ? a : best; }, null);
}
function lastAttempt(player){
  var examAttempts = player.attempts.filter(function(a){return a.mode==='exam';});
  return examAttempts.length ? examAttempts[examAttempts.length-1] : null;
}
function downloadJSON(filename, obj){
  var blob = new Blob([JSON.stringify(obj,null,1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function exportPlayerProfile(player){
  downloadJSON('สถิติ-'+player.name+'.json', {
    app:'jsor-exam-quiz-profile', version:2,
    name:player.name, createdAt:player.createdAt, attempts:player.attempts
  });
}
function mergeAttemptsIntoPlayers(list){
  var byName = {};
  list.forEach(function(a){
    var name = slugName(a.playerName || '');
    if(!name) return;
    (byName[name] = byName[name] || []).push(a);
  });
  Object.keys(byName).forEach(function(name){
    var p = getPlayer(name);
    if(!p){ p = {name:name, createdAt:Date.now(), attempts:[]}; PLAYERS.push(p); }
    var haveTs = {};
    p.attempts.forEach(function(a){ haveTs[String(a.ts)]=true; });
    byName[name].forEach(function(a){
      if(!haveTs[String(a.ts)]){ p.attempts.push(a); haveTs[String(a.ts)]=true; }
    });
    p.attempts.sort(function(a,b){return a.ts-b.ts;});
  });
}
function fetchMyAttempts(cb){
  apiCall('getMyAttempts', {token:auth.token}, function(err, data){
    if(handleIfSessionKicked(data)){ return; } // auth screen already rendered; don't let the caller overwrite it with its own error UI
    if(err || !data || !data.ok){ cb && cb((data && data.error) || 'โหลดสถิติไม่สำเร็จ'); return; }
    if(!Array.isArray(data.attempts)){ cb && cb(STALE_SERVER_MSG); return; }
    PLAYERS = [];
    mergeAttemptsIntoPlayers(data.attempts || []);
    currentPlayerName = auth.username;
    if(!getPlayer(currentPlayerName)){
      PLAYERS.push({name:currentPlayerName, createdAt:Date.now(), attempts:[]});
    }
    cb && cb(null);
  });
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function wirePasswordToggle(inputId, toggleId){
  var input = document.getElementById(inputId);
  var toggle = document.getElementById(toggleId);
  if(!input || !toggle) return;
  toggle.onclick = function(e){
    e.preventDefault();
    if(input.type==='password'){ input.type='text'; toggle.textContent='🙈'; }
    else { input.type='password'; toggle.textContent='👁️'; }
  };
}

function bindAuthEvents(){
  document.querySelectorAll('[data-authmode]').forEach(function(tab){
    tab.onclick = function(){
      authState.mode = tab.getAttribute('data-authmode');
      authState.error = '';
      renderAuthScreen();
    };
  });
  document.getElementById('tryDemoBtn').onclick = function(){ renderDemoSetup(); };
  document.getElementById('adminLinkBtn').onclick = function(e){ e.preventDefault(); renderAdminLogin(); };
  wirePasswordToggle('authPassword','authPasswordToggle');
  wirePasswordToggle('authPassword2','authPassword2Toggle');

  function submit(){
    var uEl = document.getElementById('authUsername');
    var pEl = document.getElementById('authPassword');
    var username = uEl ? uEl.value.trim() : '';
    var password = pEl ? pEl.value : '';
    authState.username = username;
    if(!username || !password){ authState.error='กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบ'; renderAuthScreen(); return; }
    if(authState.mode==='register'){
      var p2El = document.getElementById('authPassword2');
      var password2 = p2El ? p2El.value : '';
      if(password!==password2){ authState.error='รหัสผ่านทั้งสองช่องไม่ตรงกัน'; renderAuthScreen(); return; }
    }
    authState.busy = true; authState.error=''; renderAuthScreen();
    var fn = authState.mode==='register' ? doRegister : doLogin;
    fn(username, password, function(err, pending){
      if(err){ authState.busy=false; authState.error=err; renderAuthScreen(); return; }
      authState.busy = false;
      if(pending){ renderPendingApproval(); return; }
      afterLoginSuccess();
    });
  }
  document.getElementById('authSubmitBtn').onclick = submit;
  ['authUsername','authPassword','authPassword2'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onkeydown = function(e){ if(e.key==='Enter') submit(); };
  });
}

function afterLoginSuccess(){
  app.innerHTML = '<div class="card"><h1>🔄 กำลังโหลดคลังข้อสอบ...</h1>'+
    '<p class="lead">รอสักครู่นะครับ กำลังดึงข้อสอบและสถิติของคุณจากเซิร์ฟเวอร์</p></div>';
  fetchFullBank(function(err){
    if(err){ authState.busy=false; authState.error=err; renderAuthScreen(); return; }
    fetchMyAttempts(function(){
      authState.busy=false;
      renderSetup();
    });
  });
}

function updateSummaryLine(){
  var el = document.getElementById('summaryLine');
  if(!el) return;
  var pool = poolSize();
  var n = resolveCount();
  var txt = 'จะทำทั้งหมด <b>'+Math.min(n,pool)+'</b> ข้อ จากคลัง <b>'+pool+'</b> ข้อในวิชาที่เลือก';
  if(pool===0) txt = '<b style="color:var(--bad)">กรุณาเลือกอย่างน้อย 1 วิชา</b>';
  el.innerHTML = txt;
  var startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.disabled = (pool===0);
}

function resolveCount(){
  var pool = poolSize();
  if(setupState.countChoice==='all') return pool;
  if(setupState.countChoice==='custom') return Math.max(1, Math.min(setupState.customCount||1, pool));
  return Math.min(parseInt(setupState.countChoice,10), pool);
}

function bindSetupEvents(){
  var lbBtn = document.getElementById('viewHistoryBtn');
  if(lbBtn){ lbBtn.onclick = function(){ renderMyHistory(); }; }
  var logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.onclick = function(){
      if(confirm('ต้องการออกจากระบบหรือไม่?')) doLogout();
    };
  }

  document.getElementById('selAllBtn').onclick = function(){
    setupState.selectedSubjects = FULL_SUBJECTS.map(function(s){return s.num;});
    renderSetup();
  };
  document.getElementById('selNoneBtn').onclick = function(){
    setupState.selectedSubjects = [];
    renderSetup();
  };
  document.getElementById('openStudyLibBtn').onclick = function(){
    studyState.back = 'setup';
    renderStudyLibrary();
  };
  document.querySelectorAll('[data-study-subj]').forEach(function(link){
    link.onclick = function(e){
      e.preventDefault(); e.stopPropagation();
      studyState.back = 'setup';
      renderStudyArticle(parseInt(link.getAttribute('data-study-subj'),10));
    };
  });
  document.querySelectorAll('[data-subj-cb]').forEach(function(cb){
    cb.onclick = function(e){
      e.stopPropagation();
      var num = parseInt(cb.getAttribute('data-subj-cb'),10);
      var idx = setupState.selectedSubjects.indexOf(num);
      if(cb.checked){ if(idx===-1) setupState.selectedSubjects.push(num); }
      else { if(idx!==-1) setupState.selectedSubjects.splice(idx,1); }
      updateSummaryLine();
      cb.closest('.subject-item').classList.toggle('checked', cb.checked);
    };
  });
  document.querySelectorAll('.subject-item').forEach(function(item){
    item.addEventListener('click', function(e){
      if(e.target.tagName==='INPUT') return;
      var cb = item.querySelector('input');
      cb.checked = !cb.checked;
      cb.onclick({stopPropagation:function(){}, target:cb});
    });
  });
  document.querySelectorAll('.mode-card').forEach(function(card){
    card.onclick = function(){
      setupState.mode = card.getAttribute('data-mode');
      renderSetup();
    };
  });
  document.querySelectorAll('#countPills .pill').forEach(function(p){
    p.onclick = function(){
      setupState.countChoice = p.getAttribute('data-count');
      renderSetup();
    };
  });
  var customInput = document.getElementById('customCountInput');
  if(customInput){
    customInput.oninput = function(){
      setupState.customCount = parseInt(customInput.value,10)||1;
      updateSummaryLine();
    };
  }
  document.querySelectorAll('[data-toggle]').forEach(function(p){
    p.onclick = function(){
      var t = p.getAttribute('data-toggle');
      if(t==='shuffleQ') setupState.shuffleQ = true;
      if(t==='orderQ') setupState.shuffleQ = false;
      if(t==='shuffleOpt') setupState.shuffleOpt = true;
      if(t==='orderOpt') setupState.shuffleOpt = false;
      renderSetup();
    };
  });
  var timeSelect = document.getElementById('timeSelect');
  if(timeSelect){
    timeSelect.onchange = function(){ setupState.timeChoice = timeSelect.value; };
  }
  var passInput = document.getElementById('passPctInput');
  if(passInput){
    passInput.oninput = function(){ setupState.passPct = parseInt(passInput.value,10)||60; };
  }
  document.getElementById('startBtn').onclick = function(){ startQuiz({source:'full'}); };
}

// MY EXAM HISTORY VIEW — personal only. There is no cross-user leaderboard;
// this shows only the logged-in account's own past exam-mode attempts, so
// they can see whether they're improving over time.
// ============================================================
function renderMyHistory(refreshed){
  exitBtn.classList.remove('hidden');
  exitBtn.textContent = '← กลับไปหน้าตั้งค่า';
  exitBtn.onclick = function(){ renderSetup(); };
  headerSub.textContent = '📊 ประวัติการสอบของฉัน (เฉพาะคะแนนโหมดจำลองสอบ)';

  if(!refreshed){
    app.innerHTML = '<div class="card"><h1>📊 ประวัติการสอบของฉัน</h1>'+
      '<p class="lead">🔄 กำลังโหลดประวัติคะแนนจากเซิร์ฟเวอร์กลาง...</p></div>';
    fetchMyAttempts(function(err){
      if(err){
        app.innerHTML = '<div class="card"><h1>⚠️ โหลดประวัติการสอบไม่สำเร็จ</h1>'+
          '<p class="lead">'+escapeHtml(err)+'</p>'+
          '<button class="btn primary" id="retryLbBtn">🔄 ลองใหม่</button></div>';
        document.getElementById('retryLbBtn').onclick = function(){ renderMyHistory(); };
        return;
      }
      renderMyHistory(true);
    });
    return;
  }

  var me = getCurrentPlayer();
  var examAttempts = me ? me.attempts.filter(function(a){return a.mode==='exam';}) : [];
  var sorted = examAttempts.slice().sort(function(a,b){ return b.ts - a.ts; }); // newest first
  var best = bestAttempt(me || {attempts:[]});
  var avgPct = examAttempts.length
    ? Math.round((examAttempts.reduce(function(s,a){return s+a.pct;},0) / examAttempts.length) * 10) / 10
    : null;

function buildSession(pool, cfg){
  // pool: array of question objects. cfg: {source, mode, count, shuffleQ,
  // shuffleOpt, timeLimitSec, passPct, subjectLabel}
  var list = pool.slice();
  if(cfg.shuffleQ) list = shuffle(list);
  var n = Math.min(cfg.count, list.length);
  var chosen = list.slice(0, n);

  var questions = chosen.map(function(q){
    var letters = ['A','B','C','D'];
    var order = cfg.shuffleOpt ? shuffle(letters) : letters;
    return {
      id: q.id,
      subject: q.subject,
      subjectTitle: q.subjectTitle,
      q: q.q,
      answerLetter: q.answer || null, // present for demo; revealed progressively for full bank
      optOrder: order,
      options: q.options
    };
  });

  session = {
    source: cfg.source,
    mode: cfg.mode,
    questions: questions,
    current: 0,
    answers: {}, // index -> chosen original-letter
    flagged: {},
    startedAt: Date.now(),
    timeLimitSec: cfg.timeLimitSec,
    passPct: cfg.passPct,
    subjectLabelOverride: cfg.subjectLabel || null,
    finished: false,
    timerId: null,
    checking: false,
    recorded: false,
    examSubmitted: false,
    examSubmitting: false
  };

  exitBtn.classList.remove('hidden');
  exitBtn.textContent = '✕ ออกจากแบบทดสอบ';
  exitBtn.onclick = function(){
    if(confirm('ต้องการออกจากแบบทดสอบตอนนี้หรือไม่? ความคืบหน้าจะไม่ถูกบันทึก')){
      stopTimer();
      if(session.source==='demo') renderAuthScreen(); else renderSetup();
    }
  };

  if(session.mode==='practice'){
    renderPractice();
  } else {
    renderExamQuestion();
    if(session.timeLimitSec) startTimer();
  }
}

function startQuiz(opts){
  if(opts.source==='demo'){
    buildSession(DEMO, {
      source:'demo', mode:opts.mode,
      count: DEMO.length, shuffleQ:true, shuffleOpt:true,
      timeLimitSec: opts.mode==='exam' ? 15*60 : null,
      passPct: 60
    });
  } else {
    var pool = FULL_QUESTIONS.filter(function(q){return setupState.selectedSubjects.indexOf(q.subject)!==-1;});
    var n = resolveCount();
    var subjNums = setupState.selectedSubjects.slice().sort(function(a,b){return a-b;});
    var subjectLabel = (subjNums.length===FULL_SUBJECTS.length) ? 'ทุกวิชา' :
      subjNums.map(function(num){
        var s = FULL_SUBJECTS.filter(function(x){return x.num===num;})[0];
        return s ? s.title.replace(/^วิชา/,'') : num;
      }).join(', ');
    buildSession(pool, {
      source:'full', mode:setupState.mode,
      count:n, shuffleQ:setupState.shuffleQ, shuffleOpt:setupState.shuffleOpt,
      timeLimitSec: (setupState.mode==='exam' && setupState.timeChoice!=='none') ? parseInt(setupState.timeChoice,10)*60 : null,
      passPct: setupState.passPct,
      subjectLabel: subjectLabel
    });
  }
}

function stopTimer(){
  if(session && session.timerId){ clearInterval(session.timerId); session.timerId=null; }
}

function startTimer(){
  session.deadline = Date.now() + session.timeLimitSec*1000;
  session.timerId = setInterval(function(){
    var remain = Math.max(0, Math.round((session.deadline - Date.now())/1000));
    updateTimerDisplay(remain);
    if(remain<=0){
      stopTimer();
      finishExam();
    }
  }, 1000);
  updateTimerDisplay(session.timeLimitSec);
}

function updateTimerDisplay(remainSec){
  var el = document.getElementById('timerDisplay');
  if(!el) return;
  var m = Math.floor(remainSec/60), s = remainSec%60;
  el.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  el.classList.toggle('low', remainSec<=60);
}

  var html = '<div class="card">';
  html += '<div class="quiz-top">';
  html += '<div class="progress-wrap"><div class="progress-bar"><div style="width:'+pct+'%"></div></div>'+
    '<div class="progress-label">ข้อ '+(session.current+1)+' จาก '+session.questions.length+'</div></div>';

  html += '<div class="q-subject-tag">'+(session.source==='demo'?'🎯 ตัวอย่างฟรี — ':'')+escapeHtml(q.subjectTitle)+'</div>';
  html += '<div class="q-text">'+escapeHtml(q.q)+'</div>';
  html += '<div class="options">';
  q.optOrder.forEach(function(letter, i){
    var displayLetter = ['A','B','C','D'][i];
    var cls='option';
    if(checking){
      cls+=' disabled';
      if(letter===chosenLetter) cls+=' selected';
    } else if(answered){
      cls+=' disabled';
      if(letter===q.answerLetter) cls+=' correct';
      else if(letter===chosenLetter) cls+=' incorrect';
    } else if(letter===chosenLetter){
      cls+=' selected';
    }
    html += '<div class="'+cls+'" data-letter="'+letter+'">'+
      '<span class="letter">'+displayLetter+'</span>'+
      '<span class="text">'+escapeHtml(q.options[letter])+'</span></div>';
  });
  html += '</div>';

  if(checking){
    html += '<div class="feedback-box" style="background:var(--surface-2);color:var(--text-muted);">🔄 กำลังตรวจคำตอบ...</div>';
  } else if(answered){
    var correct = chosenLetter===q.answerLetter;
    html += '<div class="feedback-box '+(correct?'good':'bad')+'">'+
      (correct ? '🎉 ถูกต้อง! เก่งมากทหาร!' : '💥 ยังไม่ถูกนะ ลองข้อหน้าต่อ! — เฉลยคือข้อที่ทำเครื่องหมายสีเขียว')+
      '</div>';
  }

  html += '<div class="quiz-nav">';
  html += '<button class="btn ghost" id="prevBtn" '+(session.current===0||checking?'disabled':'')+'>← ข้อก่อนหน้า</button>';
  html += '<div class="right-group">';
  html += '<button class="btn danger ghost" id="endEarlyBtn" '+(checking?'disabled':'')+'>🏁 จบและดูสรุปผล</button>';
  if(session.current < session.questions.length-1){
    html += '<button class="btn primary" id="nextBtn" '+(!answered||checking?'disabled':'')+'>ข้อถัดไป →</button>';
  } else {
    html += '<button class="btn primary" id="nextBtn" '+(!answered||checking?'disabled':'')+'>ดูสรุปผล →</button>';
  }
  html += '</div></div>';
  html += '</div>';

  app.innerHTML = html;

  document.querySelectorAll('.option').forEach(function(opt){
    opt.onclick = function(){
      if(session.answers.hasOwnProperty(session.current) || session.checking) return;
      var letter = opt.getAttribute('data-letter');
      if(session.source==='demo'){
        session.answers[session.current] = letter;
        renderPractice();
      } else {
        session.checking = true;
        session.answers[session.current] = letter;
        renderPractice();
        var qRef = q;
        checkAnswer(qRef.id, letter, function(err, data){
          session.checking = false;
          if(err){
            delete session.answers[session.current];
            alert('⚠️ '+err);
            renderPractice();
            return;
          }
          qRef.answerLetter = data.answer;
          renderPractice();
        });
      }
    };
  });
  var prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.onclick = function(){ session.current--; renderPractice(); };
  var nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = function(){
    if(session.current < session.questions.length-1){ session.current++; renderPractice(); }
    else { renderResults(); }
  };
  var endBtn = document.getElementById('endEarlyBtn');
  if(endBtn) endBtn.onclick = function(){
    if(confirm('ต้องการจบและดูสรุปผลตอนนี้เลยหรือไม่?')) renderResults();
  };
}

var reviewFilter = 'all';

function renderResults(){
  stopTimer();

  // Full-bank exam attempts must be scored & recorded server-side (the
  // client never has the answer key for these), so submit first and
  // only then render the results screen.
  if(session.mode==='exam' && session.source==='full' && !session.examSubmitted){
    if(session.examSubmitting) return;
    session.examSubmitting = true;
    headerSub.textContent = 'กำลังส่งข้อสอบ...';
    exitBtn.classList.add('hidden');
    app.innerHTML = '<div class="card"><h1>📮 กำลังส่งข้อสอบ...</h1>'+
      '<p class="lead">รอสักครู่ กำลังส่งคำตอบไปตรวจและบันทึกคะแนนที่เซิร์ฟเวอร์กลาง</p></div>';

    var answersPayload = session.questions.map(function(q,i){
      return { id:q.id, chosen: session.answers[i] || null };
    });
    var subjNums = [];
    session.questions.forEach(function(q){ if(subjNums.indexOf(q.subject)===-1) subjNums.push(q.subject); });
    subjNums.sort(function(a,b){return a-b;});

    submitExamToServer({
      mode:'exam', ts: Date.now(), subjects: subjNums,
      subjectLabel: session.subjectLabelOverride, passPct: session.passPct,
      answers: answersPayload
    }, function(err, data){
      session.examSubmitting = false;
      if(err){
        exitBtn.classList.remove('hidden');
        exitBtn.textContent = 'กลับไปหน้าตั้งค่า';
        exitBtn.onclick = function(){ session=null; renderSetup(); };
        app.innerHTML = '<div class="card"><h1>⚠️ ส่งข้อสอบไม่สำเร็จ</h1>'+
          '<p class="lead">'+escapeHtml(err)+' — คำตอบของคุณยังอยู่ครบ ลองส่งใหม่อีกครั้งได้เลย</p>'+
          '<button class="btn primary" id="retrySubmitBtn">🔄 ลองส่งข้อสอบอีกครั้ง</button></div>';
        document.getElementById('retrySubmitBtn').onclick = renderResults;
        return;
      }
      var byId = {};
      (data.review||[]).forEach(function(r){ byId[r.id]=r; });
      session.questions.forEach(function(q){
        if(byId[q.id]) q.answerLetter = byId[q.id].answer;
      });
      session.examSubmitted = true;
      session.serverScore = data; // {total,correct,pct,passPct,passed}
      renderResultsInner();
    });
    return;
  }

  renderResultsInner();
}

function renderResultsInner(){
  headerSub.textContent = 'สรุปผลการทำแบบทดสอบ';
  exitBtn.classList.remove('hidden');
  exitBtn.textContent = 'กลับไปหน้าตั้งค่า';
  exitBtn.onclick = function(){ session=null; renderExitToHome(); };

  var total = session.questions.length;
  var correctCount = 0;
  var bySubject = {};

  session.questions.forEach(function(q,i){
    var chosen = session.answers[i];
    var isCorrect = (q.answerLetter!=null) && chosen === q.answerLetter;
    if(isCorrect) correctCount++;
    if(!bySubject[q.subject]) bySubject[q.subject] = {title:q.subjectTitle, total:0, correct:0};
    bySubject[q.subject].total++;
    if(isCorrect) bySubject[q.subject].correct++;
  });

  var pct, passed, passPct;
  if(session.serverScore){
    correctCount = session.serverScore.correct;
    total = session.serverScore.total;
    pct = session.serverScore.pct;
    passPct = session.serverScore.passPct || session.passPct || 60;
    passed = session.serverScore.passed;
  } else {
    pct = total>0 ? Math.round((correctCount/total)*1000)/10 : 0;
    passPct = session.passPct || 60;
    passed = pct >= passPct;
  }

  // Record into local PLAYERS cache for immediate comparison UI. The
  // server already appended the attempt row during submitExam, so this
  // is purely a local mirror — no extra network call needed here, and
  // practice mode / demo mode never record anything (business rule:
  // only full-bank exam-mode attempts count).
  if(session.mode==='exam' && session.source==='full' && !session.recorded){
    session.recorded = true;
    var player = getCurrentPlayer();
    if(player){
      var prevBest = bestAttempt(player);
      var prevLast = lastAttempt(player);
      var attempt = {
        ts: Date.now(), mode:'exam', subjects: Object.keys(bySubject).map(Number),
        subjectLabel: session.subjectLabelOverride, total: total, correct: correctCount,
        pct: pct, passPct: passPct, passed: passed
      };
      player.attempts.push(attempt);
      session.compareInfo = {
        playerName: player.name,
        deltaVsLast: prevLast ? Math.round((pct - prevLast.pct)*10)/10 : null,
        deltaVsBest: prevBest ? Math.round((pct - prevBest.pct)*10)/10 : null,
        isNewBest: !prevBest || pct > prevBest.pct
      };
    }
  }

  var html = '<div class="card">';
  html += '<div class="score-hero">';
  var heroEmoji = (session.mode==='exam') ? (passed ? '🏆' : '🎖️') : (pct>=80 ? '🌟' : (pct>=50 ? '🎖️' : '🪖'));
  html += '<div class="medal">'+heroEmoji+'</div>';
  html += '<div class="big">'+correctCount+' / '+total+'</div>';
  html += '<div class="pct">คิดเป็น '+pct+'%</div>';
  if(session.mode==='exam'){
    html += '<div class="badge-pass '+(passed?'pass':'fail')+'">'+(passed?'🏅 ผ่านเกณฑ์ เก่งมาก! ('+passPct+'%)':'💪 ยังไม่ผ่านเกณฑ์ สู้ต่ออีกนิดนะ! ('+passPct+'%)')+'</div>';
  }
  html += '</div>';

  // ---- comparison / scoreboard block ----
  if(session.mode==='exam' && session.source==='full'){
    var ci = session.compareInfo;
    var activePlayer = getPlayer(ci ? ci.playerName : null);
    if(ci && activePlayer){
      html += '<div class="compare-box">';
      html += '<div class="compare-title">🪪 ผลของ '+escapeHtml(activePlayer.name)+'</div>';
      html += '<div class="compare-lines">';
      if(ci.deltaVsLast===null){
        html += '<div class="compare-line">🆕 นี่คือครั้งแรกที่ทำโหมดจำลองสอบของคุณ — ยินดีต้อนรับเข้าประจำการ!</div>';
      } else {
        var upLast = ci.deltaVsLast>0, sameLast = ci.deltaVsLast===0;
        html += '<div class="compare-line '+(upLast?'up':(sameLast?'same':'down'))+'">'+
          (upLast?'📈 ดีขึ้นกว่าครั้งก่อน':(sameLast?'➖ เท่ากับครั้งก่อน':'📉 ต่ำกว่าครั้งก่อน'))+
          ' '+(ci.deltaVsLast>0?'+':'')+ci.deltaVsLast+'%</div>';
      }
      if(ci.isNewBest && ci.deltaVsBest!==null){
        html += '<div class="compare-line up">🎉 ทำลายสถิติสูงสุดของตัวเอง! (+'+ci.deltaVsBest+'% จากสถิติเดิม)</div>';
      } else if(ci.isNewBest){
        html += '<div class="compare-line up">🌟 สถิติสูงสุดครั้งแรกของคุณ!</div>';
      } else if(ci.deltaVsBest!==null){
        html += '<div class="compare-line">🏅 สถิติสูงสุดของคุณอยู่ที่ '+(bestAttempt(activePlayer)?bestAttempt(activePlayer).pct:'-')+'% (ครั้งนี้ยังห่างอยู่ '+Math.abs(ci.deltaVsBest)+'%)</div>';

      html += '</div>';
      html += '<div class="row-actions" style="margin-top:10px;">';
      html += '<button class="btn small primary" id="saveProfileBtn">💾 ดาวน์โหลดสำรองคะแนน</button>';
      html += '<button class="btn small" id="goHistoryBtn">📊 ดูประวัติการสอบ</button>';
      html += '</div>';
      html += '</div>';
    }
  } else if(session.source==='demo'){
    html += '<div class="compare-box guest">';
    html += '<div class="compare-line">🎯 นี่คือคะแนนจากชุดตัวอย่างฟรี — ไม่ถูกบันทึกในประวัติการสอบ สมัครสมาชิกเพื่อทำข้อสอบเต็ม '+totalBankCount()+' ข้อ พร้อมเก็บสถิติจริง</div>';
    html += '<div class="row-actions" style="margin-top:8px;"><button class="btn small primary" id="goRegisterBtn">📝 สมัครสมาชิกเลย</button></div>';
    html += '</div>';
  } else {
    html += '<div class="compare-box guest"><div class="compare-line">📘 นี่คือโหมดฝึกทำ — คะแนนจะไม่ถูกนับในประวัติการสอบ (นับเฉพาะโหมดจำลองสอบของบัญชีที่ล็อกอิน)</div></div>';
  }

  html += '<h2 style="margin-top:20px;">คะแนนแยกตามวิชา</h2>';
  html += '<table class="subject-table"><thead><tr><th>วิชา</th><th>คะแนน</th><th style="width:36%">สัดส่วน</th></tr></thead><tbody>';
  Object.keys(bySubject).sort(function(a,b){return a-b;}).forEach(function(k){
    var s = bySubject[k];
    var sp = Math.round((s.correct/s.total)*100);
    html += '<tr><td>'+escapeHtml(s.title)+'</td><td>'+s.correct+'/'+s.total+'</td>'+
      '<td><div class="bar-cell"><div class="bar"><div style="width:'+sp+'%"></div></div><span>'+sp+'%</span></div></td></tr>';
  });
  html += '</tbody></table>';

  html += '<div class="row-actions" style="margin-top:18px;">';
  html += '<button class="btn primary" id="retryBtn">🔄 ทำแบบทดสอบชุดใหม่</button>';
  html += '<button class="btn" id="reviewBtn">ดูเฉลยรายข้อ ↓</button>';
  html += '</div>';
  html += '</div>';

  // review section
  html += '<div class="card" id="reviewSection">';
  html += '<h2>เฉลยรายข้อ</h2>';
  html += '<div class="review-filters">';
  [['all','ทั้งหมด'],['wrong','ตอบผิด'],['right','ตอบถูก'],['unanswered','ยังไม่ตอบ']].forEach(function(f){
    html += '<div class="pill '+(reviewFilter===f[0]?'active':'')+'" data-filter="'+f[0]+'">'+f[1]+'</div>';
  });
  html += '</div>';
  html += '<div id="reviewList"></div>';
  html += '</div>';

  app.innerHTML = html;
  renderReviewList();

  document.getElementById('retryBtn').onclick = function(){
    session=null;
    if(FULL_QUESTIONS) renderSetup(); else renderAuthScreen();
  };
  document.getElementById('reviewBtn').onclick = function(){
    document.getElementById('reviewSection').scrollIntoView({behavior:'smooth'});
  };
  document.querySelectorAll('[data-filter]').forEach(function(p){
    p.onclick = function(){ reviewFilter = p.getAttribute('data-filter'); renderResultsInner(); document.getElementById('reviewSection').scrollIntoView(); };
  });
  var saveBtn = document.getElementById('saveProfileBtn');
  if(saveBtn){
    saveBtn.onclick = function(){
      var p = getPlayer(session.compareInfo.playerName);
      if(p) exportPlayerProfile(p);
    };
  }
  var goLb = document.getElementById('goHistoryBtn');
  if(goLb){ goLb.onclick = function(){ renderMyHistory(); }; }
  var goReg = document.getElementById('goRegisterBtn');
  if(goReg){ goReg.onclick = function(){ authState.mode='register'; authState.error=''; renderAuthScreen(); }; }
}

function renderExitToHome(){
  if(FULL_QUESTIONS) renderSetup(); else renderAuthScreen();
}

function renderReviewList(){
  var list = document.getElementById('reviewList');
  var html = '';
  session.questions.forEach(function(q,i){
    var chosen = session.answers[i];
    var status = !chosen ? 'unanswered' : (chosen===q.answerLetter ? 'right' : 'wrong');
    if(reviewFilter!=='all' && reviewFilter!==status) return;

    html += '<div class="review-item '+status+'">';
    html += '<div class="rq">'+(i+1)+'. '+escapeHtml(q.q)+' <span class="q-subject-tag">'+escapeHtml(q.subjectTitle)+'</span></div>';
    q.optOrder.forEach(function(letter,idx){
      var dl = ['A','B','C','D'][idx];
      var tagParts = [];
      if(letter===q.answerLetter) tagParts.push('เฉลย');
      if(letter===chosen) tagParts.push('คำตอบของคุณ');
      var color = letter===q.answerLetter ? 'var(--good)' : (letter===chosen ? 'var(--bad)' : 'var(--text)');
      var tagTxt = tagParts.length ? ' — <span class="tag" style="color:'+color+'">['+tagParts.join(', ')+']</span>' : '';
      html += '<div class="ra-line" style="color:'+(tagParts.length?color:'var(--text-muted)')+'">'+dl+'. '+escapeHtml(q.options[letter])+tagTxt+'</div>';
    });
    if(status==='unanswered'){
      html += '<div class="ra-line" style="margin-top:4px;color:var(--warn);font-weight:600;">ไม่ได้ตอบข้อนี้</div>';
    }
    if(!q.answerLetter){
      html += '<div class="ra-line" style="margin-top:4px;color:var(--text-muted);font-style:italic;">(ไม่ได้เปิดดูเฉลยข้อนี้ระหว่างฝึกทำ)</div>';
    }
    html += '</div>';
  });
  if(!html) html = '<p class="lead">ไม่มีข้อที่ตรงกับตัวกรองนี้</p>';
  list.innerHTML = html;
}

// ============================================================
// ADMIN PANEL (developer-only — separate from regular user login,
// gated by a secret admin key set inside the Apps Script backend)
// ============================================================
var adminAuth = { key: null };
var adminState = { error:'', busy:false };

function adminApiCall(action, extra, cb){
  var payload = extra || {};
  payload.adminKey = adminAuth.key;
  apiCall(action, payload, cb);
}

function fmtDateShort(v){
  var d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  var pad = function(n){return (n<10?'0':'')+n;};
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function renderAdminLogin(){
  exitBtn.classList.remove('hidden');
  exitBtn.textContent = '← กลับหน้าแรก';
  exitBtn.onclick = function(){ renderAuthScreen(); };
  headerSub.textContent = 'สำหรับผู้ดูแลระบบ';

  var html = '<div class="card auth-card">';
  html += '<h1>⚙️ เข้าสู่ระบบผู้ดูแล</h1>';
  html += '<p class="lead">กรอกรหัสลับผู้ดูแลระบบ (ตั้งไว้ในไฟล์ Apps Script ฝั่งเซิร์ฟเวอร์)</p>';
  html += '<div class="auth-form">';
  html += '<div class="field"><label class="field-label">รหัสลับผู้ดูแลระบบ</label>'+
    '<div class="pw-field"><input type="password" id="adminKeyInput" placeholder="ADMIN_KEY">'+
    '<button type="button" class="pw-toggle" id="adminKeyToggle" tabindex="-1">👁️</button></div></div>';
  html += '</div>';
  if(adminState.error){
    html += '<div class="server-status err" style="margin-top:12px;">⚠️ '+escapeHtml(adminState.error)+'</div>';
  }
  html += '<div class="start-bar" style="justify-content:flex-start;margin-top:16px;">';
  html += '<button class="btn primary" id="adminLoginBtn" style="padding:11px 26px;" '+(adminState.busy?'disabled':'')+'>'+
    (adminState.busy?'🔄 กำลังตรวจสอบ...':'เข้าสู่ระบบผู้ดูแล →')+'</button>';
  html += '</div></div>';
  app.innerHTML = html;
  wirePasswordToggle('adminKeyInput','adminKeyToggle');

  function submit(){
    var keyEl = document.getElementById('adminKeyInput');
    var key = keyEl ? keyEl.value : '';
    if(!key){ adminState.error='กรุณากรอกรหัสลับ'; renderAdminLogin(); return; }
    adminState.busy = true; adminState.error=''; renderAdminLogin();
    adminAuth.key = key;
    adminApiCall('adminListUsers', {}, function(err, data){
      adminState.busy = false;
      if(err || !data || !data.ok || !Array.isArray(data.users)){
        adminAuth.key = null;
        var msg = (data && data.error) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง';
        if(!err && data && data.ok && !Array.isArray(data.users)){
          msg = 'เซิร์ฟเวอร์ตอบกลับไม่ตรงรูปแบบที่คาดไว้ — เซิร์ฟเวอร์ (Apps Script) อาจยังเป็นโค้ดรุ่นเก่าที่ไม่รองรับหน้าแอดมิน ตรวจสอบว่าวางโค้ด Code.gs ชุดล่าสุดและกด Deploy เวอร์ชันใหม่แล้วจริงหรือยัง';
        }
        adminState.error = msg;
        renderAdminLogin();
        return;
      }
      renderAdminPanel(data.users);
    });
  }
  document.getElementById('adminLoginBtn').onclick = submit;
  document.getElementById('adminKeyInput').onkeydown = function(e){ if(e.key==='Enter') submit(); };
}

var adminTab = 'users';

function renderAdminPanel(users){
  exitBtn.classList.remove('hidden');
  exitBtn.textContent = '🚪 ออกจากหน้าแอดมิน';
  exitBtn.onclick = function(){ adminAuth.key=null; renderAuthScreen(); };
  headerSub.textContent = 'แผงควบคุมผู้ดูแลระบบ';

  var html = '<div class="card">';
  html += '<h1>⚙️ แผงควบคุมผู้ดูแลระบบ</h1>';
  html += '<p class="lead">จัดการบัญชีผู้ใช้และประวัติคะแนนของระบบ</p>';
  html += '<div class="auth-tabs">';
  html += '<div class="auth-tab '+(adminTab==='users'?'active':'')+'" data-admintab="users">ผู้ใช้ ('+users.length+')</div>';
  html += '<div class="auth-tab '+(adminTab==='attempts'?'active':'')+'" data-admintab="attempts">ประวัติคะแนน</div>';
  html += '</div>';

  if(adminState.error){
    html += '<div class="server-status err">⚠️ '+escapeHtml(adminState.error)+'</div>';
  }

  if(adminTab==='users'){
    if(!users.length){
      html += '<p class="lead" style="font-style:italic;">ยังไม่มีผู้สมัครสมาชิกเลย</p>';
    } else {
      html += '<table class="subject-table"><thead><tr><th>ชื่อผู้ใช้</th><th>สมัครเมื่อ</th><th>สถานะ</th><th>ผลสอบ</th><th>จัดการ</th></tr></thead><tbody>';
      users.forEach(function(u){
        html += '<tr>';
        html += '<td><b>'+escapeHtml(u.username)+'</b>'+(u.activeSession?' <span class="you-tag">ออนไลน์</span>':'')+'</td>';
        html += '<td>'+fmtDateShort(u.createdAt)+'</td>';
        html += '<td>'+(u.suspended?'<span style="color:var(--bad);font-weight:700;">⏸️ ยังไม่เปิดใช้งาน</span>':'<span style="color:var(--good);font-weight:700;">✅ เปิดใช้งานแล้ว</span>')+'</td>';
        html += '<td>'+(u.examCount>0 ? u.bestPct+'% ('+u.examCount+' ครั้ง)' : '-')+'</td>';
        html += '<td><div class="row-actions" style="margin:0;">'+
          '<button class="btn small" data-admin-action="resetpw" data-username="'+escapeHtml(u.username)+'">🔑 รีเซ็ตรหัส</button>'+
          '<button class="btn small" data-admin-action="'+(u.suspended?'unsuspend':'suspend')+'" data-username="'+escapeHtml(u.username)+'">'+(u.suspended?'✅ อนุมัติ/เปิดใช้งาน':'⛔ ระงับบัญชี')+'</button>'+
          '<button class="btn small danger" data-admin-action="delete" data-username="'+escapeHtml(u.username)+'">🗑️ ลบบัญชี</button>'+
          '</div></td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    app.innerHTML = html;
    bindAdminUsersEvents(users);
  } else {
    html += '</div>';
    app.innerHTML = html;
    app.innerHTML += '<div class="card" id="attemptsCard"><p class="lead">🔄 กำลังโหลดประวัติคะแนน...</p></div>';
    bindAdminTabEvents(users);
    adminApiCall('adminListAttempts', {}, function(err, data){
      var card = document.getElementById('attemptsCard');
      if(!card) return;
      if(err || !data || !data.ok || !Array.isArray(data.attempts)){
        card.innerHTML = '<p class="lead" style="color:var(--bad);">โหลดไม่สำเร็จ: '+escapeHtml((data&&data.error)||(data&&data.ok?STALE_SERVER_MSG:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'))+'</p>';
        return;
      }
      renderAdminAttemptsTable(card, data.attempts);
    });
    return;
  }
}

function bindAdminTabEvents(users){
  document.querySelectorAll('[data-admintab]').forEach(function(t){
    t.onclick = function(){ adminTab = t.getAttribute('data-admintab'); adminState.error=''; renderAdminPanel(users); };
  });
}

function bindAdminUsersEvents(users){
  bindAdminTabEvents(users);
  document.querySelectorAll('[data-admin-action]').forEach(function(btn){
    btn.onclick = function(){
      var action = btn.getAttribute('data-admin-action');
      var username = btn.getAttribute('data-username');
      if(action==='suspend'){
        if(!confirm('ระงับการใช้งานบัญชี "'+username+'" หรือไม่? ผู้ใช้จะถูกบังคับออกจากระบบทันทีและล็อกอินไม่ได้จนกว่าจะปลดระงับ')) return;
        adminApiCall('adminSuspendUser', {username:username, suspended:true}, function(err,data){ afterAdminAction(err,data); });
      } else if(action==='unsuspend'){
        adminApiCall('adminSuspendUser', {username:username, suspended:false}, function(err,data){ afterAdminAction(err,data); });
      } else if(action==='delete'){
        var wipe = confirm('ลบบัญชี "'+username+'" ออกจากระบบหรือไม่?\n\nกด "ตกลง" = ลบบัญชี (ประวัติคะแนนเดิมจะยังอยู่ในระบบ)\nกด "ยกเลิก" = ไม่ลบ');
        if(!wipe) return;
        var alsoWipeAttempts = confirm('ต้องการลบประวัติคะแนนของ "'+username+'" ทั้งหมดด้วยหรือไม่? (กด "ตกลง" = ลบด้วย, "ยกเลิก" = เก็บประวัติไว้)');
        adminApiCall('adminDeleteUser', {username:username, wipeAttempts:alsoWipeAttempts}, function(err,data){ afterAdminAction(err,data); });
      } else if(action==='resetpw'){
        var newPw = prompt('ตั้งรหัสผ่านใหม่ให้ "'+username+'" (อย่างน้อย 4 ตัวอักษร) — แจ้งรหัสนี้ให้ผู้ใช้ทางช่องทางที่ปลอดภัย:');
        if(!newPw) return;
        adminApiCall('adminResetPassword', {username:username, newPassword:newPw}, function(err,data){
          afterAdminAction(err,data, data&&data.ok ? 'ตั้งรหัสผ่านใหม่ให้ '+username+' เรียบร้อยแล้ว' : null);
        });
      }
    };
  });
}

function afterAdminAction(err, data, okAlert){
  if(err || !data || !data.ok){
    adminState.error = (data && data.error) || 'ดำเนินการไม่สำเร็จ ลองใหม่อีกครั้ง';
    adminApiCall('adminListUsers', {}, function(e2,d2){ renderAdminPanel((d2&&d2.users)||[]); });
    return;
  }
  adminState.error = '';
  if(okAlert) alert(okAlert);
  adminApiCall('adminListUsers', {}, function(e2,d2){ renderAdminPanel((d2&&d2.users)||[]); });
}

function renderAdminAttemptsTable(card, attempts){
  attempts = attempts.slice().sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  var html = '<h2>ประวัติคะแนนทั้งหมด ('+attempts.length+')</h2>';
  if(!attempts.length){
    html += '<p class="lead" style="font-style:italic;">ยังไม่มีประวัติการทำข้อสอบ</p>';
  } else {
    html += '<table class="subject-table"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>โหมด</th><th>คะแนน</th><th>ผล</th><th></th></tr></thead><tbody>';
    attempts.forEach(function(a){
      html += '<tr>';
      html += '<td>'+fmtDateShort(a.ts)+'</td>';
      html += '<td>'+escapeHtml(a.username)+'</td>';
      html += '<td>'+(a.mode==='exam'?'จำลองสอบ':a.mode)+'</td>';
      html += '<td>'+a.pct+'% ('+a.correct+'/'+a.total+')</td>';
      html += '<td>'+(a.passed?'✅ ผ่าน':'❌ ไม่ผ่าน')+'</td>';
      html += '<td><button class="btn small danger" data-del-ts="'+encodeURIComponent(a.ts)+'" data-del-user="'+escapeHtml(a.username)+'">🗑️ ลบ</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  card.innerHTML = html;
  card.querySelectorAll('[data-del-ts]').forEach(function(btn){
    btn.onclick = function(){
      if(!confirm('ลบประวัติคะแนนรายการนี้หรือไม่? ทำแล้วกู้คืนไม่ได้')) return;
      var ts = decodeURIComponent(btn.getAttribute('data-del-ts'));
      var username = btn.getAttribute('data-del-user');
      adminApiCall('adminDeleteAttempt', {ts:ts, username:username}, function(err,data){
        if(err || !data || !data.ok){ alert('ลบไม่สำเร็จ: '+((data&&data.error)||'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้')); return; }
        adminApiCall('adminListAttempts', {}, function(e2,d2){
          if(d2 && d2.ok) renderAdminAttemptsTable(card, d2.attempts);
        });
      });
    };
  });
}

// ---- server version check (helps diagnose "ยังไม่ได้ deploy โค้ดล่าสุด") ----
var EXPECTED_SERVER_VERSION = 'v7-fix-duplicate-options-2026-08-24';
var serverVersionInfo = { checked:false, ok:false, version:'' };
function checkServerVersion(){
  apiCall('ping', {}, function(err, data){
    serverVersionInfo.checked = true;
    if(!err && data && data.version){
      serverVersionInfo.version = data.version;
      serverVersionInfo.ok = (data.version === EXPECTED_SERVER_VERSION);
    } else {
      serverVersionInfo.version = '';
      serverVersionInfo.ok = false;
    }
    // re-render the footer notice if we're still sitting on the auth screen
    var el = document.getElementById('serverVersionNotice');
    if(el){ el.outerHTML = renderServerVersionNotice(); }
  });
}
function renderServerVersionNotice(){
  if(!serverVersionInfo.checked){
    return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:var(--text-muted);">🔄 กำลังตรวจสอบเวอร์ชันเซิร์ฟเวอร์...</p>';
  }
  if(serverVersionInfo.ok){
    return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:#2e7d32;">✅ เซิร์ฟเวอร์เป็นโค้ดล่าสุด ('+escapeHtml(serverVersionInfo.version)+')</p>';
  }
  if(serverVersionInfo.version){
    return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:#c62828;">⚠️ เซิร์ฟเวอร์ยังเป็นโค้ดรุ่นเก่า (เจอเวอร์ชัน "'+escapeHtml(serverVersionInfo.version)+'" ต้องการ "'+EXPECTED_SERVER_VERSION+'") — กรุณาวาง Code.gs ล่าสุดแล้ว Deploy เวอร์ชันใหม่อีกครั้ง</p>';
  }
  return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:#c62828;">⚠️ ตรวจสอบเวอร์ชันเซิร์ฟเวอร์ไม่ได้ — เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ หรือโค้ดยังเก่ามากจนไม่รู้จัก action นี้</p>';
}

// ---- init ----
renderAuthScreen();
checkServerVersion();

})();
