นความรับผิดชอบของ <strong>กรมสรรพาวุธทหารบก และกรมวิทยาศาสตร์ทหารบก</strong></p>\n<p><strong>ระเบียบ ทบ.ว่าด้วยความรับผิดชอบในสิ่งอุปกรณ์</strong> ปัจจุบันใช้ฉบับ <strong>พ.ศ.2555</strong> กำหนดความรับผิดชอบสิ่งอุปกรณ์แต่ละสาย ตัวอย่างที่ข้อสอบชอบถาม:</p>\n<ul>\n<li><strong>เครื่องกำเนิดไฟฟ้าสำหรับเครื่องมือสื่อสาร</strong> อยู่ในความรับผิดชอบของ <strong>สส. (สายสื่อสาร)</strong> (ไม่ใช่เครื่องกำเนิดไฟฟ้าทั่วไปหรือประจำอาคาร)</li>\n<li><strong>เครื่องมือ วัสดุ อุปกรณ์ก่อสร้าง ซ่อมแซมอาคาร ระบบไฟฟ้า-ประปา-สาธารณูปโภคในที่ตั้งปกติ</strong> = สิ่งอุปกรณ์<strong>สายยุทธโยธา</strong></li>\n<li><strong>ยานพาหนะทางบกที่ไม่ใช้ในการสงครามและการก่อสร้าง</strong> = สิ่งอุปกรณ์<strong>สายขนส่ง</strong></li>\n<li><strong>เครื่องมือเครื่องใช้สำหรับอุตุนิยมวิทยา</strong> = สิ่งอุปกรณ์<strong>สายสื่อสาร</strong></li>\n<li><strong>สิ่งอุปกรณ์ที่ไม่สามารถอนุโลมเข้าอยู่ในสายงานอื่นใดได้</strong> → จัดเป็นสิ่งอุปกรณ์<strong>สายพลาธิการ</strong> (เป็นสายงาน \"ค่าเริ่มต้น\" สำหรับ สป.ที่ไม่มีสายงานเฉพาะ)</li>\n<li><strong>เครื่องอิเล็กทรอนิกส์ที่มิได้กำหนดให้อยู่ในความรับผิดชอบของสายงานอื่น</strong> → จัดเป็นสิ่งอุปกรณ์<strong>สายสื่อสาร</strong></li>\n<li>ข้อควรระวัง: รถแทรกเตอร์กสิกรรม/เครื่องมือการเกษตร และ สี/อุปกรณ์เกี่ยวกับสีที่ใช้ปรนนิบัติบำรุง-ซ่อมบำรุง <strong>ไม่ได้จัดอยู่ในสายที่ข้อสอบมักเข้าใจผิด</strong> (ข้อสอบเคยตั้งให้ระบุว่าเป็นสายการสัตว์และสายพลาธิการตามลำดับ ซึ่งเป็นข้อความที่<strong>ผิด</strong> ต้องระวังตัวเลือกลักษณะนี้) เช่นเดียวกับวัตถุระเบิดทางเคมี-ชีวะ-รังสี-นิวเคลียร์ ก็<strong>ไม่ใช่</strong>สิ่งอุปกรณ์สายสรรพาวุธตามที่ข้อสอบมักหลอกไว้</li>\n</ul>\n<p><strong>อัตราสิ่งอุปกรณ์ถาวร (อสอ.) สายสื่อสาร</strong> ตามอนุมัติ ผบ.ทบ. เมื่อ 28 ธ.ค.2559 ปรับปรุงกำหนดไว้ 10 รายการ พร้อมเกณฑ์การแจกจ่าย เช่น เครื่องโทรสาร เครื่องคอมพิวเตอร์พร้อมอุปกรณ์ เครื่องจ่ายกำลังไฟฟ้าสำรอง ฯลฯ — <strong>เครื่องถ่ายเอกสารไม่อยู่ในบัญชี อสอ.สายสื่อสาร</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่ \"รายการสิ่งอุปกรณ์\" กับ \"สายงานที่รับผิดชอบ\" ตามระเบียบความรับผิดชอบ สป. พ.ศ.2555 โดยเฉพาะรายการที่ดูเหมือนจะเข้าสายหนึ่งแต่จริง ๆ อยู่อีกสายหนึ่ง (เช่น อุปกรณ์อุตุนิยมวิทยาอยู่สายสื่อสาร) และการจำแนกเสบียงประเภท ก-จ ของ สป.1</p>\n<hr />\n<h2>5. วงรอบการส่งกำลัง: ความต้องการ การเบิก การจ่าย การแจกจ่าย การส่งคืน</h2>\n<p><strong>ลักษณะความต้องการ</strong> ทบ. แบ่งเป็น 2 ลักษณะ คือ <strong>ความต้องการประจำ และความต้องการครั้งคราว</strong></p>\n<p><strong>ความต้องการขั้นต้น</strong> คือความต้องการ สป.ที่หน่วย/ทหารต้องการมีไว้ปฏิบัติภารกิจซึ่ง<strong>ยังไม่เคยได้รับมาก่อน</strong> เกิดจาก: การจัดตั้งหน่วยใหม่, การรับทหารเข้าประจำการใหม่, การกำหนดมาตรฐาน สป.ใหม่ — <strong>ไม่รวม</strong>การย้ายหรือเปลี่ยนแปลงที่ตั้งหน่วย (เพราะหน่วยเคยมี สป.อยู่แล้ว ไม่ใช่ความต้องการครั้งแรก)</p>\n<p><strong>ความต้องการทดแทน</strong> คือความต้องการเพื่อทดแทน สป.ที่หน่วยเคยได้รับมาแล้ว เกิดจาก: ทดแทน สป.ที่ถูกละทิ้ง/ทำลาย/ข้าศึกทำให้เสียหาย/โจรกรรม/เสียหายจากเหตุอื่น, ทดแทน สป.ที่อยู่ระหว่างซ่อมบำรุงโดยใช้ สป.สำรอง, ทดแทน สป.ที่หมดเปลืองจากการใช้งานหรือชิ้นส่วนซ่อมชำรุด — <strong>ไม่รวม</strong>การทดแทน สป.ที่เกินอัตราหรือระดับสะสมซึ่งหน่วยต้องดำเนินการ \"ส่งคืน\" (คนละกรณีกับความต้องการทดแทน)</p>\n<p><strong>การเบิก</strong> มี <strong>4 ประเภท</strong>: การเบิกขั้นต้น, การเบิกทดแทน, การเบิกเพื่อรักษาระดับส่งกำลัง (การเพิ่มเติมเพื่อรักษาระดับส่งกำลัง), และ<strong>การเบิกพิเศษ</strong> ซึ่งได้แก่ <strong>การเบิกเร่งด่วน เบิกนอกอัตรา และเบิกก่อนกำหนด</strong> (ข้อสอบออกซ้ำแนวนี้หลายข้อ ต้องจำให้แม่น)</p>\n<p><strong>การส่งคืน</strong> คือการส่ง สป.กลับคืนหน่วยจ่ายหรือหน่วยสนับสนุนทางการส่งกำลัง มูลเหตุของการส่งคืนได้แก่: เกินอัตราหรือระดับสะสมที่ได้รับอนุมัติ, ล้าสมัย/เปลี่ยนแบบ/เลิกใช้, เมื่อได้รับอนุมัติให้จำหน่าย — <strong>ไม่รวม</strong>การส่งซ่อมหรือรับคืน สป.ที่ซ่อมเสร็จแล้ว (นั่นเป็นเรื่องของงานซ่อมบำรุง ไม่ใช่ \"การส่งคืน\" ตามความหมายวงรอบส่งกำลัง)</p>\n<p><strong>การจ่ายสิ่งอุปกรณ์</strong> คือการตอบสนองความต้องการที่หน่วยเบิกส่งคำขอมา หลักเกณฑ์ที่ต้องพิจารณาว่าควรจ่ายรายการใด จำนวนเท่าใด ได้แก่: สถานการณ์ทางยุทธวิธี, ระดับส่งกำลังหรืออัตราของหน่วยรับการสนับสนุน, สิ่งอำนวยความสะดวกในการขนส่ง — <strong>ไม่ใช่</strong>ความต้องการของ \"หน่วยให้การสนับสนุน\" (ผู้จ่ายไม่ใช่ผู้พิจารณาความต้องการของตัวเอง แต่พิจารณาจากผู้รับ)</p>\n<p><strong>การแจกจ่ายสิ่งอุปกรณ์</strong> ทำได้ 2 ลักษณะ คือ <strong>ณ ที่ตั้งหน่วยใช้ และ ณ ที่ตั้งสถานที่ส่งกำลัง</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์แนว \"ข้อใดไม่ใช่...\" ของความต้องการขั้นต้น/ทดแทน/มูลเหตุการส่งคืน ต้องแยกให้ออกว่ากรณีไหนเข้าข่ายหมวดใด และท่องประเภทการเบิกพิเศษ (เร่งด่วน-นอกอัตรา-ก่อนกำหนด) ให้แม่น เพราะออกซ้ำถึง 3 ข้อในชุดนี้</p>\n<hr />\n<h2>6. การจำหน่ายสิ่งอุปกรณ์</h2>\n<p><strong>นิยาม:</strong> การจำหน่าย คือ <strong>การตัดยอด สป.ออกจากความรับผิดชอบของกองทัพบก</strong></p>\n<p><strong>สาเหตุของการจำหน่าย</strong>: สูญไป/สูญหาย, ชำรุดเสียหายจนซ่อมไม่คุ้มค่า/เสื่อมสภาพจนใช้ราชการไม่ได้, หมดความจำเป็นหรือหากใช้ราชการต่อไปจะสิ้นเปลืองค่าใช้จ่ายมาก — <strong>ไม่รวม</strong>กรณี \"คนหรือสัตว์สูญหาย ตาย เกินความต้องการ\" (คนและสัตว์มีชีวิตไม่ได้ใช้กระบวนการจำหน่ายแบบสิ่งของ)</p>\n<p><strong>การแบ่งประเภท สป. เพื่อการจำหน่าย มี 4 ประเภท</strong>: <strong>สป.ถาวร / สป.สิ้นเปลือง / ชิ้นส่วนซ่อม / สป.ที่มีชีวิต</strong> (ออกซ้ำหลายข้อในชุดนี้ ต้องจำให้แม่น)</p>\n<p><strong>ขั้นตอนการดำเนินการ:</strong> เมื่อหน่วยต้องการจำหน่าย สป. ให้ใช้<strong>แบบรายงานขออนุมัติจำหน่าย ทบ.400-065</strong> พร้อมแนบหลักฐานต่าง ๆ ไปกับรายงาน โดย:</p>\n<ul>\n<li><strong>หน่วยขนาดกองร้อยหรือเทียบเท่าเป็นหน่วยเริ่มรายงาน</strong> โดยรายงานตามสายการบังคับบัญชา (ไม่ใช่เริ่มที่ระดับกองพัน)</li>\n<li>หน่วยรายงานต้องแต่งตั้งคณะกรรมการสอบสวนข้อเท็จจริงก่อนทำรายงานขออนุมัติจำหน่าย</li>\n<li>ใช้แบบ ทบ.400-065 พร้อมแนบหลักฐานประกอบ</li>\n</ul>\n<p><strong>สิ่งอุปกรณ์ที่ตัดยอดออกจากบัญชีคุมได้เลยโดยไม่ต้องรายงานขออนุมัติจำหน่าย</strong>: สป.สิ้นเปลืองที่หมดไปตามการใช้งาน (เว้น สป.5 ต้องรายงานขออนุมัติแต่ไม่ต้องตั้งกรรมการสอบสวน), สป.ถาวรกำหนดอายุที่จ่ายประจำตัวทหารเมื่อใช้ครบอายุ, ชิ้นส่วนซ่อมที่ใช้ไปในการซ่อมบำรุง, เครื่องแต่งกายทหาร — <strong>ไม่รวม</strong> สป.นอกอัตราที่จัดหาด้วยงบประมาณราชการ (กรณีนี้ยังต้องรายงานขออนุมัติจำหน่ายตามปกติ)</p>\n<p><strong>ระเบียบ ทบ.ว่าด้วยการจำหน่ายสิ่งอุปกรณ์ พ.ศ.2557</strong> กำหนดให้จัดตั้ง <strong>\"ตำบลรวบรวมสิ่งอุปกรณ์จำหน่าย\"</strong> ที่หน่วย: มณฑลทหารบก, กองบัญชาการช่วยรบ, กรมฝ่ายยุทธบริการและกรมฝ่ายกิจการพิเศษที่รับผิดชอบ สป. — <strong>ไม่รวมกองทัพภาค</strong> (ทภ. ไม่ต้องจัดตั้งตำบลรวบรวมฯ เอง)</p>\n<p><strong>คำสั่ง สส.(เฉพาะ) ที่ 956/57 ลง 18 ธ.ค.2557</strong> กำหนดสิ่งอุปกรณ์/ซากสิ่งอุปกรณ์ที่ต้องส่งคืนไปยังตำบลรวบรวม สป.จำหน่าย ต้องมีมูลค่า<strong>ตั้งแต่ 5,000 บาทขึ้นไป</strong></p>\n<p><strong>อำนาจอนุมัติจำหน่าย:</strong> จก.สส. ในฐานะเจ้ากรมฝ่ายยุทธบริการ มีอำนาจอนุมัติจำหน่ายสิ่งอุปกรณ์สายสื่อสาร (ประเภทสิ่งอุปกรณ์สิ้นเปลือง สิ่งอุปกรณ์ถาวร ชิ้นส่วนซ่อม — เฉพาะกรณีมีซาก สป.) ในวงเงินคราวละ<strong>ไม่เกิน 600,000 บาท</strong> (ตามระเบียบ ทบ.ว่าด้วยการจำหน่ายสิ่งอุปกรณ์ พ.ศ.2557)</p>\n<p><strong>การปฏิบัติต่อ สป./ซาก สป. ที่ได้รับอนุมัติให้จำหน่ายแล้ว</strong>: การขาย/แลกเปลี่ยน/โอน, การทำลายหรือทำให้สิ้นสภาพทางทหารก่อนขายหรือแลกเปลี่ยน, สำหรับ สป.ในโครงการให้ปฏิบัติตามข้อตกลงกับองค์การที่ให้ความช่วยเหลือ — <strong>ไม่รวม</strong>การนำกลับมาใช้ราชการ (เมื่อจำหน่ายแล้วห้ามนำกลับมาใช้อีก)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> วงเงินอนุมัติจำหน่ายของ จก.สส. (600,000 บาท) และมูลค่า สป.ที่ต้องคืนซาก (5,000 บาทขึ้นไป) ออกซ้ำหลายข้อ, 4 ประเภท สป.เพื่อการจำหน่ายออกซ้ำ 2 ครั้ง, และขั้นตอน/หน่วยเริ่มรายงานขออนุมัติจำหน่าย</p>\n<hr />\n<h2>7. การชดใช้สิ่งอุปกรณ์ และการควบคุมทางบัญชี</h2>\n<p><strong>การชดใช้ สป.</strong> เกิดขึ้นเมื่อ สป.ชำรุดเสียหาย, เสื่อมสภาพจนใช้ราชการไม่ได้, สูญหาย หรือตาย <strong>อันเกิดจากความจงใจ ประมาทเลินเล่อ ทุจริต หรือปฏิบัติหน้าที่บกพร่อง</strong></p>\n<p><strong>วิธีการชดใช้ มี 3 วิธี</strong>: <strong>การแก้ไขให้คงสภาพเดิม, การชดใช้ด้วย สป., การชดใช้ด้วยเงิน</strong> — <strong>ไม่ใช่</strong>การนำ สป.ที่มีราคาเท่ากันมาทดแทน (ระเบียบไม่ได้กำหนดวิธีนี้ไว้)</p>\n<p><strong>การควบคุมทางบัญชี</strong> เป็นหน้าที่ที่ต้องดำเนินการร่วมกันของ <strong>หน่วยใช้ และหน่วยสนับสนุนทางด้านส่งกำลังบำรุง</strong> (ไม่ใช่ฝ่ายใดฝ่ายหนึ่งเพียงลำพัง)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำ 3 วิธีการชดใช้ สป.ให้แม่น (แก้ไขคงสภาพเดิม / ชดใช้ด้วย สป. / ชดใช้ด้วยเงิน) และระวังตัวเลือกหลอกที่ใส่วิธีการนอกเหนือจาก 3 วิธีนี้</p>\n<hr />\n<h2>8. การสำรวจและการรายงานสถานภาพสิ่งอุปกรณ์</h2>\n<p><strong>การสำรวจพิเศษ</strong> คือการสำรวจ สป.เป็นครั้งคราวตามความจำเป็น โดยปิดการเบิกจ่ายเฉพาะรายการที่สำรวจ (เว้นกรณีเร่งด่วน) จะสำรวจเมื่อ: มีอันตรายเกิดขึ้นกับสิ่งอุปกรณ์, เมื่อหน่วยบัญชีคุมต้องการทราบจำนวน, เมื่อมีการรับส่งหน้าที่ของ ผบ.หน่วย — <strong>ไม่ใช่</strong>การสำรวจทุกครั้งที่มีการเปลี่ยนแปลงเจ้าหน้าที่คลัง (ไม่ใช่เกณฑ์บังคับ)</p>\n<p><strong>อำนาจในการสั่งสำรวจสิ่งอุปกรณ์</strong> (มอบอำนาจให้ผู้ใต้บังคับบัญชาสั่งแทนได้): คลังกรมฝ่ายยุทธบริการ/ฝ่ายกิจการพิเศษ = เจ้ากรมฝ่ายยุทธบริการ/กิจการพิเศษ, คลังกองบัญชาการช่วยรบ = ผู้บัญชาการกองบัญชาการช่วยรบ, คลังมณฑลทหารบก = ผู้บัญชาการมณฑลทหารบก — ระวังตัวเลือกที่ใส่ผิดว่า \"คลังกองทัพภาค ได้แก่ แม่ทัพภาค\" ซึ่งข้อสอบชี้ว่าไม่ถูกต้อง</p>\n<p><strong>การรายงานสถานภาพสิ่งอุปกรณ์</strong> มีความมุ่งหมายเพื่อให้ผู้บังคับบัญชาและหน่วยส่งกำลังบำรุงชั้นเหนือทราบสถานภาพ สป.ของหน่วยใช้และหน่วยสนับสนุนทางการส่งกำลังตามห้วงระยะเวลา หน่วยที่ต้องรายงานคือ <strong>หน่วยสนับสนุนทางการส่งกำลัง ได้แก่ หน่วยสนับสนุนโดยตรง หน่วยสนับสนุนทั่วไป และคลัง</strong></p>\n<p><strong>รอบระยะเวลารายงานของหน่วยใช้</strong> (รอบ 3 เดือน) ต้องปิดการรายงานภายในสิ้นเดือน<strong>มีนาคม มิถุนายน กันยายน และธันวาคม</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่ผู้มีอำนาจสั่งสำรวจกับระดับคลังแต่ละประเภท (ระวังคลัง ทภ. ที่ข้อสอบใส่ผิดเป็นแม่ทัพภาค) และจำเดือนปิดรอบรายงานสถานภาพ สป. (มี.ค./มิ.ย./ก.ย./ธ.ค.)</p>\n<hr />\n<h2>9. การปรนนิบัติบำรุงและหลักการซ่อมบำรุง</h2>\n<p><strong>การปรนนิบัติบำรุง (ปบ.)</strong> คือการปฏิบัติทั้งปวงของหน่วยใช้ที่กระทำเพื่อรักษาให้ยุทธภัณฑ์อยู่ในสภาพดีที่สุดนับแต่ได้รับมา เพื่อ<strong>หยุดยั้งข้อเสียหายก่อนที่จะเกิดขึ้น</strong></p>\n<p><strong>ผลที่ได้จากการ ปบ.</strong>: ทำให้เครื่องมืออยู่ในสภาพใช้งานได้ดีตลอดเวลา, ยืดอายุการใช้งานเครื่องมือให้ยาวนานขึ้น, เป็นการลดงานบริการ — <strong>ไม่ใช่</strong>การทำให้เครื่องมือหรือยุทโธปกรณ์มีประสิทธิภาพสูงขึ้น (ปบ. เป็นการรักษาสภาพเดิม ไม่ใช่การเพิ่มประสิทธิภาพเกินมาตรฐาน)</p>\n<p><strong>การแบ่งระยะเวลาในการปรนนิบัติบำรุง</strong>: <strong>การปฏิบัติประจำวัน การปฏิบัติประจำสัปดาห์ การปฏิบัติประจำเดือน</strong></p>\n<p><strong>สาเหตุที่เครื่องมือสื่อสารเกิดความเสียหาย</strong> โดยทั่วไป: ขาดการตรวจสภาพตามระยะเวลาอันสมควร, เจ้าหน้าที่ไม่มีความรู้/ไม่เอาใจใส่ต่อการใช้และการ ปบ., เจ้าหน้าที่พยายามซ่อมแก้โดยไม่มีความรู้หรือใช้เครื่องมือซ่อมไม่ถูกต้อง — <strong>ไม่รวม</strong>การที่เจ้าหน้าที่ไม่มีการหมุนเวียนเครื่องมือนำออกไปใช้งาน (ไม่ใช่สาเหตุหลักตามข้อสอบ)</p>\n<p><strong>หลักการซ่อมบำรุง มี 4 ข้อ</strong>: ต้องปฏิบัติตามคู่มือหรือ TM, การซ่อมแก้ต้องกระทำ ณ ที่ซึ่งยุทโธปกรณ์ตั้งอยู่, ยุทโธปกรณ์ที่ชำรุดเกินขีดความสามารถของหน่วยให้ส่งซ่อมหน่วยซ่อมบำรุงขั้นที่สูงกว่า และเงื่อนไขเรื่องการยุบรวมหน่วยซ่อม (ข้อสอบชี้ว่าเงื่อนไข \"ห้ามยุบรวม เว้นแต่ได้รับอนุมัติจาก ผบ.หน่วยหรือสถานการณ์ทางยุทธวิธีบังคับ\" ไม่ถูกต้องตามหลักการซ่อมบำรุง 4 ข้อ)</p>\n<p><strong>การแบ่งความรับผิดชอบในการซ่อมบำรุง แบ่งเป็น 4 ประเภท 5 ขั้น:</strong></p>\n<ul>\n<li><strong>ขั้นที่ 1</strong> (ซ่อมบำรุงระดับหน่วย) ดำเนินการโดย<strong>เจ้าหน้าที่ผู้ใช้งาน</strong> (ไม่ใช่เจ้าหน้าที่ประจำคลังเก็บ สป.)</li>\n<li><strong>ขั้นที่ 2</strong> (ซ่อมบำรุงระดับหน่วย) ดำเนินการโดย<strong>ช่างซ่อมของหน่วย</strong></li>\n<li><strong>ขั้นที่ 3</strong> (ซ่อมบำรุงสนับสนุนโดยตรง) ดำเนินการโดย <strong>พัน.ส.พล. หรือ กรม สน.พล.</strong></li>\n<li><strong>ขั้นที่ 4</strong> (ซ่อมบำรุงสนับสนุนทั่วไป) ดำเนินการโดย <strong>พัน.ซบร.บชร.</strong></li>\n<li><strong>ขั้นที่ 5</strong> (ซ่อมบำรุงขั้นคลัง) ดำเนินการโดยหน่วยซ่อมระดับคลัง เช่น กซสอ.สส., พัน.ส.ซบร.เขตหลัง</li>\n</ul>\n<p><strong>ลำดับการส่งซ่อม สป.สาย ส. ที่ชำรุดของหน่วยขึ้นตรงกองพล</strong> (ตัวอย่างเช่น พล.ร.15): ต้องผ่านขั้นที่ 1 (จนท.ผู้ใช้งาน) และขั้นที่ 2 (ช่างประจำหน่วย) ก่อน หากเกินขีดความสามารถของหน่วยให้ส่งซ่อมที่ <strong>พัน.ซบร.กรม.สน.พล.ร.15</strong> และหากเกินขีดความสามารถของ พัน.ซบร.กรม.สน.พล.ร.15 อีก ให้ส่งซ่อมที่ <strong>พัน.ซบร.บชร.</strong> (ระดับกองทัพภาค) — ข้อสอบระวังใส่หน่วย \"ตอน.ซบร.ร้อย.บก.ส.พัน.\" เป็นตัวลวงในขั้นตอนนี้</p>\n<p><strong>เกณฑ์ \"ซ่อมไม่คุ้มค่า\"</strong>: หน่วยซ่อมระดับคลัง จะลงความเห็นว่าซ่อมไม่คุ้มค่า เมื่อค่าซ่อม<strong>เกิน 65% ของราคาจัดหาใหม่</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ลำดับขั้นการซ่อมบำรุง 5 ขั้น กับหน่วยผู้รับผิดชอบแต่ละขั้นต้องจำให้แม่น รวมถึงเส้นทางส่งซ่อมตามลำดับชั้น (หน่วย → กรม สน.พล. → บชร.) และตัวเลข 65% สำหรับเกณฑ์ซ่อมไม่คุ้มค่า</p>\n<hr />\n<h2>10. การจัดดินแดนและการส่งกำลังบำรุงในสนาม/ยามสงคราม</h2>\n<p><strong>การจัดดินแดนในยามสงคราม</strong> แบ่งพื้นที่ออกเป็น <strong>เขตยุทธบริเวณ</strong> และ <strong>เขตภายใน</strong> โดยเขตยุทธบริเวณยังแบ่งย่อยเป็น <strong>เขตหน้า</strong> และ <strong>เขตหลัง</strong> (มีเส้นแบ่งเขตกำหนดความรับผิดชอบชัดเจน)</p>\n<ul>\n<li><strong>สิ่งอุปกรณ์ที่นำมาสนับสนุนการปฏิบัติการทางทหารส่วนใหญ่ ได้มาจาก \"เขตภายใน\"</strong> (แหล่งผลิต/จัดหาหลักของประเทศ)</li>\n<li><strong>รมว.กห.</strong> มีอำนาจแต่งตั้ง<strong>ผบ.ทหารสูงสุด</strong>เป็น <strong>ผบ.ยุทธบริเวณ</strong></li>\n<li><strong>รมว.กห.</strong> เป็นผู้กำหนด<strong>เส้นเขตหลังของเขตหน้า</strong></li>\n<li>งานทางการส่งกำลังบำรุงสาย ส. ใน <strong>\"เขตหลัง\"</strong> มีความสำคัญที่สุดต่อการสนับสนุนหน่วยในสนามและความสำเร็จภารกิจของ ทบ. (เพราะเป็นพื้นที่รวบรวม สป.และฐานซ่อมบำรุงหลักก่อนส่งต่อไปเขตหน้า)</li>\n<li><strong>บชร. หรือ สย.บชร.</strong> มีที่ตั้งอยู่ใน<strong>เขตหลัง</strong></li>\n</ul>\n<p><strong>การจัดระบบส่งกำลังบำรุงในภาวะสงคราม:</strong></p>\n<ul>\n<li>บชร. จัด<strong>ส่วนแยก</strong>เพื่อสนับสนุนหน่วยในเขตหน้า โดยมีที่ตั้งอยู่ใน<strong>พื้นที่ส่วนหลังของกองทัพภาค (ทภ.)</strong></li>\n<li>หน่วยส่งกำลังบำรุงของกองพลจะตั้งอยู่ใน<strong>พื้นที่สนับสนุนของกองพล</strong></li>\n<li>ในยามสงคราม <strong>ร้อย คลัง ส. เขตหลัง</strong> (หน่วยในอัตราของกรมการทหารสื่อสาร) จะแปรสภาพเป็นหน่วยส่งกำลัง สป.สาย ส. ปฏิบัติงานขึ้นตรงกับ <strong>บช.กบ.ทบ.</strong></li>\n<li>การจัดส่วนแยก (สย.) สนับสนุนการส่งกำลังบำรุงของ กรม สน.พล.ร.9 จัดได้<strong>ไม่เกิน 3 สย.</strong></li>\n</ul>\n<p><strong>เส้นหลักการส่งกำลัง (สลก.) ของกองพล:</strong></p>\n<ul>\n<li>การพิจารณาเลือกเส้นหลักการส่งกำลังใช้ปัจจัย <strong>METT-T</strong></li>\n<li><strong>ผช.หน.สธ.4 ฝ่ายขนส่ง</strong> รับผิดชอบวางแผนจัดระเบียบการจราจร และเป็นผู้เสนอเส้นหลักการส่งกำลังแก่ หน.สธ.4 โดยประสานหน่วยที่เกี่ยวข้อง</li>\n<li><strong>พัน.ช.พล.</strong> รับผิดชอบซ่อมบำรุงเส้นหลักการส่งกำลังให้มีสภาพดีอยู่ตลอดเวลา</li>\n<li>ข้อควรระวัง: เส้นหลักการส่งกำลัง<strong>ไม่ควรมีเพียงเส้นเดียว</strong> ควรมีทางเลือกสำรองเพื่อความยืดหยุ่น (ข้อสอบชี้ว่าแนวคิด \"เลือกเส้นทางที่ดีที่สุดและมีเส้นเดียวเพื่อป้องกันความสับสน\" เป็นความเข้าใจที่ผิด)</li>\n</ul>\n<p><strong>คำสั่งการช่วยรบ</strong> (ตามคำสั่งยุทธการของกองพล) มีจำนวน <strong>9 ข้อ</strong> โดยงานในหน้าที่เฉพาะของ <strong>สธ.4 คือข้อ 4 และ 5</strong> ผู้ลงนามในคำสั่งการช่วยรบคือ <strong>ผบ.พล.</strong> (ไม่ใช่ มทภ. หรือระดับหน่วยรอง)</p>\n<p><strong>กองทัพภาค</strong> รับผิดชอบส่งกำลังบำรุงให้หน่วยในพื้นที่ของตน โดยมี <strong>กองบัญชาการช่วยรบ (บชร.) และมณฑลทหารบก (มทบ.)</strong> เป็นหน่วยปฏิบัติในขั้นสนับสนุน ทั้งนี้ <strong>มทบ.</strong> มีภารกิจสนับสนุน สป.1, สป.3, และ สป.5 (กระสุนฝึก-ศึกษาและกระสุนมูลฐาน) — <strong>ไม่ใช่</strong>การสนับสนุน สป.2 และ สป.4 ทุกสาย ซึ่งเป็นภารกิจของหน่วยสายวิทยาการโดยตรง/บชร.</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ผู้มีอำนาจกำหนดเขตต่าง ๆ (รมว.กห. เป็นผู้กำหนดเส้นเขตหลังของเขตหน้าและแต่งตั้ง ผบ.ยุทธบริเวณ), ที่ตั้งของหน่วยส่งกำลังบำรุงแต่ละระดับในภาวะสงคราม, และรายละเอียดคำสั่งการช่วยรบ (จำนวนข้อ/ผู้ลงนาม/ข้อที่เป็นหน้าที่ สธ.4)</p>\n<hr />\n<h2>11. การจัดซื้อจัดจ้างและวงเงินอำนาจอนุมัติ</h2>\n<p><strong>พ.ร.บ.การจัดซื้อจัดจ้างและการบริหารพัสดุภาครัฐ พ.ศ.2560</strong> กำหนดวิธีการจัดซื้อจัดจ้างพัสดุไว้ <strong>3 วิธี</strong>:</p>\n<ol>\n<li><strong>วิธีประกาศเชิญชวนทั่วไป</strong> — เชิญชวนผู้ประกอบการทั่วไปที่มีคุณสมบัติตรงตามเงื่อนไขที่กำหนดให้เข้ายื่นข้อเสนอ</li>\n<li><strong>วิธีคัดเลือก</strong> — เชิญชวนเฉพาะผู้ประกอบการที่มีคุณสมบัติตรงตามที่กำหนด ซึ่งต้องไม่น้อยกว่า 3 ราย ให้เข้ายื่นข้อเสนอ เว้นแต่มีผู้ประกอบการที่มีคุณสมบัติตรงตามกำหนดน้อยกว่า 3 ราย</li>\n<li><strong>วิธีเฉพาะเจาะจง</strong> — หน่วยงานภาครัฐเชิญชวนผู้ประกอบการที่มีคุณสมบัติตรงตามที่กำหนดรายใดรายหนึ่งให้เข้ายื่นข้อเสนอหรือให้เข้ามาเจรจาต่อรองราคา</li>\n</ol>\n<p><strong>อำนาจสั่งซื้อสั่งจ้าง:</strong> เจ้ากรมการทหารสื่อสาร ในฐานะเจ้ากรมฝ่ายยุทธบริการ มีอำนาจสั่งซื้อสั่งจ้างด้วยวิธีประกาศเชิญชวนทั่วไป โดยลงนามรับคำสั่ง ผบ.ทบ. ในวงเงิน<strong>ไม่เกิน 40 ล้านบาท</strong></p>\n<p><strong>อำนาจอนุมัติจำหน่ายสิ่งอุปกรณ์</strong> (เกี่ยวเนื่อง — ดูหัวข้อ 6): จก.สส. อนุมัติจำหน่าย สป.สาย ส. กรณีมีซาก ได้ไม่เกิน 600,000 บาทต่อครั้ง</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกความแตกต่างของ 3 วิธีจัดซื้อจัดจ้างตาม พ.ร.บ.2560 (ประกาศเชิญชวนทั่วไป / คัดเลือก / เฉพาะเจาะจง) และจำวงเงินอำนาจของ จก.สส. ทั้ง 2 กรณี คือ วงเงินจัดซื้อจัดจ้าง (40 ล้านบาท) กับวงเงินอนุมัติจำหน่าย (600,000 บาท) อย่าสับสนกัน</p>\n<hr />\n<h2>12. การตรวจรับและการเก็บรักษาสิ่งอุปกรณ์</h2>\n<p><strong>การรับสิ่งอุปกรณ์จากการเบิก:</strong> เมื่อสิ่งอุปกรณ์มาถึงหน่วย ผบ.หน่วยต้องแต่งตั้งกรรมการตรวจรับ<strong>จำนวน 3 นาย</strong> โดย<strong>ต้องเป็นนายทหารสัญญาบัตรอย่างน้อย 2 นาย</strong></p>\n<p><strong>ปัจจัยในการเก็บรักษาสิ่งอุปกรณ์</strong> เพื่อให้การเก็บรักษาได้ผลดี ผู้บังคับหน่วยต้องคำนึงถึง: <strong>พื้นที่เก็บรักษา, กำลังคน, และเครื่องมือยกขน</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนและระดับชั้นยศของกรรมการตรวจรับ สป. (3 นาย, น.สัญญาบัตรอย่างน้อย 2 นาย) และ 3 ปัจจัยหลักในการเก็บรักษา สป. (พื้นที่-กำลังคน-เครื่องมือยกขน)</p>"}, {"subject": 6, "subjectTitle": "วิชาฝ่ายอำนวยการ", "html": "<p>สรุปนี้สังเคราะห์จากคลังข้อสอบ 50 ข้อ (subject_6) โดยยึดตามเฉลยที่ถูกต้อง จัดกลุ่มเป็นเนื้อหาความรู้ 15 หัวข้อ</p>\n<h2>1. หลักนิยมทางทหาร (Doctrine)</h2>\n<p>\"หลักนิยม\" คือหลักพื้นฐานที่กำลังรบทางทหารยึดถือเป็นแนวทางปฏิบัติเพื่อสนับสนุนวัตถุประสงค์แห่งชาติ เป็นสิ่งที่เชื่อถือได้ แต่ไม่ใช่กฎตายตัว จะต้องพิจารณาปรับใช้ให้เหมาะสมกับสถานการณ์จริงเสมอ (ต่างจาก \"ระเบียบปฏิบัติ\" ซึ่งเป็นขั้นตอนที่กำหนดตายตัวกว่า)</p>\n<p>หลักนิยมการปฏิบัติการร่วมของกำลังทางบก/กองทัพบก แนวคิด \"การยุทธ์ทางอากาศ-พื้นดิน\" (Air Land Battle) มีคุณลักษณะสำคัญ 4 ประการ ได้แก่ ความริเริ่ม (Initiative), ความว่องไว (Agility), ความสามารถรอบด้าน/ความลึก (Depth), และความประสานสอดคล้อง (Synchronization) โดยข้อสอบเน้นว่าในสถานการณ์ปัจจุบัน \"ความสามารถรอบด้าน\" ถือเป็นคุณลักษณะที่สำคัญที่สุด</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ให้แยกความหมายของ \"หลักนิยม\" ออกจาก \"ระเบียบปฏิบัติ\" และ \"ขอบเขต\" และมักถามว่าใน 4 คุณลักษณะของ Air Land Battle ข้อใดสำคัญที่สุดในปัจจุบัน (เฉลย: ความสามารถรอบด้าน)</p>\n<h2>2. การจัดส่วนราชการกองทัพบกและเหล่าทหาร</h2>\n<p>กองทัพบกไทยจัดหน่วยรบและเหล่าทหารออกเป็น 2 กลุ่มใหญ่:</p>\n<ul>\n<li><strong>หน่วยรบหลัก</strong>: ทหารราบ (เหล่า ร.), ทหารม้า (เหล่า ม.), หน่วยสงครามพิเศษ (ไม่จำกัดเหล่า)</li>\n<li><strong>หน่วยสนับสนุนการรบ</strong>: ทหารปืนใหญ่ (เหล่า ป.), ทหารปืนใหญ่ต่อสู้อากาศยาน (เหล่า ปตอ.), หน่วยการบินทหารบก (ไม่จำกัดเหล่า)</li>\n</ul>\n<p>โครงสร้างส่วนราชการของ ทบ. แบ่งเป็นส่วนบัญชาการ ส่วนกำลังรบ ส่วนสนับสนุนการรบ และส่วนส่งกำลังบำรุง โดย \"สำนักงานปลัดบัญชีกองทัพบก (สปช.ทบ.)\" จัดอยู่ใน <strong>ส่วนบัญชาการ</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกให้ออกว่าเหล่าใดเป็น \"หน่วยรบ\" กับเหล่าใดเป็น \"หน่วยสนับสนุนการรบ\" และหน่วยงานระดับกรม/สำนักงานใดอยู่ในส่วนราชการส่วนใดของโครงสร้าง ทบ.</p>\n<h2>3. ทหารกองเกิน กองหนุน และการรับราชการทหาร</h2>\n<p>ทหารกองเกินซึ่งไม่ถูกเรียกเข้ารับราชการในกองประจำการ จะถูกปลดเป็น <strong>กองหนุนประเภทที่ 2 ชั้นที่ 2</strong> เมื่อมีอายุ <strong>30 ปีบริบูรณ์ ถึง 39 ปีบริบูรณ์</strong></p>\n<p>การแบ่งประเภทและชั้นกองหนุนของนายทหารสัญญาบัตร เช่น ยศชั้นพันเอกที่มีอายุไม่เกิน 55 ปี จะจัดเป็นนายทหารสัญญาบัตรประเภท <strong>\"กองหนุน\"</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ช่วงอายุที่ใช้แบ่งประเภท/ชั้นของกองหนุน (ทั้งทหารกองเกินและนายทหารสัญญาบัตร) เป็นตัวเลขที่ต้องจำแม่นเพราะตัวลวงในตัวเลือกใกล้เคียงกันมาก</p>\n<h2>4. ฝ่ายอำนวยการ: ประเภท สายงาน และหน้าที่ร่วม</h2>\n<p>การจัดฝ่ายอำนวยการมี <strong>3 ประเภท</strong> คือ ฝ่ายอำนวยการประสานงาน, ฝ่ายกิจการพิเศษ และฝ่ายอำนวยการประจำตัว โดย \"ปริมาณงานหรือแผนที่ต้องปฏิบัติ\" เป็นหนึ่งในข้อพิจารณาสำคัญในการจัดฝ่ายอำนวยการ</p>\n<ul>\n<li><strong>ฝ่ายเสนาธิการ</strong> คือผู้ที่ได้รับมอบอำนาจหน้าที่ให้ปฏิบัติในเรื่องใดเรื่องหนึ่งโดยเฉพาะ</li>\n<li><strong>ฝ่ายกิจการพิเศษ</strong> มีหน้าที่ช่วยเหลือฝ่ายอำนวยการอื่นในการทำแผน/คำสั่ง/รายงานเฉพาะด้าน</li>\n<li>ระวังตัวลวงเรื่อง \"ฝ่ายอำนวยการหลักมี 6 สายงาน (กำลังพล ข่าวกรอง ยุทธการ ส่งกำลังบำรุง กิจการพลเรือน การเงิน)\" — ข้อความนี้เป็นข้อที่<strong>ผิด</strong> เพราะฝ่ายอำนวยการหลักตามหลักนิยม (G1–G4) ไม่ได้นับกิจการพลเรือนและการเงินรวมเป็นสายงานหลักในลักษณะนั้น</li>\n</ul>\n<p>งานในหน้าที่ร่วมของฝ่ายอำนวยการทุกฝ่าย ได้แก่ การหาข่าวสารและให้ข่าวสาร, การประมาณการและเสนอแนะ, การจัดทำแผนและคำสั่ง ส่วน <strong>\"การตกลงใจและกำกับดูแล\"</strong> ไม่ใช่หน้าที่ร่วมของฝ่ายอำนวยการ เพราะเป็นอำนาจหน้าที่ของผู้บังคับบัญชา</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกประเภทฝ่ายอำนวยการ 3 ประเภทให้แม่น และแยก \"หน้าที่ร่วมของฝ่ายอำนวยการ\" ออกจาก \"อำนาจของผู้บังคับบัญชา\" (การตกลงใจเป็นของผู้บังคับบัญชาเท่านั้น ฝ่ายอำนวยการมีหน้าที่เสนอแนะ)</p>\n<h2>5. การแก้ปัญหาอย่างมีระเบียบ และข้อพิจารณาของฝ่ายอำนวยการ (Staff Study)</h2>\n<p>กองทัพบกมีวิธีแก้ปัญหาอย่างมีระเบียบหลายวิธี ได้แก่ การประชุมตกลงใจ, การจัดทำข้อพิจารณาของฝ่ายอำนวยการ (Staff Study), และการปฏิบัติตามลำดับขั้นการปฏิบัติงานของ ผบ.ฝอ. — \"ผบ.หน่วยสั่งการโดยตรง\" <strong>ไม่ใช่</strong> วิธีแก้ปัญหาอย่างมีระเบียบ</p>\n<p>ข้อพิจารณาของฝ่ายอำนวยการเป็นเครื่องมือสำคัญ แต่ไม่ควรใช้อย่างฟุ่มเฟือย เพราะจะทำให้เรื่องง่ายกลายเป็นเรื่องยากและเสียเวลาไปโดยเปล่าประโยชน์</p>\n<p>เอกสารข้อพิจารณาของฝ่ายอำนวยการรูปแบบที่ไม่ซับซ้อน ง่ายต่อการสั่งการ จะจัดทำเป็น 4 หัวข้อ ได้แก่ <strong>ปัญหา, ข้อเท็จจริง, ข้อพิจารณา, ข้อเสนอ</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> เรื่อง \"อะไรไม่ใช่วิธีแก้ปัญหาอย่างมีระเบียบ\" และจำนวน/ชื่อหัวข้อของเอกสารข้อพิจารณาฝ่ายอำนวยการ (4 หัวข้อ ไม่ใช่ 5)</p>\n<h2>6. การประชุม</h2>\n<p>ปัจจัยที่ต้องพิจารณาก่อนจัดประชุม ได้แก่ วัตถุประสงค์และผลที่คาดว่าจะได้รับ, มีวิธีอื่นที่บรรลุวัตถุประสงค์ได้โดยไม่ต้องประชุมหรือไม่, และเรื่องที่จะประชุมมีคุณค่าน่าสนใจต่อผู้เข้าประชุมเพียงใด</p>\n<p>กระบวนการประชุมมี 4 ขั้นตอน คือ <strong>การเตรียมการประชุม, วิธีการ, การดำเนินการประชุม, การติดตามประเมินผลการประชุม</strong></p>\n<p>ประโยชน์ของวาระการประชุม ได้แก่ ผู้เข้าร่วมมีโอกาสเตรียมตัวล่วงหน้า, ประธานเสนอปัญหาและเป้าหมายได้ชัดเจน, และทุกคนทราบขอบเขตว่าจะพูดเรื่องใดบ้าง — ส่วน \"มีเวลาพอสำหรับพูดเรื่องอื่นๆ\" <strong>ไม่ใช่</strong> ประโยชน์ของวาระการประชุม (วาระมีไว้เพื่อจำกัดขอบเขต ไม่ใช่เปิดช่องให้พูดนอกเรื่อง)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนขั้นตอนของกระบวนการประชุม (4 ขั้น มี \"วิธีการ\" แทรกอยู่ด้วย) และข้อที่ไม่ใช่ประโยชน์ของวาระการประชุม</p>\n<h2>7. เอกสารราชการ บันทึก และงานสารบรรณ</h2>\n<p>ลักษณะที่พึงประสงค์ของบันทึกที่สำคัญ คือ <strong>ลงรายละเอียดให้น้อยที่สุดแต่เก็บเนื้อความ (ใจความสำคัญ) ให้ได้มากที่สุด</strong> — เน้นความกระชับแต่ครบถ้วน</p>\n<p>การร่างหนังสือติดต่อภายในส่วนราชการที่สังกัดกระทรวงเดียวกัน (ต่างกรม/กองที่อยู่คนละหน่วยแต่กระทรวงเดียวกัน) ให้ใช้ <strong>หนังสือภายนอก ที่ใช้ติดต่อภายในกระทรวง</strong></p>\n<p>ข่าวสารที่นำมาลงในบันทึกประจำวันได้มาจาก สาส์น, คำสั่ง, รายงาน, บันทึกการสนทนา และเหตุการณ์ต่างๆ (ครอบคลุมแหล่งข่าวสารได้กว้าง ไม่จำกัดเฉพาะบางประเภท)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ประเภทหนังสือราชการที่ใช้ตามลักษณะการติดต่อ (ภายใน/ภายนอกกระทรวง) และแหล่งที่มาของข่าวสารในบันทึกประจำวัน</p>\n<h2>8. หลักการจัดกำลังพล ภาวะผู้นำ และขวัญกำลังใจ</h2>\n<p><strong>เอกภาพในการบังคับบัญชา (Unity of Command)</strong> หมายถึง มีผู้บังคับบัญชาเพียงผู้เดียวเท่านั้นที่จะสามารถสั่งการได้ในทุกเรื่อง (ไม่ใช่แค่การสั่งตามสายงานหรือไม่สั่งข้ามสาย)</p>\n<p>ข้อพิจารณาในการบรรจุคนให้เหมาะสมกับงาน (Put the right man on the right job) มี <strong>3 ประการ</strong> คือ คน, งาน, และความต้องการของทางราชการ</p>\n<p>หลักการจัดกำลังพลที่เกี่ยวกับการให้บุคคลได้รับความก้าวหน้าในอาชีพ ปฏิบัติหน้าที่ที่สูงขึ้นและรับผิดชอบมากขึ้นเรื่อยๆ เรียกว่า <strong>หลักการให้ความเชื่อมั่นในความก้าวหน้าของอาชีพ</strong> (มาจากแนวคิดที่ว่าไม่มีบุคคลใดคงรูปเดิม ประสิทธิภาพต้องก้าวหน้าหรือลดลงเท่านั้น)</p>\n<p>การแสดงออกซึ่งลักษณะของขวัญที่ดี คือ <strong>ความกระตือรือร้นในการปฏิบัติหน้าที่ให้เป็นไปตามความมุ่งหมายของผู้บังคับบัญชา</strong> ไม่ใช่เพียงแค่การมาทำงานตรงเวลาหรือการเอาใจใส่ผู้บังคับบัญชาแบบผิวเผิน</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> นิยามคำศัพท์เฉพาะ (เอกภาพในการบังคับบัญชา, ความก้าวหน้าในอาชีพ) และตัวเลือกลวงที่ฟังดูใกล้เคียงแต่ไม่ตรงนิยามที่แท้จริง</p>\n<h2>9. ระเบียบการนำหน่วย (Troop Leading Procedure) และการวางแผนยุทธวิธี</h2>\n<p><strong>ระเบียบการนำหน่วย</strong> คือกรรมวิธีที่ผู้บังคับหน่วยใช้เตรียมหน่วยเพื่อปฏิบัติให้บรรลุภารกิจทางยุทธวิธี มีทั้งหมด <strong>8 ขั้น</strong> โดยไม่จำเป็นต้องทำเรียงตามลำดับขั้นเสมอไป ขึ้นอยู่กับเวลาและสถานการณ์ที่มี (สามารถทำหลายขั้นควบคู่กันได้)</p>\n<p>จุดเริ่มต้น–จุดสุดท้ายของระเบียบการนำหน่วย คือ <strong>\"รับภารกิจใหม่\" ไปจนถึง \"จบภารกิจ\"</strong></p>\n<p>เมื่อได้รับภารกิจ (ในรูปคำสั่งเตือน, คำสั่งยุทธการ หรือคำสั่งเป็นส่วนๆ) ต้องเริ่มวิเคราะห์ภารกิจทันทีโดยใช้ปัจจัย <strong>METT-T</strong>: Mission (ภารกิจ), Enemy (ข้าศึก), Terrain and weather (ภูมิประเทศและลมฟ้าอากาศ), Troops available (กำลังที่มีอยู่), Time available (เวลาที่มีอยู่) — การคิดเรื่อง \"เวลา\" อยู่ใน <strong>ขั้นที่ 1</strong> ของระเบียบการนำหน่วย โดยใช้ปัจจัย METT-T นี้เอง</p>\n<p>การพิจารณาผลกระทบของภูมิประเทศและลมฟ้าอากาศต่อกำลังฝ่ายเราและข้าศึกในเชิงยุทธวิธี ใช้แง่คิด <strong>OCOKA</strong>: Observation and field of fire (การตรวจการณ์และการยิง), Cover and concealment (การกำบังและซ่อนพราง), Obstacle (เครื่องกีดขวาง), Key terrain (ภูมิประเทศสำคัญ), Avenue of approach (แนวทางเข้าตี)</p>\n<p>หลัก <strong>\"1 ใน 3 – 2 ใน 3\"</strong>: ผู้บังคับหน่วยใช้เวลาที่มีอยู่เพียง 1 ใน 3 สำหรับการวางแผนและออกคำสั่ง ส่วนเวลาที่เหลืออีก 2 ใน 3 ให้หน่วยรองใช้ในการวางแผนและเตรียมการปฏิบัติของตนเอง</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวย่อ METT-T และ OCOKA (มักมีตัวลวงสลับตัวอักษร เช่น OOKCA, OKOCA) จำนวนขั้นของระเบียบการนำหน่วย (8 ขั้น) และสัดส่วนเวลา 1/3-2/3</p>\n<h2>10. คำสั่งยุทธการ</h2>\n<p>หัวข้อมาตรฐานของคำสั่งยุทธการมี 5 หัวข้อ เรียงตามลำดับ คือ <strong>1. สถานการณ์ 2. ภารกิจ 3. การปฏิบัติ 4. การช่วยรบ 5. การบังคับบัญชาและการสื่อสาร</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ลำดับหัวข้อคำสั่งยุทธการที่ถูกต้อง (มักมีตัวลวงสลับตำแหน่ง \"การปฏิบัติ\" กับ \"การช่วยรบ\")</p>\n<h2>11. การส่งกำลังบำรุง</h2>\n<p>ขอบเขตของงานส่งกำลังบำรุงมี <strong>5 ประการ</strong>: การส่งกำลัง, การซ่อมบำรุง, การขนส่ง, การบริการทางการแพทย์, การบริการอื่นๆ</p>\n<p><strong>วงรอบการส่งกำลัง</strong> มี 4 ขั้นตอน คือ <strong>ความต้องการ → การจัดหา → การแจกจ่าย → การจำหน่าย</strong></p>\n<p>การเบิกสิ่งอุปกรณ์ประเภท 2-4 (สป.2-4) มี <strong>4 ประเภท</strong>: การเบิกขั้นต้น, การเบิกทดแทน, การเบิกเพิ่มเติมเพื่อรักษาระดับส่งกำลัง, การเบิกพิเศษ</p>\n<p>ความรับผิดชอบสิ่งอุปกรณ์ตามสายยุทธบริการ: สป.2 ทุกสายรับผิดชอบเฉพาะของตน, สป.3 (น้ำมันเชื้อเพลิง) เป็นความรับผิดชอบของสายพลาธิการ ส่วนสป.1 (อาหาร เครื่องดื่ม) ก็เป็นความรับผิดชอบของสายพลาธิการเช่นกัน (ไม่ใช่ \"อาหารสัตว์\")</p>\n<p>ความต้องการขั้นต้น (จากการจัดตั้งหน่วยใหม่/การเปลี่ยนแปลงอัตรา) กำหนดมูลฐานจาก <strong>อจย. (อัตราการจัดและยุทโธปกรณ์), อฉก. (อัตราเฉพาะกิจ), อสอ. (อัตราสิ่งอุปกรณ์ถาวร)</strong> — ไม่ได้กำหนดจาก \"อัตรากำลังพล\"</p>\n<p>งานซ่อมบำรุง (ปบ.บำรุง): </p>\n<ul>\n<li><strong>ปบ.บำรุง</strong> คือ การดูแลให้บริการเพื่อรักษายุทโธปกรณ์/เครื่องมือเครื่องใช้ให้อยู่ในสภาพใช้การได้ดี</li>\n<li><strong>ถอดปรน</strong> คือ การถอดชิ้นส่วน/ส่วนประกอบจากยุทโธปกรณ์ครบชุดที่ซ่อมได้แต่ไม่คุ้มค่า หรือที่ถูกจำหน่ายแล้ว เพื่อนำไปใช้กับยุทโธปกรณ์อื่น</li>\n<li>คำว่า <strong>\"ยุบรวม\"</strong> ในความหมายที่ถูกต้องไม่ใช่การถอดชิ้นส่วนที่ใช้การได้จาก ยป. หนึ่งไปประกอบกับอีก ยป. หนึ่งโดยหน่วยใช้เอง (นิยามนี้ใกล้เคียงกับ \"ถอดปรน\" มากกว่า) — ข้อสอบใช้จุดนี้ทดสอบว่าแยกความหมายของศัพท์การซ่อมบำรุงแต่ละคำได้ถูกต้องหรือไม่</li>\n</ul>\n<p><strong>การคำนวณน้ำมันเชื้อเพลิง</strong> ใช้สูตร:</p>\n<pre><code>จำนวนน้ำมันที่ต้องการ (ลิตร) = (ระยะทาง x จำนวนเที่ยว x จำนวนวัน x จำนวนคัน) ÷ อัตราสิ้นเปลืองน้ำมัน (กม./ลิตร)\n</code></pre>\n<p>ตัวอย่าง: ระยะทาง 60 กม. วิ่ง 2 เที่ยว(ไป-กลับ)/วัน ปฏิบัติงาน 5 วัน ใช้รถ 4 คัน อัตราสิ้นเปลือง 3 กม./ลิตร\n= (60 x 2 x 5 x 4) ÷ 3 = 2,400 ÷ 3 = <strong>800 ลิตร</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนประเภท/ขั้นตอนต่างๆ (ขอบเขตงาน 5 ข้อ, วงรอบส่งกำลัง 4 ขั้น, การเบิก สป.2-4 มี 4 ประเภท) ศัพท์เฉพาะทางการซ่อมบำรุงที่ความหมายใกล้เคียงกัน (ปบ.บำรุง/ถอดปรน/ยุบรวม) และโจทย์คำนวณน้ำมันเชื้อเพลิงที่ต้องคูณระยะทาง เที่ยว วัน และจำนวนรถให้ครบก่อนหารด้วยอัตราสิ้นเปลือง</p>\n<h2>12. งานกิจการพลเรือน การปกครอง สังคมจิตวิทยา และการประชาสัมพันธ์</h2>\n<p>หน่วยงานหลักด้านกิจการพลเรือนในระดับกองทัพบก คือ <strong>กรมกิจการพลเรือนทหารบก (กร.ทบ.)</strong></p>\n<p>ขอบเขตงานประชาสัมพันธ์ของ ทบ. ครอบคลุมทั้ง <strong>การประชาสนเทศ, การเสนาสนเทศ, และการชุมนุมสัมพันธ์</strong></p>\n<p>งานกิจการพลเรือนของ ทบ. ในปัจจุบันมี <strong>4 งานหลัก</strong>: การปฏิบัติการกิจการพลเรือน, การปฏิบัติการจิตวิทยา, การประชาสัมพันธ์, และการปลูกฝังอุดมการณ์ทางการเมือง</p>\n<p>งานหลักของ<strong>การปฏิบัติการกิจการพลเรือน (CA)</strong> โดยเฉพาะ ได้แก่ การเสริมสร้างความสัมพันธ์อันดีกับชุมชน, การส่งเสริม/สนับสนุนการปฏิบัติของส่วนราชการพลเรือน, การส่งเสริม/สนับสนุนการปฏิบัติทางทหาร, การควบคุมและใช้ประโยชน์จากทรัพยากรในท้องถิ่น, การพัฒนาพลังประชาชน, และการปกครองดินแดนที่ได้จากการยึดครอง — ส่วน \"การป้องกันภัยฝ่ายพลเรือน\" และ \"การดำรงสภาพพลเรือน\" <strong>ไม่ใช่</strong> งานหลักของกิจการพลเรือนโดยตรง</p>\n<p>บทบาทของทหารด้านการปกครอง:</p>\n<ul>\n<li>ในพื้นที่ฝ่ายเรา ให้เจ้าหน้าที่พลเรือนรับผิดชอบโดยตรง ฝ่ายทหารเข้าไปสนับสนุนตามการร้องขอ เว้นแต่กรณีหวังผลทางการรบหรือเกินขีดความสามารถของเจ้าหน้าที่พลเรือน ฝ่ายทหารจึงเข้ารับผิดชอบโดยตรง</li>\n<li>ในพื้นที่ฝ่ายตรงข้าม ฝ่ายทหารจะเข้าควบคุมอำนาจการปกครองทั้งปวง (<strong>ไม่ใช่</strong>ปล่อยให้ประชาชนปกครองตนเอง) โดยยึดหลักมนุษยธรรม, หลักประโยชน์ของผู้ถูกปกครอง, และหลักการรับรู้ในสิทธิซึ่งกันและกัน</li>\n</ul>\n<p>ปัจจัยที่ฝ่ายทหารควรนำมาเป็นหลักในการปฏิบัติงานด้านสังคมจิตวิทยา คือ ด้าน<strong>การศึกษา, ศิลปวัฒนธรรม, และสาธารณสุข</strong></p>\n<p><strong>การปลูกฝังอุดมการณ์ทางทหาร</strong> หมายถึง การปลูกฝังความเชื่อในระบอบการปกครองของสังคมหนึ่งเทียบกับระบอบการปกครองของอีกสังคมหนึ่งว่าแบบใดเหมาะสมกว่ากัน — ต้องระวังไม่สับสนกับนิยามของ \"การปฏิบัติการจิตวิทยา\" (การเผยแพร่ข่าวสาร/ความคิดเห็น/ลัทธินิยมเพื่อจูงใจกลุ่มเป้าหมาย) และ \"การประชาสัมพันธ์\" (การสร้างความสัมพันธ์อันดีกับกลุ่มประชาชนโดยมีประชามติเป็นบรรทัดฐาน) ซึ่งเป็นตัวลวงที่ข้อสอบมักนำนิยามมาสลับกัน</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกนิยาม 3 คำที่คล้ายกัน (การปฏิบัติการจิตวิทยา / การประชาสัมพันธ์ / การปลูกฝังอุดมการณ์ทางทหาร) และแยกบทบาททหารเรื่องการปกครองในพื้นที่ฝ่ายเรา vs พื้นที่ฝ่ายตรงข้าม</p>\n<h2>13. งบประมาณ การเงิน และสำนักงานปลัดบัญชีทหารบก (สปช.ทบ.)</h2>\n<p>ภารกิจของ <strong>สปช.ทบ.</strong> ได้แก่ จัดทำ ประสานงาน และกำกับดูแลเกี่ยวกับงบประมาณ การบัญชี การเงิน และการควบคุมภายใน, อำนวยการศึกษาในกิจการปลัดบัญชี, และกำกับดูแล กง.ทบ. (กรมการเงินทหารบก) และ สตน.ทบ. (สำนักงานตรวจสอบภายในทหารบก) ในด้านการกำหนดภารกิจ การจัดระเบียบ และการบริหารงาน — ส่วน<strong>\"การกำหนดหลักนิยมในการจัด ทบ.\"</strong> <strong>ไม่ใช่</strong> ภารกิจของ สปช.ทบ.</p>\n<p>การแบ่งปีงบประมาณเป็น <strong>\"ไตรมาส\"</strong> จำนวน 4 ห้วง ให้ระวังว่าปีงบประมาณราชการไทยเริ่มต้นที่เดือน<strong>ตุลาคม</strong> ไม่ใช่มกราคม ดังนั้นการระบุไตรมาสที่ 1 = ม.ค.-มี.ค. ตามปีปฏิทินทั่วไปจึงเป็นการเข้าใจผิด (ข้อสอบชี้ว่าตัวเลือกที่อ้างอิงปีปฏิทินแบบนี้ผิดทั้งหมด)</p>\n<p>หน่วยงานที่เกี่ยวข้องด้านงบประมาณของ ทบ. ได้แก่ หน่วยการเงินกองทัพบก และหน่วยงบประมาณกองทัพบก</p>\n<p>ตามโครงสร้างส่วนราชการของ ทบ. สปช.ทบ. จัดอยู่ใน <strong>\"ส่วนบัญชาการ\"</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกภารกิจที่สปช.ทบ.ทำ กับภารกิจที่ไม่ใช่ของสปช.ทบ. (โดยเฉพาะเรื่องหลักนิยม) และการนับไตรมาสของปีงบประมาณราชการที่เริ่มเดือนตุลาคม</p>\n<h2>14. วินัยทหารและศาลทหาร</h2>\n<p>วิธีการทั่วไปในการรักษาวินัยทหาร มี <strong>2 วิธี</strong> คือ วิธีป้องกัน และวิธีแก้ไข</p>\n<p><strong>นายทหารธุรการ (นธน.)</strong> เป็นผู้รับผิดชอบด้านงานธุรการทางศาล</p>\n<p>ในยามศึกสงคราม จะมีการจัดตั้ง <strong>\"ศาลอาญาศึก\"</strong> ขึ้นเป็นการเฉพาะ</p>\n<p>ในเวลาปกติ โครงสร้างศาลทหารมี 3 ชั้น คือ ศาลทหารชั้นต้น, ศาลทหารกลาง, และศาลทหารสูงสุด (ไม่มี \"ศาลชั้นอุทธรณ์\" เป็นชั้นแยกต่างหากตามที่ตัวเลือกบางข้อกล่าวอ้าง — ต้องระวังตัวลวงที่เพิ่มชั้นศาลเข้ามาให้ครบ 4 ชั้น)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนชั้นของศาลทหารในเวลาปกติ (3 ชั้น ไม่ใช่ 4) และบทบาทของ นธน. กับศาลอาญาศึกในยามสงคราม</p>\n<h2>15. ระบบ BOS (Battlefield Operating System)</h2>\n<p>ระบบ BOS7 คือการแบ่งกิจกรรมในสนามรบออกเป็น 7 ระบบงานเพื่อประสานการปฏิบัติ ครอบคลุมทั้งการควบคุมบังคับบัญชา การข่าวกรอง การดำเนินกลยุทธ การสนับสนุนการยิง การป้องกันภัยทางอากาศ การส่งกำลังบำรุง และการเอาตัวรอด/การช่วยรบ</p>\n<p>ในระบบ BOS7 นี้ งานที่เป็นความรับผิดชอบของ<strong>เหล่าสื่อสารโดยตรง</strong> คือ <strong>\"การควบคุมบังคับบัญชา\" (Command and Control)</strong> เนื่องจากเหล่าสื่อสารเป็นผู้วางระบบและดูแลเครือข่ายสื่อสารที่ใช้สนับสนุนการบังคับบัญชาของหน่วย</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ระบุว่าในบรรดา 7 ระบบของ BOS ระบบใดเป็นงานเฉพาะของเหล่าสื่อสาร (เฉลย: การควบคุมบังคับบัญชา ไม่ใช่การข่าวกรองหรือการดำเนินกลยุทธ)</p>"}, {"subject": 7, "subjectTitle": "วิชาคอมพิวเตอร์", "html": "<p>เอกสารนี้สังเคราะห์ความรู้จากคลังข้อสอบวิชาคอมพิวเตอร์ (subject_7) จำนวน 100 ข้อ โดยจัดกลุ่มเป็นหัวข้อความรู้ที่ควรอ่านทำความเข้าใจก่อนสอบ ไม่ใช่การท่องจำเป็นข้อๆ</p>\n<hr />\n<h2>1. พื้นฐานคอมพิวเตอร์และองค์ประกอบของระบบ</h2>\n<p><strong>หน่วยของข้อมูล</strong> เรียงจากเล็กไปใหญ่: Bit (เลขฐานสอง 0/1) → 8 Bit = 1 <strong>Byte</strong> → Field (เขตข้อมูล) → Record (ระเบียน) → File (แฟ้มข้อมูล) → Database</p>\n<p><strong>องค์ประกอบของระบบคอมพิวเตอร์</strong> มี 4 ส่วนหลัก ได้แก่ Hardware (ฮาร์ดแวร์), Software (ซอฟต์แวร์), Peopleware (บุคลากร) และ Data (ข้อมูล)</p>\n<p><strong>Software (ซอฟต์แวร์)</strong> คือชุดคำสั่งหรือโปรแกรมที่สั่งงานให้คอมพิวเตอร์ทำงาน แบ่งได้เป็น 2 ประเภทหลัก คือ</p>\n<ul>\n<li><strong>ซอฟต์แวร์ระบบ (System Software)</strong> เช่น ระบบปฏิบัติการ</li>\n<li><strong>ซอฟต์แวร์ประยุกต์ (Application Software)</strong> คือโปรแกรมใช้งานทั่วไป</li>\n</ul>\n<p><strong>Program</strong> คือชุดคำสั่งในระบบคอมพิวเตอร์</p>\n<p><strong>จอภาพ (Monitor)</strong>: หน่วยที่ใช้บอกความละเอียดของจอภาพคือ <strong>Pixel</strong> และชนิดของจอภาพที่ควรรู้จักคือ <strong>CRT</strong> (จอแบบหลอดภาพ)</p>\n<p><strong>หน่วยความจำสำรอง</strong>: หากต้องการสำรอง (Backup) ข้อมูลในฐานข้อมูลขนาดใหญ่ ควรเลือกใช้ <strong>Hard Disk</strong></p>\n<p><strong>ขนาดของเครื่องคอมพิวเตอร์แบบพกพา</strong>: Laptop = ขนาดสมุดโน้ต, Palmtop = ขนาดฝ่ามือ</p>\n<p><strong>ประเภทคอมพิวเตอร์ตามลักษณะการประมวลผลสัญญาณ</strong>: Analog Computer, Digital Computer และ <strong>Hybrid Computer</strong> (เครื่องที่ใช้เทคนิคและส่วนประกอบร่วมกันทั้งแบบ Analog และ Digital)</p>\n<p><strong>ความสามารถของคอมพิวเตอร์</strong>: <strong>Voice Recognition</strong> คือความสามารถของคอมพิวเตอร์ในการรับรู้คำพูดของมนุษย์โดยไม่คำนึงว่าใครเป็นผู้พูด (ไม่ขึ้นกับตัวผู้พูด)</p>\n<p><strong>การเรียงข้อมูล (Sorting)</strong> แบ่งได้เป็น Internal Sort และ External Sort</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ลำดับหน่วยข้อมูล (bit → byte → field → record → file) และการแปลง 8 bit = 1 byte</li>\n<li>องค์ประกอบ 4 ส่วนของระบบคอมพิวเตอร์ และการแบ่งซอฟต์แวร์เป็น 2 ประเภท</li>\n<li>คำศัพท์เฉพาะ เช่น Pixel, Voice Recognition, Hybrid Computer</li>\n</ul>\n<hr />\n<h2>2. ประวัติศาสตร์คอมพิวเตอร์และบุคคลสำคัญ</h2>\n<p>ควรจำคู่ \"บุคคล/สิ่งที่ประดิษฐ์\" ให้แม่นตามที่ข้อสอบชุดนี้กำหนด (หมายเหตุ: บางคำตอบอาจต่างจากตำราประวัติศาสตร์ทั่วไป แต่ให้ยึดตามเฉลยของคลังข้อสอบชุดนี้เพื่อใช้สอบ):</p>\n<ul>\n<li><strong>Ada Augusta (Ada Lovelace)</strong> ได้รับการยกย่องเป็น <strong>โปรแกรมเมอร์คนแรกของโลก</strong></li>\n<li><strong>Charles Babbage</strong> — ตามเฉลยข้อสอบระบุเป็นผู้ประดิษฐ์ตาราง <strong>Logarithms</strong></li>\n<li><strong>Difference Engine</strong> — ตามเฉลยข้อสอบระบุผู้ประดิษฐ์คือ <strong>John Mauchly</strong></li>\n<li><strong>William Oughtred</strong> นักคณิตศาสตร์ชาวอังกฤษ เป็นผู้ประดิษฐ์ <strong>สไลด์รูล (Slide Rule)</strong></li>\n<li><strong>MARK 1</strong> คือเครื่องคำนวณที่ควบคุมด้วยคำสั่งเรียงตามลำดับโดยอัตโนมัติเครื่องแรก หรือ Automatic Sequence Controlled Calculator (<strong>ASCC</strong>)</li>\n<li><strong>John Mauchly และ Presper Eckert</strong> เป็นผู้ประดิษฐ์เครื่องคอมพิวเตอร์อิเล็กทรอนิกส์เครื่องแรกของโลก</li>\n<li><strong>IBM</strong> ย่อมาจาก <strong>International Business Machines Corporation</strong></li>\n</ul>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>จับคู่ชื่อบุคคลสำคัญกับผลงาน/สิ่งประดิษฐ์ที่เกี่ยวข้อง</li>\n<li>คำเต็มของคำย่อองค์กร/เครื่องที่สำคัญ เช่น IBM, ASCC (MARK 1)</li>\n</ul>\n<hr />\n<h2>3. ระบบเลขฐานสอง (Binary Number System)</h2>\n<p>การแปลงเลขฐานสองเป็นฐานสิบ ทำโดยคูณแต่ละหลักด้วยค่าน้ำหนัก 2 ยกกำลังตามตำแหน่ง (นับจากขวาสุดเริ่มที่ 2⁰) แล้วนำมาบวกกัน</p>\n<p>ตัวอย่าง:</p>\n<ul>\n<li>1111₂ = (1×8)+(1×4)+(1×2)+(1×1) = <strong>15</strong></li>\n<li>1101₂ = (1×8)+(1×4)+(0×2)+(1×1) = <strong>13</strong></li>\n</ul>\n<p>เลขฐานสองใช้สัญลักษณ์เพียง 2 ตัวคือ 0 กับ 1 ซึ่งเป็นหน่วยพื้นฐาน (Bit) ที่คอมพิวเตอร์ใช้แทนข้อมูลทั้งหมด</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>โจทย์คำนวณแปลงเลขฐานสอง (4 บิต) ให้เป็นเลขฐานสิบ ควรฝึกคำนวณให้คล่องและจำค่าน้ำหนักบิต 1,2,4,8 (และ 16,32,... หากมีบิตมากขึ้น) ให้แม่น</li>\n</ul>\n<hr />\n<h2>4. ระบบปฏิบัติการ Windows และอินเทอร์เน็ตเบื้องต้น</h2>\n<p><strong>เว็บเพจ (Web Page)</strong> คือเอกสารที่แสดงในแต่ละหน้าผ่านเครื่องคอมพิวเตอร์ อาจประกอบด้วยข้อความ ภาพ และเสียง ไว้บริการผู้ใช้อินเทอร์เน็ต</p>\n<p><strong>หน้าแรกของเว็บไซต์</strong> ที่ตั้งค่าให้เปิดขึ้นอัตโนมัติ เรียกกันทั่วไปว่า Homepage</p>\n<p><strong>การพิมพ์เอกสารในระบบ Windows</strong>: เข้าถึงผ่านเมนู <strong>Start Menu → Program</strong></p>\n<p><strong>Recycle Bin</strong>: ทำหน้าที่เป็นโฟลเดอร์สำหรับเก็บพักไฟล์ที่ถูกลบทิ้ง (ยังไม่ได้ลบถาวรทันที) หากลบไฟล์ผิดพลาดสามารถกู้คืนได้ด้วยคำสั่ง <strong>Restore</strong> ใน Recycle Bin</p>\n<p><strong>Unix</strong>: เดิมเป็นระบบปฏิบัติการที่ใช้บนเครื่อง <strong>มินิคอมพิวเตอร์ (Mini Computer)</strong> ต่อมามีการพัฒนาให้นำมาใช้กับเครื่องไมโครคอมพิวเตอร์ด้วย</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>การกู้คืนไฟล์ที่ลบผิดพลาดผ่าน Recycle Bin/Restore</li>\n<li>เส้นทางเมนู Start → Program สำหรับเปิดโปรแกรมพิมพ์เอกสาร</li>\n<li>ที่มาของระบบปฏิบัติการ Unix (จากมินิคอมพิวเตอร์สู่ไมโครคอมพิวเตอร์)</li>\n</ul>\n<hr />\n<h2>5. ระบบสารสนเทศ (Information System)</h2>\n<p>คำว่า \"ระบบสารสนเทศ\" ภาษาอังกฤษเขียนว่า <strong>Information System</strong></p>\n<p><strong>ข้อมูล (Data)</strong> หมายถึง ข้อเท็จจริงหรือเหตุการณ์ที่เกิดขึ้น แล้วใช้ตัวเลข ตัวอักษร หรือสัญลักษณ์ต่างๆ ทำความหมายแทนสิ่งเหล่านั้น</p>\n<p><strong>สารสนเทศ (Information)</strong> หมายถึง ข้อสรุปต่างๆ ที่ได้จากการนำข้อมูลมาทำการวิเคราะห์หรือผ่านวิธีการที่กำหนดขึ้น เพื่อนำข้อสรุปไปใช้งานหรืออ้างอิง</p>\n<p><strong>ความแตกต่างข้อมูล-สารสนเทศ</strong>: ข้อมูลเป็นข้อเท็จจริงดิบ ส่วนสารสนเทศเป็นข้อมูลที่ผ่านการกลั่นกรอง/วิเคราะห์แล้ว เช่น <strong>ข่าวตามหนังสือพิมพ์</strong> ถือเป็นตัวอย่างของ Information (เพราะผ่านการเรียบเรียงนำเสนอมาแล้ว)</p>\n<p><strong>แหล่งข้อมูล</strong>:</p>\n<ul>\n<li><strong>แหล่งข้อมูลภายใน (Internal Source)</strong> คือข้อมูลที่นำมาจากภายในองค์กรนั้นๆ เอง</li>\n<li><strong>ข้อมูลปฐมภูมิ (Primary Data)</strong> คือข้อมูลที่รวบรวม/เก็บมาด้วยตนเองโดยตรง เช่น รูปภาพที่นักเรียนถ่ายรวบรวมได้เอง</li>\n</ul>\n<p><strong>องค์ประกอบของระบบสารสนเทศ</strong> ได้แก่ Hardware, Software, ข้อมูล (Data), บุคลากร และขั้นตอนการปฏิบัติงาน (Procedure) — ในบริบทนี้ <strong>Hardware</strong> หมายถึง อุปกรณ์ที่ช่วยในการป้อนข้อมูล ประมวลผล จัดเก็บ และผลิตเอาต์พุตออกมาในระบบสารสนเทศ</p>\n<p><strong>ขั้นตอนการประมวลผลข้อมูล</strong>:</p>\n<ul>\n<li>ขั้นพื้นฐาน 3 ขั้น: <strong>รับข้อมูลเข้า (Input) → ประมวลผล (Process) → แสดงผล (Output)</strong></li>\n<li>ขั้นตอนแบบละเอียด: การรวบรวมข้อมูล → การแยกแยะข้อมูลออกเป็นกลุ่ม → การตรวจสอบความถูกต้องของข้อมูล → การคำนวณหาค่าต่างๆ → การจัดลำดับ → การรายงานผล</li>\n</ul>\n<p><strong>EIS (Executive Information System)</strong> คือระบบสารสนเทศสำหรับผู้บริหารระดับสูง</p>\n<p><strong>ซอฟต์แวร์ฐานข้อมูล</strong>: ในซอฟต์แวร์ Microsoft Access แถวและคอลัมน์ (ภาษาอังกฤษ) เรียกว่า <strong>Row - Column</strong> ตามลำดับ เหมาะกับงานจัดเก็บ/คำนวณข้อมูลเชิงตาราง เช่น คำนวณรายรับ-รายจ่ายของโรงเรียน</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>นิยามศัพท์ \"ข้อมูล\" เทียบกับ \"สารสนเทศ\" (ออกซ้ำในหลายมุมมอง)</li>\n<li>ลำดับขั้นตอนการประมวลผล Input → Process → Output</li>\n<li>องค์ประกอบของระบบสารสนเทศ และตัวย่อระบบสารสนเทศผู้บริหาร (EIS)</li>\n</ul>\n<hr />\n<h2>6. พระราชบัญญัติว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ พ.ศ. 2560</h2>\n<p><strong>รัฐมนตรีว่าการกระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม</strong> เป็นผู้รักษาการตาม พ.ร.บ. ฉบับนี้</p>\n<p><strong>ฐานความผิดและบทลงโทษ</strong> ที่ควรจำ (เรียงจากโทษน้อยไปมาก):</p>\n<table>\n<thead>\n<tr>\n<th>ลักษณะการกระทำผิด</th>\n<th>บทลงโทษ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>จำหน่าย/เผยแพร่ชุดคำสั่ง (โปรแกรม) ที่จัดทำขึ้นเพื่อใช้เป็นเครื่องมือกระทำความผิดต่อระบบคอมพิวเตอร์ผู้อื่นทั่วไป</td>\n<td>จำคุกไม่เกิน 1 ปี หรือปรับไม่เกิน 20,000 บาท หรือทั้งจำทั้งปรับ</td>\n</tr>\n<tr>\n<td>ล่วงรู้มาตรการป้องกันการเข้าถึงระบบคอมพิวเตอร์ที่ผู้อื่นจัดทำขึ้นเฉพาะ แล้วนำไปเปิดเผยโดยมิชอบจนอาจก่อความเสียหาย</td>\n<td>จำคุกไม่เกิน 1 ปี หรือปรับไม่เกิน 20,000 บาท หรือทั้งจำทั้งปรับ</td>\n</tr>\n<tr>\n<td>เข้าถึงโดยมิชอบซึ่งข้อมูลคอมพิวเตอร์ที่มีมาตรการป้องกันการเข้าถึงโดยเฉพาะ (มาตรการนั้นไม่ได้มีไว้สำหรับตน) เช่น แอบใช้รหัสผ่านผู้อื่นเข้าถึงข้อมูลลับ</td>\n<td>จำคุกไม่เกิน 2 ปี หรือปรับไม่เกิน 40,000 บาท หรือทั้งจำทั้งปรับ</td>\n</tr>\n<tr>\n<td>จำหน่าย/เผยแพร่ชุดคำสั่งที่จัดทำขึ้นเพื่อใช้เป็นเครื่องมือเข้าถึงระบบที่เกี่ยวกับความมั่นคงปลอดภัยของประเทศ</td>\n<td>จำคุกไม่เกิน 2 ปี หรือปรับไม่เกิน 40,000 บาท หรือทั้งจำทั้งปรับ</td>\n</tr>\n<tr>\n<td>นำเข้าสู่ระบบคอมพิวเตอร์ซึ่งข้อมูลอันเป็นเท็จ โดยประการที่น่าจะเกิดความเสียหายต่อความมั่นคงปลอดภัยของประเทศ/ความปลอดภัยสาธารณะ/เศรษฐกิจ หรือก่อให้เกิดความตื่นตระหนกแก่ประชาชน (เช่น สร้างข่าวลือระบาดของไวรัสโควิด-19)</td>\n<td>จำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท หรือทั้งจำทั้งปรับ</td>\n</tr>\n<tr>\n<td>ตัดต่อภาพผู้อื่นแล้วโพสต์ลงโซเชียลมีเดียจนได้รับความอับอาย</td>\n<td>จำคุกไม่เกิน 3 ปี และปรับไม่เกิน 200,000 บาท</td>\n</tr>\n<tr>\n<td>ผู้ครอบครองข้อมูลคอมพิวเตอร์ที่ศาลสั่งให้ทำลาย แต่ไม่ทำลายตามคำสั่ง</td>\n<td>ระวางโทษกึ่งหนึ่งของโทษที่บัญญัติไว้</td>\n</tr>\n</tbody>\n</table>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>จับคู่ \"ลักษณะการกระทำผิด\" กับ \"อัตราโทษ\" ให้ถูกต้อง โทษที่พบบ่อยคือ 1 ปี/20,000 บาท, 2 ปี/40,000 บาท และ 5 ปี/100,000 บาท</li>\n<li>หลักการทั่วไป: ยิ่งการกระทำกระทบต่อความมั่นคงของประเทศ/สาธารณะมากเท่าไร โทษยิ่งสูงขึ้น</li>\n<li>ผู้รักษาการตามกฎหมายฉบับนี้คือรัฐมนตรีกระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม</li>\n</ul>\n<hr />\n<h2>7. การจัดกลุ่มตำแหน่งบุคลากรภาครัฐด้านการบริหารและดิจิทัล</h2>\n<ul>\n<li><strong>ผู้บริหารระดับสูง (Executive)</strong>: หัวหน้า/รองหัวหน้าส่วนราชการระดับกระทรวง กรม จังหวัด หรือหน่วยงานในต่างประเทศ ตำแหน่งประเภทบริหารระดับสูง รับผิดชอบกำหนดนโยบายและทิศทางองค์กร เช่น ปลัดกระทรวง รองปลัดกระทรวง อธิบดี รองอธิบดี ผู้ว่าราชการจังหวัด เอกอัครราชทูต</li>\n<li><strong>ผู้อำนวยการกอง (Management)</strong>: หัวหน้าหน่วยงานระดับกอง หรือตำแหน่งประเภทอำนวยการ รับผิดชอบนำนโยบายจากฝ่ายบริหารไปปฏิบัติให้เกิดผลจริง เช่น ผู้อำนวยการสำนัก/กอง/ศูนย์</li>\n<li><strong>ผู้ทำงานด้านนโยบายและงานวิชาการ (Academic)</strong>: ผู้ปฏิบัติงานที่ต้องใช้ความรู้ทางวิชาการ เช่น จัดทำนโยบาย/แผนงาน/งบประมาณ วิจัยหรือจัดทำผลงานวิชาการ ตำรา หลักสูตร หรือให้คำปรึกษาเชิงวิชาการ</li>\n<li><strong>ผู้ทำงานด้านบริการ (Service)</strong>: ปฏิบัติงานเพื่อให้บริการ ช่วยเหลือ หรืออำนวยความสะดวกแก่ผู้รับบริการโดยตรง (ไม่จำเป็นต้องใช้ความรู้ทางวิชาการ)</li>\n<li><strong>ผู้ปฏิบัติงานเฉพาะด้านเทคโนโลยีดิจิทัล (Technology Specialist)</strong>: ผู้ดำรงตำแหน่งนักวิชาการคอมพิวเตอร์ เจ้าพนักงานเครื่องคอมพิวเตอร์ หรือสายงานอื่นที่ต้องใช้ความรู้เชิงเทคนิคเกี่ยวกับเทคโนโลยีดิจิทัล</li>\n</ul>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ให้คำอธิบายลักษณะงานยาวๆ แล้วถามว่าจัดอยู่ในกลุ่มตำแหน่งใด ต้องจับคำสำคัญ: \"กำหนดนโยบาย\" = ผู้บริหารระดับสูง, \"นำนโยบายไปปฏิบัติ\" = Management, \"วิจัย/วิชาการ\" = Academic, \"ให้บริการประชาชนโดยตรง\" = Service, \"ความรู้เชิงเทคนิคดิจิทัล\" = Technology Specialist</li>\n</ul>\n<hr />\n<h2>8. Google Apps และเครื่องมือคลาวด์เพื่อการทำงาน/การศึกษา</h2>\n<p><strong>Google Apps</strong> เป็นชุดโปรแกรมที่ประมวลผลแบบ <strong>Cloud Computing</strong> เริ่มนำมาใช้งานครั้งแรกในปี <strong>พ.ศ. 2549</strong> (ปีเดียวกับที่ Google Calendar/ปฏิทิน เปิดให้ผู้บริโภคทั่วไปใช้งาน)</p>\n<p><strong>Google Sites</strong> เปิดใช้งานเมื่อเดือน<strong>พฤษภาคม พ.ศ. 2551</strong></p>\n<p><strong>Google Calendar</strong>: ใช้สร้างตารางนัดหมาย/ตารางสอน ที่สามารถอัปโหลด/ซิงค์เข้าสมาร์ทโฟนได้</p>\n<p><strong>Google Forms</strong>: หากต้องการให้ระบบตรวจข้อสอบให้อัตโนมัติ ต้องติดตั้งส่วนเสริม (Add-on) ชื่อ <strong>Flubaroo</strong></p>\n<p><strong>Google Docs</strong>: ใช้งานได้หลากหลาย (ประมวลผลคำ) — เคอร์เซอร์ที่ปรากฏบนหน้าเอกสารทำหน้าที่แสดงตำแหน่งที่จะเริ่มพิมพ์</p>\n<p><strong>Google Sheets</strong>:</p>\n<ul>\n<li>สามารถดาวน์โหลดเป็นไฟล์นามสกุลต่างๆ ได้ ยกเว้นไฟล์ประเภทค่าคอนฟิกระบบ เช่น <strong>.ini</strong></li>\n<li>สามารถใช้ไฟล์นามสกุล <strong>.xlsx</strong> ใน Google Drive ได้</li>\n<li>การพิมพ์สูตรคำนวณต้อง <strong>ขึ้นต้นด้วยเครื่องหมายเท่ากับ (=)</strong></li>\n<li>การรวมเซลล์เข้าด้วยกัน ทำผ่านเมนู <strong>รูปแบบ → ผสานเซลล์</strong></li>\n</ul>\n<p><strong>Google Slides</strong>: ความสามารถคล้ายกับโปรแกรม <strong>Ms. PowerPoint และ OpenOffice Impress</strong></p>\n<p><strong>Google Sites</strong>: การตั้งชื่อไซต์ต้องตั้งที่ <strong>Title</strong>, การนำเสนอเว็บไซต์กดปุ่ม <strong>F5</strong>, คีย์ลัดเข้าไปจัดการไซต์คือกด <strong>g ตามด้วย m</strong></p>\n<p><strong>Google Classroom</strong>: เป็นการผสมผสานเครื่องมือใน Google Apps for Education (ไม่รวม Google Earth) ช่วยจัดการชั้นเรียนออนไลน์</p>\n<p><strong>Google Drive</strong>: ไฟล์ที่ใส่ไว้ในโฟลเดอร์ \"Google ไดรฟ์\" บนเครื่อง (My Document) จะถูกซิงค์อัปโหลดเข้าสู่ Google Drive บนคลาวด์โดยอัตโนมัติ</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ปีที่เปิดตัวบริการต่างๆ (Google Apps/Calendar ปี 2549, Google Sites พ.ค. 2551)</li>\n<li>ชื่อ Add-on เฉพาะทาง เช่น Flubaroo สำหรับตรวจข้อสอบใน Google Forms</li>\n<li>เมนูและคีย์ลัดเฉพาะของแต่ละแอป (F5 นำเสนอ Site, g+m จัดการ Site, ผสานเซลล์ใน Sheets)</li>\n<li>การเทียบเคียงแอป Google กับโปรแกรม Office ทั่วไป (Slides ↔ PowerPoint/Impress)</li>\n</ul>\n<hr />\n<h2>9. Big Data และวิทยาการข้อมูล (Data Science)</h2>\n<p><strong>Big Data</strong> ถูกภาครัฐนำมาประยุกต์ใช้ในสถานการณ์โควิด-19 โดยเฉพาะด้าน <strong>การวิเคราะห์ข้อมูลด้านสาธารณสุข</strong></p>\n<p><strong>กระบวนการวิทยาการข้อมูล (Data Science Process)</strong> มีขั้นตอนสำคัญที่ควรแยกแยะให้ได้:</p>\n<ul>\n<li><strong>การเก็บรวบรวมข้อมูล</strong> คือการค้นหา/รวบรวมข้อมูลตั้งต้น เช่น การค้นหาข้อมูลความนิยมของสิ่งต่างๆ ก่อนนำไปใช้ต่อ</li>\n<li><strong>การวิเคราะห์ข้อมูล</strong> คือขั้นตอนการหารูปแบบของข้อมูล หาความสัมพันธ์ของข้อมูล รวมถึงอาจใช้ทำนายข้อมูลหรือเหตุการณ์ในอนาคตจากข้อมูลที่มีอยู่</li>\n</ul>\n<p><strong>ทักษะที่เกี่ยวข้องกับ Data Scientist/Big Data</strong> ส่วนใหญ่เป็นด้านสถิติ คณิตศาสตร์ การเขียนโปรแกรม/วิทยาการคอมพิวเตอร์ ส่วนทักษะที่ไม่เกี่ยวข้องโดยตรง เช่น รัฐศาสตร์ (Political Science)</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>แยกแยะสถานการณ์ตัวอย่างว่าอยู่ในขั้นตอนใดของกระบวนการวิทยาการข้อมูล (เก็บรวบรวม vs วิเคราะห์)</li>\n<li>ทักษะที่เกี่ยวข้อง/ไม่เกี่ยวข้องกับ Data Scientist</li>\n</ul>\n<hr />\n<h2>10. ภัยคุกคามไซเบอร์ ไวรัสคอมพิวเตอร์ และมารยาทการใช้อินเทอร์เน็ต</h2>\n<p><strong>Hacker</strong> คือผู้เชี่ยวชาญที่มีความสามารถเจาะระบบรักษาความปลอดภัยของเครื่องคอมพิวเตอร์ผู้อื่นได้</p>\n<p><strong>ไวรัสคอมพิวเตอร์ (Computer Virus)</strong> คือโปรแกรมที่บุกรุกเข้าเครื่องคอมพิวเตอร์โดยไม่ได้รับอนุญาตจากผู้ใช้ อาการของเครื่องที่ติดไวรัสมีได้หลายลักษณะ (เช่น เครื่องทำงานผิดปกติ/ช้าลง ไฟล์สูญหายหรือเสียหาย โปรแกรมทำงานแปลกไป) — เมื่อโจทย์ยกตัวอย่างอาการหลายแบบพร้อมกันมักตอบว่า \"ถูกทุกข้อ\"</p>\n<p><strong>มารยาทการใช้อินเทอร์เน็ต</strong>: การโพสต์ข้อความว่าร้าย/เปิดเผยความลับของผู้อื่นบนโซเชียลมีเดีย (เช่น Facebook) ถือเป็นการกระทำผิด เพราะเป็นการใช้คอมพิวเตอร์ทำร้ายหรือละเมิดสิทธิของผู้อื่น</p>\n<p><strong>การรับมือกับภัยออนไลน์</strong>: ควรปกปิดข้อมูลส่วนตัว <strong>ไม่ควรระบุชื่อจริง เพศ หรืออายุจริง</strong> เมื่อใช้บริการต่างๆ บนอินเทอร์เน็ต เพื่อลดความเสี่ยงจากภัยออนไลน์</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>แยกแยะพฤติกรรมที่ผิดมารยาท/ผิดกฎหมายบนอินเทอร์เน็ต</li>\n<li>วิธีป้องกันตนเองจากภัยออนไลน์ โดยเน้นหลักการ \"ไม่เปิดเผยข้อมูลส่วนตัวที่แท้จริง\"</li>\n</ul>\n<hr />\n<h2>11. Internet of Things (IoT) และปัญญาประดิษฐ์ (AI)</h2>\n<p><strong>IoT (Internet of Things)</strong> คือการเชื่อมต่ออุปกรณ์ต่างๆ เข้ากับอินเทอร์เน็ตเพื่อให้สื่อสาร/ควบคุมกันได้โดยอัตโนมัติ สามารถติดต่อสื่อสารผ่านได้หลายช่องทาง (เช่น Wi-Fi, Bluetooth, สัญญาณอินเทอร์เน็ตอื่นๆ) ตัวอย่างของ IoT เช่น เครื่องปรับอากาศที่เปิดทำงานอัตโนมัติผ่านการส่งสัญญาณระบุพิกัด</p>\n<p><strong>AI (Artificial Intelligence - ปัญญาประดิษฐ์)</strong> คือเทคโนโลยีที่ทำให้เครื่องจักร/คอมพิวเตอร์มีความสามารถในการเรียนรู้และตัดสินใจคล้ายมนุษย์ (เทคโนโลยีอย่าง Animation <strong>ไม่</strong>จัดเป็นเทคโนโลยี AI)</p>\n<p><strong>ความเสี่ยง/อันตรายของ AI</strong>: การนำ AI มาใช้เป็นอาวุธในสงคราม อาจทำให้ชีวิตของผู้บริสุทธิ์จำนวนมากได้รับผลกระทบ</p>\n<p>ปัจจุบัน AI ถูกนำมาประยุกต์ใช้อย่างแพร่หลายในหลายระบบ/หลายวงการ</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>แยกแยะว่าเทคโนโลยี/ตัวอย่างใดจัดเป็น IoT หรือ AI จริง (และตัวอย่างที่ไม่ใช่ เช่น Animation ไม่ใช่ AI)</li>\n<li>ประเด็นความเสี่ยง/อันตรายของการนำ AI ไปใช้ในทางที่ผิด เช่น ใช้เป็นอาวุธสงคราม</li>\n</ul>"}, {"subject": 8, "subjectTitle": "วิชาไฟฟ้าและอิเล็กทรอนิกส์", "html": "<h2>1. ระบบเลขฐานและรหัสดิจิทัล</h2>\n<p>การแปลงเลขฐานเป็นทักษะพื้นฐานที่ต้องทำได้คล่อง ทั้งการแปลงข้ามฐาน (ฐานสอง ↔ ฐานแปด ↔ ฐานสิบ ↔ ฐานสิบหก) และการบวก-ลบเลขในฐานที่ไม่ใช่ฐานสิบ</p>\n<ul>\n<li><strong>แปลงฐานสอง → ฐานสิบหก</strong>: จับกลุ่มบิตฐานสองทีละ 4 บิตจากขวาไปซ้าย แล้วแปลงแต่ละกลุ่มเป็น 1 หลักฐานสิบหก เช่น 101100101111(2) แบ่งเป็น 1011 0010 1111 = B2F(16)</li>\n<li><strong>แปลงฐานสิบหก → ฐานสิบ</strong>: กระจายแต่ละหลักคูณด้วยเลขฐาน 16 ยกกำลังตามตำแหน่ง แล้วบวกกัน</li>\n<li><strong>แปลงฐานสิบ → ฐานสิบหก</strong>: หารสิบด้วย 16 ไปเรื่อยๆ เก็บเศษ แล้วนำเศษมาเรียงย้อนกลับ (เศษที่ ≥10 ให้แทนด้วย A-F)</li>\n<li><strong>บวก/ลบเลขฐานแปดหรือฐานสิบหก</strong>: ทำเหมือนเลขฐานสิบทุกประการ เพียงแต่เมื่อยอดรวมในหลักใดครบฐาน (8 หรือ 16) ต้องทดขึ้นหลักถัดไป หรือขอยืมเมื่อค่าลบไม่พอ — วิธีที่ปลอดภัยที่สุดคือแปลงเป็นฐานสิบ คำนวณ แล้วแปลงกลับ</li>\n</ul>\n<p><strong>รหัสแทนอักขระ (Alphanumeric Code)</strong>: รหัสที่ใช้แทนตัวอักษร ตัวเลข และสัญลักษณ์พิเศษ เรียกรวมว่า Alphanumeric Code ซึ่งรหัสที่นิยมใช้ในคอมพิวเตอร์มากที่สุดคือ <strong>ASCII</strong> (American Standard Code for Information Interchange) โดย ASCII มาตรฐานใช้เลขฐานสอง <strong>7 บิต</strong> ในการแทนอักขระ 1 ตัว (128 รหัส) ส่วน EBCDIC เป็นรหัสอีกชนิดที่ใช้ในเมนเฟรมบางระบบ</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณแปลงฐาน/บวกลบเลขฐาน (ฐาน 2, 8, 16) แบบตรงไปตรงมาแต่ต้องคำนวณละเอียด และคำถามความจำ \"ASCII ใช้กี่บิต\" (คำตอบคือ 7 บิต ไม่ใช่ 8 บิต)</p>\n<h2>2. ลอจิกเกตพื้นฐาน (Logic Gates)</h2>\n<p>ต้องจำสัญลักษณ์วงจรและตารางความจริง (Truth Table) ของเกตพื้นฐานให้แม่น: AND, OR, NOT, NAND, NOR, EXOR (XOR), EXNOR (XNOR)</p>\n<ul>\n<li><strong>AND</strong>: เอาต์พุตเป็น 1 ก็ต่อเมื่ออินพุตทุกตัวเป็น 1</li>\n<li><strong>OR</strong>: เอาต์พุตเป็น 1 เมื่ออินพุตตัวใดตัวหนึ่ง (หรือมากกว่า) เป็น 1 — โจทย์ในลักษณะ \"ถ้าอินพุตตัวใดตัวหนึ่งทำงาน เอาต์พุตก็ทำงาน\" คือคุณสมบัติของเกต OR</li>\n<li><strong>NAND / NOR</strong>: คือ AND/OR ที่กลับสัญญาณ (Invert) ที่เอาต์พุต เป็น \"เกตสากล\" ที่สามารถนำมาต่อกันเองเพื่อสร้างเกตชนิดอื่นทุกชนิดได้ (universal gate) โจทย์มักให้ภาพวงจรที่สร้างจากไดโอด-ทรานซิสเตอร์ หรือสวิตช์ต่อกัน แล้วถามว่าเทียบเท่าเกตใด — วงจรที่เอาต์พุตเป็น 1 เมื่ออินพุตทุกตัวเป็น 0 เท่านั้น คือพฤติกรรมของ <strong>NOR</strong></li>\n<li><strong>EXOR (XOR)</strong>: เอาต์พุตเป็น 1 เมื่ออินพุตต่างกัน (ตัวหนึ่งเป็น 0 อีกตัวเป็น 1)</li>\n<li><strong>EXNOR (XNOR)</strong>: เอาต์พุตเป็น 1 เมื่ออินพุตเหมือนกัน (เป็น 0 ทั้งคู่ หรือ 1 ทั้งคู่)</li>\n</ul>\n<p>โจทย์อีกกลุ่มเป็นการต่อวงจรสวิตช์ไฟ (หลอดไฟสว่าง/ดับ) แทนพฤติกรรมของเกตลอจิก คือ การต่อสวิตช์แบบอนุกรมเทียบเท่ากับเกต AND (ต้องปิดสวิตช์ทุกตัวไฟจึงติด) และการต่อแบบขนานเทียบเท่ากับเกต OR (ปิดสวิตช์ตัวใดตัวหนึ่งไฟก็ติด)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ให้ดูภาพวงจร (ไดโอด/ทรานซิสเตอร์/สวิตช์) แล้วถามว่า \"เปรียบเทียบได้กับเกทชนิดใด\" ต้องอาศัยการจำตารางความจริงเพื่อเทียบพฤติกรรมอินพุต-เอาต์พุตกับเกตมาตรฐาน และมักถามย้อนว่า \"เอาต์พุตเป็น 1 เมื่ออินพุตมีค่าใด\"</p>\n<h2>3. พีชคณิตบูลีนและการลดรูปสมการลอจิก (Boolean Algebra / Karnaugh Map)</h2>\n<p>การลดรูปสมการลอจิกใช้กฎพีชคณิตบูลีนหลัก เช่น</p>\n<ul>\n<li>กฎเสริม: A + A̅ = 1, A · A̅ = 0</li>\n<li>กฎการดูดกลืน (Absorption): A + AB = A</li>\n<li>กฎการกระจาย (Distributive)</li>\n<li><strong>ทฤษฎีของเดอมอร์แกน (De Morgan's Theorem)</strong>: ใช้แปลงนิพจน์ที่อยู่ในรูป NAND/NOR ทั้งหมดให้กลับเป็นรูป AND-OR-NOT เพื่อลดรูปได้ง่ายขึ้น — จำเป็นมากเมื่อโจทย์ให้สมการที่มีขีดบน (complement) คร่อมทั้งนิพจน์</li>\n<li><strong>แผนผังคาร์โนห์ (Karnaugh Map / K-Map)</strong>: เป็นเครื่องมือแบบตารางช่วยจัดกลุ่มพจน์ (term) ที่ต่างกันแค่ตัวแปรเดียวเพื่อตัดตัวแปรทิ้ง ทำให้ได้สมการที่มีจำนวนตัวแปร (literal) น้อยที่สุด</li>\n</ul>\n<p>จากตัวอย่างข้อสอบ: สมการที่ดูซับซ้อนบางสมการเมื่อลดรูปแล้วอาจเหลือแค่พจน์เดียว (เช่น A B̅) หรือลดรูปแล้วกลายเป็นค่าคงที่ 0 หรือ 1 ไปเลย ดังนั้นต้องฝึกลดรูปทีละขั้นอย่างมีระบบ ไม่เดาคำตอบจากรูปร่างสมการ</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์ให้สมการลอจิกยาวๆ (มักมี NAND ครอบทั้งสมการ ต้องใช้เดอมอร์แกนก่อน) แล้วถามหารูปย่อที่สุด ตัวลวงมักเป็นคำตอบที่ลดได้ไม่สุดหรือคำตอบ 0/1</p>\n<h2>4. ฟลิปฟลอปและวงจรนับ (Flip-Flop / Counter)</h2>\n<p>ฟลิปฟลอปเป็นวงจรความจำ 1 บิต มีหลายชนิด: SR Flip-Flop, D Flip-Flop, JK Flip-Flop, T Flip-Flop</p>\n<ul>\n<li><strong>T Flip-Flop</strong>: เอาต์พุตจะ \"กลับสภาวะ\" (toggle) ทุกครั้งที่มีพัลส์สัญญาณนาฬิกา (Clock) เข้ามา</li>\n<li><strong>JK Flip-Flop</strong> สามารถดัดแปลงให้ทำงานเหมือน T Flip-Flop ได้ โดยการต่อขา <strong>J = 1 และ K = 1</strong> ตลอดเวลา (เมื่อ J=K=1 เอาต์พุตของ JK FF จะ toggle ทุก Clock เหมือน T FF)</li>\n<li><strong>วงจรนับ (Counter)</strong>: สร้างจากฟลิปฟลอปต่อกันหลายตัว จำนวนสถานะสูงสุดที่นับได้คำนวณจาก 2ⁿ - 1 เมื่อ n คือจำนวนฟลิปฟลอป (บิต) เช่น วงจรนับ 3 บิต จะนับได้ตั้งแต่ 0 ถึง 7 (นับได้สูงสุด = 7)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ถามชนิดฟลิปฟลอปจากพฤติกรรม \"toggle ทุก Clock\" (คือ T FF) และการต่อ J,K ให้ JK FF ทำตัวเป็น T FF (J=K=1) รวมถึงคำนวณค่านับสูงสุดของวงจรนับจากภาพวงจร</p>\n<h2>5. วงจรแปลงสัญญาณ DAC และ ADC</h2>\n<p><strong>DAC (Digital to Analog Converter)</strong> แปลงรหัสดิจิทัลเป็นแรงดัน/กระแสแอนะล็อก มีสูตรสำคัญที่ข้อสอบใช้คำนวณซ้ำหลายข้อ:</p>\n<ul>\n<li><strong>แรงดันเอาต์พุต</strong> = (ค่าฐานสิบของรหัสดิจิทัลอินพุต) × (Step Size) เช่น อินพุต 10001(2) = 17 ฐานสิบ ถ้า Step Size = 0.2 V จะได้เอาต์พุต = 17 × 0.2 = 3.4 V</li>\n<li><strong>แรงดันสูงสุด (Full Scale)</strong> = (2ⁿ - 1) × Step Size เมื่อ n คือจำนวนบิต — ใช้หา Step Size ได้จากรหัสอินพุตที่รู้ค่าเอาต์พุตแล้ว จากนั้นคูณด้วยรหัสสูงสุด (2ⁿ-1) เพื่อหาแรงดันสูงสุด</li>\n<li><strong>ค่าความละเอียด (Resolution %)</strong> = (Step Size ÷ แรงดันเอาต์พุตเต็มสเกล) × 100 เช่น Step Size = 1 V, Full Scale = 15 V → Resolution = 1/15 × 100 = 6.67%</li>\n<li><strong>หาจำนวนบิตที่ต้องใช้</strong>: จำนวนขั้น (steps) ที่ต้องการ = ช่วงค่าที่ต้องควบคุม ÷ Step Size แล้วหาค่า n ที่ทำให้ 2ⁿ - 1 ครอบคลุมจำนวนขั้นนั้นได้พอดีหรือมากกว่า (ปัดขึ้นเป็นจำนวนเต็มบิตถัดไป) เช่น ต้องการ 500 ขั้น → 2⁹ - 1 = 511 ≥ 500 จึงต้องใช้ 9 บิต</li>\n</ul>\n<p><strong>ADC (Analog to Digital Converter)</strong> และ <strong>วงจรสุ่มและเก็บค่า (Sample and Hold)</strong>: ความถี่ตอบสนองสูงสุดของวงจรคำนวณจากสูตร</p>\n<p>f(max) = 1 ÷ (2π × 2ⁿ × t_c)</p>\n<p>โดย n คือจำนวนบิตของ ADC และ t_c คือเวลาสวิตช์/เวลาคงที่ของวงจร (switching time) — ยิ่งจำนวนบิตมากหรือเวลาสวิตช์นานขึ้น ความถี่ตอบสนองสูงสุดจะยิ่งต่ำลง</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณ Step Size / แรงดันเต็มสเกล / Resolution / จำนวนบิต ล้วนวนใช้สูตรความสัมพันธ์ระหว่าง Step Size, จำนวนบิต และ Full Scale ตัวเดียวกัน ต้องจำสูตร 2ⁿ-1 ให้แม่น ส่วนโจทย์ความถี่ตอบสนอง ADC/Sample-Hold ให้ใช้สูตร f = 1/(2π·2ⁿ·t_c)</p>\n<h2>6. ไมโครโปรเซสเซอร์ Z-80 และภาษาแอสเซมบลี</h2>\n<p>ความรู้พื้นฐานเกี่ยวกับสถาปัตยกรรมไมโครโปรเซสเซอร์ Z-80:</p>\n<ul>\n<li>คำสั่ง <strong>RUN</strong> คือคำสั่งที่ทำให้ไมโครโปรเซสเซอร์ <strong>ทำงานตามโปรแกรมที่เขียนไว้ต่อเนื่องไปเรื่อยๆ</strong> (ไม่ใช่หยุดทีละคำสั่ง)</li>\n<li>คำสั่ง <strong>LD (Load)</strong> ใช้สำหรับย้าย/คัดลอกข้อมูล เช่น <code>LD A, FFH</code> หมายถึง นำข้อมูลเลขฐานสิบหก FF ไปใส่ใน Register A ส่วน <code>LD D, A</code> หมายถึง นำข้อมูลจาก Register A ไปใส่ใน Register D (ทิศทางอ่านจากขวาไปซ้าย: ปลายทาง, ต้นทาง)</li>\n<li><strong>Register SP (Stack Pointer)</strong>: ทำหน้าที่เก็บ/ชี้ตำแหน่งของหน่วยความจำในช่วงที่กำหนด (ในข้อสอบระบุช่วงตำแหน่ง 2000-3FFF)</li>\n<li>Register ขนาด <strong>16 บิต</strong> ที่ใช้ระบุตำแหน่งของหน่วยความจำ (Address) ในการเขียนโปรแกรมมีทั้งหมด <strong>3 ตัว</strong></li>\n<li>Z-80 สามารถนำ Register ขนาด 8 บิต มาจับคู่กันเป็น Register ขนาด 16 บิต ได้ <strong>4 คู่</strong> ได้แก่ <strong>AF, BC, DE, HL</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ความหมายของชุดคำสั่ง LD แบบต่างๆ (ต้องอ่านทิศทางปลายทาง-ต้นทางให้ถูก) และจำนวน/รายชื่อ Register คู่ 16 บิตของ Z-80 (AF, BC, DE, HL)</p>\n<h2>7. อุปกรณ์อิเล็กทรอนิกส์พื้นฐาน: ตัวต้านทาน ตัวเก็บประจุ ไดโอด/LED</h2>\n<p><strong>ตัวต้านทาน (Resistor)</strong>: ทำหน้าที่ต้านการไหลของกระแสไฟฟ้าและควบคุมค่าความต่างศักย์ในวงจร แบ่งเป็น</p>\n<ul>\n<li>ตัวต้านทานคงที่ (Fixed Resistor)</li>\n<li>ตัวต้านทานที่เปลี่ยนค่าได้ (Variable Resistor / Potentiometer) — เมื่อหมุนแกนของตัวต้านทาน ค่าความต้านทานจะเปลี่ยนแปลงไป</li>\n<li>ตัวต้านทานไวแสง (LDR - Light Dependent Resistor) — ค่าความต้านทานเปลี่ยนแปลงไปตามปริมาณแสงที่ตกกระทบ ถือว่าเป็นตัวต้านทานที่ \"ปรับค่าได้\" เช่นกัน (แม้จะไม่ได้ปรับด้วยมือ แต่ปรับตามสภาพแสง)</li>\n<li>การต่อตัวต้านทานเข้าไปในวงจรทำให้ <strong>ปริมาณกระแสไฟฟ้าลดลง</strong> และตัวต้านทานทั่วไป <strong>ไม่ต้องคำนึงถึงขั้ว</strong> (ไม่มีขั้วบวก-ลบ ต่อกลับด้านได้)</li>\n</ul>\n<p><strong>ตัวเก็บประจุ (Capacitor)</strong>: มีหน่วยเป็น <strong>ฟารัด (F)</strong> ทำหน้าที่สะสม/คายประจุไฟฟ้า และปรับแต่งสัญญาณทางอิเล็กทรอนิกส์ได้ — ตัวเก็บประจุ <strong>ไม่ได้มีขั้วทุกชนิด</strong> (บางชนิด เช่น อิเล็กโทรไลติก มีขั้ว แต่บางชนิด เช่น เซรามิก ไม่มีขั้ว) ตัวเก็บประจุชนิดเปลี่ยนค่าได้ (Variable Capacitor) มักพบในวงจรเลือกหาสถานีวิทยุ (จูนความถี่)</p>\n<p><strong>ไดโอด (Diode) และ LED</strong>: ขั้วแอโนด (Anode, A) ต่อกับขั้วบวก ขั้วแคโทด (Cathode, K) ต่อกับขั้วลบ ถ้าต่อผิดขั้วไดโอดจะไม่ยอมให้กระแสไหลผ่าน — สำหรับ LED ขา <strong>แอโนดจะยาวกว่าขาแคโทด</strong> (ไม่ใช่แคโทดยาวกว่า)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> คำถามแนว \"ข้อใดไม่ใช่คุณสมบัติของ...\" ต้องรู้ข้อเท็จจริงที่ผิดแฝงอยู่ (เช่น ตัวเก็บประจุไม่ได้มีขั้วทุกชนิด, ขา LED แอโนดยาวกว่าแคโทด) และผลของการต่อตัวต้านทานเพิ่มเข้าวงจร (กระแสลดลง)</p>\n<h2>8. สารกึ่งตัวนาและรอยต่อ PN (ไดโอด)</h2>\n<p>เมื่อนำสารกึ่งตัวนาชนิด N และชนิด P มาต่อกัน จะเกิด <strong>รอยต่อ PN</strong> และเกิดบริเวณปลอดพาหะ (Depletion Region) ทำหน้าที่เสมือนกำแพงแรงดันกั้นการไหลของอิเล็กตรอน/โฮล</p>\n<ul>\n<li>ระดับแรงดันกั้น (Barrier Voltage) ของสารกึ่งตัวนา <strong>เยอรมันเนียม (Ge)</strong> อยู่ที่ประมาณ <strong>0.3 โวลต์</strong> (ส่วนซิลิคอน Si อยู่ที่ประมาณ 0.7 โวลต์ ซึ่งเป็นความรู้เสริมที่ควรจำคู่กัน)</li>\n<li><strong>การไบแอสตรง (Forward Bias)</strong>: ต่อแรงดันขั้วบวกเข้าฝั่งสาร P และขั้วลบเข้าฝั่งสาร N ผลคือ <strong>เกิดการไหลของกระแส</strong> (ช่องว่างรอยต่อแคบลง)</li>\n<li><strong>การไบแอสกลับ (Reverse Bias)</strong>: ต่อแรงดันขั้วบวกเข้าฝั่งสาร N และขั้วลบเข้าฝั่งสาร P ผลคือ <strong>ไม่มีกระแสไหล</strong> (ช่องว่างรอยต่อกว้างขึ้น)</li>\n</ul>\n<p><strong>ไดโอดชนิดพิเศษตามหน้าที่ใช้งาน</strong>:</p>\n<ul>\n<li><strong>Bridge Diode</strong>: ไดโอด 4 ตัวต่อร่วมกัน ใช้ในวงจรเรียงกระแส (Rectifier) แปลงไฟ AC เป็น DC</li>\n<li><strong>Detector Diode</strong>: ใช้ในวงจรเครื่องรับ-ส่งวิทยุ เพื่อแยกสัญญาณวิทยุหรือลดสัญญาณรบกวน</li>\n<li>(เสริม) Zener Diode ใช้รักษาระดับแรงดัน, Varicap Diode ใช้เป็นตัวเก็บประจุปรับค่าได้ (จูนความถี่), LED ให้กำเนิดแสง, Laser Diode ให้กำเนิดแสงเลเซอร์</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ทิศทางการต่อแรงดันไบแอสตรง/กลับ (ขั้วบวก-ลบ เข้าฝั่ง P หรือ N) และการจับคู่ชนิดไดโอดกับหน้าที่การใช้งาน (Bridge = เรียงกระแส, Detector = แยกสัญญาณวิทยุ)</p>\n<h2>9. ทรานซิสเตอร์และการทำงานเป็นสวิตช์</h2>\n<p>ทรานซิสเตอร์มี <strong>3 ขา</strong> คือ Base (เบส, B), Emitter (อิมิตเตอร์, E), Collector (คอลเลกเตอร์, C) มี 2 ชนิดหลักคือ NPN และ PNP</p>\n<ul>\n<li><strong>การไบแอสขาเบสของทรานซิสเตอร์ PNP</strong>: ต้องไบแอสด้วยแรงดัน <strong>ลบ (-)</strong> เมื่อเทียบกับขาอิมิตเตอร์ (ตรงข้ามกับ NPN ที่ต้องไบแอสขาเบสด้วยแรงดันบวก)</li>\n</ul>\n<p><strong>สภาวะการทำงานของทรานซิสเตอร์</strong> มี 3 สภาวะหลัก: <strong>คัตออฟ (Cut-off)</strong>, <strong>อิ่มตัว (Saturation)</strong>, <strong>แอคทีฟ (Active)</strong> — ไม่มีสภาวะที่เรียกว่า \"สเตเบิ้ล\"</p>\n<ul>\n<li>เมื่อใช้ทรานซิสเตอร์เป็น <strong>สวิตช์ (Transistor as Switch)</strong> จะใช้งานแค่ 2 สภาวะเท่านั้น คือ <strong>คัตออฟ</strong> (สวิตช์เปิด/ปิดวงจร) กับ <strong>อิ่มตัว</strong> (สวิตช์ปิด/นำกระแสเต็มที่) — สภาวะแอคทีฟไม่ถูกใช้ในการทำงานแบบสวิตช์ (ใช้ในการขยายสัญญาณเชิงเส้นแทน)</li>\n<li>เมื่อทรานซิสเตอร์ทำงานเป็นสวิตช์เปิด (Turn-off / Cut-off) กระแสเบสจะมีค่าเท่ากับ <strong>0 A</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวน/รายชื่อสภาวะการทำงาน (คัตออฟ-อิ่มตัว-แอคทีฟ ตัวลวงคือ \"สเตเบิ้ล\") การทำงานเป็นสวิตช์ใช้เพียง 2 สภาวะ (คัตออฟ-อิ่มตัว) และทิศทางไบแอสขาเบสของ PNP (ลบ)</p>\n<h2>10. วงจรรวม (Integrated Circuit - IC)</h2>\n<p><strong>IC ย่อมาจาก Integrated Circuit</strong> (วงจรรวม) แบ่งเป็น 2 ประเภทใหญ่คือ <strong>Analog IC</strong> และ <strong>Digital IC</strong></p>\n<ul>\n<li><strong>Analog IC (Linear IC)</strong>: เช่น IC OP-Amp (Operational Amplifier) ใช้ขยายสัญญาณแอนะล็อก</li>\n<li><strong>Digital IC (Logic IC)</strong>: เช่น IC ที่เป็น Flip-Flop, Gate (AND, OR ฯลฯ)</li>\n<li><strong>IC 555</strong> จัดเป็น <strong>IC Timer</strong> ใช้ในวงจรตั้งเวลา วงจรกำเนิดสัญญาณพัลส์ (oscillator)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> IC ย่อมาจากอะไร, การแบ่งประเภท IC เป็น Analog/Digital, และการจับคู่ IC เบอร์ยอดนิยม (555) กับหน้าที่ (Timer)</p>\n<h2>11. เครื่องมือวัดพื้นฐาน: มัลติมิเตอร์และการใช้งาน</h2>\n<p><strong>การตรวจสอบตัวเก็บประจุด้วยมัลติมิเตอร์แบบเข็ม</strong> (ตั้งย่านโอห์ม): ผลการวัดบอกสภาพของตัวเก็บประจุได้ดังนี้</p>\n<ul>\n<li>เข็มไม่ขยับเลย → ตัวเก็บประจุ <strong>ขาด</strong></li>\n<li>เข็มตีขึ้นไปค้างที่ 0 (ไม่ยอมกลับ) → ตัวเก็บประจุ <strong>ช็อต</strong></li>\n<li>เข็มตีขึ้นแล้วกลับสู่ค่าอนันต์เต็มที่ → ตัวเก็บประจุ <strong>ดี</strong></li>\n<li>เข็มตีขึ้นแล้วกลับไม่สุด (กลับไม่ถึงอนันต์) → ตัวเก็บประจุ <strong>รั่ว</strong></li>\n</ul>\n<p><strong>ข้อควรระวังในการใช้มัลติมิเตอร์แบบเข็ม</strong>:</p>\n<ul>\n<li>เมื่อวัดจุดที่ไม่ทราบค่าแน่นอน ให้ตั้งย่านวัดสูงสุดก่อนเสมอ (ป้องกันเข็มตีเกินสเกล) แล้วค่อยๆ ปรับลดย่านลงจนเข็มเริ่มขยับชัดเจนจึงอ่านค่า</li>\n<li>ถ้าวัดย่าน DCV แล้วเข็มตีกลับ (deflect ผิดทาง) ให้สลับสายวัดแล้ววัดใหม่</li>\n<li>ต้องเสียบสายวัดให้ถูกตำแหน่งเสมอ (สายสีแดงเข้า + และสายสีดำเข้า -COM) และห้ามตั้งย่านวัดผิดประเภท</li>\n<li><strong>ห้ามตั้งย่านวัดโอห์มแล้ววัดค่าความต้านทานได้เลยทันทีโดยไม่ระวัง</strong> (ข้อความที่บอกว่าทำได้เลยถือเป็นข้อที่ผิด) — ต้องแน่ใจว่าไม่มีไฟเลี้ยงวงจรและตรวจสภาพก่อนวัดเสมอ</li>\n</ul>\n<p><strong>เครื่องมือที่เหมาะสมสำหรับวัดค่าตัวต้านทานโดยตรงที่สุด</strong> คือ <strong>โอห์มมิเตอร์</strong> (แม้มัลติมิเตอร์จะวัดได้เช่นกัน แต่โอห์มมิเตอร์เป็นคำตอบที่ตรงและเฉพาะเจาะจงที่สุด)</p>\n<p><strong>การวัดแรงดันตกคร่อมตัวต้านทาน</strong>: ต้องปรับย่านวัดไปที่ <strong>DCV (Direct Current Voltage)</strong> และคำนวณด้วยกฎของโอห์ม <strong>V = I × R</strong> เช่น กระแส 25 mA ไหลผ่านตัวต้านทาน 10 Ω จะได้แรงดันตกคร่อม = 0.025 A × 10 Ω = 0.25 V (ต้องแปลงหน่วย mA→A, kΩ→Ω ให้ถูกต้องก่อนคูณเสมอ)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> อาการเข็มมัลติมิเตอร์บอกสภาพตัวเก็บประจุ (ขาด/ช็อต/ดี/รั่ว) ข้อควรระวังการใช้งาน (โดยเฉพาะข้อที่ผิด) และโจทย์คำนวณแรงดันตกคร่อมจาก V=IR ที่ต้องระวังหน่วย mA/kΩ</p>\n<h2>12. การออกแบบเครื่องวัด: โวลต์มิเตอร์ (Multiplier) และแอมมิเตอร์ (Shunt)</h2>\n<p><strong>โวลต์มิเตอร์หลายย่านวัด</strong>: ต้องต่อ <strong>ตัวต้านทานอนุกรม (Multiplier Resistor)</strong> เพิ่มเข้ากับขดลวดเคลื่อนที่ของมิเตอร์ เพื่อขยายย่านวัดแรงดันให้กว้างขึ้น สูตรคำนวณ:</p>\n<p>R(multiplier) = (V ÷ I(fsd)) − R(ขดลวดมิเตอร์)</p>\n<p>โดย V คือแรงดันเต็มสเกลที่ต้องการวัด และ I(fsd) คือกระแสเต็มสเกลของขดลวดเคลื่อนที่ เช่น ต้องการย่านวัด 15V, ขดลวดมิเตอร์ 2kΩ, กระแสเต็มสเกล 10 µA → R = (15÷0.00001) − 2,000 = 1,498,000 Ω ≈ 1.5 MΩ</p>\n<p>เมื่อออกแบบหลายย่านวัดพร้อมกัน (แบบอนุกรมต่อเนื่อง) ตัวต้านทานของแต่ละย่านคำนวณจาก <strong>ผลต่าง</strong> ของค่าต้านทานรวมที่ต้องการของย่านนั้นกับย่านก่อนหน้า</p>\n<p><strong>แอมมิเตอร์หลายย่านวัด</strong>: ต้องต่อ <strong>ตัวต้านทานชันท์ (Shunt Resistor) ขนานกับขดลวดมิเตอร์</strong> เพื่อแบ่งกระแสส่วนใหญ่ไม่ให้ไหลผ่านขดลวด สูตรคำนวณ:</p>\n<p>R(shunt) = (I(fsd) × R(ขดลวดมิเตอร์)) ÷ (I(ย่านวัดที่ต้องการ) − I(fsd))</p>\n<p>เช่น ขดลวด 100 Ω, กระแสเต็มสเกล 5 mA, ต้องการย่านวัด 100 mA → R(shunt) = (0.005×100)÷(0.1−0.005) = 5.26 Ω</p>\n<p>สำหรับแอมมิเตอร์หลายย่านวัดแบบ <strong>ชันท์วงแหวน (Ayrton Shunt)</strong> ตัวต้านทานชันท์จะถูกแบ่งเป็นช่วงๆ ต่อเรียงกัน แล้วแตะสายวัดที่จุดต่างกันเพื่อให้ได้ย่านกระแสต่างกัน โดยยิ่งแตะจุดที่มีความต้านทานชันท์มากขึ้น ย่านกระแสเต็มสเกลที่วัดได้จะยิ่งน้อยลง</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณ Multiplier Resistor ของโวลต์มิเตอร์และ Shunt Resistor ของแอมมิเตอร์ (มักถามหลายข้อต่อเนื่องจากชุดข้อมูลเดียวกัน) ต้องจำสูตรและหน่วย (Ω, kΩ, MΩ) ให้แม่น</p>\n<h2>13. เครื่องกำเนิดสัญญาณและออสซิลโลสโคป</h2>\n<ul>\n<li><strong>เครื่องกำเนิดสัญญาณ (Signal Generator)</strong>: อุปกรณ์ที่ใช้ป้อนสัญญาณความถี่เข้าไปในวงจรเพื่อทดสอบ</li>\n<li><strong>ออสซิลโลสโคป (Oscilloscope / สโคป)</strong>: เครื่องมือวัดที่แสดงผลสัญญาณไฟฟ้าออกมาเป็น <strong>รูปคลื่น</strong> บนหน้าจอ (ต่างจากดิจิตอลมิเตอร์ที่แสดงเป็นตัวเลข)</li>\n<li><strong>ความสัมพันธ์ความถี่-คาบเวลา</strong>: f = 1/T โดย f คือความถี่ (Hz) และ T คือคาบเวลา (วินาที) — จุดที่ต้องระวังคือการแปลงหน่วยเวลาให้ถูกต้อง (ms, µs, ns) ก่อนแทนค่าในสูตร เพราะคาบเวลาที่ต่างหน่วยกันมากจะให้ความถี่ที่ต่างกันหลายเท่าตัว (Hz, kHz, MHz, GHz)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่ชื่อเครื่องมือกับหน้าที่ (Signal Generator = ป้อนสัญญาณ, สโคป = แสดงรูปคลื่น) และโจทย์คำนวณความถี่จากคาบเวลา f=1/T ที่ต้องแปลงหน่วยเวลาให้ถูกก่อนคำนวณ</p>\n<h2>14. วงจรไฟฟ้ากระแสตรงพื้นฐาน (กฎของโอห์ม, KCL, วงจรอนุกรม-ขนาน)</h2>\n<ul>\n<li><strong>กฎของโอห์ม</strong>: V = I × R, I = V/R (สลับใช้ตามที่โจทย์ให้)</li>\n<li><strong>ค่าความนำไฟฟ้า (Conductance, G)</strong>: G = 1/R มีหน่วยเป็น <strong>ซีเมนส์ (Siemens, S)</strong> เป็นส่วนกลับของค่าความต้านทาน เช่น R = 25 Ω → G = 1/25 = 0.04 S</li>\n<li><strong>กฎกระแสไฟฟ้าของเคอร์ชอฟฟ์ (Kirchhoff's Current Law, KCL)</strong>: ผลรวมกระแสที่ไหล<strong>เข้า</strong>โนดใดๆ ต้องเท่ากับผลรวมกระแสที่ไหล<strong>ออก</strong>จากโนดนั้นเสมอ เช่น มีกระแสไหลเข้าโนด 2A, 5A, 7A (รวม 14A) และไหลออก 4A จะได้กระแสที่เหลือไหลออกอีกเส้น I = 14 − 4 = 10A</li>\n<li><strong>วงจรอนุกรม-ขนาน</strong>: ตัวต้านทานอนุกรม R(รวม) = R1+R2+...; ตัวต้านทานขนาน 1/R(รวม) = 1/R1+1/R2+...; แรงดันในวงจรแบ่งตามสัดส่วนความต้านทาน (Voltage Divider), กระแสในวงจรขนานแบ่งผกผันกับความต้านทานแต่ละสาขา</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณ KCL แบบ \"กระแสเข้า=กระแสออก\" ที่โนด และการหาค่า R, G, RT, IT ในวงจรผสมอนุกรม-ขนานจากภาพวงจรที่ให้มา</p>\n<h2>15. วงจรไฟฟ้ากระแสสลับ (AC): กำลังไฟฟ้า ตัวประกอบกำลัง และอิมพีแดนซ์</h2>\n<p>หลักการสำคัญที่สุดของหัวข้อนี้คือ <strong>ในวงจรที่มีแต่ตัวเก็บประจุ (C) หรือขดลวดเหนี่ยวนำ (L) ล้วนๆ โดยไม่มีตัวต้านทาน (R) กำลังไฟฟ้าเฉลี่ย (Average Power) ที่แท้จริงจะเท่ากับ 0 วัตต์เสมอ</strong> เพราะแรงดันและกระแสต่างเฟสกัน 90° พลังงานแกว่งไปมาโดยไม่มีการสูญเสียจริงสุทธิ — มีเพียงตัวต้านทาน (R) เท่านั้นที่สลายพลังงานไฟฟ้าจริง</p>\n<p>สูตรคำนวณที่ใช้บ่อย:</p>\n<ul>\n<li><strong>กำลังไฟฟ้าเฉลี่ย</strong>: P(avg) = (1/2)·Vm·Im·cosθ = Vrms·Irms·cosθ เมื่อ θ คือมุมต่างเฟสระหว่างแรงดันกับกระแส (มุมตัวประกอบกำลัง)</li>\n<li>ในวงจรที่มีเฉพาะ R (หรือคิดเฉพาะกำลังที่ตัว R สลาย): P(avg) = (1/2)·Im²·R = Irms²·R</li>\n<li><strong>รีแอกแตนซ์ตัวเหนี่ยวนำ</strong>: X(L) = ωL = 2πfL</li>\n<li><strong>รีแอกแตนซ์ตัวเก็บประจุ</strong>: X(C) = 1/(ωC) = 1/(2πfC)</li>\n<li><strong>อิมพีแดนซ์รวม (Z)</strong> ของวงจรอนุกรม RL: Z = R + jX(L), |Z| = √(R² + X(L)²); ของวงจรอนุกรม RC: Z = R − jX(C), |Z| = √(R² + X(C)²)</li>\n<li><strong>ตัวประกอบกำลัง (Power Factor, p.f.)</strong>: p.f. = cosθ = R/|Z|</li>\n<li><strong>แรงดันยอด (peak) รวม</strong>: Vm = Im × |Z|</li>\n<li>ในวงจรอนุกรม RL หรือ RC ที่มีแต่ 2 องค์ประกอบ แรงดันแต่ละองค์ประกอบสัมพันธ์กันแบบเวกเตอร์ตั้งฉาก: V² = VR² + VL² (หรือ VR² + VC²) เนื่องจากเฟสของ VR กับ VL (หรือ VC) ต่างกัน 90°</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์ \"วงจรมีแต่ L กับ C หากำลังไฟฟ้าเฉลี่ย\" คำตอบมักเป็น 0 W เสมอ และโจทย์คำนวณ p.f., P, Xc, Xl, Z จากสมการ V=Vm sin(ωt) และ i=Im sin(ωt) ที่ให้ค่า R, L หรือ C มา ต้องหาค่ามุมเฟสและใช้สูตรกำลังไฟฟ้าเฉลี่ยแบบ AC</p>\n<h2>16. หม้อแปลงไฟฟ้า (Transformer)</h2>\n<p>หม้อแปลงไฟฟ้าใช้แปลงระดับแรงดัน/กระแสไฟฟ้ากระแสสลับผ่านอัตราส่วนจำนวนรอบขดลวด (Turns Ratio):</p>\n<ul>\n<li><strong>สำหรับหม้อแปลงอุดมคติ (Ideal Transformer)</strong>: N1/N2 = V1/V2 = I2/I1 (แรงดันแปรผันตรงตามจำนวนรอบ ส่วนกระแสแปรผกผัน)</li>\n<li><strong>ประสิทธิภาพ (Efficiency, η)</strong>: η = P(out) ÷ P(in) × 100% — เมื่อหม้อแปลงมีประสิทธิภาพไม่เต็ม 100% ต้องคำนึงถึงกำลังสูญเสียในแกนเหล็ก/ขดลวด เวลาคำนวณกระแสด้านทุติยภูมิ (I2) จากกำลังไฟฟ้าด้านปฐมภูมิ ต้องคูณ/หารด้วยค่าประสิทธิภาพให้ถูกทิศทาง (P(out) = η × P(in))</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณกระแสด้านทุติยภูมิ (I2) ของหม้อแปลงเมื่อกำหนดประสิทธิภาพเป็นเปอร์เซ็นต์มาให้ ต้องแยกให้ออกว่ากำลังไฟฟ้าฝั่งใดคือ input ฝั่งใดคือ output</p>\n<h2>17. ลำโพงและระดับความเข้มของเสียง (Sound Level, dB)</h2>\n<ul>\n<li><strong>โครงสร้างลำโพง</strong>: ส่วนที่ต่อรับสัญญาณเสียงโดยตรงจากเครื่องขยายเสียงคือ <strong>Voice Coil</strong> (ขดลวดเสียง) ซึ่งอยู่ในสนามแม่เหล็กและสั่นตามสัญญาณไฟฟ้า ทำให้ไดอะแฟรม (Diaphragm) สั่นสร้างเสียง</li>\n<li><strong>ระดับความเข้มเสียง (Sound Intensity Level)</strong> มีหน่วยเป็น <strong>เดซิเบล (dB)</strong> คำนวณจาก IL = 10·log₁₀(I/I₀) เมื่อ I₀ คือความเข้มเสียงอ้างอิงที่หูมนุษย์เริ่มได้ยิน</li>\n<li><strong>การรวมความเข้มเสียงจากลำโพงหลายตัวที่เหมือนกัน</strong>: เมื่อใช้ลำโพงชนิดเดียวกัน N ตัวเล่นพร้อมกัน ระดับเสียงรวมจะเพิ่มขึ้นจากลำโพงตัวเดียวตามสูตร</li>\n</ul>\n<p>dB(รวม) = dB(ตัวเดียว) + 10·log₁₀(N)</p>\n<p>เช่น ลำโพง 1 ตัวให้เสียง 60dB ถ้าใช้ 10 ตัว → dB(รวม) = 60 + 10·log₁₀(10) = 60 + 10 = 70dB (ข้อควรจำ: จำนวนลำโพงเพิ่มเป็น 10 เท่า ระดับเสียงเพิ่มขึ้นเพียง 10dB ไม่ใช่เพิ่มเป็น 10 เท่าของค่า dB เดิม)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ชื่อชิ้นส่วนลำโพงที่รับสัญญาณจากแอมป์ (Voice Coil) และโจทย์คำนวณระดับเสียงรวมเมื่อเพิ่มจำนวนลำโพง (สูตร +10log₁₀N)</p>\n<h2>18. สนามไฟฟ้าสถิตและกฎของเกาส์ (Electrostatics)</h2>\n<ul>\n<li><strong>กฎของคูลอมบ์ / สนามไฟฟ้าจากประจุจุด</strong>: E⃗ = (1/4πε₀) × (q/r²) × r̂ โดย r̂ คือเวกเตอร์หน่วยชี้จากตำแหน่งประจุไปยังจุดที่ต้องการหาสนาม ถ้าประจุเป็น <strong>บวก</strong> สนามไฟฟ้าจะชี้ <strong>ออกจาก</strong> ประจุ ถ้าเป็น <strong>ลบ</strong> สนามไฟฟ้าจะชี้ <strong>เข้าหา</strong> ประจุ — ต้องคำนวณเวกเตอร์หน่วย r̂ จากพิกัด (x,y,z) ของประจุกับจุดสังเกตให้ถูกต้องก่อนเสมอ (หาระยะทาง r ด้วยพีทาโกรัส 3 มิติ แล้วหาร vector ตำแหน่งด้วย r)</li>\n<li><strong>กฎของเกาส์ (Gauss's Law)</strong>: ฟลักซ์ไฟฟ้ารวมที่ผ่านผิวปิดใดๆ ที่ล้อมรอบประจุ q ขึ้นอยู่กับประจุที่ถูกล้อมเท่านั้น <strong>ไม่ขึ้นกับรูปร่างหรือขนาดของผิวปิด</strong></li>\n</ul>\n<p>Φ(รวม) = q(enclosed) / ε₀   (ε₀ ≈ 8.85×10⁻¹² C²/N·m²)</p>\n<p>เช่น ประจุ q = 4.0 µC อยู่ตรงกลางทรงกลม (ไม่ว่ารัศมีเท่าใด) → Φ = 4.0×10⁻⁶/8.85×10⁻¹² ≈ 4.5×10⁵ N·m²/C</p>\n<ul>\n<li><strong>ฟลักซ์ผ่านผิวเปิดในสนามไฟฟ้าสม่ำเสมอ</strong>: Φ = E⃗ · A⃗ = E·A·cosθ (θ คือมุมระหว่างสนามไฟฟ้ากับเส้นตั้งฉากผิว) — ถ้าสนามไฟฟ้าขนานกับผิว (ตั้งฉากกับเวกเตอร์พื้นที่) ฟลักซ์จะเป็น 0</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณสนามไฟฟ้า/เวกเตอร์หน่วยจากพิกัด 3 มิติ (ต้องคำนวณระยะทางและทิศทางให้ถูก) และโจทย์ฟลักซ์ผ่านทรงกลมที่ล้อมประจุ (คำตอบไม่ขึ้นกับรัศมี ใช้ Φ=q/ε₀ ตรงๆ)</p>\n<h2>19. การเหนี่ยวนำแม่เหล็กไฟฟ้า (Electromagnetic Induction / Faraday's Law)</h2>\n<ul>\n<li><strong>กฎของฟาราเดย์</strong>: แรงเคลื่อนไฟฟ้าเหนี่ยวนำ (EMF) ในขดลวด ε = −N·(dΦ/dt) = −N·A·(dB/dt)·cosθ โดย N คือจำนวนรอบขดลวด, A คือพื้นที่ขดลวด, θ คือมุมระหว่างสนามแม่เหล็กกับเวกเตอร์ตั้งฉากพื้นที่ขดลวด — <strong>ถ้าสนามแม่เหล็กเปลี่ยนแปลงแต่ทิศทางตั้งฉากกับเวกเตอร์พื้นที่ (θ=90°) หรือฟลักซ์ที่พันผ่านขดลวดไม่เปลี่ยนแปลงจริง จะไม่เกิด EMF เหนี่ยวนำเลย (EMF = 0)</strong> เป็นจุดที่ข้อสอบชอบใช้หลอก ต้องพิจารณาทิศทางสนามเทียบกับระนาบขดลวดให้ดีก่อนคำนวณ</li>\n<li><strong>เครื่องกำเนิดไฟฟ้าแบบขดลวดหมุนในสนามแม่เหล็ก</strong>: EMF สูงสุด (peak) = N·B·A·ω โดย ω = 2πf = 2π×(รอบต่อนาที ÷ 60) — ต้องแปลงหน่วยความเร็วรอบจาก รอบ/นาที เป็น เรเดียน/วินาที ก่อนแทนสูตรเสมอ</li>\n<li><strong>สนามไฟฟ้าเหนี่ยวนำรอบขดลวดโซเลนอยด์ที่มีกระแสเปลี่ยนแปลงตามเวลา</strong> (จากกฎของฟาราเดย์ประยุกต์กับเส้นทางวงกลม): ถ้าจุดที่พิจารณาอยู่ <strong>นอกรัศมีของโซเลนอยด์</strong> (r &gt; R) สนามไฟฟ้าเหนี่ยวนำคำนวณจาก</li>\n</ul>\n<p>E = μ₀·n·(dI/dt)·R² ÷ (2r)</p>\n<p>โดย n คือจำนวนรอบต่อความยาว 1 เมตร, R คือรัศมีของโซเลนอยด์ (คำนวณจากพื้นที่หน้าตัด), r คือระยะจากแกนโซเลนอยด์ถึงจุดที่พิจารณา — ถ้าจุดพิจารณาอยู่ <strong>ภายในโซเลนอยด์</strong> (r &lt; R) ให้ใช้ E = μ₀·n·(dI/dt)·r ÷ 2 แทน</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์ EMF เหนี่ยวนำที่ \"หลอก\" ให้ตอบ 0V เพราะทิศทางสนามไม่ตั้งฉากกับขดลวดจริง โจทย์เครื่องกำเนิดไฟฟ้าคำนวณ EMF สูงสุดจากรอบ/นาที (ต้องแปลงหน่วยเป็น rad/s) และโจทย์สนามไฟฟ้าเหนี่ยวนำรอบโซเลนอยด์ที่ต้องแยกกรณี r มากกว่าหรือน้อยกว่ารัศมีขดลวด</p>"}, {"subject": 9, "subjectTitle": "วิชาระเบียบงานสารบรรณ", "html": "<p>สังเคราะห์จากคลังข้อสอบ 50 ข้อ (อ้างอิงหลักตามระเบียบกองทัพบกว่าด้วยงานสารบรรณ พ.ศ. 2555) โดยดึงหลักการ นิยาม ตัวเลข และขั้นตอนสำคัญที่ข้อสอบใช้ทดสอบ มาเรียบเรียงเป็นเนื้อหาความรู้ ไม่ใช่การไล่เฉลยรายข้อ</p>\n<h2>1. ภาพรวมชนิดของหนังสือราชการ</h2>\n<p>หนังสือราชการแบ่งเป็น <strong>6 ชนิด</strong> ได้แก่</p>\n<ol>\n<li>หนังสือภายนอก</li>\n<li>หนังสือภายใน</li>\n<li>หนังสือประทับตรา</li>\n<li>หนังสือประชาสัมพันธ์</li>\n<li>หนังสือสั่งการ</li>\n<li>หนังสือที่เจ้าหน้าที่จัดทำขึ้นหรือรับไว้เป็นหลักฐานในราชการ</li>\n</ol>\n<p>ข้อควรจำ: <strong>\"บันทึกข้อความ\" ไม่ใช่ชื่อชนิดหนังสือหลักทั้ง 6 ชนิด</strong> นี้ แต่เป็นรูปแบบย่อยที่อยู่ภายใต้ \"หนังสือที่เจ้าหน้าที่จัดทำขึ้นฯ\" (ใช้กระดาษบันทึกข้อความ) มักถูกใส่เป็นตัวลวงว่าเป็นหนึ่งใน 6 ชนิดหลัก</p>\n<p>นิยาม <strong>\"ส่วนราชการ\"</strong> ตามระเบียบ ทบ. ว่าด้วยงานสารบรรณ หมายถึง หน่วยระดับกองร้อยหรือเทียบเท่าขึ้นไป</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ท่องจำจำนวน (6 ชนิด) และรายชื่อให้ครบ ระวังตัวเลือกที่ใส่จำนวนผิด (4, 5, 7 ชนิด) หรือแอบใส่ \"บันทึกข้อความ\"/\"ประกาศ\" ปนเข้าไปในรายชื่อ 6 ชนิดหลัก</p>\n<h2>2. หนังสือภายนอก หนังสือภายใน และหนังสือประทับตรา</h2>\n<ul>\n<li><strong>หนังสือภายนอก</strong> คือหนังสือติดต่อราชการที่เป็นแบบพิธี ใช้กระดาษตราครุฑ เป็นหนังสือติดต่อระหว่างส่วนราชการ (เช่น ระหว่างกระทรวง) โดย <strong>คำลงท้ายใช้ตามฐานะของ \"ผู้รับ\" หนังสือ</strong> (ไม่ใช่ฐานะผู้ส่ง)</li>\n<li><strong>หนังสือภายใน</strong> คือหนังสือติดต่อราชการในกระทรวง ทบวง กรม หรือส่วนราชการเดียวกัน <strong>ใช้กระดาษบันทึกข้อความ ไม่ใช่กระดาษตราครุฑ</strong> — ข้อสอบมักหลอกด้วยประโยคว่า \"หนังสือภายใน...ใช้กระดาษตราครุฑ\" ซึ่งผิด (ตราครุฑเป็นของหนังสือภายนอก)</li>\n<li>ชื่อตำแหน่งที่ <strong>บันทึก</strong> ถึง ให้ใช้คำขึ้นต้นอนุโลมตามหนังสือภายใน</li>\n<li><strong>การประทับตราชั้นความเร็วในหนังสือภายใน</strong>: ประทับด้วยหมึกสีแดง <strong>ในแนวเดียวกับเท้าครุฑ</strong> (ไม่ใช่เหนือครุฑ ไม่ใช่กึ่งกลางหน้ากระดาษด้านบน-ล่าง)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกให้ออกว่าใช้กระดาษตราครุฑหรือกระดาษบันทึกข้อความในแต่ละชนิดหนังสือ ตำแหน่งประทับตราความเร็ว และหลักที่ว่าคำลงท้ายอิงฐานะผู้รับ ไม่ใช่ผู้ส่ง</p>\n<h2>3. หนังสือสั่งการ</h2>\n<p>หนังสือสั่งการ ได้แก่ คำสั่ง ระเบียบ ข้อบังคับ (ข้อบังคับ<strong>ไม่ใช่</strong>หนังสือประชาสัมพันธ์ ต้องแยกกลุ่มให้ถูก)</p>\n<p><strong>คำสั่ง</strong> คือ บรรดาข้อความที่ผู้บังคับบัญชาสั่งการให้ปฏิบัติโดยชอบด้วยกฎหมาย ออกได้ตั้งแต่หัวหน้าส่วนราชการระดับ <strong>ผู้บังคับกองร้อย (ผบ.ร้อย.) หรือเทียบเท่าขึ้นไป</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ระดับหน่วยขั้นต่ำที่มีสิทธิออกคำสั่ง (ผบ.ร้อย. ขึ้นไป) และการแยก \"ข้อบังคับ\" ออกจากกลุ่มหนังสือประชาสัมพันธ์</p>\n<h2>4. หนังสือประชาสัมพันธ์</h2>\n<p>หนังสือประชาสัมพันธ์มี <strong>3 ชนิด</strong> คือ <strong>ประกาศ แถลงการณ์ ข่าว</strong> (ข้อบังคับไม่ใช่หนังสือประชาสัมพันธ์)</p>\n<ul>\n<li><strong>แถลงการณ์</strong> คือ บรรดาข้อความที่ทางราชการแถลงเพื่อทำความเข้าใจในกิจการของทางราชการหรือกรณีใดให้ทราบชัดเจนโดยทั่วกัน — ออกได้เฉพาะระดับ <strong>กองทัพบก</strong> เท่านั้น (สูงกว่าระดับ นขต.ทบ. หรือกองทัพภาค)</li>\n<li>หนังสือประชาสัมพันธ์โดยทั่วไป (เช่น ประกาศ) ออกได้ตั้งแต่หัวหน้าส่วนราชการระดับ <strong>ผบ.ร้อย. หรือเทียบเท่าขึ้นไป</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำ 3 ชนิดให้แม่น ระวังตัวลวงที่ใส่ \"ข้อบังคับ\" หรือ \"คำสั่ง\" ปนเข้ามาในกลุ่มประชาสัมพันธ์ และจำว่าแถลงการณ์ออกได้เฉพาะระดับกองทัพบกเท่านั้น</p>\n<h2>5. หนังสือที่เจ้าหน้าที่จัดทำขึ้นฯ และบันทึก</h2>\n<p>หนังสือที่เจ้าหน้าที่จัดทำขึ้นหรือรับไว้เป็นหลักฐานในราชการ ได้แก่ <strong>หนังสือรับรอง บันทึก รายงานการประชุม และหนังสืออื่น</strong></p>\n<p><strong>\"บันทึก\"</strong> แบ่งเป็น <strong>5 ประเภท</strong>: บันทึกความเห็น บันทึกรายงาน บันทึกย่อเรื่อง บันทึกติดต่อ บันทึกสั่งการ</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนและรายชื่อประเภทบันทึกทั้ง 5 แบบ (ตัวลวงมักตัดออกหรือเพิ่มประเภทให้ผิดจำนวน) และย้ำว่าคำขึ้นต้นของบันทึกอิงตามหนังสือภายใน</p>\n<h2>6. คำขึ้นต้น คำลงท้าย และคำราชาศัพท์</h2>\n<p>หลักการ: หนังสือภายนอกใช้คำขึ้นต้น/คำลงท้ายตามฐานะของ <strong>\"ผู้รับ\"</strong> หนังสือ ยิ่งผู้รับมีฐานะสูง ถ้อยคำยิ่งเป็นทางการ/สูงส่งขึ้น</p>\n<ul>\n<li>เขียนถึงบุคคลสำคัญระดับสูงของประเทศ (เช่น ประธานรัฐสภา หรือหัวหน้าคณะรักษาความสงบแห่งชาติ) ใช้คำขึ้นต้น <strong>\"กราบเรียน\"</strong> คำลงท้าย <strong>\"ขอแสดงความนับถืออย่างยิ่ง\"</strong> — สูงกว่าคำขึ้นต้น \"เรียน\" คำลงท้าย \"ขอแสดงความนับถือ\" ที่ใช้ในการติดต่อทั่วไป</li>\n<li>เขียนถึง<strong>สมเด็จพระสังฆราช</strong> ใช้คำขึ้นต้น <strong>\"กราบทูล\"</strong> คำลงท้าย <strong>\"ควรมิควรแล้วแต่จะโปรด\"</strong> (คำราชาศัพท์เฉพาะสำหรับพระสงฆ์ชั้นสูง/พระราชวงศ์)</li>\n<li>การใช้คำว่า <strong>\"ทรง\"</strong>: ใช้นำหน้าคำกริยาสามัญเพื่อทำให้เป็นราชาศัพท์ เช่น \"ทรงเป็นทหาร\" ถูกต้อง ส่วนคำนามที่เป็นราชาศัพท์อยู่แล้ว เช่น \"พระราชบิดา\" \"พระราชโอรส\" \"พระบรมราชโองการ\" <strong>ไม่ต้องเติม \"ทรง\" นำหน้าซ้ำอีก</strong> (เป็นการใช้ผิดหลักไวยากรณ์ราชาศัพท์)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่คำขึ้นต้น-คำลงท้ายให้ตรงกับฐานะผู้รับ (บุคคลทั่วไป / บุคคลสำคัญระดับสูงของรัฐ / พระสงฆ์ชั้นสูง) และทดสอบความเข้าใจการใช้คำว่า \"ทรง\" ให้ถูกหลัก</p>\n<h2>7. ส่วนประกอบของหนังสือราชการ</h2>\n<ul>\n<li>คำว่า <strong>\"เรื่อง\"</strong> ในหนังสือราชการ ให้เขียนสรุป<strong>ให้ได้ใจความสั้นที่สุด</strong>ของหนังสือฉบับนั้น (ไม่ใช่เขียนกึ่งกลางหน้ากระดาษ ไม่ใช่ต้องให้ตรงกับคำขึ้นต้น)</li>\n<li><strong>การอ้างถึง</strong>: ใช้เฉพาะกรณีอ้างถึงหนังสือที่เคยติดต่อกัน <strong>เฉพาะฉบับที่ส่วนราชการผู้รับหนังสือได้รับมาก่อนแล้วเท่านั้น</strong> (ไม่ใช่ทุกฉบับที่เคยติดต่อกัน) รูปแบบการเขียนให้ใช้ <strong>ชื่อย่อของหน่วยงานเจ้าของหนังสือ + เลขที่หนังสือ + วันที่แบบย่อ</strong> เช่น \"อ้างถึงหนังสือ สส. ที่ กห 0442/300 ลง 26 ม.ค.64\" — ไม่ต้องใส่ชื่อเต็มหน่วยงาน ไม่ต้องระบุชั้นความลับ/ความเร็ว และไม่ต้องใส่เรื่องของหนังสือที่อ้างถึง</li>\n<li><strong>สำเนาคู่ฉบับ</strong>: หนังสือราชการที่จัด
