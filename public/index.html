<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ สอบเลื่อนฐานะ จ.ส.อ. เป็นนายทหารสัญญาบัตร</title>
<style>
:root{
  /* ---- คลังสี: โทนทหาร (olive/khaki) แต่งแต้มความน่ารัก ---- */
  --bg:#eee6d2;
  --surface:#fffdf6;
  --surface-2:#f1e9d4;
  --border:#d9c9a3;
  --text:#3a3324;
  --text-muted:#8a7f60;
  --primary:#5c6b3a;
  --primary-dark:#3f4a27;
  --primary-soft:#e3e8cd;
  --good:#4a7c3f;
  --good-soft:#e6f1de;
  --bad:#bb4a35;
  --bad-soft:#fbe6dd;
  --warn:#cc9427;
  --warn-soft:#fbf0d6;
  --accent:#d98a3d;
  --radius:16px;
  --shadow:0 3px 0 rgba(63,74,39,.12), 0 6px 16px rgba(63,74,39,.08);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  color:var(--text);
  font-family:'Leelawadee UI','TH Sarabun New','Noto Sans Thai','Sarabun',Tahoma,'Segoe UI',sans-serif;
  line-height:1.55;
  min-height:100vh;
  background-color:var(--bg);
  /* เบา ๆ ลายพราง (camo) แบบน่ารัก ไม่แสบตา */
  background-image:
    radial-gradient(ellipse 180px 120px at 8% 12%, #d7cba3 40%, transparent 41%),
    radial-gradient(ellipse 140px 100px at 92% 8%, #c9c9a0 40%, transparent 41%),
    radial-gradient(ellipse 220px 150px at 78% 92%, #dcd0aa 40%, transparent 41%),
    radial-gradient(ellipse 160px 110px at 4% 88%, #cdc79f 40%, transparent 41%),
    radial-gradient(ellipse 200px 140px at 50% 50%, #e6dcbb 35%, transparent 40%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  background-size:100% 100%;
}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 64px;}
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;
  background:linear-gradient(135deg,var(--primary) 0%,#6f8047 55%,var(--primary) 100%);
  border-bottom:4px dashed #3f4a27;
  position:sticky;top:0;z-index:50;box-shadow:0 4px 14px rgba(40,48,20,.25);
}
header.top .brand{display:flex;align-items:center;gap:12px;font-weight:700;color:#fff;}
header.top .brand .dot{
  width:38px;height:38px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%, #f6d78a, var(--accent) 60%, #a85f1f 100%);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  border:2px solid #fff4de;box-shadow:0 2px 4px rgba(0,0,0,.25) inset, 0 2px 3px rgba(0,0,0,.3);
  animation:badgeWiggle 4.5s ease-in-out infinite;
}
@keyframes badgeWiggle{
  0%,100%{transform:rotate(-4deg);}
  50%{transform:rotate(4deg);}
}
header.top .brand > div{line-height:1.3;}
header.top .brand small{display:block;font-weight:500;color:#eef2df;font-size:.78rem;opacity:.92;}
h1{font-size:1.5rem;margin:0 0 6px;color:var(--primary-dark);}
h2{font-size:1.15rem;margin:0 0 10px;color:var(--primary-dark);}
h2::before{content:'★ ';color:var(--accent);}
p.lead{color:var(--text-muted);margin:0 0 20px;}
.card{
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);margin-bottom:18px;
  position:relative;
}
.card::before{
  content:'';position:absolute;top:10px;left:10px;right:10px;bottom:10px;
  border:1.5px dashed #e4d9b8;border-radius:calc(var(--radius) - 6px);
  pointer-events:none;opacity:.6;
}
.grid-subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;position:relative;}
.subject-item{
  display:flex;align-items:center;gap:10px;border:2px solid var(--border);border-radius:12px;
  padding:10px 12px;background:var(--surface-2);cursor:pointer;user-select:none;transition:.15s;
}
.subject-item:hover{border-color:var(--primary);transform:translateY(-1px);}
.subject-item.checked{background:var(--primary-soft);border-color:var(--primary);}
.subject-item input{width:17px;height:17px;accent-color:var(--primary);flex:none;}
.subject-item .meta{flex:1;min-width:0;}
.subject-item .meta .name{font-weight:700;font-size:.94rem;}
.subject-item .meta .name::before{content:'🎖️ ';}
.subject-item .meta .count{font-size:.78rem;color:var(--text-muted);}
.row-actions{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap;}
.btn{
  appearance:none;border:2px solid var(--border);background:var(--surface);color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:.92rem;font-weight:700;cursor:pointer;transition:.12s;
  box-shadow:0 2px 0 var(--border);
}
.btn:hover{border-color:var(--primary);color:var(--primary-dark);transform:translateY(-1px);}
.btn:active{transform:translateY(1px);box-shadow:none;}
.btn.small{padding:6px 12px;font-size:.82rem;}
.btn.primary{background:linear-gradient(135deg,var(--primary),#728148);border-color:var(--primary-dark);color:#fff;box-shadow:0 3px 0 var(--primary-dark);}
.btn.primary:hover{filter:brightness(1.08);color:#fff;}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--primary-dark);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-muted);box-shadow:none;}
.btn.danger{color:var(--bad);}
.btn.danger:hover{border-color:var(--bad);}
.mode-toggle{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.mode-card{
  flex:1;min-width:220px;border:2px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--surface-2);transition:.15s;
}
.mode-card:hover{transform:translateY(-1px);}
.mode-card.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 2px 0 var(--primary);}
.mode-card .title{font-weight:800;margin-bottom:3px;}
.mode-card .desc{font-size:.82rem;color:var(--text-muted);}
label.field-label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 6px;color:var(--primary-dark);}
.inline-fields{display:flex;gap:16px;flex-wrap:wrap;}
.field{flex:1;min-width:180px;}
select,input[type=number]{
  width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:10px;font-size:.92rem;
  background:var(--surface);color:var(--text);font-family:inherit;
}
.pill-select{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  border:2px solid var(--border);border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer;background:var(--surface-2);font-weight:600;transition:.12s;
}
.pill:hover{border-color:var(--primary);}
.pill.active{background:var(--primary);border-color:var(--primary-dark);color:#fff;font-weight:700;}
.summary-line{font-size:.9rem;color:var(--text-muted);margin-top:10px;}
.summary-line b{color:var(--text);}
.start-bar{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;}
.hidden{display:none !important;}

/* Quiz view */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.progress-wrap{flex:1;min-width:160px;}
.progress-bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:2px solid var(--border);}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.2s;}
.progress-label{font-size:.78rem;color:var(--text-muted);margin-top:4px;}
.timer{
  font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;padding:6px 14px;border-radius:10px;
  background:var(--surface-2);border:2px solid var(--border);
}
.timer::before{content:'⏱️ ';}
.timer.low{color:var(--bad);background:var(--bad-soft);border-color:var(--bad);animation:pulseWarn 1s infinite;}
@keyframes pulseWarn{0%,100%{opacity:1;}50%{opacity:.6;}}
.q-subject-tag{
  display:inline-block;font-size:.74rem;font-weight:800;color:var(--primary-dark);
  background:var(--primary-soft);padding:4px 12px;border-radius:999px;margin-bottom:10px;border:1.5px solid var(--primary);
}
.q-subject-tag::before{content:'🪖 ';}
.q-text{font-size:1.12rem;font-weight:700;margin:0 0 18px;white-space:pre-wrap;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{
  display:flex;gap:12px;align-items:flex-start;border:2px solid var(--border);border-radius:14px;
  padding:12px 14px;cursor:pointer;background:var(--surface-2);transition:.12s;
}
.option:hover{border-color:var(--primary);transform:translateY(-1px);}
.option .letter{
  flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;
}
.option .text{flex:1;padding-top:2px;}
.option.selected{border-color:var(--primary);background:var(--primary-soft);}
.option.selected .letter{background:var(--primary);border-color:var(--primary-dark);color:#fff;}
.option.correct{border-color:var(--good);background:var(--good-soft);}
.option.correct .letter{background:var(--good);border-color:var(--good);color:#fff;}
.option.correct .letter::after{content:'★';}
.option.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.option.incorrect .letter{background:var(--bad);border-color:var(--bad);color:#fff;}
.option.disabled{cursor:default;}
.option.disabled:hover{transform:none;}
.feedback-box{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.9rem;font-weight:700;border:1.5px dashed transparent;}
.feedback-box.good{background:var(--good-soft);color:var(--good);border-color:var(--good);}
.feedback-box.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap;}
.quiz-nav .right-group{display:flex;gap:8px;flex-wrap:wrap;}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;}
.qgrid button{
  width:34px;height:34px;border-radius:8px;border:2px solid var(--border);background:var(--surface-2);
  font-size:.78rem;font-weight:800;cursor:pointer;color:var(--text-muted);
}
.qgrid button.answered{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);}
.qgrid button.current{outline:2px solid var(--accent);outline-offset:1px;}
.qgrid button.flagged{position:relative;}
.qgrid button.flagged::after{content:'🚩';position:absolute;top:-9px;right:-6px;font-size:.7rem;}
details.navigator summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--primary-dark);margin-bottom:6px;}

/* Results */
.score-hero{text-align:center;padding:26px 10px 10px;}
.score-hero .medal{font-size:2.6rem;line-height:1;margin-bottom:4px;}
.score-hero .big{font-size:2.6rem;font-weight:800;color:var(--primary-dark);}
.score-hero .pct{font-size:1.1rem;color:var(--text-muted);margin-top:2px;}
.badge-pass{display:inline-block;margin-top:10px;padding:7px 18px;border-radius:999px;font-weight:800;font-size:.9rem;border:2px solid transparent;}
.badge-pass.pass{background:var(--good-soft);color:var(--good);border-color:var(--good);}
.badge-pass.fail{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);}
table.subject-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem;}
table.subject-table th,table.subject-table td{padding:8px 10px;border-bottom:1.5px dashed var(--border);text-align:left;}
table.subject-table th{color:var(--text-muted);font-weight:700;font-size:.8rem;}
.bar-cell{display:flex;align-items:center;gap:8px;}
.bar-cell .bar{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border);}
.bar-cell .bar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));}
.review-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.review-item{border:2px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--surface-2);}
.review-item .rq{font-weight:700;margin-bottom:8px;}
.review-item .ra-line{font-size:.86rem;margin-bottom:3px;}
.review-item .ra-line .tag{font-weight:800;}
.review-item.wrong{border-left:6px solid var(--bad);}
.review-item.right{border-left:6px solid var(--good);}
.review-item.unanswered{border-left:6px solid var(--warn);}

/* Players / scoreboard */
.player-card h2::before{content:'★ ';}
.player-roster{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.player-chip{
  border:2px solid var(--border);border-radius:12px;padding:8px 14px;background:var(--surface-2);cursor:pointer;
  transition:.12s;min-width:150px;
}
.player-chip:hover{border-color:var(--primary);transform:translateY(-1px);}
.player-chip.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 2px 0 var(--primary);}
.player-chip .pname{display:block;font-weight:800;font-size:.92rem;}
.player-chip .pmeta{display:block;font-size:.74rem;color:var(--text-muted);margin-top:2px;}
#newPlayerInput{background:var(--surface);color:var(--text);}
.server-status{font-size:.84rem;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:12px;border:1.5px dashed;}
.server-status.loading{color:var(--text-muted);border-color:var(--border);background:var(--surface-2);}
.server-status.ok{color:var(--good);border-color:var(--good);background:var(--good-soft);}
.server-status.err{color:var(--warn);border-color:var(--warn);background:var(--warn-soft);}
.compare-box{
  border:2px dashed var(--primary);border-radius:14px;padding:14px 16px;margin:16px 0;background:var(--primary-soft);
}
.compare-box.guest{border-color:var(--warn);background:var(--warn-soft);}
.compare-title{font-weight:800;margin-bottom:6px;color:var(--primary-dark);}
.compare-lines{display:flex;flex-direction:column;gap:4px;}
.compare-line{font-size:.9rem;font-weight:600;}
.compare-line.up{color:var(--good);}
.compare-line.down{color:var(--bad);}
.compare-line.same{color:var(--warn);}
table.leaderboard-table .rank-cell{font-size:1.2rem;text-align:center;width:44px;}
table.leaderboard-table tr.you-row{background:var(--primary-soft);}
.you-tag{
  display:inline-block;font-size:.68rem;font-weight:800;background:var(--primary);color:#fff;
  padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;
}
.stat-tile{
  background:var(--primary-soft);border-radius:12px;padding:10px 16px;min-width:96px;text-align:center;flex:1;
}
.stat-tile .stat-num{font-size:1.35rem;font-weight:900;color:var(--primary-dark);line-height:1.2;}
.stat-tile .stat-label{font-size:.72rem;color:var(--text-muted);font-weight:700;margin-top:2px;}
table.history-table td{font-size:.9rem;}
/* LINE OA unlock-request card (pending-approval screen) */
.line-unlock-card{border:2px solid #06C755;background:#f2fdf6;}
.line-unlock-card h2{margin-top:0;font-size:1.05rem;}
.line-qr-wrap{display:flex;justify-content:center;padding:14px 0 4px;}
.line-qr-img{width:200px;height:200px;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--border);}
.line-add-btn{background:#06C755;color:#fff;font-weight:800;padding:11px 26px;border-radius:999px;text-decoration:none;display:inline-block;}
.line-add-btn:hover{background:#05a648;}
/* Study content (อ่านเนื้อหาสรุปก่อนสอบ) */
.study-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;position:relative;}
.study-card{border:2px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;}
.study-card .sbadge{align-self:flex-start;font-size:.68rem;font-weight:800;background:var(--primary);color:#fff;padding:2px 10px;border-radius:999px;}
.study-card .stitle{font-weight:800;font-size:.96rem;}
.study-card .stitle::before{content:'📖 ';}
.study-card .scount{font-size:.78rem;color:var(--text-muted);}
.study-card .study-read-btn{margin-top:4px;align-self:flex-start;}
.subject-item{flex-wrap:wrap;}
.subject-item .read-link{
  flex:none;font-size:.74rem;font-weight:800;color:var(--primary-dark);
  background:var(--surface);border:1.5px solid var(--primary);border-radius:999px;
  padding:4px 10px;text-decoration:none;white-space:nowrap;
}
.subject-item .read-link:hover{background:var(--primary-soft);}
.study-article{max-width:100%;}
.study-article-body h1{font-size:1.22rem;margin-top:0;}
.study-article-body h2{font-size:1.06rem;margin-top:24px;border-bottom:2px dashed var(--border);padding-bottom:6px;}
.study-article-body h3{font-size:.96rem;margin-top:16px;color:var(--primary-dark);}
.study-article-body p{margin:8px 0;}
.study-article-body ul,.study-article-body ol{padding-left:22px;margin:8px 0;}
.study-article-body li{margin:4px 0;}
.study-article-body blockquote{border-left:4px solid var(--accent);background:var(--warn-soft);padding:10px 14px;border-radius:8px;margin:12px 0 18px;color:var(--text-muted);font-style:italic;}
.study-article-body code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:.86em;}
.study-article-body hr{border:none;border-top:2px dashed var(--border);margin:20px 0;}
.study-callout{border:2px solid var(--accent);background:#fff6ea;border-radius:12px;padding:12px 14px;margin:14px 0;}
.study-callout .ctitle{font-weight:800;color:#a85f1f;margin-bottom:6px;}
.study-callout .ctitle::before{content:'🎯 ';}
.study-callout ul{margin:0 !important;padding-left:20px;}
/* Auth (login/register) screen */
.auth-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--border);}
.auth-tab{padding:9px 18px;font-weight:800;font-size:.92rem;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.auth-tab:hover{color:var(--primary-dark);}
.auth-tab.active{color:var(--primary-dark);border-bottom-color:var(--primary);}
.auth-form{display:flex;flex-direction:column;gap:2px;max-width:380px;}
.auth-form input[type=text],.auth-form input[type=password]{
  width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-size:.94rem;
  background:var(--surface);color:var(--text);font-family:inherit;
}
.auth-form input:focus{outline:none;border-color:var(--primary);}
.demo-teaser{background:var(--surface-2);border-style:dashed;}
.pw-field{position:relative;}
.pw-field input{padding-right:42px !important;}
.pw-toggle{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:1.05rem;padding:6px 8px;
  color:var(--text-muted);line-height:1;
}
.pw-toggle:hover{color:var(--primary-dark);}
/* Header back/exit button — visible against the dark green header */
header.top #exitBtn{
  background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.55);
  color:#fff;
  font-weight:800;
  padding:8px 16px;
  box-shadow:none;
}
header.top #exitBtn:hover{
  background:rgba(255,255,255,.28);
  border-color:#fff;
  color:#fff;
  transform:translateY(-1px);
}
footer.foot{text-align:center;color:var(--text-muted);font-size:.78rem;margin-top:30px;}
footer.foot::before{content:'🎯 ';}
@media (max-width:600px){
  .wrap{padding:12px 10px 48px;}
  h1{font-size:1.25rem;}
  .score-hero .big{font-size:2.1rem;}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dot">⭐</span>
    <div>
      แบบทดสอบเตรียมสอบ จ.ส.อ. เลื่อนฐานะเป็นนายทหารสัญญาบัตร
      <small id="headerSub">พร้อมข้อสอบ</small>
    </div>
  </div>
  <button class="btn small ghost hidden" id="exitBtn">ออกไปหน้าตั้งค่า</button>
</header>

"subject": 1, "subjectTitle": "วิชาการสื่อสารประเภทวิทยุ", "count": 309}, {"subject": 2, "subjectTitle": "วิชาการสื่อสารประเภทสาย", "count": 300}, {"subject": 3, "subjectTitle": "วิชาทหารสื่อสาร", "count": 150}, {"subject": 4, "subjectTitle": "วิชาทั่วไป", "count": 100}, {"subject": 5, "subjectTitle": "วิชาส่งกำลังบำรุงและซ่อมบำรุง", "count": 100}, {"subject": 6, "subjectTitle": "วิชาฝ่ายอำนวยการ", "count": 50}, {"subject": 7, "subjectTitle": "วิชาคอมพิวเตอร์", "count": 100}, {"subject": 8, "subjectTitle": "วิชาไฟฟ้าและอิเล็กทรอนิกส์", "count": 118}, {"subject": 9, "subjectTitle": "วิชาระเบียบงานสารบรรณ", "count": 50}, {"subject": 10, "subjectTitle": "วิชาแบบธรรมเนียม", "count": 82}], "studyContent": [{"subject": 1, "subjectTitle": "วิชาการสื่อสารประเภทวิทยุ", "html": "<blockquote>\n<p>สังเคราะห์จากคลังข้อสอบ 309 ข้อ (พร้อมเฉลย) จัดกลุ่มเป็น 6 หัวข้อใหญ่ ครอบคลุมตั้งแต่หลักการพื้นฐาน สายอากาศ เครื่องวิทยุแต่ละรุ่น สงครามอิเล็กทรอนิกส์ การสื่อสาร/นำร่องทางอากาศ ไปจนถึงเรดาร์</p>\n</blockquote>\n<hr />\n<h2>1. หลักการพื้นฐานของการสื่อสารทางวิทยุและระเบียบปฏิบัติ</h2>\n<h3>1.1 กลุ่มวันเวลา (Date-Time Group) และเวลามาตรฐานกรีนิช</h3>\n<ul>\n<li>รูปแบบกลุ่มวันเวลาสากลเขียนเป็น <strong>วัน-ชั่วโมง-นาที ตัวอักษรเขตเวลา เดือน ปี</strong> เช่น <code>312045Z AUG 57</code></li>\n<li>ตัวอักษร <strong>Z (Zulu)</strong> ต่อท้ายตัวเลข หมายถึงเวลานั้นอ้างอิงตาม <strong>เวลามาตรฐานกรีนิช (GMT)</strong> ซึ่งเป็นมูลฐานกำหนดเวลาสากลที่ทุกเขตเวลาทั่วโลกใช้เทียบ</li>\n<li>ประเทศไทยอยู่ในเขตเวลา <strong>GMT+7</strong> ดังนั้นเวลาไทย (เขตอักษร G) จะ<strong>เร็วกว่า Zulu อยู่ 7 ชั่วโมงเสมอ</strong></li>\n<li>วิธีแปลง: นำเวลา Z บวก 7 ชั่วโมง ถ้าผลลัพธ์เกิน 2400 ให้ตัดวันไปเป็นวันถัดไปและปรับเดือน/ปีตามจำเป็น<ul>\n<li>ตัวอย่าง: <code>312045Z AUG</code> (31 ส.ค. เวลา 20.45 Z) + 7 ชม. = 27.45 น. ⇒ เกินเที่ยงคืน ต้องข้ามไปวันที่ 1 ก.ย. เวลา 03.45 น. ⇒ เขียนเป็น <code>010345G SEP</code></li>\n</ul>\n</li>\n</ul>\n<h3>1.2 การก่อกวนและการรบกวน (พื้นฐานก่อนเข้าเรื่อง EW)</h3>\n<ul>\n<li><strong>การรบกวน (Interference)</strong> คือสัญญาณที่ไม่ต้องการซึ่งเข้ามา<strong>ขัดขวางการรับสัญญาณ</strong> อาจเกิดขึ้นโดย \"เจตนา\" หรือ \"ไม่เจตนา\" ก็ได้</li>\n<li>ถ้าเป็นการรบกวน<strong>โดยเจตนา</strong> จะเรียกว่า <strong>\"การก่อกวน\" (Jamming)</strong></li>\n<li><strong>แบบมูลฐานของการก่อกวนมี 2 แบบ</strong> คือ<ol>\n<li><strong>การก่อกวนเป็นจุด (Spot jamming)</strong> — ส่งสัญญาณ<strong>ความถี่แคบ</strong>เพื่อรบกวนช่องหรือความถี่ใดความถี่หนึ่งโดยเฉพาะ ได้ผลรบกวนรุนแรงในช่องนั้น</li>\n<li><strong>การก่อกวนเป็นฉาก (Barrage/Sweep jamming)</strong> — ส่งสัญญาณ<strong>ความถี่กว้าง</strong>เพื่อรบกวนหลายๆ ช่องพร้อมกันเท่าที่จะทำได้</li>\n</ol>\n</li>\n<li>ต้องแยกให้ออกระหว่าง \"การก่อกวน\" (จงใจทำให้เครื่องมือข้าศึกใช้การไม่ได้) กับ \"การลวง\" (ทำให้ข้าศึกแปลความหมายผิด) — รายละเอียดเชิงลึกอยู่ในหัวข้อ EW</li>\n</ul>\n<h3>1.3 เอกสารและคำสั่งทางการสื่อสาร</h3>\n<ul>\n<li><strong>แผนผังข่ายวิทยุ</strong> จะปรากฏอยู่ใน <strong>รปจ. (ระเบียบปฏิบัติประจำ) และ นสป. (คำแนะนำ/หนังสือคู่มือสถานีวิทยุ)</strong></li>\n<li><strong>การกำหนดนามเรียกขาน</strong> ให้กับชุดวิทยุแต่ละข่าย จะปรากฏอยู่ใน <strong>คำแนะนำปฏิบัติการสื่อสาร (CEOI/SOI)</strong></li>\n<li>แผนผังข่ายและตารางนามเรียกขาน/ความถี่โดยละเอียด จะอยู่ใน <strong>อนุผนวกประกอบผนวกการสื่อสาร และคำสั่งปฏิบัติการสื่อสาร</strong> ไม่ใช่ในคำสั่งยุทธการหรือประมาณการสื่อสารโดยตรง</li>\n</ul>\n<h3>1.4 ข้อจำกัดของการสื่อสารประเภทวิทยุ</h3>\n<ul>\n<li>วิทยุเป็นเครื่องอิเล็กทรอนิกส์ จึง<strong>ถูกก่อกวน (jam) ได้ง่าย</strong> — นี่คือข้อจำกัดหลักที่ข้อสอบเน้น</li>\n<li>ข้อจำกัดอื่น เช่น ต้องใช้ความถี่ตรงกัน ต้องส่ง-รับสัญญาณแบบเดียวกัน (โหมด/ระบบเดียวกัน) และต้องอยู่ในรัศมีทำการของเครื่องที่มีกำลังส่งสูงกว่า</li>\n<li>สิ่งที่ <strong>ไม่ใช่</strong> ข้อจำกัด (กลับกลายเป็นจุดแข็ง) ได้แก่ การมีเครื่องควบคุมระยะไกล การเคลื่อนที่ได้สะดวก (ใช้กับหน่วยในอากาศได้)</li>\n<li>ปัจจัยที่ทำให้เครื่องส่งวิทยุมีประสิทธิภาพน่าเชื่อถือ ได้แก่ <strong>สายอากาศ ความสามารถของพนักงาน ความถี่ และกำลังออกอากาศ</strong></li>\n<li>ระบบสื่อสารที่ดีต้องสนองความต้องการ 4 ประการ คือ <strong>ความเชื่อถือได้ ความแน่นอน ความปลอดภัย และความคงอยู่ (ความรวดเร็ว)</strong></li>\n<li>หลัก 3 ประการของผู้ใช้วิทยุโทรศัพท์ทางทหาร คือ <strong>ความรวดเร็ว ความแน่นอน ความปลอดภัย</strong> — \"ความแน่นอน\" หมายถึง <strong>ไม่แต่งเติมแก้ไขข่าวให้ผิดไปจากต้นฉบับ</strong></li>\n</ul>\n<h3>1.5 ระเบียบการวิทยุ คำพูด และรูปแบบข่าว</h3>\n<ul>\n<li>คำพูดตามระเบียบการ <strong>\"ส่งต่อ\"</strong> เพียงคำเดียว (ไม่มีการระบุนามสถานีตามหลัง) หมายความว่า <strong>สถานีที่ถูกเรียกต้องส่งข่าวไปยังสถานีที่รับทั้งหมดตามจ่าหน้า</strong> แต่ถ้าต้องการให้ส่งต่อไปยังสถานีใดสถานีหนึ่งโดยเฉพาะ (เมื่อถูกเรียกมากกว่า 1 สถานี) ต้องใส่<strong>นามเรียกขานของสถานีที่ถูกกำหนด ไว้หน้าคำว่า \"ส่งต่อ\"</strong></li>\n<li>คำว่า <strong>\"ข่าว\"</strong> ในทางการสื่อสาร หมายรวมถึงข้อความธรรมดา ข้อความเข้ารหัสลับ แผนที่ ภาพถ่าย เรื่องราวต่างๆ และความคิดเห็น — แต่<strong>ไม่รวม \"กฎหมาย\"</strong> (ไม่ใช่ข่าวในความหมายของการสื่อสาร)</li>\n<li><strong>แผนภาพของข่าว</strong> มีทั้งสิ้น <strong>16 บรรทัด</strong> เครื่องหมายผู้ให้ข่าว <strong>\"จาก\"</strong> อยู่ที่<strong>บรรทัดที่ 6</strong></li>\n<li><strong>การนับหมู่คำ</strong>: ใช้นับความเร็ว/ปริมาณข้อความ เช่น ชื่อ-ยศ \"ร.อ.รักชาติ ยิ่งชีพ\" นับเป็น <strong>3 หมู่คำ</strong></li>\n<li>อัตราความเร็วมาตรฐานในการส่งข่าวด้วยมัชฌิมวิทยุโทรศัพท์ คือ <strong>8–12 ฉบับ/ชั่วโมง</strong></li>\n<li>ในขั้นการเคลื่อนที่เข้าปะทะ (movement to contact) เพื่อรักษาการรอนหาข้าศึกไม่ให้ทราบตำแหน่ง จะเน้น <strong>ระงับวิทยุหรือเงียบฟังไว้ก่อน</strong> ใช้บริการนำสารแทนเป็นหลัก</li>\n</ul>\n<h3>1.6 รปจ.สถานีวิทยุ ที่ตั้งสถานี และความปลอดภัย</h3>\n<ul>\n<li>รปจ. (ระเบียบปฏิบัติประจำ) ของสถานีวิทยุ ครอบคลุม การตั้งสถานี บันทึกของพนักงาน การกลับเข้าหน่วย ฯลฯ (การเฝ้าฟังเป็นสภาวะต่อเนื่อง ไม่ใช่ขั้นตอน รปจ. โดยตรง)</li>\n<li>ที่ดินที่<strong>ห้าม</strong>ใช้ตั้งสถานีวิทยุ คือ <strong>ที่ดินของเอกชน</strong></li>\n<li>การเลือกที่ตั้งสถานีวิทยุกำลังปานกลาง: <strong>ห้ามตั้งใต้สายไฟฟ้าแรงสูง ใต้สะพานเหล็ก ใต้ต้นไม้ใหญ่ หรือใต้ทางลอด</strong> เพราะโครงสร้างโลหะ/สิ่งกีดขวางเหล่านี้บดบัง/รบกวนการแพร่กระจายคลื่น (ไม่ควรตั้งในป่าทึบเพียงเพื่อพราง เพราะกระทบการรับ-ส่งสัญญาณ)</li>\n<li><strong>การรักษาความปลอดภัยในการสื่อสาร (รปภ.ส.)</strong> เป็นความรับผิดชอบของ<strong>ทุกคน</strong> ไม่จำกัดเฉพาะฝ่ายใดฝ่ายหนึ่ง</li>\n<li>แบบฟอร์มรายงานตรวจสอบซ่อมบำรุงเครื่องสื่อสาร <strong>ขั้นที่ 1 สำหรับพนักงานวิทยุ</strong> ใช้ <strong>ทบ.463-016</strong></li>\n</ul>\n<h3>1.7 นามเรียกขานและโครงสร้างข่ายวิทยุ</h3>\n<ul>\n<li><strong>นามเรียกขานรวม</strong> คือนามที่ใช้แทนสถานี/ผู้บังคับบัญชา/ส่วนราชการ/เจ้าหน้าที่ <strong>ตั้งแต่ 2 สถานีขึ้นไป</strong> พร้อมกัน (แยกจากนามเรียกขานทั่วไป, นามเรียกขานสากล, นามเรียกขานทางยุทธวิธี ซึ่งใช้แทนสถานีเดียว)</li>\n<li><strong>หน้าที่ทางเทคนิคของสถานีบังคับข่าย (สบข.)</strong> ได้แก่ ปรับความถี่ให้ตรงกันทุกสถานี รักษาลำดับก่อนหลัง รักษาวินัยของข่าย ระบายข่าวให้เร็วที่สุด ควบคุมการส่งข่าว — ส่วน <strong>\"การบังคับข่าย\" และ \"การเปิด-ปิดข่าย\" ไม่ใช่หน้าที่ทางเทคนิค</strong> (เป็นอำนาจสั่งการ/บริหารข่าย)</li>\n<li><strong>ข่ายภายในกองทัพภาค</strong> มีจำนวนทั้งสิ้น <strong>11 ข่าย</strong></li>\n<li>ข่ายภายนอกกองทัพภาค เช่น \"ข่าย กพ./กบ.ทบ. (ปส./วทพ.)\" มีสถานีบังคับข่ายตั้งอยู่ที่ <strong>บชร. (กองบัญชาการช่วยรบ)</strong></li>\n</ul>\n<div class=\"study-callout\"><div class=\"ctitle\">จุดที่ข้อสอบชอบออก</div><ul>\n<li>แปลงเวลา Zulu (Z) เป็นเวลาไทย (บวก 7 ชั่วโมง แล้วเช็คว่าข้ามวัน/เดือนหรือไม่)</li>\n<li>แยกแยะ \"การก่อกวนเป็นจุด\" กับ \"การก่อกวนเป็นฉาก\" และเจตนา/ไม่เจตนา</li>\n<li>เอกสารไหนอยู่ตรงไหนของคำสั่งการสื่อสาร (รปจ./นสป./คำแนะนำปฏิบัติการสื่อสาร/อนุผนวก)</li>\n<li>ตัวเลขเฉพาะ: 16 บรรทัดแผนภาพข่าว (จาก=บรรทัด 6), ทบ.463-016, 8-12 ฉบับ/ชม., 11 ข่ายในกองทัพภาค</li>\n</ul></div>\n<hr />\n<h2>2. สายอากาศและการแพร่กระจายคลื่นวิทยุ</h2>\n<h3>2.1 ปัจจัยในการเลือกสายอากาศ</h3>\n<p>การกำหนดว่าจะใช้สายอากาศชนิด ขนาด และรูปร่างใด ขึ้นอยู่กับปัจจัยหลัก 4 ประการ คือ <strong>ความถี่ใช้งาน, กำลังออกอากาศ, ทิศทางโดยทั่วไปของสถานีคู่สนทนา, และขั้วไฟฟ้า (โพลาไรเซชัน) ที่ต้องการ</strong></p>\n<h3>2.2 สายอากาศมาโคนี (Marconi) และกลุ่มดินเทียม</h3>\n<ul>\n<li><strong>สายอากาศมาโคนี</strong> คือสายอากาศที่มีตัวแผ่รังสียาว <strong>¼ ช่วงคลื่น</strong> และอาศัยพื้นดิน (หรือดินเทียม) เสมือนเป็นอีก ¼ ช่วงคลื่น รวมความยาวใช้งานเป็น <strong>½ ช่วงคลื่น</strong></li>\n<li>ตัวอย่างสายอากาศตระกูลมาโคนี: สายอากาศแบบเอลกลับ, สายอากาศแบบแส้ (Whip), สายอากาศดินเทียม (Ground Plane) — ส่วน <strong>DUMMY ANTENNA (สายอากาศเทียม/หุ่น) ไม่ใช่สายอากาศมาโคนี</strong> (ใช้สำหรับทดสอบเครื่องส่งโดยไม่แพร่คลื่นออกจริง)</li>\n<li><strong>สายอากาศพื้นดินเทียม (Ground Plane)</strong> ประกอบด้วยตัวแผ่รังสีทางดิ่งยาว ¼ คลื่น และ \"แผ่นดินเทียม\" 3 ส่วนที่กางออกทำมุม <strong>142 องศา</strong> กับแนวดิ่ง (ตัวสายอากาศ)</li>\n<li>เมื่อดินมีความนำไฟฟ้าต่ำ ต้องเติมสารเคมีเพื่อเพิ่มความนำไฟฟ้าของดิน โดยเรียงลำดับความดี→เลว คือ <strong>โซเดียมคลอไรด์ (เกลือแกง) → แคลเซียมคลอไรด์ → คอปเปอร์ซัลเฟต → แมกนีเซียมซัลเฟต (ดีเกลือ) → โปแตสเซียมไนเตรท (ดินประสิว)</strong></li>\n</ul>\n<h3>2.3 ผลของพื้นดินต่อสายอากาศ (ตามย่านความถี่)</h3>\n<ul>\n<li>ย่านความถี่ <strong>MF และ HF</strong>: สายอากาศจำเป็นต้องตั้งใกล้พื้นดินค่อนข้างมาก (คิดเป็นเศษส่วนของความยาวคลื่น) เพราะพื้นดินมีผลต่อการแพร่กระจายคลื่นในย่านนี้อย่างมีนัยสำคัญ</li>\n<li>ย่านความถี่ <strong>HF</strong>: การส่งด้วยขั้วไฟฟ้าทางดิ่งหรือทางระดับให้ผลต่างกันเพียงเล็กน้อย จึงสร้างสายอากาศส่ง/รับเป็นแบบใดก็ได้ (ความต้องการขั้วไฟฟ้าไม่เข้มงวด)</li>\n<li>ย่านความถี่ <strong>VHF และ UHF</strong>: ขั้วไฟฟ้าที่สายอากาศส่งจะ \"คงสภาพ\" ไปตลอดเส้นทางจนถึงสายอากาศรับ ดังนั้น<strong>ต้องใช้ขั้วไฟฟ้าเดียวกันทั้งสองด้าน</strong> (ส่งทางดิ่ง ต้องรับทางดิ่ง)</li>\n</ul>\n<h3>2.4 ประโยชน์ของขั้วไฟฟ้าทางดิ่งและทางระดับ</h3>\n<ul>\n<li><strong>ขั้วไฟฟ้าทางดิ่ง (Vertical Polarization)</strong>: สายอากาศทางดิ่งรับสัญญาณรบกวนจากการกระทำของมนุษย์ (man-made noise) ได้<strong>น้อยกว่า</strong> เพราะสัญญาณรบกวนประเภทนั้นมักมีขั้วไฟฟ้าทางดิ่งเช่นกันแต่กระจายไม่เท่ากันในทิศทาง — (ข้อสอบใช้เหตุผลนี้เป็นคำตอบหลัก)</li>\n<li><strong>ขั้วไฟฟ้าทางระดับ (Horizontal Polarization)</strong>: เมื่อใช้สายอากาศทางระดับแบบง่ายๆ สายส่งกำลัง (feed line) จะอยู่ในแนวดิ่ง ซึ่งไม่รบกวนตัวสายอากาศที่ขั้วอยู่ในแนวระดับ ทำให้ติดตั้งง่ายและกวนกันน้อย</li>\n</ul>\n<div class=\"study-callout\"><div class=\"ctitle\">จุดที่ข้อสอบชอบออก</div><ul>\n<li>ตัวเลขมุม 142 องศาของดินเทียม, ลำดับสารเคมีเติมดิน</li>\n<li>สายอากาศมาโคนี = ¼ คลื่น+ดินเทียมอีก ¼ = ½ คลื่นรวม, DUMMY ANT ไม่ใช่มาโคนี</li>\n<li>ย่านความถี่ไหนต้องขั้วไฟฟ้าตรงกัน (VHF/UHF) กับย่านที่ไม่เข้มงวด (HF)</li>\n<li>เหตุผลเชิงเทคนิคของขั้วไฟฟ้าทางดิ่ง/ทางระดับ</li>\n</ul></div>\n<hr />\n<h2>3. เครื่องวิทยุสื่อสารทางยุทธวิธี (แยกตามรุ่น)</h2>\n<p>หัวข้อนี้เป็นหัวข้อที่ข้อสอบออกมากที่สุด (เกินครึ่งของคลังข้อสอบ) เน้นจดจำ <strong>สเปกตัวเลข ชื่อรุ่นอุปกรณ์ประกอบ และขั้นตอนการตั้งค่าเฉพาะรุ่น</strong></p>\n<h3>3.1 ชุดวิทยุ PRC-624</h3>\n<table>\n<thead>\n<tr>\n<th>รายการ</th>\n<th>ค่า/รายละเอียด</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>สายโหลดข้อมูลระหว่าง RT-624 กับ RT-624</td>\n<td>CX-6240</td>\n</tr>\n<tr>\n<td>สายทำสถานีถ่ายทอด (Retransmission)</td>\n<td>CX-624</td>\n</tr>\n<tr>\n<td>ย่านติดต่อกับ AN/PRC-77</td>\n<td>30.000–75.950 MHz</td>\n</tr>\n<tr>\n<td>ย่านติดต่อกับ CNR-900</td>\n<td>30.000–87.975 MHz</td>\n</tr>\n<tr>\n<td>หน้าที่ไมโครโพรเซสเซอร์</td>\n<td>แสดงระดับแรงดันไฟ, ลบข้อมูล, ทดสอบตัวเอง (ทำได้ทุกอย่าง)</td>\n</tr>\n<tr>\n<td>เครื่องกำเนิดสัญญาณ 1560 Hz</td>\n<td>ใช้ทดสอบ<strong>ภาคส่ง</strong></td>\n</tr>\n<tr>\n<td>เครื่องกำเนิดสัญญาณ RF</td>\n<td>ใช้ทดสอบ<strong>ภาครับ</strong></td>\n</tr>\n<tr>\n<td>กำลังส่งสูงสุด</td>\n<td>2.6 วัตต์</td>\n</tr>\n<tr>\n<td>กำลังส่งต่ำสุด</td>\n<td>0.25 วัตต์</td>\n</tr>\n<tr>\n<td>ความไวไมโครโฟนปกติ</td>\n<td>1.4 mV ที่ 150 โอห์ม</td>\n</tr>\n<tr>\n<td>ความไวไมโครโฟนโหมดกระซิบ</td>\n<td>0.4 mV ที่ 150 โอห์ม</td>\n</tr>\n<tr>\n<td>ปุ่มเลื่อนตำแหน่งความถี่</td>\n<td>ปุ่ม FREQ</td>\n</tr>\n<tr>\n<td>ผล VSWR สายอากาศสูง</td>\n<td>ลดกำลังส่งออกอากาศ</td>\n</tr>\n<tr>\n<td>คำว่า RXMT บนจอ</td>\n<td>หมายถึงเป็นสถานีถ่ายทอด</td>\n</tr>\n<tr>\n<td>คำว่า DATA บนจอ</td>\n<td>หมายถึงรับ-ส่งข้อมูล</td>\n</tr>\n</tbody>\n</table>\n<h3>3.2 ตระกูล AN/VRC-12 Series และการทำสถานีส่งต่อ</h3>\n<ul>\n<li>เสาอากาศ <strong>AT-912/VRC</strong> และ <strong>AS-1729</strong> ประกอบด้วยท่อนเสาอากาศ AS-1730, AS-1096, AS-1095 — <strong>ไม่รวม AS-1097</strong> (เป็นตัวลวงที่ข้อสอบชอบใส่)</li>\n<li>ขั้ว <strong>X-MODE</strong> สำหรับต่ออุปกรณ์อื่น ต้องมีระยะห่างระหว่างชาแนล <strong>100 KHz</strong></li>\n<li>กล่องควบคุมเลือกความถี่ (Control Box) ของ AN/VRC-12 Series คือ <strong>C-2742/VRC</strong></li>\n<li>ชุดวิทยุ <strong>VRC-1465</strong> เมื่อทำหน้าที่สถานีส่งต่อ (Retransmission) ความถี่เครื่องรับ-ส่งต้องห่างกัน<strong>อย่างน้อย 10 MHz และห้ามห่างกันพอดี 29 MHz</strong></li>\n<li>ชุดวิทยุ <strong>VRC-1460</strong> เมื่อทำสถานีส่งต่อ ความถี่ต้องห่างกัน<strong>อย่างน้อย 3 MHz และห้ามห่างกันพอดี 29 MHz</strong></li>\n<li>VRC-1465 ต่ออุปกรณ์ <strong>CX-5230</strong> เข้าที่หมุด RMT/DATA เพื่อทำสถานีส่งต่อ</li>\n<li>ถ้าใช้ <strong>PRC-730 ร่วมกับ AN/PRC-77</strong> ทำสถานีส่งต่อ ต้องใช้สาย <strong>CX-4656/GRC</strong></li>\n<li>ถ้าใช้ VRC-980 ทำสถานีส่งต่อ ใช้สาย <strong>CX-5630</strong> ต่อที่ RMT/DATA</li>\n<li>กรณี ทก.หลัก-ทก.หลัง กองพลห่างกัน 34 กม. และต้องใช้ชุดวิทยุ AN/VRC-12(43-49) อย่างประหยัด ให้ใช้ <strong>เครื่องควบคุมระยะใกล้ AN/GRC-39</strong></li>\n<li>ข่ายธุรการ/ส่งกำลังบำรุงกองพลที่ใช้ AN/VRC-47 ร่วมกับระบบ RWI (AN/GSA-7) และสายอากาศ RC-292 จะได้ระยะวางแผนไกลสุด <strong>80 กม.</strong></li>\n</ul>\n<h3>3.3 ตระกูล CNR-900 / CNR-900T (CNR-9000)</h3>\n<p>คุณลักษณะ/สเปกที่ออกสอบบ่อย:</p>\n<ul>\n<li>ความไวภาครับ <strong>-115 dB</strong></li>\n<li>อัตราส่งข้อมูลสูงสุด (โหมดปกติ) <strong>4,800 bps</strong></li>\n<li>น้ำหนักเครื่องรับ-ส่ง RT-7330 <strong>6.05 กก.</strong>; แบตเตอรี่ TNC-2188 <strong>1.65 กก.</strong></li>\n<li>สายอากาศ AS-1288 ประกอบด้วย <strong>AT-2730, AT-2731, MX-6808</strong></li>\n<li>ตั้งตารางความถี่ก้าวกระโดด (Frequency Hopping) ล่วงหน้าได้ <strong>10 ตาราง</strong></li>\n<li>โหลดข้อมูลต้องกดปุ่ม <strong>PROG 3 ครั้ง</strong></li>\n<li>ทดสอบภาครับ: กดปุ่ม <strong>TEST แล้วกด ENT</strong></li>\n<li>ไฟ <strong>FAULT ติดค้างตลอด</strong> = <strong>เครื่องเสีย</strong></li>\n<li>เมื่อสิ้นสุดการสนทนาระหว่างสแกน เครื่องจะหยุดสแกนค้างที่ช่องนั้นต่ออีก <strong>2 วินาที</strong></li>\n<li>ลำดับความสำคัญการสแกน: <strong>ช่องลำดับ 1 สำคัญกว่าลำดับ 2, ลำดับ 2 สำคัญกว่าลำดับ 3</strong></li>\n<li>การถ่ายโอนข้อมูล MASTER→SLAVE: จอ MASTER แสดง <strong>LOADING</strong> จอ SLAVE แสดง <strong>LOADED</strong></li>\n<li>ขั้ว RMT/DATA ใช้หมุด <strong>S, T, M</strong> ในการถ่ายโอนข้อมูล</li>\n<li>โหมด AJ (Anti-Jamming) ติดต่อกันไม่ได้ เพราะเวลา/วันที่ไม่ตรง, ค่าปัจจัย(key)ไม่ตรง, หรือโหลดข้อมูลคนละแบบ — <strong>ไม่ใช่</strong>เพราะเลือก MODULATE คนละแบบ</li>\n<li>เนื่องจากตั้งค่าใช้งานได้หลายแบบ (Hopping/เข้ารหัส) หากคู่สถานีตั้งไม่ตรงกันจะติดต่อไม่ได้ ให้ตั้งสวิตช์เลือกไว้ที่ <strong>HAIL</strong> เพื่อป้องกันปัญหานี้</li>\n<li>สามารถใช้ CNR-900 แทน <strong>AN/VRC-44</strong> ได้โดยตั้งสวิตช์เลือกหน้าที่ไว้ที่ <strong>SCAN</strong></li>\n<li>เมื่อหน้าจอปรากฏตัวเลข <strong>41250</strong> ตัวเลขที่นำมาใช้เป็นรหัสจะ<strong>กลับลำดับ</strong> เป็น <strong>15420</strong></li>\n<li>คุณลักษณะพิเศษที่ CNR-900 และ CNR-9000(900T) <strong>แตกต่างกันชัดเจน</strong> ข้อสอบเคยออกทั้งในมุม <strong>SELECTIVE-CALLING</strong> และ <strong>ADAPTIVE-PWR</strong> เป็นคำตอบ — ให้จำว่าทั้งสองฟีเจอร์นี้เป็นจุดต่างที่ข้อสอบเน้นเปรียบเทียบระหว่างสองตระกูลนี้</li>\n</ul>\n<p><strong>CNR-900T เฉพาะทาง</strong></p>\n<ul>\n<li>ตรวจสอบการหลงโหมด (mode) ต้องเข้าเมนู <strong>OPER</strong> เพื่อเลือกใช้งาน HAIL</li>\n<li>ตัวอักษร <strong>\"ERS\"</strong> บนหน้าปัด ใช้สำหรับ<strong>ลบข้อมูล</strong></li>\n<li>เมนู <strong>PROG</strong> ใช้สำหรับเปิด-ปิด TONE SQ., ดูเวลา, และดูวันที่ของเครื่อง (ทุกอย่างรวมอยู่ในเมนูเดียว ต่างจาก CNR-900 รุ่นเดิมที่กดปุ่มตัวเลขแยกกันหลัง PASSWORD)</li>\n<li>โหมดเลือกเรียก (Selective Calling): หากต้องการติดต่อกับสถานีหมายเลข 1–9 และ 21–29 พร้อมกัน ต้องตั้งค่า <strong>SELL T = 31</strong></li>\n<li><strong>SELL R ห้ามตั้งเลข 31–39</strong>, <strong>SELL T ห้ามตั้งเลข 40</strong> (เป็นช่วงเลขสงวน/ใช้งานพิเศษ)</li>\n</ul>\n<h3>3.4 ตระกูล HF-2000 / HF-6000 / VRC-2100 / VRC-2020</h3>\n<p><strong>HF-2000 / VRC-2100</strong></p>\n<ul>\n<li>โหมด AJ (Anti-Jamming): ตั้ง <strong>HOP SET</strong> ให้ตรงกันทั้งสองสถานี ถ้ายังติดต่อไม่ได้ให้ตรวจสอบ<strong>ความถี่ในโหมด CLR</strong></li>\n<li>โหมด AJ ตั้ง <strong>NET number</strong> ตรงกันแล้วยังติดต่อไม่ได้ ให้ตรวจสอบปัจจัยที่เกี่ยวข้อง<strong>ทุกข้อ</strong> (เวลา วันที่ ปัจจัย ฯลฯ)</li>\n<li>ถ้าไม่ใช้ CP-2103 ยังสามารถใช้สายอากาศ Whip กับ VRC-2100 ได้ โดยเปลี่ยนที่ปุ่ม <strong>PROG + Direct</strong></li>\n<li>โหมด <strong>DUAL FREQ</strong> ตั้งได้เฉพาะช่อง <strong>10–19</strong> และใช้ได้กับโหมด <strong>CLR, SEC</strong> เท่านั้น</li>\n<li>โหมด FUNC MODE A-J: เมื่อวิทยุ LINK กันอยู่ หากไม่มีการกด KEY จะยัง LINK ค้างอยู่ <strong>40 วินาที</strong></li>\n<li>โหมด <strong>CW</strong> ตั้งค่าที่<strong>ปุ่มหมายเลข 6</strong></li>\n<li>ระบบ <strong>SQ-SEL C</strong> ระหว่าง HF-2000/HF-6000: ตัวอย่าง SEL-R 01 = SELD ID 01 (การตั้งรหัสประจำสถานีให้ตรงกัน)</li>\n<li>โหมด <strong>FREQ HOPPING</strong> ใช้งานได้ทั้ง <strong>AM และ SSB</strong></li>\n<li>หน้าจอแสดง <strong>\"SCAN-1\"</strong> หมายถึงเครื่องทำงานแบบ <strong>AUTO CALL TABLE 1</strong></li>\n<li>ตาราง Auto Call ใส่ความถี่ได้สูงสุด <strong>10 ความถี่/ตาราง</strong></li>\n<li>ความถี่ <strong>Forbidden</strong> (ความถี่ต้องห้าม) ใส่ได้สูงสุด <strong>10 ความถี่</strong></li>\n<li>ตาราง <strong>Table 2 ของ AJ Parameter</strong> ใส่ความถี่ได้ต่ำสุด <strong>8 ความถี่</strong></li>\n<li>อุปกรณ์แปลงแรงดันไฟใน HF-2000 คือ <strong>AD-1224</strong></li>\n<li>ระบบ <strong>SQ-SYLAB</strong> ใช้ประโยชน์กับวิทยุ AM ที่ไม่มี SQ ดิจิตอล</li>\n<li>Auto Call: หากเครื่อง A ใช้ตาราง 1 และเครื่อง B ใช้ตาราง 2 แต่ยังติดต่อกันได้ปกติ แสดงว่า <strong>ปัจจัยในตารางที่ 1 และ 2 เหมือนกัน</strong> (หมายเลขตารางต่างกันได้ ตราบใดที่เนื้อหาปัจจัยตรงกัน)</li>\n<li>ลำโพงที่ใช้กับชุด VRC-2020 คือ <strong>LS-108M</strong></li>\n<li>ชุดสะพายหลัง HF-2000 ใช้สายอากาศขนาด 9 ฟุต รุ่น <strong>AT-1717</strong> (ใช้ร่วมกับ VRC-2100 แบบ Whip เช่นกัน)</li>\n<li>VRC-2100 ต้องติดตั้งชุดควบคุมสายอากาศ <strong>CP-2103</strong></li>\n<li>ชุดขยายสัญญาณของ VRC-2100 คือ <strong>AM-2102</strong></li>\n<li>อุปกรณ์ส่งสัญญาณรหัสมอร์ส (CW) ร่วมกับ HF-2000 คือ <strong>KY-116/U</strong></li>\n<li>โหมด voice ใช้ได้กับปากพูดหูฟังได้<strong>ทุกชนิด</strong></li>\n</ul>\n<p><strong>HF-6000</strong></p>\n<ul>\n<li>ระบบ Auto Call สามารถโปรแกรมได้<strong>ทุกตาราง</strong></li>\n<li>ตาราง HOP แบบ AJ ที่ต้องป้อนปัจจัยการก้าวกระโดดและ STEP จะตั้งได้เมื่อเลือกเมนู <strong>FORMULAR (Formula)</strong></li>\n<li>ตัวอย่างการคำนวณ HOP FREQS แบบ Formula: BASE FREQ = 10.000 MHz, FREQ STEP = 20 KHz, กระโดด 8 ความถี่ ⇒ ความถี่สุดท้าย = 10.000 + (0.020 × 8) = <strong>10.160 MHz</strong></li>\n<li>HOPLIST แก้ไขปัจจัยได้เฉพาะ <strong>KEY และ TABLE</strong> โดยผ่าน <strong>PASSWORD 20000</strong></li>\n<li>เมื่อ HF-6000 สองเครื่องล็อกติดต่อกันในระบบ Auto Call แล้ว จะ<strong>ไม่มีเวลาตัดการติดต่ออัตโนมัติ</strong> (ล็อกค้างจนกว่าจะยกเลิกเอง)</li>\n<li>ค่า <strong>HOPLIST 012</strong> หมายถึง AJ ใช้ <strong>TABLE เท่ากับ 0</strong> (หลักแรกของรหัสคือหมายเลข Table)</li>\n<li>ตารางที่ตั้งได้ในโหมด AUTO CALL ที่แก้ไขผ่านคอมพิวเตอร์และโหลดผ่าน <strong>G10</strong> คือ <strong>ตำแหน่งตารางที่ 010–179</strong></li>\n<li>ถ้าไม่มี G10 และสาย LOAD สามารถใช้สายไฟธรรมดาแทนโดยต่อที่จุด <strong>M, S, T</strong></li>\n<li>HF-6000 มีความสามารถโหมด AJ/ECCM แบ่งการทำงานไว้ <strong>2 แบบของตาราง (TABLE AJ)</strong></li>\n<li>โหลดปัจจัยจาก <strong>G10 ไปสู่เครื่อง HF</strong> ทำได้ทันที</li>\n<li>โหลดปัจจัยจาก<strong>เครื่อง HF ไปสู่ G10</strong> ต้อง<strong>โปรแกรมจากเครื่อง HF ก่อน</strong>แล้วจึงโหลด</li>\n</ul>\n<h3>3.5 PRC-6020 / VRC-6100</h3>\n<ul>\n<li>สายอากาศไดโพลของ PRC-6020 มีชื่อว่า <strong>AT-1743</strong></li>\n<li>สาย DC Power (CX-8024) ของ VRC-6100 ยาว <strong>2.2 เมตร</strong></li>\n<li>อุปกรณ์ 24 VDC Power Supply ของ VRC-6100 คือ <strong>PS-2004X</strong></li>\n<li>อุปกรณ์ <strong>CP-2103</strong> ของ VRC-6100 สามารถใช้ร่วมกับชุดวิทยุ <strong>VRC-2100</strong> ได้</li>\n</ul>\n<h3>3.6 PNR-500 (วิทยุมือถือขนาดเล็ก)</h3>\n<table>\n<thead>\n<tr>\n<th>รายการ</th>\n<th>ค่า</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ย่านความถี่</td>\n<td>380–430 MHz</td>\n</tr>\n<tr>\n<td>ความห่างแต่ละช่อง</td>\n<td>100 KHz</td>\n</tr>\n<tr>\n<td>จำนวนช่องทั้งหมด</td>\n<td>500 ช่อง</td>\n</tr>\n<tr>\n<td>ตั้งความถี่ล่วงหน้าได้</td>\n<td>15 ช่อง</td>\n</tr>\n<tr>\n<td>ระยะติดต่อ พื้นที่โล่ง</td>\n<td>1,500 เมตร</td>\n</tr>\n<tr>\n<td>ระยะติดต่อ เขตเมือง</td>\n<td>800 เมตร</td>\n</tr>\n<tr>\n<td>ระยะติดต่อ ในป่า</td>\n<td>500 เมตร</td>\n</tr>\n<tr>\n<td>แรงดันไฟใช้งาน</td>\n<td>3.6 V.DC.</td>\n</tr>\n<tr>\n<td>น้ำหนัก</td>\n<td>น้อยกว่า 430 กรัม (รวมแบตเตอรี่และสายอากาศ)</td>\n</tr>\n<tr>\n<td>ขนาดเครื่องรับ-ส่ง</td>\n<td>120×70×50 มม.</td>\n</tr>\n<tr>\n<td>ระดับกำลังส่ง</td>\n<td>3 ตำแหน่ง</td>\n</tr>\n<tr>\n<td>จำนวนเครือข่าย</td>\n<td>15 เครือข่าย (แต่ละเครือข่ายมี 4 เครือข่ายย่อย รวม 60 เครือข่ายย่อย)</td>\n</tr>\n<tr>\n<td>กุญแจรหัส (Key)</td>\n<td>15 รหัส</td>\n</tr>\n<tr>\n<td>อัตราส่งข้อมูล</td>\n<td>19.2 Kbps</td>\n</tr>\n</tbody>\n</table>\n<h3>3.7 PRC-710 MB (และรุ่นติดตั้ง ARC-710MB / VRC-710MB)</h3>\n<table>\n<thead>\n<tr>\n<th>รายการ</th>\n<th>ค่า</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ย่านความถี่</td>\n<td>VHF/UHF, 30.000–511.99375 MHz</td>\n</tr>\n<tr>\n<td>จำนวนช่องความถี่</td>\n<td>19,280 ช่อง ที่ระยะห่าง 25 KHz</td>\n</tr>\n<tr>\n<td>ระดับกำลังส่ง</td>\n<td>2 ระดับ (LO, HI)</td>\n</tr>\n<tr>\n<td>กำลังส่งสูงสุด</td>\n<td>3 วัตต์</td>\n</tr>\n<tr>\n<td>กำลังส่งต่ำสุด</td>\n<td>0.25 วัตต์</td>\n</tr>\n<tr>\n<td>LO ขณะใช้เป็น AM</td>\n<td>1 วัตต์</td>\n</tr>\n<tr>\n<td>LO ขณะใช้เป็น FM</td>\n<td>0.25 วัตต์</td>\n</tr>\n<tr>\n<td>ความถี่โทนสเควลซ์</td>\n<td>150 Hz</td>\n</tr>\n<tr>\n<td>ตั้งความถี่ล่วงหน้า</td>\n<td>100 ช่อง</td>\n</tr>\n<tr>\n<td>เครื่องรับ-ส่ง</td>\n<td>RT-710MBN</td>\n</tr>\n<tr>\n<td>แบตเตอรี่</td>\n<td>LTI-718</td>\n</tr>\n<tr>\n<td>สายอากาศ AT-1000</td>\n<td>รับสัญญาณ GPS</td>\n</tr>\n<tr>\n<td>กำลังส่งสูงสุด ARC-710MB (ติดอากาศยาน)</td>\n<td>20 วัตต์</td>\n</tr>\n<tr>\n<td>กำลังส่งสูงสุด VRC-710MB (ติดยานยนต์)</td>\n<td>50 วัตต์</td>\n</tr>\n<tr>\n<td>แรงดันไฟใช้งาน</td>\n<td>14 V.DC.</td>\n</tr>\n<tr>\n<td>การมอดูเลต</td>\n<td>AM/FM</td>\n</tr>\n<tr>\n<td>ชนิดสายอากาศที่ใช้งาน</td>\n<td>3 ชนิด</td>\n</tr>\n<tr>\n<td>สแกนได้</td>\n<td>3 ช่อง</td>\n</tr>\n</tbody>\n</table>\n<p>การใช้งานปุ่มต่างๆ ของ PRC-710 MB: <strong>PTT</strong> = กดพูดออกอากาศ, <strong>FREQ</strong> = ปรับตั้งความถี่, <strong>ENT</strong> = ยืนยันค่าที่ตั้ง, <strong>TEST</strong> = ทดสอบตัวเอง, <strong>LITE</strong> = เปิด-ปิดไฟส่องสว่าง, ไม่มีปุ่ม <strong>NUM</strong>; การปิด-เปิดเครื่องกระทำที่<strong>ปุ่มปรับเสียง (volume)</strong>; โหมดเสียงชัดเจน (ไม่เข้ารหัส) เรียกว่า <strong>CLR</strong> โหมดเข้ารหัสเรียกว่า <strong>SEC</strong>; การใช้งานแบบเลือกเรียกใช้ได้ทุกโหมดยกเว้นโหมด CLR; ชุดหูฟัง-ไมค์ <strong>H-250/U</strong> ต่อที่<strong>ขั้วต่ออุปกรณ์เสียง</strong></p>\n<h3>3.8 เครื่องอื่นๆ ที่ควรจำ</h3>\n<ul>\n<li><strong>GRC-1600</strong> ใช้ทดแทนชุดวิทยุ AN/VRC-64 และ GRC-160 ติดตั้งบนรถยนต์ ใช้งานในหน่วยระดับ <strong>หมวด – กองพัน</strong></li>\n<li><strong>VRC-745</strong> ติดตั้งบนรถสายพานลำเลียงพล มีระยะติดต่อสื่อสาร <strong>24 กม.</strong></li>\n</ul>\n<div class=\"study-callout\"><div class=\"ctitle\">จุดที่ข้อสอบชอบออก</div><ul>\n<li>ตัวเลขสเปกเฉพาะรุ่น (กำลังส่ง สูง/ต่ำ, ย่านความถี่, จำนวนช่อง, น้ำหนัก, ระยะทำการ) — ต้องจำแยกแต่ละรุ่นให้แม่น อย่าสลับกัน</li>\n<li>ระยะห่างความถี่ขั้นต่ำ/ต้องห้ามสำหรับการทำสถานีส่งต่อ (Retransmission) ของแต่ละรุ่น (VRC-1460 ≠ VRC-1465)</li>\n<li>ชื่อรหัสสาย/อุปกรณ์เสริมเฉพาะรุ่น (CX-xxxx, CP-2103, AT-1717 ฯลฯ)</li>\n<li>ขั้นตอนกดปุ่ม/เข้าเมนูเฉพาะของ CNR-900, CNR-900T, HF-2000, HF-6000 (มักมีตัวเลือกใกล้เคียงกันมาก ต้องจำลำดับปุ่มให้แม่น)</li>\n<li>โจทย์คำนวณ เช่น การกลับเลขรหัส CNR-900 (41250→15420) และการคำนวณ HOP FREQ แบบสูตร</li>\n</ul></div>\n<hr />\n<h2>4. สงครามอิเล็กทรอนิกส์ (Electronic Warfare - EW)</h2>\n<h3>4.1 องค์ประกอบหลักของ EW</h3>\n<p>EW แบ่งการปฏิบัติออกเป็น 3 ส่วนหลัก ที่ข้อสอบอ้างถึงบ่อย:</p>\n<ul>\n<li><strong>ESM (Electronic Warfare Support Measures)</strong> — การเฝ้าตรวจ ค้นหา ดักรับ และวิเคราะห์สัญญาณข้าศึก ถือเป็น<strong>ขั้นแรกของการปฏิบัติการ EW</strong> ตัวอย่างเช่น การค้นหาตำแหน่งเป้าหมายเพื่อโจมตี หรือกองพันข่าวกรองทางทหารใช้เวลาหลายเดือนในการพิสูจน์ทราบรหัสลับข้าศึก (ถือเป็นการปฏิบัติ ESM)</li>\n<li><strong>ECM (Electronic Countermeasures)</strong> — ถือเป็น<strong>\"อาวุธหลัก\" ของ EW</strong> ครอบคลุมการก่อกวน (Jamming) และการลวง (Deception) — <strong>เรดาร์ (RADAR) ไม่ใช่อาวุธของ ECM</strong> (เรดาร์เป็นเซนเซอร์/เป้าหมายของฝ่ายตรงข้าม ไม่ใช่เครื่องมือก่อกวน)</li>\n<li><strong>ECCM (Electronic Counter-Countermeasures)</strong> — มาตรการป้องกัน/แก้ไขไม่ให้ฝ่ายเราถูก ECM ของข้าศึกกระทบ</li>\n</ul>\n<h3>4.2 การข่าวกรองทางอิเล็กทรอนิกส์ (SIGINT / ELINT / COMINT)</h3>\n<ul>\n<li><strong>SIGINT (Signal Intelligence)</strong> เป็นการกระทำที่ต้อง<strong>ดำเนินการอย่างต่อเนื่อง</strong> เพื่อให้ผู้บังคับบัญชาสามารถตัดสินใจได้ถูกต้องที่สุด (เป็นคำรวมของ COMINT+ELINT)</li>\n<li><strong>ELINT (Electronic Intelligence)</strong> คือการเก็บรวบรวมและดำเนินกรรมวิธีเพื่อให้ได้ข้อมูลข่าวกรองจาก<strong>การแพร่กระจายคลื่นแม่เหล็กไฟฟ้าที่ไม่ได้เกิดจากการสื่อสาร</strong> (เช่น สัญญาณเรดาร์) — <strong>RADAR ถือเป็นตัวอย่างของข่าวกรองทางอิเล็กทรอนิกส์ (ELINT)</strong>; ฝ่ายเราวิเคราะห์ทำเนียบกำลังรบข้าศึกได้จากงานด้าน ELINT เช่นกัน</li>\n<li><strong>COMINT (Communications Intelligence)</strong> ใช้หาข้อมูล<strong>ทำเนียบกำลังรบของข้าศึก</strong> จากการดักฟังการสื่อสาร</li>\n</ul>\n<h3>4.3 การก่อกวนและการลวง</h3>\n<ul>\n<li><strong>การก่อกวน (Jamming)</strong> คือการจงใจแผ่รังสีคลื่นแม่เหล็กไฟฟ้า เพื่อให้ข้าศึกไม่สามารถใช้เครื่องมืออิเล็กทรอนิกส์ได้</li>\n<li><strong>การก่อกวนแบบจุด (Spot jamming)</strong> ให้ประสิทธิภาพสูงสุดเมื่อเทียบกับแบบฉาก</li>\n<li><strong>การก่อกวน vs การลวง</strong>: การก่อกวนมุ่ง<strong>ทำให้เครื่องมือข้าศึกใช้การไม่ได้</strong> ส่วนการลวงมุ่ง<strong>ทำให้ข้าศึกแปลความหมายข้อมูลผิด</strong></li>\n<li><strong>การลวงเล่ห์ (Manipulative deception)</strong> ไม่จำเป็นต้องเข้าไปในข่ายข้าศึก ส่วน <strong>การลวงเลียน (Imitative deception)</strong> ต้องเข้าไปปฏิบัติการในข่ายข้าศึกจริง (ปลอมตัวเป็นสถานีในข่ายนั้น)</li>\n<li>การลวงจะเกิดขึ้นได้ง่ายเมื่อ<strong>ข่ายวิทยุมีลูกข่ายจำนวนมาก</strong> (โอกาสสับสน/แทรกซึมสูงขึ้น)</li>\n<li>มาตรการที่ป้องกันการลวงจากข้าศึกได้ดีที่สุด คือ <strong>ระบบรับรองฝ่าย (Authentication)</strong></li>\n</ul>\n<h3>4.4 มาตรการ ECCM</h3>\n<ul>\n<li>ECCM แบ่งเป็นมาตรการ<strong>ป้องกัน (Preventive)</strong> เช่น ใช้กำลังออกอากาศต่ำเพื่อลดโอกาสถูกดักรับ, เลือกที่ตั้งสายอากาศให้เหมาะสม, ใช้สายอากาศทิศทางเดียว (Uni-directional) เพื่อป้องกันการดักรับจากข้าศึก และมาตรการ<strong>แก้ไขเยียวยา (Remedial/Corrective)</strong> เช่น <strong>ดำรงการสื่อสารต่อไป</strong> แม้ถูกก่อกวน</li>\n<li><strong>การเข้ารหัส (Encryption)</strong> ถือเป็นการดำเนินการ ECCM เชิงรับ (Passive)</li>\n<li>เมื่อถูกก่อกวนจากข้าศึก การปฏิบัติอันดับแรก คือ <strong>ส่งข่าวต่อไป</strong> (ไม่หยุดการสื่อสารทันที)</li>\n<li>หากถูกก่อกวนอย่างหนักจนใช้เสียงพูดไม่ได้ผล ให้ <strong>เปลี่ยนเป็นส่งด้วยรหัสมอร์ส (CW) แทนคำพูด</strong></li>\n<li>การรับรองฝ่าย (Authentication) กระทำ<strong>ทุกครั้งที่จำเป็น</strong> (เมื่อสงสัย เมื่อได้รับคำสั่ง หรือตามที่กำหนดใน SOI)</li>\n<li>สิ่งที่<strong>ไม่ใช่</strong>การปฏิบัติ ECCM ที่ถูกต้อง ได้แก่ <strong>การส่งตามตารางเวลาที่แน่นอน/คาดเดาได้</strong> (ทำให้ข้าศึกดักรับ/วิเคราะห์รูปแบบได้ง่าย) และการมองว่า \"ใช้กำลังส่งต่ำ\" คือมาตรการหลักในการลดปริมาณข่าวสาร (ที่จริงมาตรการลดปริมาณข่าวสารเน้นเรื่องรัดกุมของเนื้อหา ไม่ใช่การลดกำลังส่ง)</li>\n</ul>\n<h3>4.5 เอกสารและการวางแผน EW</h3>\n<ul>\n<li><strong>หัวข้อประมาณการ EW</strong>: ภารกิจ → สถานการณ์และหนทางปฏิบัติ → วิเคราะห์หนทางปฏิบัติ → เปรียบเทียบหนทางปฏิบัติ → ข้อเสนอแนะ</li>\n<li><strong>หัวข้อผนวก EW</strong> (รูปแบบคำสั่งยุทธการ 5 ย่อหน้า): สถานการณ์ → ภารกิจ → การปฏิบัติ → การบริการสนับสนุน → การบังคับบัญชาและการสื่อสาร</li>\n<li>ข้อมูลทำเนียบอิเล็กทรอนิกส์ของข้าศึกจะถูกรายงานอยู่ในส่วน <strong>\"สถานการณ์\"</strong> ของผนวก EW</li>\n<li>ผลจากการวางแผนต่อเนื่องและประมาณการฝ่ายอำนวยการด้าน EW คือ <strong>ผนวก EW</strong></li>\n<li>ผู้บังคับบัญชาสามารถทราบความเคลื่อนไหวด้าน EW <strong>หลังการปฏิบัติ</strong> ของหน่วยได้จาก<strong>รายงาน ECCM</strong></li>\n</ul>\n<h3>4.6 บทบาทของ EW ในยามปกติ</h3>\n<ul>\n<li>ในยามปกติ EW มีบทบาทหลักคือ <strong>หาตำแหน่งข้าศึกที่บุกรุก</strong> (เฝ้าตรวจ/แจ้งเตือน)</li>\n<li>ตัวอย่างการใช้งาน: <strong>AM/SSB</strong> มักใช้กับหน่วยลาดตระเวน เนื่องจากคุณสมบัติด้านระยะไกลและทนต่อการก่อกวนในระดับหนึ่ง</li>\n</ul>\n<div class=\"study-callout\"><div class=\"ctitle\">จุดที่ข้อสอบชอบออก</div><ul>\n<li>แยกความแตกต่าง ESM / ECM / ECCM และลำดับการปฏิบัติ (ESM มาก่อนเสมอ)</li>\n<li>แยก SIGINT / ELINT / COMINT ว่าอันไหนให้ข้อมูลอะไร (ทำเนียบกำลังรบ = COMINT, สัญญาณที่ไม่ใช่การสื่อสาร เช่น เรดาร์ = ELINT)</li>\n<li>ความแตกต่างการก่อกวน vs การลวง, การลวงเล่ห์ vs การลวงเลียน</li>\n<li>หัวข้อผนวก EW และประมาณการ EW (ต้องเรียงลำดับให้ถูก)</li>\n<li>มาตรการ ECCM เชิงป้องกันกับเชิงแก้ไข และข้อที่ \"ไม่ใช่\" มาตรการที่ถูกต้อง</li>\n</ul></div>\n<hr />\n<h2>5. การสื่อสารและเครื่องช่วยเดินอากาศ (Aviation Communication &amp; Navigation)</h2>\n<h3>5.1 ประเภทเครื่องสื่อสารบนอากาศยาน</h3>\n<p>เครื่องสื่อสารที่ติดตั้งบนอากาศยานแบ่งเป็น 2 ประเภทหลัก:</p>\n<ol>\n<li><strong>เครื่องสื่อสารการบิน (Avionics Communication)</strong> — ใช้ติดต่อด้วยคำพูดระหว่างอากาศยาน/ภาคพื้น</li>\n<li><strong>เครื่องช่วยเดินอากาศ (Avionics Navigation)</strong> — ใช้นำทาง/บอกตำแหน่ง</li>\n</ol>\n<ul>\n<li><strong>ระบบสื่อสารภายในอากาศยาน (Intercommunication)</strong> ใช้ติดต่อระหว่าง<strong>นักบินกับนักบินผู้ช่วยหรือเจ้าหน้าที่ประจำอากาศยาน</strong> (ไม่ใช่กับภายนอก)</li>\n<li>ระบบ <strong>VHF/FM ย่าน 30.00–87.975 MHz</strong> ใช้ติดต่อ <strong>อากาศยานกับอากาศยาน และอากาศยานกับหน่วยภาคพื้น</strong> (ทางยุทธวิธี)</li>\n<li>ระบบ <strong>UHF/AM ย่าน 225.000–399.875 MHz</strong> ใช้ติดต่อ <strong>อากาศยานกับอากาศยาน, อากาศยานกับหอบังคับการบิน หรือหน่วยทหารภาคพื้น</strong></li>\n<li>ภาษาที่ใช้ในการสื่อสารทางการบินสากล มีภาษาหลัก <strong>5 ภาษา</strong> คือ <strong>อังกฤษ ฝรั่งเศส เยอรมัน รัสเซีย จีน</strong> และอนุญาตให้ใช้ภาษาท้องถิ่นได้อีก 1 ภาษา</li>\n<li>ความถี่ฉุกเฉินสากลทางการบิน (Emergency) คือ <strong>121.500 MHz</strong>; สถานการณ์ฉุกเฉินแบ่งเป็น 2 ชนิด คือ <strong>เหตุที่จะก่อให้เกิดอันตรายถึงขั้นเสียชีวิต</strong> กับ <strong>เหตุที่ต้องการความเร่งด่วน</strong></li>\n</ul>\n<h3>5.2 วิธีการเดินอากาศ (Navigation Methods)</h3>\n<p>มี 3 วิธีหลัก:</p>\n<ol>\n<li><strong>Pilotage (Piloting)</strong> — ใช้แผนที่เดินอากาศครอบคลุมเส้นทางจากต้นทางถึงปลายทาง เป็นวิธีที่ทำได้ง่ายที่สุด ใกล้เคียงกับการบินแบบ <strong>VFR</strong> (มองเห็นพื้นเบื้องล่าง)</li>\n<li><strong>Dead Reckoning</strong> — บินด้วยทิศทาง (Heading) และความเร็วคงที่ พร้อมจับเวลาตลอดเส้นทาง คำนวณระยะทางด้วยสูตรฟิสิกส์ <strong>S = VT</strong> (S=ระยะทาง, V=ความเร็ว, T=เวลา) — ในอดีตวิธีนี้<strong>ไม่ค่อยแม่นยำ</strong> เพราะยังไม่มีการพยากรณ์อากาศ เครื่องบินจึงเสี่ยงถูกกระแสลมพัดออกนอกเส้นทาง</li>\n<li><strong>Radio Navigation</strong> — ใช้คลื่นวิทยุจากสถานีเครื่องช่วยเดินอากาศภาคพื้นดินและสัญญาณดาวเทียมช่วยนำร่อง มีความแม่นยำสูง นักบิน<strong>ไม่จำเป็นต้องมองเห็นพื้นเบื้องล่าง</strong></li>\n</ol>\n<h3>5.3 อุปกรณ์/ระบบเครื่องช่วยเดินอากาศ (Navigation Aids)</h3>\n<p>ระบบเครื่องช่วยการเดินอากาศ (Air Navigation Radio Aids) แบ่งเป็น 2 ประเภท:</p>\n<ul>\n<li><strong>Enroute Aids System</strong> — ให้ข้อมูลการเดินทางจากจุดหนึ่งไปอีกจุดหนึ่ง บอกตำแหน่ง/ทิศทางต้นทาง-ปลายทาง</li>\n<li><strong>Terminal Aids System</strong> — ช่วยเข้า-ออกสนามบิน</li>\n</ul>\n<p>ระบบสำคัญที่ต้องจำ:</p>\n<ul>\n<li><strong>VOR (VHF Omni-Range)</strong> — ระบบพื้นฐานของการนำร่องแบบอิเล็กทรอนิกส์ที่ใช้อยู่ในปัจจุบัน ทำงานในย่านความถี่ <strong>108.00–117.95 MHz</strong></li>\n<li><strong>DME (Distance Measuring Equipment)</strong> — วัดระยะทางจากสถานีภาคพื้นดินถึงอากาศยาน โดยส่งสัญญาณรหัสถาม-ตอบ (interrogation-reply) แล้วคำนวณระยะทางจากเวลาที่ใช้ไปกลับ</li>\n<li><strong>NDB (Non-Directional Beacon)</strong> หรือวิทยุประภาคาร — ส่งสัญญาณบอกทิศทาง/ตำแหน่งสถานีคร่าวๆ ให้นักบินนำอากาศยานเข้าสนามบินโดยเทียบกับเข็มทิศ</li>\n<li><strong>ADF (Automatic Direction Finding)</strong> — ใช้เข็มชี้ไปยังสถานีที่ส่งสัญญาณ (ทำงานร่วมกับระบบ <strong>HOMING</strong>) เพื่อนำอากาศยานบินเข้าหาสถานี — ข้อได้เปรียบของ ADF เหนือ VOR คือ <strong>การรับสัญญาณไม่จำกัดเฉพาะแนวเส้นตรงที่ไม่มีสิ่งกีดขวาง</strong> (เพราะใช้ความถี่ต่ำ-ปานกลางที่เลี้ยวเบนตามภูมิประเทศได้ดีกว่า)</li>\n</ul>\n<h3>5.4 ชุดวิทยุ/อุปกรณ์บนอากาศยานที่ควรจำ</h3>\n<table>\n<thead>\n<tr>\n<th>ชุดวิทยุ</th>\n<th>คุณลักษณะ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>C-1611/AIC</strong></td>\n<td>ชุดควบคุมการติดต่อภายในอากาศยาน (Intercom) ติดตั้งมากับ ฮ.212</td>\n</tr>\n<tr>\n<td><strong>AN/ARC-131</strong></td>\n<td>เบา, VHF/FM 30.00–75.95 MHz, air-to-air/air-to-ground; รองรับ RETRAN</td>\n</tr>\n<tr>\n<td><strong>AN/ARC-186</strong></td>\n<td>VHF AM/FM, รับ-ส่งคำพูดปกติและเข้ารหัส (Secure), 2 แบนด์ (AM+FM); ใช้ทดแทน AN/ARC-134, 131, 114, 115 ได้ด้วยชุด RETRO FIT โดยไม่ต้องแก้สายในเครื่องบิน</td>\n</tr>\n<tr>\n<td><strong>AN/ARC-114</strong></td>\n<td>รองรับ RETRAN เช่นเดียวกับ ARC-131</td>\n</tr>\n<tr>\n<td><strong>AN/ARC-73</strong></td>\n<td>VHF/AM, เครื่องรับและเครื่องส่งแยกเป็นคนละเครื่อง ควบคุมทุกอย่าง (เปิด-ปิด, เปลี่ยนความถี่, SQUELCH, ระดับเสียง) ที่ REMOTE CONTROL</td>\n</tr>\n<tr>\n<td><strong>AN/ARC-164</strong></td>\n<td>UHF/AM, air-to-air/air-to-ground, ติดตั้งบน ฮ.212 และ ฮ.โจมตี AH-1F</td>\n</tr>\n<tr>\n<td><strong>AN/ARC-159</strong></td>\n<td>UHF/FM, มีเครื่องรับช่วย <strong>Guard Receiver</strong> ความถี่คงที่ <strong>243.000 MHz</strong> สำหรับติดต่อในภาวะฉุกเฉิน</td>\n</tr>\n<tr>\n<td><strong>KX-175</strong></td>\n<td>VHF/AM NAV/COM ติดตั้งบน ฮ.206 ของ ทบ. มี 2 แบนด์ (COMM 1 แบนด์ + รับ NAV VOR/LOC 1 แบนด์)</td>\n</tr>\n<tr>\n<td><strong>AN/ARN-82, AN/ARN-144, KNR-630, KNR-63A</strong></td>\n<td>เครื่องรับสัญญาณ VOR ย่าน 108.00–117.95 MHz</td>\n</tr>\n</tbody>\n</table>\n<h3>5.5 ระบบเรดาร์การบินเบื้องต้น</h3>\n<ul>\n<li>ระบบเรดาร์ที่ใช้ในการบินแบ่งเป็น <strong>Primary Radar</strong> และ <strong>Secondary Radar</strong></li>\n<li><strong>Primary Radar</strong>: ส่งพลังงานเป็นห้วงสั้น (พัลส์) ออกไป เมื่อกระทบวัตถุ (เครื่องบิน) จะสะท้อนกลับมาที่สายอากาศ แสดงเป็นจุดบนจอ — <strong>มีปัญหากับเมฆหนา</strong> ซึ่งอาจบดบังสัญญาณ ทำให้ข้อมูลบนจอผิดพลาด</li>\n<li><strong>Secondary Radar</strong>: มีส่วนประกอบเพิ่มเติมจาก Primary คือ <strong>Decoder, Interrogator, และ Transponder</strong> — อุปกรณ์บนเครื่องบินที่ตอบสัญญาณที่ส่งมาจาก Interrogator โดยอัตโนมัติ คือ <strong>Transponder</strong>; อุปกรณ์ในห้องเรดาร์ภาคพื้นที่ควบคุม/แสดงสัญญาณ คือ <strong>Decoder และ Interrogator</strong></li>\n</ul>\n<div class=\"study-callout\"><div class=\"ctitle\">จุดที่ข้อสอบชอบออก</div><ul>\n<li>แยกย่านความถี่ VHF/FM (30–87.975 MHz) กับ UHF/AM (225–399.875 MHz) และผู้ใช้งานแต่ละระบบ</li>\n<li>แยก 3 วิธีเดินอากาศ (Pilotage/Dead Reckoning/Radio Navigation) และลักษณะเด่นแต่ละแบบ พร้อมสูตร S=VT</li>\n<li>แยกอุปกรณ์นำร่อง VOR / DME / NDB / ADF ว่าใช้งานต่างกันอย่างไร</li>\n<li>จับคู่ชื่อรุ่นวิทยุอากาศยาน (AN/ARC-xxx) กับคุณสมบัติเฉพาะตัว (ย่านความถี่ Guard Receiver การ RETRAN ได้)</li>\n<li>Primary vs Secondary Radar และองค์ประกอบ (Interrogator/Transponder/Decoder)</li>\n</ul></div>\n<hr />\n<h2>6. เรดาร์ (Radar)</h2>\n<h3>6.1 หลักการพื้นฐานของเรดาร์</h3>\n<ul>\n<li>คุณสมบัติของคลื่นที่ใช้ในการทำงานของเรดาร์ คือ <strong>การสะท้อน (Reflection)</strong> — เรดาร์ส่งพลังงานคลื่นแม่เหล็กไฟฟ้า (พัลส์) ออกไปกระทบเป้าหมายแล้วสะท้อนกลับมาที่สายอากาศ</li>\n<li><strong>ขั้วคลื่นแบบวงกลม (Circular Polarization)</strong> ช่วยลดสัญญาณกวน (Clutter) จากฝน (Rain Clutter) ได้ เนื่องจากเมื่อคลื่นกระทบหยดน้ำฝนแล้วสะท้อนกลับมา ทิศทางการเคลื่อนตัวของคลื่นจะเปลี่ยนไปจากเดิม ทำให้สายอากาศไม่รับคลื่นสะท้อนนั้น</li>\n</ul>\n<h3>6.2 การแปลงเวลาเป็นระยะทางของเรดาร์</h3>\n<ul>\n<li>ระยะทาง 1 ไมล์ทะเล มีค่าทางเวลาเท่ากับ <strong>6.18 ไมโครวินาที</strong> (ทางเดียว)</li>\n<li>1 \"เรดาร์ไมล์\" (ไป-กลับ) มีค่าเท่ากับ <strong>12.26 ไมโครวินาที</strong></li>\n<li>ตัวอย่างการคำนวณ: หากเรดาร์ส่งพัลส์กระทบเป้าหมายแล้วสะท้อนกลับมาแสดงบนจอใช้เวลา <strong>1,236 ไมโครวินาที</strong> แสดงว่าเป้าหมายอยู่ห่างจากเรดาร์ประมาณ <strong>100 ไมล์</strong> (นำเวลารวมหารด้วยค่าเรดาร์ไมล์ ≈ 12.36 μs/ไมล์)</li>\n</ul>\n<h3>6.3 ย่านความถี่เรดาร์ (Radar Frequency Bands)</h3>\n<table>\n<thead>\n<tr>\n<th>ย่านความถี่</th>\n<th>ช่วงความถี่</th>\n<th>ลักษณะการใช้งาน</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>UHF-BAND</strong></td>\n<td>ต่ำกว่า L-band</td>\n<td>ใช้กับเรดาร์ระยะไกลมากๆ เช่น Warning Radar ใช้กำลังส่งสูง สายอากาศขนาดใหญ่</td>\n</tr>\n<tr>\n<td><strong>L-BAND</strong></td>\n<td>~1–2 GHz</td>\n<td>ใช้กับควบคุมจราจรทางอากาศระยะไกล เพราะมีการลดทอนในบรรยากาศต่ำและไม่มีการลดทอนจาก Rain Clutter</td>\n</tr>\n<tr>\n<td><strong>S-BAND</strong></td>\n<td>2–4 GHz</td>\n<td>เรดาร์ติดตาม/ค้นหาระยะกลาง</td>\n</tr>\n<tr>\n<td><strong>C-BAND</strong></td>\n<td>4–8 GHz</td>\n<td>ใช้งานทั่วไป</td>\n</tr>\n<tr>\n<td><strong>X-BAND</strong></td>\n<td>8–12.5 GHz (บางแหล่งระบุ 8,000–12,500 MHz)</td>\n<td>ใช้งานกว้างขวางที่สุด เพราะขนาดอุปกรณ์เล็ก แยกแยะเป้าหมายได้ดี แต่มีปัญหาลดทอนสัญญาณในบรรยากาศและจาก Rain Clutter สูง; ใช้ในกิจการเรดาร์และสื่อสารดาวเทียมด้วย</td>\n</tr>\n<tr>\n<td><strong>KU-BAND</strong></td>\n<td>12–18 GHz</td>\n<td>เรดาร์อำนวยการยิงระยะใกล้</td>\n</tr>\n<tr>\n<td><strong>KA-BAND</strong></td>\n<td>27–40 GHz</td>\n<td>เรดาร์ค้นหาระยะใกล้ ความละเอียดสูง</td>\n</tr>\n</tbody>\n</table>\n<h3>6.4 เรดาร์ทางทหารที่ต้องจำ (ระบบ/คุณสมบัติ/ย่านความถี่/รัศมีทำการ)</h3>\n<table>\n<thead>\n<tr>\n<th>ชื่อเรดาร์</th>\n<th>หน้าที่/ลักษณะ</th>\n<th>ย่านความถี่</th>\n<th>รัศมี/ระยะทำการ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Flycatcher</strong></td>\n<td>เรดาร์ควบคุมการยิง ปตอ. ตรวจจับยานบินต่ำ (โหมดค้นหา = Ka-band, โหมดติดตามเป้าหมาย = X-band)</td>\n<td>ค้นหา: Ka-BAND / ติดตาม: X-BAND</td>\n<td>20 กม.</td>\n</tr>\n<tr>\n<td><strong>AN/TPQ-36</strong></td>\n<td>เรดาร์ค้นหาตำแหน่งที่ตั้งยิงปืนใหญ่/จรวดข้าศึก และช่วยปรับการยิง ป. ฝ่ายเรา</td>\n<td>X-BAND</td>\n<td>-</td>\n</tr>\n<tr>\n<td><strong>Field Guard</strong></td>\n<td>เรดาร์อำนวยการยิง ป. ขนาดกลาง ติดตามแนวกระสุนของฝ่ายเรา หาพิกัดตกกระทบ เปรียบเทียบกับข้อมูลที่ป้อนไว้ คำนวณปรับแก้ แล้วส่งคำสั่งยิงให้หมู่ปืนใหญ่จนถึงระดับกองพันโดยอัตโนมัติ</td>\n<td>KU-BAND</td>\n<td>-</td>\n</tr>\n<tr>\n<td><strong>LAADS</strong></td>\n<td>เรดาร์ป้องกันภัยทางอากาศระดับต่ำ ตรวจจับอากาศยานบินต่ำแล้วส่งข้อมูลให้ ปตอ.วิลแคน (เรดาร์ค้นหา)</td>\n<td>L-BAND</td>\n<td>60 กม.</td>\n</tr>\n<tr>\n<td><strong>DR 172 DV</strong></td>\n<td>เรดาร์ป้องกันภัยทางอากาศระดับต่ำ ระยะปานกลาง</td>\n<td>L-BAND</td>\n<td>140 กม.</td>\n</tr>\n<tr>\n<td><strong>RASIT</strong></td>\n<td>เรดาร์เฝ้าตรวจสนามรบ ช่วยปรับการยิง ป. ตรวจจับ ฮ./บ. ความเร็วต่ำ รถถัง ยานพาหนะ พลเดินเท้า</td>\n<td>X-BAND</td>\n<td>ไม่เกิน 30 กม.</td>\n</tr>\n<tr>\n<td><strong>EL/M2106</strong></td>\n<td>เรดาร์แจ้งเตือนภัยทางอากาศเฉพาะตำบล (ขนาดเล็ก) ตรวจจับอากาศยานบินต่ำ ความเร็ว 120 กม./ชม. – 2.6 มัค แสดงผลบนจอ LED</td>\n<td>L-BAND</td>\n<td>16 กม.</td>\n</tr>\n<tr>\n<td><strong>TYPE-513</strong></td>\n<td>เรดาร์เตือนภัย ปตอ. 57 มม. (เรดาร์เตือนภัยแบบ 3 มิติ) เรดาร์ระยะไกล เทคโนโลยีไส้หลอดสูญญากาศ (ค่อนข้างล้าสมัย) ส่งข้อมูลเป็นคำพูดให้พนักงานเรดาร์ควบคุมการยิง</td>\n<td>VHF-BAND</td>\n<td>200 กม.</td>\n</tr>\n<tr>\n<td><strong>TYPE-860</strong></td>\n<td>เรดาร์ควบคุมการยิง (ติดตามเป้าหมาย) สำหรับ ปตอ. 57 มม.</td>\n<td>S-BAND/X-BAND</td>\n<td>35 กม.</td>\n</tr>\n</tbody>\n</table>\n<h3>6.5 การจำแนกประเภทเรดาร์</h3>\n<ul>\n<li>เรดาร์<strong>เตือนภัยทางอากาศ</strong>: LAADS, DR 172 DV, RASIT (บางส่วน), EL/M2106, TYPE-513 — ส่วน <strong>Field Guard ไม่ใช่เรดาร์เตือนภัยทางอากาศ</strong> (เป็นเรดาร์อำนวยการยิงปืนใหญ่)</li>\n<li>เรดาร์<strong>ควบคุมการยิง</strong>: Flycatcher, TYPE-860, Field Guard, AN/TPQ-36</li>\n<li>เรดาร์<strong>เตือนภัยแบบ 3 มิติ</strong>: TYPE-513</li>\n</ul>\n<div class=\"study-callout\"><div class=\"ctitle\">จุดที่ข้อสอบชอบออก</div><ul>\n<li>จับคู่ชื่อเรดาร์ ↔ ย่านความถี่ ↔ รัศมีทำการ ให้ตรงกัน (มักมีตัวเลือกสลับย่านความถี่ / รัศมีของเรดาร์คนละตัวมาหลอก)</li>\n<li>คำนวณระยะทางจากเวลาสะท้อนกลับของพัลส์ (ใช้ค่า ~6.18 μs/ไมล์ทางเดียว หรือ ~12.26 μs/ไมล์ไป-กลับ)</li>\n<li>คุณสมบัติ X-band (นิยมใช้มากที่สุดแต่ลดทอนบรรยากาศสูง) เทียบกับ L-band (ใช้ระยะไกล ลดทอนต่ำ)</li>\n<li>แยกหน้าที่เรดาร์เตือนภัยทางอากาศ กับเรดาร์ควบคุมการยิง/อำนวยการยิง</li>\n</ul></div>\n<hr />\n<p><em>สรุปนี้จัดทำจากการวิเคราะห์ข้อสอบและเฉลยทั้ง 309 ข้อในคลังข้อสอบวิชา \"การสื่อสารประเภทวิทยุ\" เพื่อใช้เป็นแนวทางอ่านทบทวนก่อนสอบ ควรอ่านควบคู่กับตำรา/คู่มือทางเทคนิคของหน่วยเพื่อความถูกต้องครบถ้วนตามหลักวิชาอย่างเป็นทางการ</em></p>"}, {"subject": 2, "subjectTitle": "วิชาการสื่อสารประเภทสาย", "html": "<p>สรุปนี้สังเคราะห์จากคลังข้อสอบ 300 ข้อของวิชา \"การสื่อสารประเภทสาย\" โดยจัดกลุ่มเป็นหัวข้อความรู้ที่ต้องเข้าใจ ครอบคลุมทั้งเรื่องการวางแผนระบบสื่อสารทางสาย อุปกรณ์ชุมสาย/เครื่องโทรศัพท์สนาม สายและอุปกรณ์วางสาย ตลอดจนหลักการวิทยุถ่ายทอดและการแพร่กระจายคลื่น</p>\n<hr />\n<h2>1. แผนที่เส้นทางสาย (Wire Route Map)</h2>\n<p>แผนที่เส้นทางสายทำขึ้นเพื่อ <strong>ให้การติดตั้งระบบทางสายทำได้สะดวกและรวดเร็ว</strong> โดยอ้างอิงแผนที่ภูมิประเทศมาตราส่วน <strong>1:50,000</strong></p>\n<p><strong>สัญลักษณ์สำคัญ</strong></p>\n<ul>\n<li>ตัวอักษร <strong>C</strong> ที่ปรากฏบนแผนที่ (อยู่ที่คันธงของสัญลักษณ์หน่วย) หมายถึง \"จุดที่มีเครื่องสลับสาย\" ประจำอยู่ที่หน่วยนั้น</li>\n<li>จุดที่เป็น <strong>ทางร่วมทางแยกของสาย</strong> หรือจุดที่มีการวางสายรวมกันจำนวนมาก จะมี <strong>สัญลักษณ์จุดตรวจสาย</strong> กำกับไว้ เพื่อความสะดวกในการตรวจซ่อมสาย (หลักการกำหนดจุดตรวจสาย คือกำหนดตามจุดร่วม-จุดแยกต่าง ๆ)</li>\n<li><strong>วิธีการวางสายที่ปรากฏในแผนที่มี 3 แบบ</strong> คือ (1) เหนือศีรษะ (2) ระดับพื้นดิน (3) ฝังดิน — ไม่มี \"ลอดท่อ\" เป็นวิธีวางสายในระบบนี้</li>\n<li>บริเวณที่ต้อง<strong>วางสายเหนือศีรษะ</strong>โดยหลักคือ <strong>บริเวณที่ตั้งหน่วย</strong> (เพื่อไม่ให้กีดขวางการสัญจร/ยานพาหนะ)</li>\n<li>การวางสาย<strong>ข้ามลำน้ำ</strong> ใช้สัญลักษณ์เดียวกับ<strong>การวางสายฝังดิน</strong></li>\n<li>แผนที่เส้นทางสาย<strong>ไม่สามารถบอกได้</strong>ว่าสายเส้นใดเป็นวงจรใช้ร่วมหรือวงจรใช้เฉพาะ เพราะไม่มีสัญลักษณ์แยกไว้ (ต้องไปดูในบัญชีการใช้สาย)</li>\n</ul>\n<p><strong>ขอบเขตข้อมูลที่ใช้/ไม่ใช้</strong></p>\n<ul>\n<li>ข้อมูลที่<strong>ไม่นำมาใช้</strong>ในการทำแผนที่เส้นทางสาย เช่น ความสูงของภูมิประเทศ (เรื่องความสูงภูมิประเทศเป็นข้อมูลของการทำ Profile วิทยุถ่ายทอด ไม่ใช่แผนที่เส้นทางสาย)</li>\n<li>สิ่งที่<strong>ไม่เกี่ยวข้อง</strong>กับแผนที่เส้นทางสาย ได้แก่ เทคนิคการตัดต่อสาย และแผนผังระบบวิทยุถ่ายทอด</li>\n<li>แผนที่เส้นทางสาย<strong>มีความเกี่ยวข้อง</strong>กับบัญชีการใช้สายสนาม (ใช้ประกอบกันในการวางแผน)</li>\n<li>ต้องวางสายให้ครอบคลุม<strong>ทุกหน่วย</strong> ทั้งหน่วยดำเนินกลยุทธ์หลักและหน่วยสนับสนุน</li>\n<li><strong>ไม่แสดง</strong>เส้นทางการวางสายภายในที่ตั้งหน่วย เพราะถือเป็นหน้าที่ของตอนวางสาย/ตอนสื่อสารของหน่วยนั้นเอง</li>\n<li>การอ่านค่าตัวเลขจำนวนคู่สายบนแผนที่ โดยปกติ<strong>เริ่มอ่านจากจุดที่เป็น ทก.หลัก</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> มาตราส่วน 1:50,000, ความหมายสัญลักษณ์ตัว C, จำนวน/รายชื่อวิธีวางสาย 3 แบบ (และตัวลวงที่เติม \"ลอดท่อ\" เข้ามา), และประเด็นที่แผนที่นี้ \"บอกไม่ได้\" (วงจรใช้ร่วม/เฉพาะ, ความสูงภูมิประเทศ)</p>\n<hr />\n<h2>2. แผนผังการสื่อสารทางโทรศัพท์ (Telephone Communication Diagram)</h2>\n<p>แผนผังนี้ทำขึ้นเพื่อแสดง<strong>การเชื่อมต่อของเครื่องสลับสาย</strong>ระหว่างหน่วยต่าง ๆ โดย<strong>ไม่อ้างอิงมาตราส่วนแผนที่ที่ตายตัว</strong> (ข้อสอบระบุว่า \"ไม่มีข้อใดถูก\" ในเรื่องมาตราส่วน)</p>\n<p><strong>สิ่งที่ทราบได้จากแผนผัง</strong></p>\n<ul>\n<li>สัญลักษณ์เครื่องสลับสายที่แสดงตำแหน่งติดตั้งของแต่ละหน่วย (ตัวอักษร <strong>C</strong> ใต้สัญลักษณ์หน่วย คือสัญลักษณ์เครื่องสลับสาย)</li>\n<li>ตัวเลขคู่สาย เช่น \"(2 CH)\" หมายถึง <strong>จำนวนคู่สายที่เชื่อมต่อระหว่างเครื่องสลับสายกับตู้ชุมสายสนาม</strong></li>\n<li>จำนวนคู่สายที่วางให้กับหน่วยต่าง ๆ (ทราบได้จากตัวเลขคู่สายที่แสดงในแผนผัง)</li>\n<li>จำนวนคู่สายที่เชื่อมต่อกับระบบวิทยุถ่ายทอด (ทราบได้จากตัวเลขและตัวอักษรช่อง \"CH\" ที่แสดงในแผนผัง)</li>\n</ul>\n<p><strong>สิ่งที่ทราบไม่ได้จากแผนผัง</strong></p>\n<ul>\n<li>ระยะทางการติดต่อระหว่างหน่วย/ระยะทางระหว่างตู้สลับสาย</li>\n<li>จำนวนเครื่องโทรศัพท์สนามที่ใช้งานจริง</li>\n<li>หมายเลขโทรศัพท์ที่ต้องใช้ในการติดต่อ (เพราะแผนผังนี้แสดงเพียง \"รูปแบบการเชื่อมต่อของเครื่องสลับสาย\" เท่านั้น)</li>\n<li>แผนผังระบบเครือข่ายไม่ถือเป็นส่วนหนึ่งของแผนผังการสื่อสารทางโทรศัพท์</li>\n</ul>\n<p><strong>หลักการวางสายตามสายการบังคับบัญชา:</strong> พัน.ส.พล (กองพันทหารสื่อสารกองพล) จะต้องวางสายเชื่อมต่อวงจรเครื่องสลับสายให้กับ <strong>นขต. (หน่วยขึ้นตรง) ของกองพลที่ พัน.ส.พล ให้การสนับสนุน</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกให้ออกว่าอะไร \"ทราบได้\" กับ \"ทราบไม่ได้\" จากแผนผังนี้ — ตัวเลข CH บอกจำนวนคู่สาย แต่ไม่บอกระยะทาง/หมายเลขโทรศัพท์/จำนวนเครื่อง</p>\n<hr />\n<h2>3. บัญชีการใช้สายโทรศัพท์สนาม (Wire/Line Account)</h2>\n<p>บัญชีการใช้สายมีไว้เพื่อวางแผนปริมาณสาย/ล้อสายที่ต้องใช้ ไม่ใช่เพื่อบอกจุดตรวจซ่อมสาย (ประโยชน์ข้อนี้เป็นตัวลวงที่ออกบ่อย)</p>\n<p><strong>หลักการคำนวณระยะทางสาย</strong></p>\n<ul>\n<li>เวลาคำนวณระยะทางสาย ต้อง<strong>เผื่อการผูกสายเพื่อจัดเก็บสายให้เรียบร้อย 20%</strong> ของระยะทางที่วัดได้จริง</li>\n<li>สูตรจำนวนล้อสาย (ใช้กับล้อ <strong>RL-159/U</strong> ซึ่งบรรจุสาย WD-1/TT ยาว 1 ไมล์/ล้อ): นำระยะทาง (ไมล์) × 1.2 แล้วปัดขึ้นเป็นจำนวนเต็ม จะได้จำนวนล้อสายต่อ 1 คู่สาย จากนั้นคูณด้วยจำนวนคู่สายที่ต้องการวาง<ul>\n<li>ตัวอย่าง: ระยะทาง 20 ไมล์ วาง 1 คู่สาย → 20×1.2 = 24 ล้อ</li>\n<li>ตัวอย่าง: ระยะทาง 7 ไมล์ วาง 2 คู่สาย → 7×1.2 = 8.4 ปัดขึ้นเป็น 9 ล้อ/คู่สาย × 2 คู่สาย = 18 ล้อ</li>\n</ul>\n</li>\n</ul>\n<p><strong>ประเภทวงจรในบัญชีการใช้สาย</strong></p>\n<ul>\n<li><strong>วงจรผู้ใช้เฉพาะ</strong> คือวงจรที่ต่อแบบ <strong>Hotline</strong> (เฉพาะคู่สนทนา)</li>\n<li><strong>วงจรผู้ใช้ร่วม</strong> คือวงจรที่ต่อ<strong>ระหว่างเครื่องสลับสาย</strong> (ใช้ร่วมกันของผู้ใช้หลายคน)</li>\n<li>วงจรใช้ร่วม: ระยะทางต้อง<strong>ไม่เกิน 20 ไมล์</strong></li>\n<li>วงจรใช้เฉพาะ: หากระยะทางเกินระยะการติดต่อของอุปกรณ์ (เช่น 30 ไมล์) จะไม่สามารถนำโทรศัพท์ ETP-1 มาต่อใช้งานได้ เพราะเกินระยะการติดต่อ</li>\n</ul>\n<p><strong>หลักการวางสาย พัน.ส.พล:</strong> ต้องวางสายไปให้ นขต. ของกองพลที่ พัน.ส.พล ให้การสนับสนุนทุกหน่วย</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณจำนวนล้อสาย (ต้องจำสูตรเผื่อ 20% + ปัดขึ้น), ระยะทางสูงสุดของวงจรใช้ร่วม (20 ไมล์), และความหมายของ \"วงจรใช้ร่วม\" vs \"วงจรใช้เฉพาะ\"</p>\n<hr />\n<h2>4. แผนผังระบบเครือข่าย (Network Diagram) และการกำหนด IP Address</h2>\n<p>จัดทำขึ้นเพื่อให้รู้ว่าอุปกรณ์เครือข่ายแต่ละตัวต้องตั้งหมายเลข <strong>IP Address</strong> อย่างไร โดย<strong>ไม่อ้างอิงมาตราส่วนแผนที่</strong>เช่นกัน (ไม่ใช้ข้อมูลความถี่ที่ใช้ในพื้นที่)</p>\n<p><strong>หลักการเชื่อมต่อเครื่องสลับสาย ETEx ในปัจจุบัน:</strong> เชื่อมต่อกันด้วย <strong>LAN Network</strong>; อุปกรณ์ ETEx ทุกเครื่องในระบบเดียวกันต้องอยู่ <strong>IP Network เดียวกัน</strong></p>\n<p><strong>จำนวน IP ที่ต้องกำหนด</strong></p>\n<ul>\n<li>ETEx ของหน่วยระดับ<strong>กรม</strong>: กำหนด <strong>3 IP</strong></li>\n<li>ETEx (LAN Port) ของหน่วยระดับ<strong>กองพัน</strong>: กำหนด <strong>2 IP</strong></li>\n<li>IPX-600 (WAN Port) หากต้องการใช้ครบทุก Port: กำหนด <strong>5 IP</strong></li>\n<li>IPX-600 ต้องกำหนด IP รวม 3 ส่วน คือ <strong>Master IP, IP ของ LAN Port, และ IP ของ WAN Port</strong> — ต่างจาก ETEx ที่ต้องตั้ง IP น้อยกว่า (IPX-600 ตั้ง IP มากกว่า ETEx)</li>\n</ul>\n<p><strong>พื้นฐาน Subnet Mask ที่ควรจำ</strong></p>\n<ul>\n<li>/24 = Subnet Mask 255.255.255.0</li>\n<li>/16 = Subnet Mask 255.255.0.0</li>\n<li>/32 = Subnet Mask 255.255.255.255 (ใช้กับ IP เดี่ยว เช่น Master IP ของ IPX-600)</li>\n</ul>\n<p><strong>DHCP</strong></p>\n<ul>\n<li>ในเครือข่าย ETEx ต้องกำหนดให้เครื่อง ETEx <strong>เพียง 1 เครื่อง</strong> ในเครือข่ายเป็นตัวจ่าย DHCP</li>\n<li>ในเครือข่าย IPX-600 สามารถกำหนดให้ <strong>ทุกเครื่อง</strong>เป็นตัวจ่าย DHCP ก็ได้ ขึ้นอยู่กับการออกแบบระบบ (ยืดหยุ่นกว่า ETEx)</li>\n</ul>\n<p><strong>ข้อมูลที่ไม่ปรากฏในแผนผังระบบเครือข่าย</strong></p>\n<ul>\n<li>ของเครื่อง ETEx: <strong>หมายเลขโทรศัพท์</strong> ไม่ถูกกำหนดไว้ในแผนผังนี้ (เพราะเป็นข้อมูลของแผนผังวงจร)</li>\n<li>ของเครื่อง IPX-600: <strong>หมายเลข Prefix</strong> ไม่ถูกกำหนดไว้</li>\n<li>สัญลักษณ์ทางทหารไม่เกี่ยวข้องกับแผนผังระบบเครือข่ายของ IPX-600</li>\n</ul>\n<p>แผนผังระบบเครือข่ายมีความเกี่ยวข้องกับ<strong>แผนผังวงจร</strong> (ใช้ประกอบกัน)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวน IP ที่ต้องตั้งของแต่ละหน่วย/อุปกรณ์ (กรม 3 IP, กองพัน 2 IP, IPX-600 WAN 5 IP), หลักการ Subnet mask จาก CIDR, และความแตกต่างเรื่อง DHCP ระหว่าง ETEx กับ IPX-600</p>\n<hr />\n<h2>5. แผนผังวงจร (Circuit Diagram) และการวางแผนหมายเลขโทรศัพท์</h2>\n<p>แผนผังวงจรทำขึ้นเพื่อให้<strong>การต่อวงจรทางสายทำได้สะดวกและรวดเร็ว</strong> โดยไม่อ้างอิงมาตราส่วนแผนที่ตายตัว และไม่ใช้ข้อมูลพิกัดตำบลที่ตั้งของหน่วยดำเนินกลยุทธ์</p>\n<p><strong>การเชื่อมต่อ ETEx</strong></p>\n<ul>\n<li>เชื่อมต่อได้ <strong>2 แบบ</strong>: <strong>Single Channel</strong> และ <strong>Multi Channel</strong></li>\n<li>แบบ Single Channel มีหลักการเชื่อมต่อคือ <strong>FXO ต่อกับ FXS</strong></li>\n<li>หมายเลขโทรศัพท์ของ ETEx ตามค่าที่ออกแบบจากโรงงาน เป็นตัวเลข <strong>3 หลัก ช่วง 101–136</strong></li>\n<li>เลข <strong>Prefix</strong> ของ ETEx เป็นตัวเลข <strong>2 หลัก</strong> มีไว้เพื่อ<strong>ใช้เป็นเลขตัดออกไปหาเครื่องสลับสายอื่นที่อยู่ในเครือข่าย IP เดียวกัน</strong> เวลาโทรข้ามเครื่องสลับสาย</li>\n</ul>\n<p><strong>สัญลักษณ์ในแผนผังวงจร:</strong> ไม่มีการแสดง<strong>วิธีการวางสาย</strong> (เพราะเป็นข้อมูลที่อยู่ในแผนที่เส้นทางสายแทน) และไม่เกี่ยวข้องกับการอ่านแผนที่ หรือการทำ Path calculation</p>\n<p><strong>หมายเลขตู้ชุมสาย DX-111 (การวางแผนใช้งานหมายเลข)</strong></p>\n<ul>\n<li>หมายเลขของ <strong>ผบ.พล</strong> ลงท้ายด้วยเลข <strong>6</strong></li>\n<li>หมายเลขของ <strong>รอง ผบ.พล</strong> ลงท้ายด้วยเลข <strong>5</strong></li>\n<li>หมายเลขของ <strong>ศูนย์ข่าว/ตอนศูนย์ข่าว</strong> ลงท้ายด้วยเลข <strong>9</strong></li>\n</ul>\n<p><strong>การวางแผนแผนผังวงจรของ พัน.ส.พล:</strong> เชื่อมต่อวงจรทางสายให้ทุกหน่วย ทั้งหน่วยดำเนินกลยุทธ์หลักและหน่วยสนับสนุนของกองพล และต้องจัดทำ <strong>บัญชีการใช้หมายเลขโทรศัพท์</strong> ประกอบเพื่อให้แผนผังใช้งานได้สมบูรณ์ (เช่นเดียวกับแผนผังเส้นทางสาย แผนผังวงจรก็<strong>ไม่แสดง</strong>เส้นทางวางสายภายในที่ตั้งหน่วย)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> หลักการ FXO-FXS ของ Single Channel, ความหมาย/จำนวนหลักของ Prefix, ช่วงหมายเลขโรงงานของ ETEx (101–136), และเลขท้ายเฉพาะของ ผบ.พล/รอง ผบ.พล/ศูนย์ข่าวใน DX-111</p>\n<hr />\n<h2>6. Profile และการคำนวณ Path Calculation ของระบบวิทยุถ่ายทอด</h2>\n<p><strong>Profile</strong> คือแผนภาพภาคตัดขวางภูมิประเทศ ทำขึ้นเพื่อ<strong>วิเคราะห์ภูมิประเทศที่จะติดตั้งสถานีวิทยุถ่ายทอด</strong> โดยใช้กระดาษ Profile อ้างอิงแผนที่มาตราส่วน <strong>1:50,000</strong> เช่นเดียวกับแผนที่เส้นทางสาย</p>\n<ul>\n<li>การทำ Profile แบบ Manual <strong>ไม่ใช้ข้อมูลความถี่วิทยุถ่ายทอด</strong> เป็นข้อมูลนำเข้า (ใช้ข้อมูลภูมิประเทศ/ความสูง/ระยะทางแทน)</li>\n<li>ถ้าภูมิประเทศเป็นที่โล่งแจ้ง ระยะห่างระหว่างคู่สถานีควร<strong>ไม่เกิน 40-50 กม.</strong></li>\n</ul>\n<p><strong>Path Calculation</strong> ทำขึ้นเพื่อ<strong>ประเมินว่าระบบวิทยุถ่ายทอดมีความน่าเชื่อถือ (Reliability) เพียงใด</strong> ข้อมูลที่<strong>ไม่ใช้</strong>ในการคำนวณ Path Calculation คือ \"สิ่งกีดขวางในแนวการแพร่กระจายคลื่น\" (เพราะเรื่องสิ่งกีดขวางถูกวิเคราะห์แยกไว้แล้วในขั้นตอนการทำ Profile)</p>\n<p><strong>ค่าและสูตรสำคัญที่ต้องจำ</strong></p>\n<ul>\n<li><strong>Free Space Loss (Ao)</strong> คือค่าความสูญเสียของสัญญาณในอากาศ ในสภาวะที่ไม่มีสิ่งกีดขวางใด ๆ<ul>\n<li>สูตร: <strong>Ao = 32.44 + 20logD + 20logF</strong> (D = ระยะทาง, F = ความถี่)</li>\n</ul>\n</li>\n<li><strong>System Value (SV)</strong><ul>\n<li>สูตร: <strong>SV = (Po - Pi) + 2G + 2L</strong> (Po = กำลังส่งออก, Pi = ระดับสัญญาณรับต่ำสุดที่ยอมรับได้, G = อัตราขยายสายอากาศ, L = ความสูญเสียสายนำสัญญาณ)</li>\n</ul>\n</li>\n<li>ความสูญเสียสูงสุดในสายนำสัญญาณ (Feed loss) ของเครื่องวิทยุถ่ายทอด <strong>RL-432A = -4.9 dB</strong></li>\n</ul>\n<p><strong>Fresnel Zone:</strong> หากมีสิ่งกีดขวางความหนาแน่นสูง (เช่น ตึกหรือสิ่งปลูกสร้าง) มาบัง Fresnel zone เกิน 40% จะส่งผลกระทบต่อคุณภาพสัญญาณในหลายด้าน (สัญญาณอ่อนลง/ไม่เสถียร)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ท่องสูตร Ao และ SV ให้แม่น (มักถามแบบเลือกสูตรที่ถูกจากตัวเลือกกวน), ความแตกต่างระหว่างสิ่งที่ Profile วิเคราะห์ (ภูมิประเทศ/สิ่งกีดขวาง) กับสิ่งที่ Path Calculation ประเมิน (ความน่าเชื่อถือของระบบ)</p>\n<hr />\n<h2>7. แผนผังระบบวิทยุถ่ายทอด และหลักการวางระบบ Relay</h2>\n<p>แผนผังนี้แสดงโครงข่ายวิทยุถ่ายทอดทั้งหมด และต้องมี<strong>นามเรียกขาน</strong>สำหรับวิทยุถ่ายทอดของแต่ละสถานี เพื่อใช้ติดต่อกันภายในข่ายวิทยุถ่ายทอด ข้อมูลที่<strong>ไม่แสดง</strong>ในแผนผังนี้คือ <strong>ค่าความเชื่อถือได้ของระบบ</strong> (ค่านี้มาจาก Path Calculation ซึ่งเป็นเอกสารแยกต่างหาก) การทำแผนผังระบบวิทยุถ่ายทอดให้สมบูรณ์ใช้งานได้จริง ต้องทำ <strong>Profile และ Path Calculation ประกอบ</strong></p>\n<p><strong>สถานีกลางทาง (Relay Station)</strong></p>\n<ul>\n<li>จัดตั้งขึ้นเมื่อ<strong>ต้องการเพิ่มระยะการติดต่อ หรือเพื่อหลีกเลี่ยงสิ่งกีดขวาง</strong></li>\n<li>สถานี Relay 1 จุด ใช้วิทยุถ่ายทอด <strong>2 เครื่อง</strong> ต่อกันด้วย<strong>สายสัญญาณ</strong> (Baseband/IF cable) เพื่อส่งสัญญาณต่อจาก Hop หนึ่งไปยังอีก Hop หนึ่ง</li>\n</ul>\n<p><strong>ตัวอย่างการคำนวณจำนวนอุปกรณ์ (RL-420 กับตู้ชุมสาย DX-111)</strong></p>\n<ul>\n<li>DX-111 1 เครื่องต่อวิทยุถ่ายทอดได้สูงสุด <strong>4 เครื่อง</strong> (ใช้ Port 1, 2, 3 และ EXT PORT)</li>\n<li>ถ้ามี 4 เส้นทางหลัก → ใช้วิทยุถ่ายทอด 4 เครื่อง</li>\n<li>ถ้ามี 5 เส้นทางหลัก (เกินความจุ 4 พอร์ตของตู้เดียว) → ต้องใช้ตู้ชุมสาย 3 เครื่องเพื่อรองรับ (แบ่งภาระ)</li>\n</ul>\n<p><strong>ระบบเสริม</strong> คือระบบที่ช่วยให้ระบบวิทยุถ่ายทอดที่สร้างขึ้นมีความน่าเชื่อถือมากขึ้น (เช่น เส้นทางสำรอง)</p>\n<p><strong>การวางระบบระหว่างหน่วยหลักและหน่วยรอง:</strong> วางระบบ<strong>จากหน่วยหลักไปหน่วยรอง</strong> เป็นหลัก</p>\n<p><strong>การควบคุมกำลังออกอากาศ</strong> ให้เหมาะสมกับระยะการติดต่อระหว่างคู่สถานี มีข้อดีหลายด้าน (ประหยัดพลังงาน ลดโอกาสถูกดักรับ ลดสัญญาณรบกวนสถานีอื่น)</p>\n<p><strong>การกำหนดมุมทิศแผงสายอากาศของคู่สถานี</strong></p>\n<ul>\n<li>คู่สถานีต้องหันแผงสายอากาศเข้าหากันเสมอ โดยมุมทิศต่างกัน <strong>180 องศา</strong></li>\n<li>กฎ: ถ้าสถานี ก. ใช้มุมทิศ<strong>น้อยกว่า 180 องศา</strong> สถานี ข. ต้องใช้มุมทิศ = มุมทิศสถานี ก. <strong>บวก 180 องศา</strong></li>\n<li>ตัวอย่าง: ก. = 120° → ข. = 300°; ก. = 160° → ข. = 340°</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์คำนวณจำนวนวิทยุถ่ายทอด/ตู้ชุมสายจากจำนวนเส้นทางหลัก, โจทย์คำนวณมุมทิศคู่สถานี (บวก/ลบ 180 องศา), และเหตุผลของการตั้งสถานี Relay</p>\n<hr />\n<h2>8. พื้นฐานเครื่องโทรศัพท์และระบบไฟเลี้ยง (LB / CB / CBS)</h2>\n<p><strong>หลักการทำงานพื้นฐาน:</strong> เครื่องโทรศัพท์เปลี่ยนสัญญาณเสียงเป็นสัญญาณไฟฟ้าทางภาคส่ง (Transmitter) และเปลี่ยนสัญญาณไฟฟ้ากลับเป็นสัญญาณเสียงทางภาครับ (Receiver)</p>\n<p><strong>ประเภทโทรศัพท์ตามกำลังงาน มี 2 ประเภท</strong></p>\n<ol>\n<li><strong>กำลังงานเสียง</strong> (Sound-powered) — ไม่ต้องใช้แบตเตอรี่หรือไฟภายนอก เช่น TA-1/PT</li>\n<li><strong>กำลังงานไฟฟ้า</strong> (Power-powered) — ต้องอาศัยไฟเลี้ยงจากแบตเตอรี่/ตู้ชุมสาย เช่น TA-312/PT</li>\n</ol>\n<p><strong>ระบบโทรศัพท์ 3 ระบบ (แบ่งตามแหล่งจ่ายไฟเลี้ยงวงจรปากพูดและวงจรกระดิ่ง/ไฟเรียก)</strong>\n| ระบบ | ไฟเลี้ยงวงจรปากพูดหูฟัง | ไฟเลี้ยงวงจรกระดิ่ง/ไฟเรียก |\n|---|---|---|\n| <strong>LB (Local Battery)</strong> | แบตเตอรี่ประจำเครื่อง | เครื่องกำเนิดไฟชนิดมือหมุนที่ตัวเครื่อง (ไฟสลับ) |\n| <strong>CB (Common Battery)</strong> | จากตู้สลับสายกลาง | จากตู้สลับสายกลาง (ทั้งคู่มาจากศูนย์กลาง) |\n| <strong>CBS (Common Battery Signaling)</strong> | แบตเตอรี่ประจำเครื่อง | จากเครื่องสลับสาย (ผสมกัน) |</p>\n<ul>\n<li>เครื่องโทรศัพท์พื้นฐานที่ใช้ภายใน ทบ. ปัจจุบันเป็นประเภท <strong>CB</strong></li>\n<li>ส่วนประกอบของโทรศัพท์กำลังงานไฟฟ้าแบบ CB <strong>ไม่มีแบตเตอรี่</strong> ในตัวเครื่อง เพราะไฟเลี้ยงมาจากตู้ชุมสายกลางทั้งหมด</li>\n</ul>\n<p><strong>ส่วนประกอบ/การทำงานย่อย</strong></p>\n<ul>\n<li><strong>Hook Switch</strong> ทำหน้าที่ตัดต่อวงจรระหว่างวงจร Ringing (กระดิ่งเรียก) กับวงจรปากพูดหูฟัง</li>\n<li>การยกหูโทรศัพท์ขึ้น (ได้ยินเสียง Dial Tone) เรียกว่า <strong>Off Hook</strong></li>\n<li>กระดิ่งเครื่องโทรศัพท์ในปัจจุบันมีใช้งาน 3 แบบ (ไม่รวมแบบ Crystal Ringer ซึ่งไม่ใช่แบบที่ใช้งานจริงในระบบนี้)</li>\n</ul>\n<p><strong>ประวัติความเป็นมา</strong></p>\n<ul>\n<li>ผู้ประดิษฐ์โทรศัพท์เครื่องแรกของโลก (ตามบันทึก) คือ <strong>อเล็กซานเดอร์ แกรแฮม เบล</strong></li>\n<li>ประเทศไทยนำโทรศัพท์มาใช้ครั้งแรกในสมัย <strong>รัชกาลที่ 5</strong> โดย<strong>กรมกลาโหม</strong>เป็นผู้รับผิดชอบ วัตถุประสงค์เพื่อแจ้งข่าวเรือเข้า-ออกในแม่น้ำเจ้าพระยาให้กรุงเทพทราบ และเพื่อความมั่นคง</li>\n<li>ปี พ.ศ. 2429 กรมกลาโหมโอนกิจการโทรศัพท์ให้กรมไปรษณีย์โทรเลขดูแล ทำให้ประชาชนมีโอกาสได้ใช้ระบบโทรศัพท์แบบ <strong>Magneto หรือ Local Battery (LB)</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกแหล่งไฟเลี้ยงของ LB/CB/CBS ให้ถูกต้อง (เป็นหัวข้อที่ออกซ้ำหลายแบบ ทั้งถามตรงและถามผ่านเครื่อง TA-312/PT), หน้าที่ Hook Switch, และความรู้ประวัติศาสตร์ (ผู้ประดิษฐ์ / ปีที่ไทยเริ่มใช้ / หน่วยงานที่รับผิดชอบ)</p>\n<hr />\n<h2>9. ระเบียบและประเภทโทรศัพท์ถาวรของกองทัพบก</h2>\n<p>ตามระเบียบกองทัพบก ว่าด้วยการติดตั้ง การใช้ การโยกย้าย การโอน และการซ่อมบำรุงโทรศัพท์ถาวรของกองทัพบก พ.ศ. 2562 แบ่งประเภทโทรศัพท์ถาวรออกเป็น <strong>5 ประเภท</strong> ได้แก่ ก. ข. ค. ง. และ จ. โดยที่สำคัญ:</p>\n<ul>\n<li><strong>ประเภท ข.</strong> คือโทรศัพท์ที่ใช้งานภายในหน่วยงานตามที่กองทัพบกกำหนด</li>\n<li><strong>ประเภท จ.</strong> คือ<strong>โทรศัพท์เคลื่อนที่ที่เช่าใช้จากผู้ให้บริการ</strong> (มือถือที่หน่วยเช่าใช้)</li>\n</ul>\n<p>การใช้โทรศัพท์ถาวรในส่วนราชการของกองทัพบก มีข้อห้ามหลายประการตามระเบียบฯ (ข้อสอบมักออกแบบ \"ถูกทุกข้อ\" เมื่อถามภาพรวมข้อห้าม)</p>\n<p><strong>ตัวย่อ/รหัสที่ควรจำ</strong></p>\n<ul>\n<li><strong>MDF</strong> ย่อมาจาก <strong>Main Distribution Frame</strong> (แผงกระจายสายหลักที่ใช้เชื่อมต่อสายจากภายนอกเข้าสู่ระบบชุมสาย)</li>\n<li>หมายเลขรหัสที่ใช้โทรจาก ทบ. ไปยังหมายเลขโทรศัพท์ของกระทรวงมหาดไทย คือ <strong>089</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนประเภทโทรศัพท์ถาวร (5 ประเภท) และนิยามของแต่ละประเภท โดยเฉพาะประเภท ข. กับ จ. ที่ออกซ้ำบ่อยที่สุด, ความหมายคำย่อ MDF</p>\n<hr />\n<h2>10. ระบบชุมสายโทรศัพท์ (SPC) และกระแสไฟเลี้ยงสาย</h2>\n<p>ระบบชุมสายโทรศัพท์ในปัจจุบันใช้แบบ <strong>SPC (Stored Program Control) / IPBX</strong></p>\n<ul>\n<li>ระบบ SPC คือระบบที่<strong>นำคอมพิวเตอร์มาเป็นหัวใจในการทำงาน</strong> ทำงานได้อย่างรวดเร็ว โดยลำดับขั้นตอนการทำงานถูกบันทึกไว้ใน<strong>หน่วยความจำของชุมสาย</strong></li>\n<li>ข้อดีของชุมสายระบบ SPC มีครบทุกด้าน (ความเร็ว ความแม่นยำ ความยืดหยุ่นในการขยายระบบ)</li>\n<li>ข้อดีของโทรพิมพ์ (Teletype) ก็มีครบทุกด้านเช่นกันตามข้อสอบ (บันทึกข้อความเป็นลายลักษณ์อักษร ส่งได้ระยะไกล ไม่ผิดเพี้ยนจากเสียงรบกวน)</li>\n</ul>\n<p><strong>กระแสไฟเลี้ยงสายโทรศัพท์</strong></p>\n<ul>\n<li>กระแสไฟฟ้าที่จ่ายมากับสายโทรศัพท์คือ <strong>-48 VDC</strong> (ไฟฟ้ากระแสตรง)</li>\n<li>เหตุผลที่ใช้ไฟกระแสตรง (ไม่ใช่ไฟสลับ) คือ <strong>เพื่อป้องกันมิให้เกิดอันตรายกับผู้ใช้งาน</strong></li>\n</ul>\n<p><strong>โครงข่ายท้องถิ่น (Local Network):</strong> คือโครงข่ายที่ติดต่อกัน<strong>ภายในจังหวัด</strong> (เป็นระดับโครงข่ายที่เล็กที่สุดในระบบโทรศัพท์สาธารณะ)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวเลขแรงดันไฟเลี้ยงสาย -48 VDC และเหตุผลด้านความปลอดภัย, หลักการของระบบ SPC (คอมพิวเตอร์ + หน่วยความจำ), นิยามโครงข่ายท้องถิ่น</p>\n<hr />\n<h2>11. ตู้ชุมสายสนามอัตโนมัติ DX-111</h2>\n<p>DX-111 เป็นตู้ชุมสายสนามอัตโนมัติที่ต่อใช้งานโทรศัพท์ได้ <strong>16 คู่สาย</strong> ทุกครั้งที่ใช้งานต้องต่อสายดินที่หมุด <strong>Ground</strong></p>\n<p><strong>การตั้งค่าพื้นฐาน</strong></p>\n<ul>\n<li>การตั้งหมายเลขตู้ชุมสาย: เข้าไปที่ <strong>START MENU</strong> เลื่อนเคอร์เซอร์ไปที่ <strong>OWN X=___</strong> กรอกหมายเลข แล้วกดบันทึกด้วยปุ่ม <strong>EXEC</strong></li>\n<li>ปุ่มลบข้อความในบรรทัดที่เคอร์เซอร์อยู่ทั้งบรรทัด คือ <strong>Space ร่วมกับ EXEC</strong></li>\n<li>MENU <strong>C34<
