/strong> ใช้สำหรับโปรแกรมการทำ Hotline ให้เครื่องโทรศัพท์</li>\n<li>MENU <strong>I2</strong> ใช้สำหรับดูจำนวนตู้ DX-111 ที่ต่อใช้งานอยู่ใน LOOP เดียวกัน</li>\n<li>MENU <strong>C2</strong> ใช้ตั้งค่า EXT ให้เป็น Y/N และ PORT BIT RATE (ไม่ใช่ที่ MENU C11)</li>\n<li>MENU <strong>C32</strong> ใช้ตั้งหมายเลข prefix ของแต่ละ EXT, MENU <strong>C31</strong> ใช้โปรแกรม NETW=SUB</li>\n<li>MENU <strong>C33</strong> ใช้ตั้งค่า BARRING/PASSIVATION — ถ้า BARRING=Y และ PASSIVATION=N หมายความว่า <strong>ไม่สามารถโทรออกนอก LOOP ได้ แต่โทรภายใน LOOP ได้</strong></li>\n</ul>\n<p><strong>HOTLINE 2 แบบ</strong></p>\n<ul>\n<li><strong>แบบที่ 1 (NORM/Normal):</strong> เมื่อยกหูจะโทรถึงคู่ Hotline ทันที Subscriber เครื่องอื่นสามารถโทรเข้ามาที่เครื่องคู่ Hotline ได้ แต่ 2 เครื่องที่เป็นคู่ Hotline โทรออกไปยังเครื่องอื่นไม่ได้</li>\n<li><strong>แบบที่ 2 (TO/Time Out):</strong> เมื่อยกหูจะมีเวลา 5 วินาทีให้กดหมายเลขอื่นได้ ถ้าเลย 5 วินาทีโดยไม่กดเลข ตู้ชุมสายจะเปลี่ยนไปทำงานแบบที่ 1 อัตโนมัติ</li>\n</ul>\n<p><strong>การจัดลำดับความสำคัญสาย (Priority):</strong> ค่า MAX OUTPRI (ลำดับการโทรออกสูงสุด) และ MIN INPRI (ลำดับการรับสายต่ำสุดที่ยอมรับ) ใช้กำหนดว่า EXT ใดโทรหา EXT ใดได้บ้าง — ถ้า OUTPRI ของผู้โทรไม่เพียงพอเทียบกับ MIN INPRI ของปลายทาง จะโทรเข้าไม่ได้</p>\n<p><strong>การเชื่อมต่อขยายระบบ</strong></p>\n<ul>\n<li>DX-111 1 เครื่อง เชื่อมต่อวิทยุถ่ายทอดได้สูงสุด <strong>4 เครื่อง</strong> (Port 1, 2, 3 และ EXT PORT)</li>\n<li>1 LOOP สามารถเชื่อมต่อ DX-111 ได้ <strong>ประมาณ 10-11 เครื่อง</strong></li>\n<li>การทำ 2 LOOP ต้องใช้ DX-111 อย่างน้อย <strong>2 เครื่อง</strong></li>\n<li>ระบบแทรกสาย (Intrusion): โทรศัพท์เครื่องที่ 3 สามารถแทรกเข้าไปในการสนทนาของเครื่องที่ 1 และ 2 ได้ เมื่อเครื่องที่ 3 วางหู เครื่องที่ 1 และ 2 จะกลับมาคุยกันต่อได้ตามปกติ</li>\n</ul>\n<p><strong>ส่วนแสดงผล</strong></p>\n<ul>\n<li>จอภาพใหญ่ด้านซ้ายมือ: เป็นสื่อกลางระหว่างมนุษย์กับเครื่อง (แสดงเมนู/การตั้งค่า)</li>\n<li>จอภาพเล็กด้านขวามือ: แสดงหมายเลขโทรศัพท์ของพนักงานที่มีการเรียกเข้ามาและออกไปยังตู้ชุมสายอื่น</li>\n</ul>\n<p><strong>ระยะทางเชื่อมต่อจากแผง ELT ถึงผู้ใช้งาน</strong></p>\n<ul>\n<li>โทรศัพท์ระบบ <strong>Analog</strong>: ระยะทางประมาณ <strong>7-10 กม.</strong></li>\n<li>โทรศัพท์ระบบ <strong>Digital</strong>: ระยะทางประมาณ <strong>5-8 กม.</strong></li>\n</ul>\n<p><strong>การลบหมายเลขจากเครื่องโทรศัพท์</strong> (ใช้ได้กับทั้ง DX-200B และ IPX-600): เรียกว่า <strong>De-Affiliation</strong></p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ความจุ 16 คู่สาย, ความแตกต่างระหว่าง HOTLINE แบบ NORM กับ TO, จำนวนเครื่องสูงสุดที่เชื่อมต่อได้ในแต่ละบริบท (วิทยุถ่ายทอด 4 เครื่อง, LOOP ละ 10-11 เครื่อง), และตำแหน่ง MENU ต่าง ๆ (C2, C31, C32, C33, C34, I2) ที่มักสลับกันเป็นตัวลวง</p>\n<hr />\n<h2>12. เครื่องสลับสายตระกูล ETE-X (ETE-C, ETE-S, ETE-M)</h2>\n<p>ตระกูล ETE-X ในปัจจุบันประกอบด้วย <strong>ETE-C, ETE-S, ETE-M</strong> (ไม่มี \"ETE-L\" อยู่ในตระกูลนี้ — เป็นตัวลวงที่ออกบ่อย)</p>\n<table>\n<thead>\n<tr>\n<th>รุ่น</th>\n<th>ขนาด (คู่สาย)</th>\n<th>ใช้แทนรุ่นเก่า</th>\n<th>ใช้กับหน่วยระดับ</th>\n<th>คุณสมบัติพิเศษ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ETE-C</strong></td>\n<td>8 คู่สาย</td>\n<td>SB-993</td>\n<td>กองร้อย</td>\n<td>ไม่มีหมุดต่อ FXO</td>\n</tr>\n<tr>\n<td><strong>ETE-S</strong></td>\n<td>12 คู่สาย</td>\n<td>SB-22</td>\n<td>กองพัน</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>ETE-M</strong></td>\n<td>36 คู่สาย</td>\n<td>SB-86</td>\n<td>กองพล</td>\n<td>ไม่มีแบตสำรอง, มีขั้วเชื่อม LAN 3 ขั้ว, ไม่มีเป้สะพายหลังเป็นส่วนประกอบชุด, รองรับโทรศัพท์ IP รุ่น ETP-3 ได้ 3 เครื่อง</td>\n</tr>\n</tbody>\n</table>\n<p><strong>ข้อมูลทั่วไปของ ETE-X</strong></p>\n<ul>\n<li><strong>LDF</strong> แต่ละสายมี <strong>12 FXS</strong></li>\n<li>เมื่อเปิดเครื่อง ETE-X ขึ้นมา ต้องรออีก <strong>4 นาที</strong> จึงจะสามารถใช้งานเครื่องได้ (เวลาบูตระบบ)</li>\n<li>ไฟแสดงสถานะ LED สีแดง<strong>กระพริบ</strong> หมายถึง \"ใช้ไฟจากแบตเตอรี่และกำลังใกล้จะหมด\"</li>\n<li>สายของพอร์ต <strong>FXS</strong> สามารถใช้สื่อสารได้ไกลสุดประมาณ <strong>20 กม.</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่ ETE-C/S/M กับขนาดคู่สาย, รุ่นเก่าที่ถูกแทนที่ (SB-993/SB-22/SB-86), และหน่วยระดับที่ใช้งาน — เป็นชุดข้อมูลที่ออกซ้ำในรูปแบบต่าง ๆ หลายข้อ ต้องจำให้แม่นทั้ง 3 มิติพร้อมกัน</p>\n<hr />\n<h2>13. ตู้ชุมสายสนามระบบ IP: IPX-600, DX-200B, CPX-200/DMU-220</h2>\n<p><strong>IPX-600</strong> คือ<strong>ตู้ชุมสายสนามแบบ IP</strong></p>\n<ul>\n<li>ต่อโทรศัพท์ Analog ใช้งานได้ <strong>11 คู่สาย</strong> (แม้เป็นตู้ชุมสายแบบ IP แต่ก็ยังมีคู่สายที่เป็น Analog รองรับได้)</li>\n<li>การสร้าง Network ภายในเครื่อง ใช้ <strong>Port LAN</strong> ในการเชื่อมต่อ</li>\n<li>การตั้งค่าต่าง ๆ ของเครื่อง ทำได้โดยต่อสายจาก <strong>Port Terminal</strong> และใช้โปรแกรม <strong>CMS</strong></li>\n<li>มี <strong>PORT WAN จำนวน 5 พอร์ต</strong></li>\n<li>มี <strong>PORT ที่ใช้งาน TDM จำนวน 3 พอร์ต</strong></li>\n</ul>\n<p><strong>DX-200B</strong></p>\n<ul>\n<li>ใช้การ Multiplex แบบ <strong>TDM-DM</strong></li>\n<li>สามารถลบหมายเลขโดยกดจากเครื่องโทรศัพท์ได้ด้วยวิธี <strong>De-Affiliation</strong> (เช่นเดียวกับ IPX-600)</li>\n</ul>\n<p><strong>CPX-200 / DMU-220</strong></p>\n<ul>\n<li>CPX-200 1 เครื่องสามารถเชื่อมต่อกับ DMU-220 ได้สูงสุด <strong>10 เครื่อง</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำนวนคู่สาย Analog ของ IPX-600 (11 คู่สาย), จำนวน Port WAN (5) และ Port TDM (3) ของ IPX-600, และคำว่า De-Affiliation ที่ใช้ร่วมกันทั้ง DX-200B และ IPX-600</p>\n<hr />\n<h2>14. เครื่องโทรศัพท์สนาม (TA-1/PT, TA-312/PT, TA-312/M2E, ETP-1, ETP-X)</h2>\n<p><strong>TA-1/PT</strong></p>\n<ul>\n<li>เป็นโทรศัพท์<strong>กำลังงานเสียง</strong> (ไม่ต้องใช้ไฟ)</li>\n<li>ใช้งานในหน่วยระดับ<strong>หมวด</strong></li>\n<li>ต่อกับเครื่องสลับสาย SB-993/GT ได้เลยโดย<strong>ไม่จำเป็นต้องปรับระบบ</strong>ใด ๆ</li>\n</ul>\n<p><strong>TA-312/PT</strong></p>\n<ul>\n<li>เป็นโทรศัพท์<strong>กำลังงานไฟฟ้า</strong></li>\n<li>ใช้งานในหน่วยระดับ<strong>กองร้อย</strong></li>\n<li>เลือกการทำงานได้ <strong>3 ระบบ</strong>: LB, CB, CBS (ดูตารางแหล่งไฟเลี้ยงในหัวข้อที่ 8)</li>\n<li>พนักงานรับรู้ว่ามีคนเรียกเข้าจาก<strong>เสียงบัสเซอร์ ที่สามารถปรับระดับเสียงได้</strong></li>\n</ul>\n<p><strong>TA-312/M2E</strong> เทียบกับ <strong>TA-312/PT</strong>: มีความแตกต่างกันในหลายด้าน (รุ่น M2E เป็นรุ่นปรับปรุง)</p>\n<ul>\n<li>ปรับสวิตช์ไปที่ตำแหน่ง <strong>AMP</strong> เมื่อต้องการใช้งานแบบขยายร่วม (amplifier)</li>\n<li>ปรับสวิตช์ไปที่ตำแหน่ง <strong>CHECK LOOP</strong> เมื่อต้องการตรวจสอบความต่อเนื่องของทางสาย</li>\n</ul>\n<p><strong>ETP-1</strong> (โทรศัพท์สนามแบบดิจิทัล/IP รุ่นใหม่ที่จัดหามาทดแทน <strong>TA-1/PT และ TA-312/PT</strong>)</p>\n<ul>\n<li>พนักงานรับรู้การเรียกเข้าจาก<strong>ไฟสถานะ CALL สีเขียว</strong> และ<strong>เสียงบัสเซอร์ที่ปรับได้</strong></li>\n<li>การโอนสาย: กดปุ่ม <strong>A (FLASH) + กดหมายเลข 4</strong></li>\n<li>การบันทึกหมายเลข: ยกหู → กดปุ่ม <strong>B (PROG)</strong> → กดปุ่ม <strong>D (MEMO)</strong> → เลือกหมายเลขที่ต้องการบันทึก (0-9) → กดหมายเลขโทรศัพท์ที่จะบันทึก → กดปุ่ม <strong>B (PROG)</strong> อีกครั้ง → วางหู</li>\n<li>การโทรออกในหมายเลขที่บันทึกไว้: ยกหู → กดปุ่ม <strong>D (MEMO)</strong> → เลือกหมายเลขความจำ (0-9)</li>\n<li>เมื่อสายที่คุยอยู่หลุด สามารถกดปุ่ม <strong>A (FLASH) + C (REDIAL)</strong> เพื่อโทรกลับได้ทันที โดยไม่ต้องวางแล้วโทรใหม่</li>\n<li>ในโหมด <strong>LB</strong> การโทรออกให้กดปุ่ม <strong>SIGNALING/FLASH</strong></li>\n</ul>\n<p><strong>ETP-X (ETP-3):</strong> ปุ่มพิเศษปุ่ม C ไม่ใช่ปุ่มบันทึก (หน้าที่ปุ่ม C มักเป็น REDIAL คล้ายกับ ETP-1)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่รุ่น-ระดับหน่วย-ประเภทกำลังงาน (TA-1/PT = เสียง/หมวด, TA-312/PT = ไฟฟ้า/กองร้อย), ลำดับขั้นตอนการกดปุ่มของ ETP-1 (โอนสาย/บันทึกเลข/โทรจากความจำ/รีไดอัล) ซึ่งออกเป็นโจทย์ขั้นตอนละเอียดบ่อยมาก</p>\n<hr />\n<h2>15. สายโทรศัพท์สนาม WD-1/TT: คุณสมบัติทางเทคนิค</h2>\n<p>สาย WD-1/TT เป็นสายคู่ตีเกลียว (twisted pair) ภายในประกอบด้วยลวดรวม <strong>7 เส้น</strong> เป็นลวดทองแดงผสมดีบุกและลวดเหล็กอาบสังกะสีผสมกัน (ข้อสอบบางข้อสลับจำนวนเส้นของลวดสองชนิด — ให้อ่านโจทย์อย่างละเอียดว่าถามอัตราส่วนแบบใด) มีฉนวนสีดำทำด้วยพลาสติกพิเศษเรียกว่า <strong>ไนล่อน (Nylon)</strong> หุ้มอยู่ และมี <strong>โพลิทีลีน (Polythylene)</strong> หุ้มทับฉนวนพลาสติกอีกชั้นหนึ่ง</p>\n<p><strong>คุณลักษณะทางเทคนิคที่ต้องจำ</strong></p>\n<ul>\n<li>ทนแรงดึงได้ประมาณ <strong>200 ปอนด์</strong></li>\n<li>ความต้านทานต่อกระแสไฟตรง ประมาณ <strong>230 โอห์ม/ลูฟไมล์</strong></li>\n<li>มีอิมพีแดนซ์ ณ ความถี่ 1000 Hz ประมาณ <strong>600 โอห์ม</strong> (ไม่ใช่ 200 โอห์ม — ข้อสอบมักเอาตัวเลขนี้มาสลับหลอกเป็นค่าที่ผิด)</li>\n<li>ความสูญเสียในทางสาย วัด ณ ความถี่ <strong>1000 Hz/ไมล์</strong> เป็นค่าอ้างอิงมาตรฐาน<ul>\n<li>สภาวะ<strong>แห้ง</strong>: ความสูญเสีย <strong>1.6 dB</strong></li>\n<li>สภาวะ<strong>เปียก</strong>: ความสูญเสีย <strong>2.5 dB</strong> (สูงกว่าสภาวะแห้งเพราะความชื้นเพิ่มการรั่วไหลของสัญญาณ)</li>\n</ul>\n</li>\n</ul>\n<p><strong>คุณลักษณะที่ดีของสายโทรศัพท์สนามโดยทั่วไป</strong> คือ ต้องเป็น<strong>ตัวนำที่ดี</strong> (นำไฟฟ้า/สัญญาณได้มีประสิทธิภาพ) นอกจากนี้ยังต้องทนทานต่อสภาพอากาศ แรงดึง และการใช้งานภาคสนาม</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวเลขค่าความสูญเสีย dB ทั้งสภาวะแห้ง/เปียก (1.6 กับ 2.5), ค่าอิมพีแดนซ์ที่ถูกต้อง (600 โอห์ม ไม่ใช่ 200), และจำนวนเส้นลวดภายในสาย (รวม 7 เส้น)</p>\n<hr />\n<h2>16. อุปกรณ์วางสาย เก็บสาย สร้างสาย และตัดต่อสาย</h2>\n<p><strong>ล้อม้วนสาย</strong></p>\n<ul>\n<li><strong>DR-15-B</strong>: บรรจุสายเคเบิลสนามได้ยาว <strong>1/4 ไมล์</strong></li>\n<li><strong>RL-159/U</strong>: บรรจุสาย WD-1/TT ได้ยาว <strong>1 ไมล์</strong> (ล้อมาตรฐานที่ใช้คำนวณบัญชีการใช้สาย)</li>\n<li><strong>DR-8</strong>: บรรจุสาย WD-1/TT ได้ยาว <strong>1/4 ไมล์</strong></li>\n</ul>\n<p><strong>ชุดเครื่องมือวางสาย</strong></p>\n<ul>\n<li><strong>RL-27</strong>: ชุดเครื่องมือวางสาย ใช้พนักงาน <strong>2 นาย</strong> ในการวางสายและเก็บสาย มีส่วนประกอบชุดแกนล้อสายครบชุด</li>\n<li><strong>CE-11</strong>: ชุดเครื่องมือวางสายอีกแบบหนึ่ง มีส่วนประกอบชุดครบตามที่กำหนด</li>\n<li><strong>RL-31</strong>: ชุดเครื่องวางสายที่มีน้ำหนักมาก แต่ออกแบบให้หิ้วไปมาได้สะดวก ใช้วางสายและเก็บสายโดยพนักงาน<strong>เพียงคนเดียว</strong> เหมาะกับพื้นที่การรบข้างหน้าที่วางสายระยะทางใกล้ ๆ</li>\n</ul>\n<p><strong>ชุดเครื่องมือสร้างสาย: TE-21</strong> — ใช้สำหรับปีนเสาหรือปีนต้นไม้โดยไม่ต้องใช้บันได ทำให้สามารถใช้มือทั้งสองข้างปฏิบัติงานได้ขณะอยู่บนที่สูง (เป็นชุดเข็มขัดปีนเสา)</p>\n<p><strong>ชุดเครื่องมือตัดต่อสาย: TE-33</strong></p>\n<p><strong>ไม้ค้า MC-123</strong> — ใช้ในการวางสาย กรอสายเข้าล้อ เก็บสายจากที่สูง และตรวจสอบความแข็งแรง/การผุกร่อนของเสาไม้ก่อนปีน มีลักษณะเป็นไม้กลม 2 ท่อนต่อกัน ความยาวประมาณ <strong>9 ฟุต</strong></p>\n<p><strong>การต่อสายไฟเบอร์ออฟติก</strong></p>\n<ul>\n<li><strong>Fusion Splice (การฟิวชั่น)</strong>: การต่อสายแบบหลอมละลาย core ของสายทั้งสองฝั่งเข้าด้วยกัน (ให้ค่าความสูญเสียต่ำที่สุด)</li>\n<li><strong>Mechanical Splice</strong>: การนำ core ของสายทั้งสองด้านมาชนกัน แล้วล็อกให้แน่นด้วยกลไก (ไม่หลอมละลาย)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่ชื่อรุ่นล้อสายกับความยาวสายที่บรรจุ (DR-15-B, RL-159/U, DR-8), หน้าที่ของ TE-21 (สร้างสาย/ปีนเสา) กับ TE-33 (ตัดต่อสาย) ที่มักออกเป็นโจทย์บรรยายลักษณะแล้วให้ทายชื่ออุปกรณ์ และความแตกต่างระหว่าง Fusion กับ Mechanical Splice</p>\n<hr />\n<h2>17. การแพร่กระจายคลื่นวิทยุและบรรยากาศไอโอโนสเฟียร์</h2>\n<p>ชั้นบรรยากาศที่มีผลต่อการแพร่กระจายคลื่นวิทยุ<strong>มากที่สุด</strong>คือชั้น <strong>ไอโอโนสเฟียร์ (Ionosphere)</strong></p>\n<p><strong>คุณสมบัติพื้นฐานของคลื่น</strong></p>\n<ul>\n<li><strong>Reflection</strong> สัมพันธ์กับ<strong>การสะท้อน</strong></li>\n<li><strong>Refraction</strong> สัมพันธ์กับ<strong>การหักเห</strong></li>\n</ul>\n<p><strong>ชั้นบรรยากาศไอโอโนสเฟียร์</strong></p>\n<ul>\n<li>ชั้น <strong>D</strong>: มีคุณสมบัติในการ<strong>ดูดกลืน</strong>ความถี่วิทยุ และเป็นชั้นบรรยากาศที่<strong>ปรากฏเฉพาะในเวลากลางวัน</strong>เท่านั้น (สลายตัวไปตอนกลางคืน)</li>\n</ul>\n<p><strong>นิยามสำคัญเกี่ยวกับการแพร่กระจายคลื่นฟ้า (Sky Wave)</strong></p>\n<ul>\n<li><strong>Skip Zone</strong>: เขตพื้นที่นับตั้งแต่จุดที่ Ground Wave (คลื่นดิน) สิ้นสุด จนถึงจุดที่คลื่นฟ้าสะท้อนกลับลงมายังพื้นโลกเป็นครั้งแรก</li>\n<li><strong>Skip Area (สคิป แอเรีย)</strong>: พื้นที่ที่<strong>รับสัญญาณคลื่นวิทยุไม่ได้เลย</strong> ทั้งคลื่นดินและคลื่นฟ้า (คือพื้นที่ที่ตกอยู่ใน Skip Zone)</li>\n<li><strong>ความถี่วิกฤต (Critical Frequency)</strong>: ความถี่<strong>สูงสุด</strong>ที่ชั้นบรรยากาศไอโอโนสเฟียร์ยังสามารถสะท้อนคลื่นวิทยุกลับลงมาได้ เมื่อคลื่นถูกส่งขึ้นไปในแนวดิ่ง ภายใต้สภาวะบรรยากาศหนึ่ง ๆ (สูงกว่านี้คลื่นจะทะลุออกไปไม่สะท้อนกลับ)</li>\n</ul>\n<p><strong>คลื่นที่มีเฉพาะคลื่นดิน (ไม่มีคลื่นฟ้า):</strong> คือคลื่นที่มีความยาวคลื่น<strong>น้อยกว่า</strong>คลื่นวิทยุระบบ FM (คือความถี่สูงมาก ๆ จะเดินทางแบบคลื่นดิน/เส้นตรงเป็นหลัก ไม่สะท้อนไอโอโนสเฟียร์)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ความหมายของ Skip Zone vs Skip Area (มักออกให้สับสน), นิยามความถี่วิกฤต, และคุณสมบัติเฉพาะของชั้น D (ดูดกลืนคลื่น + ปรากฏกลางวันเท่านั้น)</p>\n<hr />\n<h2>18. คลื่นแม่เหล็กไฟฟ้า ไมโครเวฟ อินฟราเรด และการสื่อสารดาวเทียม</h2>\n<ul>\n<li>การสื่อสารแบบไร้สายไม่รวมถึง<strong>ใยแก้วนำแสง</strong> เพราะไฟเบอร์ออปติกเป็นสื่อสัญญาณแบบมีสาย (ใช้แสงเดินทางในแกนแก้ว)</li>\n<li>คำว่า \"ไมโครเวฟ\" ตามข้อสอบมีที่มาจากการที่ความยาวคลื่นมีหน่วยวัดเป็น<strong>ไมโครเมตร</strong></li>\n<li>คลื่นไมโครเวฟมีผลต่อร่างกายมนุษย์ <strong>สามารถทำให้เป็นหมันได้ หากได้รับคลื่นในระดับความเข้มสูง</strong></li>\n<li>เหตุผลที่ห้ามใช้ภาชนะโลหะในเตาไมโครเวฟ: เพราะจะทำให้คลื่นไมโครเวฟ<strong>สะท้อนกลับไม่ถึงอาหาร</strong> ทำให้อาหารไม่สุก</li>\n<li>คลื่นอินฟราเรด (Infrared) มีข้อดีหลายประการ ยกเว้นข้อเสียสำคัญคือ<strong>ไม่สามารถเดินทางผ่านวัตถุทึบแสงหรือสิ่งกีดขวางได้</strong></li>\n</ul>\n<p><strong>การสื่อสารผ่านดาวเทียม</strong></p>\n<ul>\n<li>ย่านความถี่ <strong>Ku-Band อยู่ที่ 12 ถึง 18 GHz</strong></li>\n<li>ข้อเสียสำคัญของการสื่อสารผ่านดาวเทียม คือมี<strong>เวลาหน่วง (Delay Time)</strong> ในการส่งสัญญาณ (เนื่องจากระยะทางไกลถึงวงโคจร)</li>\n<li><strong>ดาวเทียมสำรวจทรัพยากรโลก</strong> คือดาวเทียมที่มีอุปกรณ์สำรวจแหล่งทรัพยากรที่สำคัญ และเฝ้าสังเกตสภาวะแวดล้อมที่เกิดขึ้นบนโลก</li>\n</ul>\n<p><strong>โพลาไรเซชันของสายอากาศ</strong></p>\n<ul>\n<li><strong>Horizontal Polarization</strong>: ขั้วของสนามไฟฟ้าจะขนานกับพื้นโลก</li>\n<li>การติดตั้งแผงสายอากาศแบบ Horizontal Polarization: สนามแม่เหล็ก (ซึ่งตั้งฉากกับสนามไฟฟ้าเสมอ) จะ<strong>ตั้งฉากกับพื้นโลก</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ผลกระทบไมโครเวฟต่อร่างกาย, ช่วงความถี่ Ku-Band, ข้อเสียหลักของดาวเทียม (Delay Time), และการแยกแยะระหว่างทิศทางของสนามไฟฟ้ากับสนามแม่เหล็กใน Horizontal Polarization (เป็นจุดที่มักสับสนกัน)</p>\n<hr />\n<h2>19. สายไฟเบอร์ออฟติก (Fiber Optic)</h2>\n<p>สายไฟเบอร์ออฟติกมีข้อดีเด่นคือส่งข้อมูลด้วยความเร็วสูง (จึงไม่ใช่ข้อเสีย)</p>\n<p><strong>คุณสมบัติตามชนิดของสาย</strong></p>\n<ul>\n<li><strong>Multi Mode</strong>: ความยาวคลื่นที่เหมาะสมในการใช้งานคือ <strong>850 นาโนเมตร</strong></li>\n<li><strong>Single Mode</strong>:<ul>\n<li>ระยะทางที่รองรับได้ประมาณ <strong>100 กม.</strong> (ไกลกว่า Multi Mode มาก เพราะมีการกระจายแสงน้อยกว่า)</li>\n<li>ขนาด CORE โดยทั่วไปประมาณ <strong>9 ไมครอน</strong> (เล็กกว่า Multi Mode ที่มี core ใหญ่กว่า)</li>\n</ul>\n</li>\n</ul>\n<p><strong>การต่อสาย</strong> ใช้เทคนิค Fusion Splice (หลอมละลาย core เข้าด้วยกัน) หรือ Mechanical Splice (นำ core มาชนกันแล้วล็อก) ตามที่กล่าวไว้ในหัวข้อที่ 16</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวเลขเฉพาะของ Single Mode (ระยะ 100 กม., core 9 ไมครอน) เทียบกับ Multi Mode (ความยาวคลื่น 850 nm) และการแยกว่าความเร็วสูงเป็น \"ข้อดี\" ไม่ใช่ข้อเสีย</p>\n<hr />\n<h2>20. วิทยุถ่ายทอด (Radio Relay): หลักการและรุ่นต่าง ๆ</h2>\n<p><strong>หลักการพื้นฐาน</strong></p>\n<ul>\n<li>วัตถุประสงค์หลักของการใช้วิทยุถ่ายทอด คือ<strong>ใช้รับส่งสัญญาณแบบหลายช่องการสื่อสาร (Multi-channel)</strong> ซึ่งเป็นคุณลักษณะที่แตกต่างจากวิทยุ FM ทั่วไปอย่างชัดเจนที่สุด</li>\n<li>เหมาะใช้งานเมื่อ<strong>ต้องการความเร็วในการติดตั้งระบบทางสาย</strong> และระบบสื่อสารที่มีระยะทางไกล (ทดแทนการเดินสายเคเบิลระยะไกล)</li>\n<li>ระยะ <strong>Line of Sight</strong> ของวิทยุถ่ายทอดจำกัดอยู่ที่ประมาณ <strong>30 ไมล์</strong> เนื่องจาก<strong>ส่วนโค้งของผิวโลก</strong> บดบังแนวสายตาระหว่างสถานี</li>\n<li>วิทยุถ่ายทอดออกแบบให้ทำงานแบบ <strong>Full Duplex</strong> เพื่อให้สามารถสนทนาโต้ตอบกันได้ทันที (ทั้งรับและส่งพร้อมกัน); เมื่อเชื่อมต่อกับตู้ชุมสายสนามทางยุทธวิธี การรับส่งสัญญาณก็เป็นแบบ Full Duplex เช่นกัน</li>\n<li>เปรียบเทียบกับวิทยุ FM ทั่วไป: วิทยุถ่ายทอด<strong>ไม่ได้ออกอากาศแบบบังคับทิศเท่านั้น</strong> (มีทั้งบังคับทิศและปรับได้ตามลักษณะการใช้งาน — ข้อความที่ระบุว่า \"บังคับทิศเท่านั้น\" จึงผิด)</li>\n<li>วิทยุถ่ายทอดป้องกันการดักรับสัญญาณของฝ่ายตรงข้ามได้ดีกว่าวิทยุ FM ทั่วไป เพราะ<strong>ใช้แผงสายอากาศแบบบังคับทิศ</strong>และสามารถ<strong>ปรับกำลังออกอากาศให้เหมาะสมกับระยะติดต่อได้แบบอัตโนมัติ</strong></li>\n</ul>\n<p><strong>หลักการเทียบระบบ SIMPLEX</strong></p>\n<ul>\n<li><strong>SIMPLEX</strong>: การสื่อสารแบบทางเดียว ผู้ส่งส่งได้อย่างเดียว ผู้รับรับได้อย่างเดียว ไม่มีการโต้ตอบ (ตรงข้ามกับ Full Duplex ของวิทยุถ่ายทอด)</li>\n</ul>\n<p><strong>รุ่นวิทยุถ่ายทอดที่ต้องจำ</strong></p>\n<table>\n<thead>\n<tr>\n<th>รุ่น</th>\n<th>ย่านความถี่</th>\n<th>ข้อมูลสำคัญอื่น</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>RL-422A</strong></td>\n<td>รองรับความถี่ 620.0 MHz</td>\n<td>ใช้เมื่อโจทย์ระบุความถี่ในช่วงนี้</td>\n</tr>\n<tr>\n<td><strong>RL-432A</strong></td>\n<td>1350 – 1850 MHz</td>\n<td>แผงสายอากาศชื่อ <strong>CA-732</strong>; ช่องการสื่อสาร <strong>4000 ช่อง</strong>; Feed loss สูงสุด <strong>-4.9 dB</strong></td>\n</tr>\n<tr>\n<td><strong>RL-532A</strong></td>\n<td>1350 – 2690 MHz</td>\n<td>รับส่งข้อมูลสูงสุด <strong>34 Mb/s</strong>; มาตรฐานเชื่อมต่อไม่รวม V.1</td>\n</tr>\n<tr>\n<td><strong>TRC-4000</strong></td>\n<td>4.4 – 5 GHz</td>\n<td>กำลังออกอากาศปรับได้ 4.5 dB ถึง +35.5 dB; BIT RATE สูงสุด 34 MB/s; ประกอบด้วย <strong>RFE, BBE, UPE</strong>; แหล่งจ่ายไฟ DC 19-32V; ตั้งค่า Function ของ RFE/BBE ผ่านอุปกรณ์ <strong>COT</strong></td>\n</tr>\n<tr>\n<td><strong>GRX-4000</strong></td>\n<td>4400 – 5000 MHz</td>\n<td>ดูรายละเอียดหัวข้อที่ 21</td>\n</tr>\n</tbody>\n</table>\n<p><strong>การโปรแกรมความถี่แบบ Manual (เช่น RL-420):</strong> สามารถกำหนดความถี่รับและความถี่ส่งได้ตามที่โจทย์ระบุ (ถูกทุกลักษณะที่กล่าวถึง)</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่รุ่นวิทยุถ่ายทอดกับย่านความถี่ใช้งาน (เป็นหัวข้อออกซ้ำมากที่สุดในกลุ่มนี้), เหตุผลเรื่องระยะ Line of Sight 30 ไมล์ (ส่วนโค้งผิวโลก), และเหตุผลที่ออกแบบเป็น Full Duplex</p>\n<hr />\n<h2>21. GRX-4000, การ Modulation และการ Multiplexing (ระบบดิจิทัล)</h2>\n<p><strong>GRX-4000</strong></p>\n<ul>\n<li>ย่านความถี่ใช้งาน <strong>4400 – 5000 MHz</strong></li>\n<li>แหล่งจ่ายไฟ: <strong>230 VAC, 50/60 Hz และ 24 VDC</strong></li>\n<li>เลือก <strong>Modulation</strong> ได้ 2 แบบ: <strong>QPSK และ 16QAM</strong></li>\n<li>ตั้งความถี่รับ-ส่งห่างกันได้น้อยที่สุด <strong>150 MHz</strong>; ระยะห่างระหว่างช่องความถี่ (channel spacing) = <strong>1 MHz</strong></li>\n<li><strong>ODU</strong> (Outdoor Unit) ทำหน้าที่รับสัญญาณจาก <strong>IDU</strong> (Indoor Unit) และผสมความถี่วิทยุส่งออกทางแผงสายอากาศ</li>\n<li><strong>Port SYSCON</strong>: ใช้เชื่อมต่อกับ<strong>คอมพิวเตอร์ EMS</strong> เพื่อบริหารจัดการระบบ</li>\n<li><strong>MNG IP</strong>: ใช้สำหรับการจัดการการเชื่อมต่อ EMS</li>\n<li>เลือก <strong>Interface</strong> ได้ 3 แบบ; Interface สำหรับต่อกับตู้ชุมสาย <strong>DX-111</strong> คือ <strong>AMI</strong>; Interface สำหรับเชื่อมต่อกับตู้ <strong>ETEx</strong> คือ <strong>ETH</strong></li>\n<li>ถ้าเลือก Modulation เป็น <strong>QPSK</strong> จะมี Bit rate สูงสุด <strong>34 Mbps</strong></li>\n<li>Interface <strong>G.703</strong> มี Bitrate = <strong>2 Mbps</strong></li>\n<li>Interface ที่สามารถตั้ง TX Bit Rate และ RX Bit Rate ต่างกันได้ คือ <strong>ETHERNET</strong></li>\n<li>แผงสายอากาศของ GRX-4000 โดยปกติติดตั้งมาเป็น <strong>Vertical Polarization</strong></li>\n<li>GRX-4000 สามารถใช้งานเป็น<strong>สถานีกลางทาง (Relay)</strong> ได้ ถือเป็นความอ่อนตัวของการใช้งาน — หากใช้เป็นสถานีกลางทางต้องต่อสายให้ครบทุก Port ที่เกี่ยวข้อง สัญญาณจึงจะไปได้สมบูรณ์ และถ้า<strong>ไม่เชื่อมต่อ Port BASEBAND</strong> จะ<strong>ไม่สามารถส่งข้อมูลจาก HOP หนึ่งไปยังอีก HOP หนึ่งได้</strong></li>\n<li>ตัวอย่างคำนวณ: เลือก TX bitrate = 8M, Interface = 2048K_E1, ETH → จะได้ Bitrate รวม <strong>4 Mbps</strong></li>\n</ul>\n<p><strong>ความเข้ากันได้ระหว่างรุ่น</strong></p>\n<ul>\n<li>นำวิทยุถ่ายทอดตระกูล <strong>RL-Series</strong> มาวางระบบร่วมกับ <strong>GRX-4000 ได้ แต่จะไม่ครบทุก Interface</strong></li>\n<li>นำ <strong>GRX-4000</strong> มาวางระบบร่วมกับ <strong>RL-Series ได้</strong> แต่จะใช้งานได้สูงสุดเพียง <strong>Eurocom 2 Mbps</strong> เท่านั้น</li>\n</ul>\n<p><strong>หลักการ Modulation</strong></p>\n<ul>\n<li><strong>QPSK</strong> ส่งข้อมูลได้<strong>น้อยกว่า</strong> 16QAM (เพราะผสมสัญญาณได้จำนวนบิตต่อครั้งน้อยกว่า)</li>\n<li><strong>16QAM</strong>: เป็นการผสมสัญญาณทั้งทางเฟสและขนาด (amplitude) พร้อมกัน โดยสามารถผสมสัญญาณได้ครั้งละ <strong>4 บิต</strong> ต่อ 1 สัญลักษณ์ (symbol) — จึงส่งข้อมูลได้มากกว่า QPSK ที่ผสมได้ครั้งละ 2 บิต</li>\n</ul>\n<p><strong>หลักการ Multiplexing</strong></p>\n<ul>\n<li>เหตุผลที่มีการใช้ <strong>Multiplex</strong> คือเพื่อให้สามารถส่งสัญญาณหลายช่องทางไปพร้อมกันบนสื่อกลางเดียว ใช้ทรัพยากรความถี่/แบนด์วิดท์อย่างคุ้มค่า (ข้อสอบสรุปว่า \"ถูกทุกข้อ\" เมื่อถามประโยชน์)</li>\n<li><strong>TDM (Time Division Multiplexing)</strong>: หลักการคือ<strong>การรวมช่องสัญญาณด้วยการแบ่งเวลา</strong> (แต่ละช่องสัญญาณผลัดกันส่งข้อมูลในช่วงเวลาสั้น ๆ ที่จัดสรรให้)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ตัวเลขเฉพาะของ GRX-4000 (ย่านความถี่, channel spacing 1 MHz, ระยะห่างความถี่ต่ำสุด 150 MHz, แหล่งจ่ายไฟ), หน้าที่ ODU/IDU, การเลือก Interface ให้ตรงกับอุปกรณ์ปลายทาง (AMI สำหรับ DX-111, ETH สำหรับ ETEx), และหลักการเปรียบเทียบ QPSK กับ 16QAM (จำนวนบิตต่อสัญลักษณ์)</p>"}, {"subject": 3, "subjectTitle": "วิชาทหารสื่อสาร", "html": "<p>เอกสารนี้สังเคราะห์จากข้อสอบ 150 ข้อ (ข้อ 610–759) ของวิชา \"วิชาทหารสื่อสาร\" โดยจัดกลุ่มเป็นหัวข้อความรู้ที่ต้องเข้าใจก่อนสอบ ไม่ใช่การท่องจำข้อ-คำตอบเป็นรายข้อ</p>\n<hr />\n<h2>1. หลักการพื้นฐานของการสื่อสารทางยุทธวิธี</h2>\n<p><strong>การสื่อสารทางยุทธวิธี</strong> หมายถึง ระบบการสื่อสารและเครื่องมือสื่อสารต่างๆ ที่สนับสนุนส่วนต่างๆ ของกองทัพบกในสนามรบ ใช้ตั้งแต่ บก.ทบ. ในพื้นที่ยุทธบริเวณ ลงไปจนถึงหน่วยรบระดับต่ำสุด หน่วยสนับสนุนการรบ และหน่วยสนับสนุนการช่วยรบ หลักนิยมที่เกี่ยวข้องคือ <strong>รส.24-1</strong></p>\n<p>ลักษณะเฉพาะของเครื่องมือสื่อสารที่ใช้ในการสื่อสารทางยุทธวิธี คือ เป็น <strong>เครื่องมือแบบพกพาและแบบบรรทุกพาหนะหรือเคลื่อนที่ได้ตามอัตรา</strong> (ไม่ใช่แบบติดตั้งประจำที่) เพราะต้องเคลื่อนย้ายตามหน่วยรบในสนาม</p>\n<h3>ระบบการสื่อสารที่ต้องการ (คุณลักษณะ 4 ประการ)</h3>\n<p>ระบบการสื่อสารที่ดีต้องประกอบด้วย:</p>\n<ol>\n<li><strong>ความเชื่อถือได้</strong> — ส่งข่าวถึงผู้รับได้ถูกต้องตรงกัน</li>\n<li><strong>ความรวดเร็ว</strong> — ปฏิบัติงานตามลำดับความเร่งด่วนของข่าว</li>\n<li><strong>ความปลอดภัย</strong> — พิทักษ์ รักษา และปฏิบัติต่อข่าวตามชั้นความลับ เพื่อให้รอดพ้นจากการดักรับของข้าศึก</li>\n<li><strong>ความคงอยู่</strong> — สามารถใช้ระบบการสื่อสารทดแทนกันได้ เมื่อระบบใดระบบหนึ่งขาดการติดต่อสื่อสาร</li>\n</ol>\n<h3>หลักการสื่อสารที่สำคัญ</h3>\n<ul>\n<li><strong>ความอ่อนตัว (Flexibility)</strong> — เครื่องมือและระบบการสื่อสารต้องปรับตัวรองรับความแปรผันของสถานการณ์ยุทธ ให้เหมาะกับภารกิจและสถานการณ์ทางยุทธวิธีได้เสมอ</li>\n<li>หลักการและเครื่องมือสื่อสารทางยุทธวิธีย่อมเปลี่ยนแปลงไปตาม <strong>สถานการณ์ทางยุทธวิธีและดุลยพินิจของผู้บังคับบัญชา</strong></li>\n<li>เมื่อเลือกเครื่องมือสื่อสารมาใช้ สิ่งที่ต้อง<strong>พิจารณาก่อนเสมอ</strong>คือ <strong>ความเร่งด่วนของความต้องการทางยุทธวิธี</strong></li>\n<li>ลักษณะของเครื่องมือที่นำมาใช้ควรมี <strong>ความเชื่อถือได้ ความปลอดภัย และความรวดเร็ว</strong></li>\n</ul>\n<h3>ความรับผิดชอบทางการบังคับบัญชา</h3>\n<ul>\n<li>ผู้บังคับบัญชาแต่ผู้เดียวเป็นผู้รับผิดชอบใน: การมีระบบสื่อสารที่เพียงพอ, การใช้ระบบสื่อสารอย่างถูกต้อง, และการปฏิบัติงานอย่างมีประสิทธิภาพในระบบสื่อสารของหน่วยเหนือถัดไปด้วย (ครอบคลุมทุกข้อ)</li>\n<li>เมื่อการสื่อสารระหว่างสองหน่วยขัดข้อง <strong>ผู้บังคับบัญชาของทั้งสองหน่วย</strong> ต้องร่วมกันรับผิดชอบในการวางการสื่อสารและซ่อมบำรุงสายสื่อสาร ไม่ใช่หน่วยใดหน่วยหนึ่งฝ่ายเดียว</li>\n</ul>\n<h3>ประเภทเครื่องมือสื่อสารตามระดับหน่วย</h3>\n<ul>\n<li><strong>เครื่องมือประจำหน่วย</strong> — เครื่องมือสื่อสารของหน่วยรบและหน่วยสนับสนุนการรบ <strong>ตั้งแต่กองพลน้อยลงไป</strong> หน่วยรับผิดชอบเครื่องมือของตนเองตาม อจย. ที่ได้รับ</li>\n<li><strong>ระบบใช้ร่วม</strong> — เครื่องมือสื่อสารของหน่วยรบและหน่วยสนับสนุนการรบ <strong>ตั้งแต่ระดับกองพลขึ้นไป</strong> จะใช้ระบบใช้ร่วม โดย<strong>หน่วยทหารสื่อสาร</strong>เป็นผู้ติดตั้งและปฏิบัติงานให้</li>\n</ul>\n<h3>ระบบการสื่อสารทางยุทธวิธีของ ทบ.ไทย</h3>\n<p>ปัจจุบัน ทบ.ไทยใช้ <strong>ระบบการสื่อสารแบบเส้นหลัก</strong> เป็นหลัก โดย:</p>\n<ul>\n<li>ระดับกองพล: <strong>กองพันทหารสื่อสารกองพล (พัน.ส.พล.)</strong> เป็นผู้รับผิดชอบวางการสื่อสาร</li>\n<li>พื้นที่กองทัพบกสนาม: <strong>กรมทหารสื่อสารที่ 1</strong> เป็นผู้รับผิดชอบวางการสื่อสารทางยุทธวิธี</li>\n</ul>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>คำนิยาม \"การสื่อสารทางยุทธวิธี\" และหลักนิยม รส.24-1</li>\n<li>4 คุณลักษณะของระบบการสื่อสารที่ต้องการ (โดยเฉพาะนิยาม \"ความปลอดภัย\")</li>\n<li>แยกความแตกต่างเครื่องมือประจำหน่วย (กองพลน้อยลงไป) กับระบบใช้ร่วม (กองพลขึ้นไป)</li>\n<li>หน่วยรับผิดชอบวางการสื่อสารตามระดับพื้นที่/ระดับหน่วย</li>\n</ul>\n<hr />\n<h2>2. มัชฌิม (สื่อ/ช่องทาง) การสื่อสาร และลำดับความปลอดภัย</h2>\n<h3>ประเภทมัชฌิมการสื่อสารทางโทรคมนาคม</h3>\n<p>มัชฌิมการสื่อสารทางโทรคมนาคมมี 4 ประเภทหลัก คือ <strong>ทัศนะสัญญาณ เสียงสัญญาณ การสื่อสารประเภทสาย และการสื่อสารประเภทวิทยุ</strong></p>\n<ul>\n<li><strong>ทัศนะสัญญาณ</strong> — ใช้แผ่นผ้าสัญญาณของกองทัพบก มี 2 แบบ คือ<ul>\n<li>แผ่นผ้าสัญญาณแสดงฝ่ายและหมายที่ตั้ง (AP-50) — ทำด้วยสีทึบแสง ใช้พิสูจน์ฝ่ายและหมายรู้ยานพาหนะ</li>\n<li>แผ่นผ้าสัญญาณสำหรับส่งข่าว (AP-30) — เป็นชุดสีขาวและสีดำ ใช้สื่อสารระหว่างอากาศ-พื้นดิน</li>\n<li>รายละเอียดการใช้และความหมายของการปูแผ่นผ้าสัญญาณ อยู่ใน <strong>นปส. (หนังสือประมวลสัญญาณ)</strong></li>\n</ul>\n</li>\n<li><strong>วิทยุ</strong> — ข้อดี: ติดตั้งเร็ว สื่อสารได้ขณะเคลื่อนที่ ใช้ได้ทั้งบนบก ในน้ำ และในอากาศ; <strong>ข้อเสีย</strong>: อ่อนไหวต่อการดักรับและการก่อกวนของสงครามอิเล็กทรอนิกส์ (ไม่ใช่ข้อดี \"มีจุดแข็งต่อการทำสงครามอิเล็กทรอนิกส์\" ตรงข้าม — วิทยุคือช่องทางที่<strong>เสี่ยงที่สุด</strong>ต่อการดักรับ)</li>\n<li><strong>โทรศัพท์</strong> — ใช้สื่อสารระหว่างบุคคลต่อบุคคล ส่งข่าวสั้นๆ เมื่อจำเป็น</li>\n</ul>\n<h3>การปิด/ระงับวิทยุ</h3>\n<p>การปิดทั้งเครื่องส่งและเครื่องรับวิทยุ เรียกว่า <strong>\"การระงับวิทยุ\"</strong></p>\n<h3>ลำดับความปลอดภัยของมัชฌิมการสื่อสาร (หัวใจสำคัญ ออกสอบบ่อยมาก)</h3>\n<p>เรียงจาก <strong>ปลอดภัยน้อยที่สุด → มากที่สุด</strong>:</p>\n<blockquote>\n<p><strong>วิทยุ → เสียงสัญญาณ → ทัศนะสัญญาณ → สาย → พลนำสาร</strong></p>\n</blockquote>\n<p>หรือมองกลับกันจาก <strong>มากที่สุด → น้อยที่สุด</strong>:</p>\n<blockquote>\n<p><strong>พลนำสาร → ทางสาย → ทัศนะสัญญาณ → เสียงสัญญาณ → วิทยุ</strong></p>\n</blockquote>\n<p>สรุปคือ <strong>พลนำสารปลอดภัยที่สุด ส่วนวิทยุปลอดภัยน้อยที่สุด</strong> (เพราะดักรับคลื่นวิทยุได้ง่าย)</p>\n<h3>พลนำสาร (Courier)</h3>\n<ul>\n<li>อัตราความเร็วในการเคลื่อนที่ของพลนำสารยานยนต์ในเวลากลางวัน คือ <strong>25-40 ไมล์/ชม.</strong></li>\n<li>ข้อพิจารณาในการเลือกพลนำสาร ได้แก่ ความฉลาดปานกลาง, ความซื่อสัตย์ จงรักภักดี มีวินัย, และความคุ้นเคยกับสภาพภูมิประเทศและภูมิอากาศเป็นอย่างดี (ไม่เน้นความ \"เฉลียวฉลาดเป็นพิเศษ\" หรือความเร็วในการเดินทางเป็นเกณฑ์หลัก)</li>\n<li>ระบบพลนำสารที่เสนอข่าวภายในที่ตั้ง ระหว่างศูนย์การสื่อสารกับผู้รับในกองบัญชาการเดียวกัน เรียกว่า <strong>ระบบพลนำสารภายใน</strong></li>\n<li>ข้อดีของพลนำสาร (บริการนำสาร): เป็นมัชฌิมที่เชื่อถือได้และปลอดภัยที่สุด, ใช้ส่งข่าวที่เป็นเอกสาร/สิ่งพิมพ์จำนวนมาก, ลดภาระการติดตั้งวงจรสื่อสารประเภทไฟฟ้า — แต่<strong>ไม่เหมาะ</strong>กับการส่งข่าวข้อความยาวที่มีความ<strong>เร่งด่วนสูง</strong> (ตรงนี้ยังต้องใช้มัชฌิมไฟฟ้าแทน)</li>\n</ul>\n<h3>ระบบเปรียบเทียบความปลอดภัยกับความเร็ว</h3>\n<p>หลักการใช้เครื่องมือ: ยิ่งปลอดภัยสูง มักจะยิ่งช้า (พลนำสาร) ส่วนที่เร็วสุด (วิทยุ) มักปลอดภัยต่ำสุด — ผู้บังคับบัญชาต้องชั่งน้ำหนักตามความเร่งด่วนของสถานการณ์</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ลำดับความปลอดภัยของมัชฌิมการสื่อสาร 5 ประเภท (ถามได้ทั้งเรียงจากน้อยไปมากและมากไปน้อย) — เป็นจุดที่ออกซ้ำหลายข้อ</li>\n<li>4 ประเภทของมัชฌิมการสื่อสารโทรคมนาคม</li>\n<li>อัตราความเร็วพลนำสารยานยนต์ (25-40 ไมล์/ชม.)</li>\n<li>ข้อดี/ข้อเสียของวิทยุ โดยเฉพาะจุดอ่อนต่อการดักรับ</li>\n</ul>\n<hr />\n<h2>3. ระบบการสื่อสารแบบเส้นหลัก vs แบบพื้นที่</h2>\n<h3>ระบบการสื่อสารแบบเส้นหลัก (Line/Trunk System)</h3>\n<ul>\n<li>วางการสื่อสาร<strong>ตามสายการบังคับบัญชา</strong> (เป็นไปตามลำดับชั้นการบังคับบัญชา)</li>\n<li>เปลี่ยนเส้นทางการส่งข่าวได้<strong>น้อย</strong></li>\n<li>เป็นระบบที่ ทบ.ไทยใช้ในปัจจุบัน</li>\n</ul>\n<h3>ระบบการสื่อสารแบบพื้นที่ (Area System)</h3>\n<ul>\n<li>วางการสื่อสาร<strong>ตามความเหมาะสมของพื้นที่/ภูมิศาสตร์</strong> ไม่ตายตัวตามสายบังคับบัญชา</li>\n<li>เปลี่ยนเส้นทางการส่งข่าวได้<strong>มากกว่า</strong>แบบเส้นหลัก (มีเส้นทางสำรองหลายเส้นทาง)</li>\n<li><strong>ดำรงการติดต่อสื่อสารได้แน่นแฟ้นระหว่างการเคลื่อนย้ายหน่วย</strong> ซึ่งเป็นจุดแข็งที่แบบเส้นหลักไม่มี</li>\n<li>โดยรวมแล้ว <strong>ระบบพื้นที่ดีกว่าระบบเส้นหลักทั้งด้านความเร็วและความเชื่อถือได้</strong></li>\n<li>องค์แทนการสื่อสารประจำหน่วยทหารขนาดใหญ่ของระบบพื้นที่ เรียกว่า <strong>ศูนย์การสัญญาณ</strong></li>\n</ul>\n<h3>ตารางเปรียบเทียบสรุป</h3>\n<table>\n<thead>\n<tr>\n<th>ประเด็น</th>\n<th>แบบเส้นหลัก</th>\n<th>แบบพื้นที่</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>แนวทางการวาง</td>\n<td>ตามสายการบังคับบัญชา</td>\n<td>ตามความเหมาะสม/ภูมิศาสตร์</td>\n</tr>\n<tr>\n<td>การเปลี่ยนเส้นทางข่าว</td>\n<td>น้อย</td>\n<td>มาก</td>\n</tr>\n<tr>\n<td>ระหว่างเคลื่อนย้ายหน่วย</td>\n<td>จุดอ่อน</td>\n<td>ดำรงการสื่อสารได้ดี</td>\n</tr>\n<tr>\n<td>ความเร็ว/ความเชื่อถือได้</td>\n<td>ต่ำกว่า</td>\n<td>สูงกว่า</td>\n</tr>\n</tbody>\n</table>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ข้อสอบชอบเอา 2 ระบบมาสลับคุณสมบัติกันเพื่อหลอก (เช่น สลับว่าแบบไหนเปลี่ยนเส้นทางได้มาก/น้อย) ต้องจำให้แม่นว่า <strong>พื้นที่ = เปลี่ยนเส้นทางได้มาก + ดีระหว่างเคลื่อนที่</strong>, <strong>เส้นหลัก = ตามสายบังคับบัญชา + เปลี่ยนเส้นทางได้น้อย</strong></li>\n<li>ระบบที่ ทบ.ไทยใช้ปัจจุบันคือแบบเส้นหลัก</li>\n</ul>\n<hr />\n<h2>4. ศูนย์การสื่อสารและศูนย์ข่าว</h2>\n<h3>พันธกิจของศูนย์การสื่อสาร</h3>\n<p>ศูนย์การสื่อสารรับผิดชอบ:</p>\n<ul>\n<li>รับ-ส่งข่าวทางราชการระหว่างที่บัญชาการ (ไม่ใช่รับส่งข่าว<strong>ภายใน</strong>ที่บัญชาการ ซึ่งเป็นหน้าที่ของศูนย์รับ-ส่ง)</li>\n<li>ทำการเข้า-ถอดรหัส (การอักษรลับ)</li>\n<li>ดำเนินการเกี่ยวกับระบบทะเบียนหลักฐานข่าว</li>\n</ul>\n<p>งานหลักของศูนย์การสื่อสารและศูนย์ข่าวมี 3 อย่าง: <strong>งานทะเบียนเอกสาร งานการรหัส และงานรับ-ส่งข่าว</strong></p>\n<p><strong>ข้อควรระวัง</strong>: ศูนย์การสื่อสาร<strong>ไม่ได้</strong>รับผิดชอบการแจกจ่ายข่าวให้เพียงพอกับผู้รับ (หน้าที่นี้เป็นของศูนย์รับ-ส่ง)</p>\n<h3>องค์ประกอบของศูนย์การสื่อสาร</h3>\n<p>ศูนย์การสื่อสารแต่ละศูนย์ประกอบด้วย 3 ส่วนหลัก:</p>\n<blockquote>\n<p><strong>ส่วนศูนย์ข่าว + ส่วนเครื่องมือ + ส่วนการรหัส</strong></p>\n</blockquote>\n<p>สิ่งที่จำเป็นต้องมีอยู่ภายในศูนย์การสื่อสาร ได้แก่ แผนผังแสดงการใช้เครื่องมือสื่อสาร, แผนที่สังเขปแสดงเส้นทางนำสาร, แผนผังแสดงทางเดินของข่าว (<strong>ไม่จำเป็นต้องมี</strong>ตัวอย่างลายมือชื่อ ผบ.พล.)</p>\n<p>การจัดศูนย์การสื่อสารไม่มีแบบตายตัว ขึ้นอยู่กับ <strong>ขนาดและพันธกิจ</strong> ของหน่วย</p>\n<h3>ศูนย์รับ-ส่ง (แยกจากศูนย์การสื่อสาร)</h3>\n<ul>\n<li>เป็นหน่วยงานที่กองบัญชาการจัดตั้งจากเหล่าทหารสารบรรณ ทำหน้าที่ควบคุม เร่งรัดความเร็วของข่าว และตรวจความถูกต้องของข่าว</li>\n<li>แจกจ่ายข่าวถึงตัวผู้รับ รวมทั้งจัดทำสำเนาเพิ่มเติม โดยมี<strong>นายทหารสารบรรณ</strong>เป็นผู้รับผิดชอบ</li>\n<li>จัดพลนำสารภายในที่บัญชาการ โดยเจ้าหน้าที่กองบัญชาการเป็นผู้ปฏิบัติ</li>\n<li>เป็นตัวกลางระหว่าง ผบช./ฝ่ายอำนวยการ กับศูนย์การสื่อสาร</li>\n<li><strong>ไม่ใช่</strong> ฝอ.2 ที่รับผิดชอบ (นี่คือจุดที่ข้อสอบมักตั้งเป็นตัวเลือกลวง)</li>\n</ul>\n<h3>ตอนศูนย์ข่าว (ในศูนย์การสื่อสารของกองพล)</h3>\n<p>มีความรับผิดชอบในการ<strong>ดำเนินกรรมวิธีต่อข่าวเข้าและข่าวออกทั้งสิ้นของกองบัญชาการ</strong></p>\n<h3>การจัดตั้งศูนย์การสื่อสารตาม อจย.11-35 (พัน.ส.พล.)</h3>\n<p>กองพันทหารสื่อสารกองพลจัดตั้งศูนย์การสื่อสารได้ 4 ศูนย์ คือ:</p>\n<blockquote>\n<p><strong>ศูนย์การสื่อสาร ทก.หลัก, ศูนย์การสื่อสาร ทก.หลัง, ศูนย์การสื่อสาร ทก.ยุทธวิธี, และศูนย์สำรอง</strong></p>\n</blockquote>\n<p>ศูนย์การสื่อสาร ณ บก.พล อยู่ในอัตราการจัดของ <strong>กองร้อยวิทยุและศูนย์ข่าว</strong></p>\n<h3>การจ่าหน้าข่าว</h3>\n<p>เมื่อต้องการส่งข่าวเดียวกันให้ผู้รับหลายคน โดยไม่ต้องการให้แต่ละคนทราบว่ามีใครได้รับข่าวเดียวกันบ้าง ให้ใช้วิธี <strong>จ่าหน้าแยกผู้รับ</strong></p>\n<h3>ประเภทของข่าว</h3>\n<p><strong>แบ่งตามการเกี่ยวข้องกับศูนย์การสื่อสาร</strong> มี: ข่าวเข้า, ข่าวออก, ข่าวถ่ายทอด/ข่าวส่งต่อ (ไม่รวม \"ข่าวเฉพาะสถานี\" ในกลุ่มนี้)</p>\n<p><strong>แบ่งตามลักษณะเกี่ยวข้องทางทหาร</strong> มี 3 อย่าง: ข่าวราชการ, ข่าวกึ่งราชการ, ข่าวเฉพาะสถานี (ไม่รวม \"ข่าวภายในที่ตั้ง\")</p>\n<p><strong>ข่าวเฉพาะสถานี</strong> เป็นข่าวชนิดเดียวที่<strong>ไม่ต้องดำเนินกรรมวิธีใดๆ</strong>ที่ศูนย์การสื่อสาร (เพราะเป็นข่าวเกี่ยวกับการปฏิบัติงานของสถานีเอง ไม่ใช่ข่าวที่ต้องส่งผ่านไปยังผู้รับภายนอก)</p>\n<h3>ผู้กำกับดูแลศูนย์ปฏิบัติการทางยุทธวิธีของกองพล</h3>\n<p>ผู้รับผิดชอบด้านฝ่ายเสนาธิการเกี่ยวกับการกำกับดูแลภายในศูนย์ปฏิบัติการทางยุทธวิธี (ศปย.) ของกองพล คือ <strong>สธ.3</strong></p>\n<h3>ลำดับความเร่งด่วนในการติดตั้งโทรศัพท์</h3>\n<p>การติดตั้งโทรศัพท์ภายในกองบัญชาการต้องเรียงตามลำดับ: <strong>ตอนศูนย์ข่าว → ตอนยุทธการ → ผู้บังคับบัญชา</strong></p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>แยกหน้าที่ศูนย์การสื่อสาร กับ ศูนย์รับ-ส่ง ให้ชัดเจน (ตัวเลือกลวงชอบสลับหน้าที่กัน)</li>\n<li>องค์ประกอบ 3 ส่วนของศูนย์การสื่อสาร และงานหลัก 3 อย่าง</li>\n<li>ประเภทข่าว 2 แบบการแบ่ง (ตามความเกี่ยวข้องกับศูนย์ฯ vs ตามลักษณะทางทหาร) และข้อยกเว้นของแต่ละแบบ</li>\n<li>การจัดตั้งศูนย์การสื่อสาร 4 ศูนย์ตาม อจย.11-35</li>\n</ul>\n<hr />\n<h2>5. การรักษาความปลอดภัยทางการสื่อสาร (COMSEC) และการอักษรลับ</h2>\n<h3>นิยามที่ต้องแยกให้ออก (ออกสอบบ่อยและมักเอามาสลับกันหลอก)</h3>\n<table>\n<thead>\n<tr>\n<th>คำศัพท์</th>\n<th>ความหมาย</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>การดักรับ (Interception)</strong></td>\n<td>การฟังและ/หรือบันทึกการสื่อสารของ<strong>ฝ่ายตรงข้าม</strong> เพื่อให้ได้ข่าวสารที่ต้องการ โดยฝ่ายที่สื่อสารอยู่ไม่ทราบว่าถูกดักรับ</td>\n</tr>\n<tr>\n<td><strong>การเฝ้าฟัง</strong></td>\n<td>การฟังและ/หรือบันทึกการสื่อสารของ<strong>ฝ่ายเดียวกัน</strong> เพื่อหาข้อมูลนำมาปรับปรุงการรักษาความปลอดภัยทางการสื่อสาร</td>\n</tr>\n<tr>\n<td><strong>การก่อกวน</strong></td>\n<td>การส่งคลื่นวิทยุเข้าไปรบกวนการสื่อสารทางวิทยุ เพื่อทำให้การสื่อสารเกิดความยุ่งยากหรือติดต่อไม่ได้</td>\n</tr>\n<tr>\n<td><strong>การลวง/ลวงเลียน</strong></td>\n<td>การส่งข่าวลวงผ่านเข้าไปในข่ายการสื่อสารของฝ่ายตรงข้าม เพื่อให้หลงผิด สับสน หรือคิดว่าเป็นฝ่ายเดียวกัน</td>\n</tr>\n</tbody>\n</table>\n<p>จุดสังเกต: <strong>ดักรับ = ฟังข้าศึกอย่างลับๆ</strong>, <strong>เฝ้าฟัง = ฟังฝ่ายเราเองเพื่อตรวจสอบ</strong>, <strong>ก่อกวน = รบกวนสัญญาณ</strong>, <strong>ลวง = ปลอมข่าวแทรกเข้าไป</strong></p>\n<h3>การอักษรลับ (Cryptography)</h3>\n<ul>\n<li><strong>ประมวลลับ</strong> — การอักษรลับที่ใช้วิธีกำหนดตัวอักษรหรือตัวเลขขึ้นเป็นกลุ่ม เพื่อให้มีจำนวนกำหนดได้มาก ใช้แทนความหมายหนึ่งคำหรือหนึ่งประโยค</li>\n<li><strong>รหัสโสณกุล</strong> มี 2 แบบ:<ul>\n<li><strong>รหัสแบบเปลี่ยนที่ (Transposition)</strong> — วิธีการสลับตัวอักษรในข้อความธรรมดาอย่างเป็นระเบียบแบบแผน</li>\n<li><strong>รหัสแบบเปลี่ยนแทน (Substitution)</strong> — วิธีการเอาตัวอักษรอื่นหรือตัวเลขมาแทนตัวอักษรในข้อความธรรมดาอย่างมีระเบียบ</li>\n</ul>\n</li>\n<li>ผู้รับผิดชอบ<strong>วางแผนทำลายทางการอักษรลับ</strong>และทำหน้าที่นายทหารรักษาความปลอดภัยทางการอักษรลับของกองพล คือ <strong>นายทหารการอักษรลับและนายทหารศูนย์ข่าว</strong></li>\n</ul>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>คำนิยาม 4 คำ (ดักรับ/เฝ้าฟัง/ก่อกวน/ลวง) — ข้อสอบชอบเอาคำนิยามมาสลับให้จับคู่ผิด</li>\n<li>รหัสโสณกุล 2 แบบ (เปลี่ยนที่ vs เปลี่ยนแทน) ต้องแยกให้ออก</li>\n<li>ผู้รับผิดชอบงานอักษรลับของกองพล</li>\n</ul>\n<hr />\n<h2>6. การจัดหน่วยทหารสื่อสารระดับกองทัพบก/กรมทหารสื่อสารที่ 1</h2>\n<h3>กรมทหารสื่อสารที่ 1</h3>\n<ul>\n<li>รับผิดชอบวางการสื่อสารทางยุทธวิธีในพื้นที่<strong>กองทัพบกสนาม</strong></li>\n<li>บังคับบัญชา วางแผน อำนวยการ ควบคุม และกำกับดูแลหน่วยทหารสื่อสารที่ได้รับการบรรจุมอบและขึ้นสมทบได้ <strong>2-4 กองพัน</strong></li>\n</ul>\n<h3>กองพันทหารสื่อสารที่ 101 และ 102 (เดิมคือ พัน.ส.บก.ทบ.)</h3>\n<ul>\n<li><strong>กองพันทหารสื่อสารกองบัญชาการกองทัพบก (พัน.ส.บก.ทบ.)</strong> เป็นหน่วยขึ้นตรงต่อกรมทหารสื่อสารที่ 1 ปัจจุบันเปลี่ยนชื่อเป็น <strong>กองพันทหารสื่อสารที่ 101 กรมทหารสื่อสารที่ 1</strong></li>\n<li>นขต. (หน่วยขึ้นตรง) ของกองพันทหารสื่อสารที่ 101 และ 102 ประกอบด้วย:<ul>\n<li><strong>กองบังคับการและกองร้อยกองบังคับการ</strong> — ทำหน้าที่ซ่อมเครื่องกำเนิดไฟฟ้า</li>\n<li><strong>กองร้อยปฏิบัติการสื่อสารประจำกองบัญชาการ</strong> — จัดบริการศูนย์ข่าวสนับสนุน ทบ.</li>\n<li><strong>กองร้อยปฏิบัติการสื่อสารสนาม</strong></li>\n<li><strong>กองร้อยปฏิบัติการสื่อสารสนับสนุน</strong> — มีสถานีบังคับข่ายสำหรับข่ายนายทหารติดต่อลาดตระเวนทางอากาศยุทธวิธี</li>\n<li>(ไม่มี \"กองร้อยปฏิบัติการสื่อสารประจำกองบังคับการ\" ซึ่งเป็นชื่อลวงที่คล้ายกัน)</li>\n</ul>\n</li>\n<li>ส.1 พัน.101 สามารถจัดศูนย์การสื่อสารสนับสนุน บก.ทบ. ได้ <strong>2 ศูนย์</strong></li>\n</ul>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ชื่อกองร้อยย่อยของ พัน.101/102 กับหน้าที่เฉพาะของแต่ละกองร้อย (ตัวเลือกลวงมีชื่อคล้ายกันมาก ต้องจำคู่ให้แม่น)</li>\n<li>จำนวนกองพันที่กรมทหารสื่อสารที่ 1 ควบคุมได้ (2-4 กองพัน)</li>\n</ul>\n<hr />\n<h2>7. กองพันทหารสื่อสารกองทัพภาค (พัน.ส.ทภ.)</h2>\n<h3>ขีดความสามารถ/ภารกิจหลัก</h3>\n<ul>\n<li>ให้การสนับสนุนการติดต่อสื่อสารแก่กองทัพภาคที่มี <strong>2-4 กองพล</strong></li>\n<li>จัดตั้งศูนย์ข่าวพร้อมบริการนำสารยานยนต์ได้ <strong>1 ศูนย์ข่าว</strong></li>\n<li>จัดชุดวิทยุถ่ายทอดได้ <strong>18 ชุด</strong></li>\n<li>จัดชุดสร้างสายสนามได้ <strong>4 ชุด</strong></li>\n</ul>\n<h3>กองร้อยสายและวิทยุถ่ายทอด (พัน.ส.ทภ.)</h3>\n<p>ขีดความสามารถ ได้แก่:</p>\n<ul>\n<li>ติดตั้ง ปฏิบัติการ และดำรงการสื่อสารทางสายไม่เกิน 200 ทางสาย</li>\n<li>จัดชุดวิทยุโทรพิมพ์สนับสนุนกองบัญชาการช่วยรบกองทัพภาคไม่เกิน 3 ชุด</li>\n<li>จัดวางการสื่อสารทางสายด้วยวิทยุถ่ายทอด ขนาด 10 ช่องเสียงได้ 3 ระบบพร้อมกันต่อหนึ่งหมวดวิทยุถ่ายทอด</li>\n<li><strong>ทำการรบอย่างทหารราบเมื่อจำเป็น</strong> ก็เป็นขีดความสามารถหนึ่งด้วย (หน่วยสื่อสารทุกระดับพร้อมรบเป็นทหารราบได้ในยามฉุกเฉิน)</li>\n</ul>\n<h3>โครงสร้างของ บก.และ ร้อย.บก. พัน.ส.ทภ.</h3>\n<ul>\n<li><strong>มีตอน บก.พัน.</strong> (ไม่มีตอนเสนารักษ์อยู่ในภาพรวมของ ร้อย.บก. — แต่ตอนเสนารักษ์เป็นหน่วยที่<strong>มี</strong>ในกองพันทหารสื่อสารกองทัพภาคโดยรวม ให้การรักษาพยาบาลกำลังพลของกองพัน)</li>\n<li>ตอนที่<strong>ไม่มี</strong>ใน พัน.ส.ทภ. คือ <strong>ตอนซ่อมบำรุงสายสื่อสาร</strong></li>\n<li>ตอนที่มีใน ร้อย.บก. พัน.ส.พล. แต่<strong>ไม่มี</strong>ใน ร้อย.บก. พัน.ส.ทภ. คือ <strong>ตอนซ่อมบำรุงสายสื่อสาร และตอนทหารสื่อสารกองพล</strong></li>\n<li>ตอนที่มีใน พัน.ส.ทภ. แต่ไม่มีใน พัน.ส.พล. คือ <strong>ตอนเสนารักษ์</strong></li>\n</ul>\n<h3>การควบคุมชุดปฏิบัติงาน</h3>\n<ul>\n<li>กำลังพลส่วนใหญ่ของ ส.พัน.ทภ. ปฏิบัติงาน ณ <strong>ทก.หลัก</strong></li>\n<li>ผู้ควบคุมการปฏิบัติงานชุดปฏิบัติงานของ พัน.ส.ทภ. ณ ทก.ทภ.หลัง คือ <strong>รอง ผบ.ส.พัน.ทภ.</strong></li>\n<li>ชุดปฏิบัติงานที่แยกไปปฏิบัติงานกับหน่วยอื่น อยู่ในการควบคุมของ <strong>นายสิบอาวุโส</strong> เป็นผู้ควบคุม และอยู่ในความควบคุมทางการปฏิบัติของ <strong>ฝสส. (ฝ่ายอำนวยการสื่อสาร) แต่ละหน่วย</strong></li>\n<li>เมื่อ ผบ.พัน. เคลื่อนย้ายไปกับ มทภ. ส่วนที่เหลือของตอน บก.พัน. เคลื่อนย้ายไปพร้อม ส.พัน.ทภ. โดยมี <strong>ฝอ.3</strong> เป็นผู้กำกับดูแล</li>\n</ul>\n<h3>ความสัมพันธ์กับกองทัพน้อย</h3>\n<p>กองทัพภาค (มทภ.) มีฐานะเป็นผู้บังคับบัญชาโดยตรงของกองทัพน้อย (มทน.) ในด้านปฏิบัติการสื่อสาร โดย <strong>กองพันทหารสื่อสารของกองทัพภาค (พัน.ส.ทภ.)</strong> เป็นผู้ดำเนินการสนับสนุนให้</p>\n<p>กองทัพน้อยควบคุมอำนวยการด้านการช่วยรบได้อย่างสมบูรณ์ <strong>ยกเว้นงานด้านการระดมสรรพกำลัง และการพิทักษ์พื้นที่ส่วนหลัง</strong> ซึ่งกองทัพภาคจะดำเนินการให้โดยผ่าน มทบ. (มณฑลทหารบก)</p>\n<h3>ข่ายวิทยุภายในกองทัพภาค</h3>\n<p>มีข่ายบังคับบัญชา/ยุทธการที่ 1 (ปส./วทพ.), ข่ายคำขอทางอากาศ (ปส./วทพ.), ข่ายนายทหารติดต่อ ป. (ปถ./คำพูด) — <strong>ไม่มี</strong>ข่ายบังคับบัญชา/ยุทธการที่ 2 (ปถ./วทพ.)</p>\n<p>ข่ายลาดตระเวน ทภ. มีสถานีบังคับข่ายตั้งอยู่ที่ <strong>ทก.ทภ.(หลัก)</strong></p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ตัวเลขขีดความสามารถ (2-4 กองพล, 1 ศูนย์ข่าว, 18 ชุดวิทยุถ่ายทอด, 4 ชุดสร้างสายสนาม)</li>\n<li>ตอน/หน่วยที่มี-ไม่มีใน พัน.ส.ทภ. เทียบกับ พัน.ส.พล. (สลับกันถามบ่อยมาก — จำหลักว่า พัน.ส.ทภ. มีตอนเสนารักษ์ แต่ไม่มีตอนซ่อมบำรุงสายสื่อสารกับตอนทหารสื่อสารกองพล ซึ่งเป็นของ พัน.ส.พล.)</li>\n<li>ผู้ควบคุมชุดปฏิบัติงานในแต่ละที่ตั้ง (รอง ผบ.ส.พัน.ทภ., นายสิบอาวุโส, ฝอ.3)</li>\n</ul>\n<hr />\n<h2>8. กองพันทหารสื่อสารกองพล (พัน.ส.พล.)</h2>\n<h3>ภาพรวมและ อจย.</h3>\n<ul>\n<li>บก.และร้อย.บก. พัน.ส.พล. จัดตาม <strong>อจย.11-36</strong></li>\n<li>นขต. ของกองพันทหารสื่อสารกองพล มี 4 ส่วนหลัก: <strong>บก.และร้อย.บก., ร้อย.วิทยุและศูนย์ข่าว, ร้อย.สายและวิทยุถ่ายทอด</strong> (ไม่มี \"ร้อย.ปฏิบัติการสื่อสาร\" ซึ่งเป็นชื่อลวง — ชื่อนั้นใกล้เคียงกับหน่วยของ พัน.101/102)</li>\n<li>ตอนที่<strong>ไม่มี</strong>ในการจัดของ พัน.ส.พล. คือ <strong>ตอนเสนารักษ์</strong> (มีการภาพ, ตอนซ่อมบำรุงยานยนต์กองพัน, ตอนส่งกำลังกองพันแทน)</li>\n</ul>\n<h3>ขีดความสามารถหลัก</h3>\n<ul>\n<li>ซ่อมบำรุงสิ่งอุปกรณ์สายสื่อสารในระดับ <strong>สนับสนุนโดยตรง</strong></li>\n<li><strong>ไม่มี</strong>ขีดความสามารถ \"ปฏิบัติการสื่อสารด้วยวิทยุถ่ายทอดให้แก่กองพลและหน่วยเหนือของกองพล\" (วิทยุถ่ายทอดใช้ภายในกองพลเป็นหลัก ไม่ใช่สนับสนุนหน่วยเหนือ)</li>\n<li>ขีดความสามารถที่มี: เชื่อมต่อการสื่อสารของกองพลเข้ากับระบบโทรคมนาคมในพื้นที่ตามความจำเป็น, บริการศูนย์การสื่อสารแก่กองบัญชาการกองพลและบริการนำสารด้วยยานพาหนะ, บริการภาพนิ่ง (รวมทั้งล้าง อัด ขยายภาพ)</li>\n<li>ต้องขอรับบริการสนับสนุนจากหน่วยอื่นในเรื่อง <strong>การขนส่งเพิ่มเติม และการรักษาพยาบาล</strong> (ไม่ได้มีขีดความสามารถด้านนี้เอง)</li>\n</ul>\n<h3>หน่วยและจำนวนชุดตามอัตรา</h3>\n<ul>\n<li>จัดพลนำสารยานยนต์ได้ <strong>5 ชุด</strong></li>\n<li>จัดชุดวิทยุควบคุมอากาศยานได้เต็มที่ <strong>5 ชุด</strong></li>\n<li>ข่ายวิทยุภายนอกกองพลมี <strong>4 ข่าย</strong></li>\n<li>ข่ายวิทยุของกองพล ประกอบด้วย ข่ายวิทยุในกองพลระบบ <strong>AM 5 ข่าย และระบบ FM 3 ข่าย</strong></li>\n<li>ชุดวิทยุที่ใช้ในข่ายคำขอทางอากาศของกองพล เพื่อส่งคำขอสนับสนุนทางอากาศยุทธวิธีตามแผน คือ <strong>ชุดวิทยุสนับสนุนทางอากาศ</strong></li>\n<li>ชุดวิทยุกำลังปานกลาง (มว.วิทยุ ร้อย.วิทยุและศูนย์ข่าว) ปฏิบัติงานใน <strong>ข่ายการข่าวกองพล</strong></li>\n<li>ชุดวิทยุที่<strong>ไม่ได้</strong>จัดอยู่ในหมวดวิทยุของ ร้อย.วิทยุและศูนย์ข่าว คือ <strong>ชุดวิทยุปลายทางและคลื่นพาห์</strong> (ชุดนี้อยู่ใน หมวดวิทยุถ่ายทอด ร้อย.สายและวิทยุถ่ายทอด)</li>\n<li>ชุดวิทยุปลายทางและคลื่นพาห์ (มว.วิทยุถ่ายทอด ร้อย.สายและวิทยุถ่ายทอด) สนับสนุนกองพลและหน่วยขึ้นสมทบ ยกเว้น <strong>พัน.ร.</strong> (กองพันทหารราบ ไม่ได้รับการสนับสนุนโดยตรงจากชุดนี้)</li>\n</ul>\n<h3>โครงสร้างหน่วยย่อยและหน้าที่</h3>\n<p><strong>บก.และร้อย.บก.พัน.ส.พล.</strong></p>\n<ul>\n<li>ภารกิจ: วางแผน อำนวยการ กำกับดูแล ประสานการปฏิบัติการสื่อสารของกองพล, จัดบริการการภาพให้แก่กองพล, ส่งกำลังและซ่อมบำรุงสายสื่อสารให้กองพล — <strong>ไม่รวม</strong>การสนับสนุนการส่งกำลังสำหรับหน่วยต่างๆ ของกองพัน รวมทั้ง บก.พล. (นั่นเป็นหน้าที่ของกองร้อยกองบังคับการ)</li>\n<li>เจ้าหน้าที่ใน ตอน บก.พัน. ปฏิบัติงานภายใต้การกำกับดูแลของ <strong>รอง ผบ.พัน.</strong></li>\n<li>มีตอนทหารสื่อสารกองพล, ตอนการภาพ, ตอนซ่อมบำรุงสายสื่อสาร — <strong>ไม่มี</strong>ตอนเสนารักษ์</li>\n</ul>\n<p><strong>กองร้อยกองบังคับการ (ร้อย.บก.) พัน.ส.พล.</strong>\nจัดตั้งขึ้นเพื่อปฏิบัติงานด้านธุรการ การส่งกำลัง การเลี้ยงดูแก่กองพัน, บริการส่งกำลังและซ่อมบำรุงสนับสนุนโดยตรงสายสื่อสารแก่เครื่องมือสื่อสารของกองพล, บริการภาพนิ่ง — <strong>ไม่รวม</strong>การซ่อมบำรุงยานยนต์ของกองพลเป็นส่วนรวม (ซ่อมบำรุงยานยนต์ไม่ใช่หน้าที่ของหน่วยนี้)</p>\n<p><strong>ร้อย.วิทยุและศูนย์ข่าว พัน.ส.พล.</strong>\nขีดความสามารถ: ติดตั้ง ปฏิบัติการและดำรงการสื่อสารประเภทวิทยุไปยังหน่วยต่างๆ ที่ปฏิบัติงานภายใต้กองบัญชาการกองพล (<strong>ไม่ใช่</strong>ภายใต้กองพันทหารสื่อสารกองพลเอง), บริการศูนย์ข่าวและบริการนำสารด้วยยานยนต์แก่กองบัญชาการกองพล, ทำการรบอย่างทหารราบเมื่อจำเป็น</p>\n<p><strong>หมวดศูนย์ข่าวและนำสาร</strong>\nประกอบด้วย ตอนศูนย์ข่าว, ตอนอักษรลับ, ตอนนำสาร (ทุกตอนปฏิบัติงานเป็นส่วนหนึ่งของศูนย์การสื่อสารของกองพล) — <strong>ไม่มี</strong>ตอนทางสาย (ตอนทางสายอยู่ในกองร้อยสายและวิทยุถ่ายทอด)</p>\n<p><strong>ส่วนปฏิบัติการสื่อสารของ พัน.ส.พล.</strong>\nประกอบด้วย หมวดศูนย์ข่าวและนำสาร (ร้อย.วิทยุและศูนย์ข่าว), หมวดวิทยุ (ร้อย.วิทยุและศูนย์ข่าว), หมวดวิทยุถ่ายทอด (ร้อย.สายและวิทยุถ่ายทอด) — <strong>ไม่รวม</strong>ตอนซ่อมบำรุงสายสื่อสารของกองร้อยกองบังคับการ (เป็นงานสนับสนุน ไม่ใช่ปฏิบัติการสื่อสารโดยตรง)</p>\n<h3>การบังคับบัญชาและงานฝ่ายอำนวยการ</h3>\n<ul>\n<li>ผบ.พัน. ในกองพันทหารสื่อสารกองพล ปฏิบัติพันธกิจสองบทบาท คือ เป็น <strong>ผบ.ส.พล.</strong> และ <strong>ผบ.พัน.ส.</strong> พร้อมกัน</li>\n<li>ในหน้าที่ <strong>ผบ.ส.พล.</strong> เป็นฝ่ายกิจการพิเศษของ ผบ.พล. (ไม่ใช่ในหน้าที่ ผบ.พัน.ส.)</li>\n<li>ในหน้าที่ <strong>ผบ.พัน.ส.</strong> กำกับดูแลงานการกำลังพล ขวัญ วินัย งานธุรการ เคหะรักษ์ และส่งกำลังบำรุง</li>\n<li>การจัดทำคำสั่งปฏิบัติการสื่อสารของ พัน.ส.พล. (ผู้ที่ทำจริงๆ) เป็นหน้าที่ของ <strong>ฝอ.3 พัน.ส.พล.</strong></li>\n<li>ท้ายคำสั่งปฏิบัติการสื่อสาร ผบ.พัน.ส.พล. ลงนามคำสั่งใน <strong>ฉบับที่ 1 และฉบับที่ 2</strong></li>\n<li>นายทหารฝ่ายส่งกำลังบำรุง (ฝอ.4) มีหน้าที่ <strong>ทำแผนควบคุมการเสียหายเป็นพื้นที่ของหน่วย</strong></li>\n<li>ในการเลือกที่บัญชาการ ผบ.ส.พล. จะประสานงานกับ <strong>หน.ฝกพ.</strong> (ฝ่ายกำลังพล)</li>\n<li>การสนับสนุนเรื่องการเลี้ยงดูในสนามของ พัน.ส.พล.: <strong>ฝอ.4</strong> รับผิดชอบทางฝ่ายอำนวยการประสานการเลี้ยงดู ส่วน <strong>ผบ.ร้อย.บก.</strong> รับผิดชอบอำนวยการใช้อุปกรณ์การเลี้ยงดูที่มีในอัตรา (แบ่งบทบาทกันชัดเจน)</li>\n<li>รอง ผบ.ส.พล. บรรจุอยู่ตามอัตราการจัดใน <strong>ตอนทหารสื่อสารกองพล</strong></li>\n<li>เมื่อกองพลจัดตั้ง ศปย.พล. (ศูนย์ปฏิบัติการยุทธ) รองผู้บังคับทหารสื่อสารกองพลเป็นหัวหน้าชุดส่วนสื่อสารอิเล็กทรอนิกส์ โดยมีเจ้าหน้าที่จาก <strong>ตอนทหารสื่อสารกองพล</strong> มาปฏิบัติงานร่วมด้วย</li>\n</ul>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ตัวเลขชุด/ข่ายต่างๆ ให้แม่น (5 ชุดพลนำสาร, 5 ชุดวิทยุควบคุมอากาศยาน, 4 ข่ายวิทยุภายนอกกองพล, AM 5/FM 3 ข่าย)</li>\n<li>แยกหน้าที่ระหว่าง บก.และร้อย.บก. กับ กองร้อยกองบังคับการ กับ ร้อย.วิทยุและศูนย์ข่าว — มีคำคล้ายกันมาก ต้องอ่านให้ละเอียด</li>\n<li>บทบาทคู่ของ ผบ.พัน. (ผบ.ส.พล. vs ผบ.พัน.ส.) และงานที่แต่ละบทบาทกำกับดูแล</li>\n<li>ผู้รับผิดชอบงานฝ่ายอำนวยการต่างๆ (ฝอ.3 ทำคำสั่งปฏิบัติการสื่อสาร, ฝอ.4 ดูแลส่งกำลัง/เลี้ยงดู)</li>\n</ul>\n<hr />\n<h2>9. หน่วยสื่อสารในเหล่าทหารอื่น (ทหารราบ ทหารม้า รถถัง)</h2>\n<h3>กรมทหารราบมาตรฐาน</h3>\n<ul>\n<li>กองบังคับการกรมทหารราบ มีนายทหารฝ่ายการสื่อสาร ทำหน้าที่เป็นฝ่ายอำนวยการสื่อสาร (<strong>ฝสส.</strong>) อัตรายศ <strong>ร้อยเอก</strong></li>\n<li>กองบังคับการและกองร้อยกองบังคับการของกรมทหารราบมาตรฐาน จัดหน่วยสื่อสารขนาด <strong>หมวด</strong> (หมวดสื่อสาร)</li>\n<li>ผู้บังคับหมวดสื่อสาร กรมทหารราบ เป็นทหารเหล่า <strong>ราบ</strong> (ไม่ใช่เหล่าสื่อสาร)</li>\n<li>กองร้อยเครื่องยิงหนัก ของกรมทหารราบมาตรฐาน จัดหน่วยสื่อสารขนาด <strong>ตอน</strong></li>\n<li>การจัดหมวดสื่อสารของกองพันทหารราบ ประกอบด้วย: <strong>บก.มว., ตอนวิทยุ, ตอนทางสาย</strong></li>\n<li>หมวดสื่อสารปฏิบัติงานในหน่วยระดับ <strong>กรม</strong></li>\n</ul>\n<h3>กรมทหารราบยานเกราะ vs กรมทหารราบมาตรฐาน</h3>\n<p>หน่วยที่มีในการจัดของกรมทหารราบยานเกราะ แต่<strong>ไม่มี</strong>ในกรมทหารราบมาตรฐาน คือ <strong>ตอนศูนย์ข่าว</strong></p>\n<h3>กรมทหารม้ามาตรฐาน</h3>\n<ul>\n<li>กองบังคับการและกองร้อยกองบังคับการ จัดหน่วยสื่อสารขนาด <strong>หมวด</strong></li>\n<li>การจัดหมวดสื่อสารของกรมทหารม้ามาตรฐาน ประกอบด้วย: <strong>บก.มว., ตอนวิทยุ, ตอนทางสายและศูนย์ข่าว</strong> (ต่างจากทหารราบตรงที่มี \"ศูนย์ข่าว\" รวมอยู่กับตอนทางสาย)</li>\n<li>นายทหารฝ่ายการสื่อสารของกรมทหารม้ามาตรฐาน เป็นฝ่ายกิจการพิเศษของกรม โดยมี <strong>ผบ.มว.สื่อสาร</strong> เป็นผู้ช่วย</li>\n<li>กองร้อยเครื่องยิงหนักของกรมทหารม้ามาตรฐาน จัดหน่วยสื่อสารขนาด <strong>ตอน</strong></li>\n</ul>\n<h3>กองพันรถถัง</h3>\n<ul>\n<li>ใช้เครื่องมือสื่อสารหลักภายในกองพันคือ <strong>วิทยุ</strong></li>\n<li>การสื่อสารทางสายของกองพันรถถัง ใช้สำหรับ <strong>เวลาอยู่ที่พักแรม ที่รวมพล และในการตั้งรับ</strong> (ไม่ใช้ทางสายเวลาเคลื่อนที่/รบเคลื่อนที่ เพราะสายตามไม่ทัน)</li>\n<li>หน้าที่ของนายทหารการสื่อสารกองพันรถถัง: เป็น ผช.ฝอ.3, ตรวจตราการฝึกการสื่อสารทุกชนิดในกองพัน, ตรวจตราที่ตั้ง — <strong>ไม่รวม</strong>การประสานเกี่ยวกับการออก นปส. (ไม่ใช่หน้าที่โดยตรงของนายทหารการสื่อสารระดับกองพันรถถัง)</li>\n<li>ผู้ตรวจตราการปรนนิบัติบำรุงระบบการสื่อสารของกองพันรถถัง คือ <strong>นายทหารฝ่ายการสื่อสาร</strong></li>\n</ul>\n<h3>ผบ.มว.สื่อสาร ในกองร้อยสนับสนุนการรบ / ร้อย.สสก.</h3>\n<ul>\n<li>ผู้บังคับหมวดสื่อสารในกองร้อยสนับสนุนการรบ อัตรายศ <strong>ร้อยโท</strong></li>\n<li>ผบ.มว.ส. ในร้อย.สสก. อัตรายศ <strong>ร้อยโท</strong></li>\n</ul>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>อัตราจัด (ขนาดหน่วย: หมู่/ตอน/หมวด) ของหน่วยสื่อสารในแต่ละระดับหน่วยและแต่ละเหล่า — เป็นจุดที่ถูกถามซ้ำในรูปแบบต่างๆ มากที่สุด</li>\n<li>อัตรายศของผู้บังคับหมวดสื่อสารแต่ละตำแหน่ง (ร้อยเอกสำหรับ ฝสส.กรม, ร้อยโทสำหรับ ผบ.มว.ส.)</li>\n<li>ความแตกต่างการจัดหมวดสื่อสารระหว่างทหารราบ (ไม่มีศูนย์ข่าวรวม) กับทหารม้า (มีศูนย์ข่าวรวมกับตอนทางสาย)</li>\n<li>เครื่องมือสื่อสารหลักและการใช้ทางสายของกองพันรถถัง</li>\n</ul>\n<hr />\n<h2>10. ฝ่ายอำนวยการสื่อสารและข่ายวิทยุระดับต่างๆ ของกองพล</h2>\n<h3>ฝ่ายอำนวยการสื่อสารตามระดับหน่วย</h3>\n<table>\n<thead>\n<tr>\n<th>ระดับหน่วย</th>\n<th>ตำแหน่งฝ่ายอำนวยการสื่อสาร</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>กองทัพบก</td>\n<td>จก.สส. (เจ้ากรมการทหารสื่อสาร)</td>\n</tr>\n<tr>\n<td>กองพล</td>\n<td>ผบ.ส.พล.</td>\n</tr>\n<tr>\n<td>กรม (กรม ร.)</td>\n<td>ฝสส. (นายทหารฝ่ายการสื่อสาร)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>ข้อควรระวัง</strong>: ระดับกองทัพภาคใช้ตำแหน่ง <strong>ผบ.พัน.ส.ทภ.</strong> ไม่ใช่ \"ผบ.ส.ทภ.\" ตามที่ข้อสอบบางข้อตั้งเป็นตัวเลือกลวง (ให้สังเกตชื่อตำแหน่งที่ถูกต้องตามระดับหน่วยแต่ละชั้น)</p>\n<h3>หน่วยสื่อสารและหน่วยทหารสื่อสารตามระดับหน่วย (ห้ามสับสน)</h3>\n<ul>\n<li>ระดับ<strong>กองพัน</strong>: หน่วยสื่อสารคือ <strong>หมวด ส.</strong> (ไม่ใช่หมู่ ส.)</li>\n<li>ระดับ<strong>กรม</strong>: หน่วยสื่อสารคือ <strong>มว.ส. (หมวดสื่อสาร)</strong></li>\n<li>ระดับ<strong>กองพล</strong>: หน่วยทหารสื่อสารคือ <strong>พัน.ส.พล. (กองพันทหารสื่อสารกองพล)</strong></li>\n<li>ระดับ<strong>กองทัพภาค</strong>: หน่วยทหารสื่อสารคือ <strong>พัน.ส.ทภ. (กองพันทหารสื่อสารกองทัพภาค)</strong></li>\n</ul>\n<p>หมายเหตุ: การจัดหน่วยทหารสื่อสาร (ระดับ \"พัน.ส.\") จะสนับสนุนตั้งแต่ระดับ <strong>กองพลขึ้นไป</strong> เท่านั้น ส่วนหน่วยระดับต่ำกว่ากองพล (กรม/กองพัน) ใช้เพียง \"หน่วยสื่อสาร\" ขนาดหมวด/ตอน/หมู่ ไม่ใช่หน่วยทหารสื่อสารเต็มรูปแบบ</p>\n<h3>วงจรใช้ร่วม</h3>\n<p>ระบบการสื่อสารของกองพลที่ใช้ <strong>วงจรใช้ร่วม</strong> ก่อให้เกิดประโยชน์สูงสุดต่อระบบการสื่อสารของกองพล (เพราะสามารถแบ่งปันทรัพยากรสื่อสารระหว่างหลายหน่วยได้อย่างมีประสิทธิภาพ แทนที่จะแยกวงจรเฉพาะตัว)</p>\n<h3>ข่ายวิทยุ 7 ข่ายในหน่วยทหารราบ</h3>\n<p>ประกอบด้วย: <strong>บังคับบัญชา, อำนวยการยิง, การข่าวกรอง, ระวังป้องกัน, ยุทธการและการข่าว, ธุรการ/ส่งกำลังบำรุง, ศปย.</strong></p>\n<p>ข่ายวิทยุที่<strong>ไม่ใช่</strong>ข่ายในหน่วยทหารราบ คือ <strong>ข่ายสนับสนุนการรบ</strong> (ไม่ใช่หนึ่งใน 7 ข่ายมาตรฐาน)</p>\n<h3>ข่ายวิทยุระดับกองพล</h3>\n<ul>\n<li>ข่ายบังคับบัญชา/ยุทธการกองพล ประกอบด้วยสถานีวิทยุจาก ทก.หลัก, ทก.ยุทธวิธีกองพล, กรม ร., กรม ป., พัน ถ., พัน ช. — <strong>ยกเว้น บชร.</strong> (กองบัญชาการช่วยรบ ไม่ได้อยู่ในข่ายนี้)</li>\n<li>ข่ายสถานีวิทยุของข่ายบังคับบัญชา/ยุทธการกองพล: ทก.หลักและทก.ยุทธวิธีของกองพล ทำการสื่อสารไปยัง <strong>3 กรม ร., 1 กรม ป.พล., พัน ถ. และ พัน ช.</strong></li>\n<li>ข่ายการข่าวกรองของกองพล มีสถานีบังคับข่ายตั้งอยู่ที่ ทก.หลักของกองพล ทำงานให้ <strong>สธ.2</strong> เป็นหลัก แต่ผู้จัดตั้งเจ้าหน้าที่และเครื่องมือปฏิบัติการในการบังคับข่าย คือ <strong>พัน.ส.พล.</strong> (สธ.2 เป็นผู้ใช้งาน แต่ พัน.ส.พล. เป็นผู้จัดวางระบบให้)</li>\n<li>ความเร่งด่วนอันดับหนึ่งของการเชื่อมต่อการสื่อสารทางการบังคับบัญชาในข่ายงานหลายช่องการสื่อสาร คือ <strong>ทก.หลักกองพล - กรม ร./ม.</strong></li>\n</ul>\n<h3>หน่วยควบคุมการยิงสนับสนุนของกองพล</h3>\n<p>หน่วยที่เป็นศูนย์การควบคุมการใช้อาวุธยิงสนับสนุนของกองพล คือ <strong>ศปย.กรม ป.</strong> (ศูนย์ปฏิบัติการยิงของกรมทหารปืนใหญ่)</p>\n<h3>การจัดตั้งและบำรุงรักษาระบบการสื่อสารของ กรม ป.</h3>\n<p>ผู้มีหน้าที่จัดตั้งและบำรุงรักษาระบบการสื่อสารของกรมทหารปืนใหญ่ คือ <strong>ผบ.มว.ส. (ผู้บังคับหมวดสื่อสาร)</strong></p>\n<h3>ระบบปฏิบัติการในสนามรบ (BOS 7)</h3>\n<p>ระบบปฏิบัติการในสนามรบที่เกี่ยวข้องกับทหารสื่อสารมากที่สุด คือ <strong>การควบคุมบังคับบัญชา</strong> (Command and Control)</p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ข่ายวิทยุ 7 ข่ายของทหารราบ ต้องท่องให้ครบและแม่นชื่อ (มักมีตัวลวงคล้ายๆ กัน เช่น สลับ \"ลาดตระเวน\" กับ \"ยุทธการและการข่าว\")</li>\n<li>ระดับหน่วย vs ชื่อหน่วยสื่อสาร (หมู่/หมวด/ตอน/พัน) ต้องจับคู่ให้ถูกระดับ</li>\n<li>องค์ประกอบข่ายบังคับบัญชา/ยุทธการกองพล และหน่วยที่ไม่รวมอยู่ในข่าย (บชร.)</li>\n<li>ตำแหน่งฝ่ายอำนวยการสื่อสารแต่ละระดับหน่วย</li>\n</ul>\n<hr />\n<h2>11. หน่วยทหารสื่อสารพิเศษ/เฉพาะทาง</h2>\n<h3>กองพันทหารสื่อสาร หน่วยบัญชาการสงครามพิเศษ</h3>\n<ul>\n<li>ขีดความสามารถติดตั้ง ปฏิบัติการ และดำรงการสื่อสารระบบเครือข่ายข้อมูล ได้<strong>ไม่เกิน 6 ชุด</strong></li>\n<li>ขีดความสามารถปฏิบัติการและดำรงการสื่อสารทางสาย ได้<strong>ไม่เกิน 150 ชุด</strong></li>\n</ul>\n<h3>กองพันทหารสื่อสารซ่อมบำรุงเขตหลัง</h3>\n<p>สามารถจัดชุดซ่อมบำรุงเคลื่อนที่ เพื่อซ่อมบำรุงยุทโธปกรณ์สายสื่อสารขั้นสนาม สนับสนุนหน่วยซ่อมบำรุงของกองบัญชาการช่วยรบหรือหน่วยขึ้นตรงกองทัพบก ได้<strong>ไม่เกิน 6 ชุด</strong></p>\n<h3>จุดที่ข้อสอบชอบออก</h3>\n<ul>\n<li>ตัวเลขขีดความสามารถเฉพาะของหน่วยพิเศษเหล่านี้ (6 ชุดเครือข่ายข้อมูล, 150 ชุดทางสาย, 6 ชุดซ่อมบำรุงเคลื่อนที่) มักมีตัวเลขใกล้เคียงกันมาหลอก ต้องจำให้แม่นตัวเลขที่ถูกต้องของหน่วยแต่ละประเภท</li>\n</ul>\n<hr />\n<h2>สรุปภาพรวมเชิงเปรียบเทียบที่ควรจำแม่นก่อนสอบ</h2>\n<ol>\n<li><strong>ลำดับความปลอดภัยของมัชฌิม</strong>: พลนำสาร (สูงสุด) &gt; สาย &gt; ทัศนะสัญญาณ &gt; เสียงสัญญาณ &gt; วิทยุ (ต่ำสุด)</li>\n<li><strong>เส้นหลัก vs พื้นที่</strong>: เส้นหลัก = ตามสายบังคับบัญชา, เปลี่ยนเส้นทางน้อย; พื้นที่ = ตามภูมิศาสตร์/ความเหมาะสม, เปลี่ยนเส้นทางมาก, ดีระหว่างเคลื่อนย้าย</li>\n<li><strong>ดักรับ vs เฝ้าฟัง</strong>: ดักรับ = ฟังข้าศึก, เฝ้าฟัง = ฟังฝ่ายเราเอง</li>\n<li><strong>พัน.ส.พล. vs พัน.ส.ทภ.</strong>: พัน.ส.พล. มีตอนทหารสื่อสารกองพล+ตอนซ่อมบำรุงสายสื่อสาร (ไม่มีตอนเสนารักษ์); พัน.ส.ทภ. มีตอนเสนารักษ์ (ไม่มีตอนซ่อมบำรุงสายสื่อสาร+ตอนทหารสื่อสารกองพล)</li>\n<li><strong>ตัวเลขอัตราจัดที่ออกสอบบ่อย</strong>: พัน.ส.พล. จัดพลนำสาร 5 ชุด, วิทยุควบคุมอากาศยาน 5 ชุด, ข่ายนอกกองพล 4 ข่าย; พัน.ส.ทภ. สนับสนุน 2-4 กองพล, วิทยุถ่ายทอด 18 ชุด, สร้างสายสนาม 4 ชุด, ศูนย์ข่าว 1 ศูนย์</li>\n</ol>"}, {"subject": 4, "subjectTitle": "วิชาทั่วไป", "html": "<p>เอกสารนี้สังเคราะห์เนื้อหาความรู้จากคลังข้อสอบวิชา \"วิชาทั่วไป\" โดยจัดกลุ่มตามหัวข้อที่พบจริงในชุดข้อสอบ เพื่อใช้อ่านทบทวนก่อนสอบ ไม่ใช่การท่องจำเป็นข้อ ๆ</p>\n<h2>ประวัติศาสตร์ไทย: กรุงศรีอยุธยาและพระมหากษัตริย์</h2>\n<p><strong>การสถาปนาและการเสียกรุง</strong></p>\n<ul>\n<li>กรุงศรีอยุธยาสถาปนาขึ้นเมื่อ พ.ศ. 1893 โดย<strong>สมเด็จพระเจ้าอู่ทอง</strong> ซึ่งมีพระนามเต็มว่า <strong>สมเด็จพระรามาธิบดีที่ 1</strong></li>\n<li>ไทยเสียกรุงศรีอยุธยา <strong>ครั้งที่ 1</strong> เมื่อ พ.ศ. 2112 ตรงกับรัชสมัย<strong>สมเด็จพระมหินทราธิราช</strong> โดยในศึกครั้งนี้ <strong>สมเด็จพระสุพรรณกัลยา</strong> ทรงยอมถวายตัวเป็นตัวประกันแก่พม่าเพื่อแลกกับการปล่อยตัวสมเด็จพระเอกาทศรถ (พระอนุชา) กลับกรุงศรีอยุธยา ถือเป็นวีรกรรมการเสียสละที่สำคัญ</li>\n<li>ผู้กอบกู้เอกราชครั้งที่ 1 คือ <strong>สมเด็จพระนเรศวรมหาราช</strong></li>\n<li>ไทยเสียกรุงศรีอยุธยา <strong>ครั้งที่ 2</strong> เมื่อ พ.ศ. 2310 ตรงกับรัชสมัย<strong>พระเจ้าเอกทัศน์</strong> (สมเด็จพระที่นั่งสุริยาศน์อมรินทร์)</li>\n<li>ผู้กอบกู้เอกราชครั้งที่ 2 คือ <strong>สมเด็จพระเจ้าตากสินมหาราช</strong></li>\n</ul>\n<p><strong>พระมหากษัตริย์สำคัญในประวัติศาสตร์ไทย</strong></p>\n<ul>\n<li>\"๗ ตำนานสมเด็จพระบูรพกษัตริย์แห่งสยาม\" หมายถึงกลุ่มพระมหากษัตริย์ผู้ยิ่งใหญ่ในประวัติศาสตร์ไทย ซึ่งรวมถึงพ่อขุนรามคำแหงมหาราช, พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว (ร.4), พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกมหาราช (ร.1) แต่<strong>ไม่รวมสมเด็จพระรามาธิบดีที่ 1</strong> (พระเจ้าอู่ทอง)</li>\n<li>การจัดกองทัพสยามไปปราบ \"ฮ่อ\" (กบฏจีนฮ่อทางภาคเหนือ) เกิดขึ้นในรัชสมัย<strong>พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว (รัชกาลที่ 5)</strong></li>\n<li><strong>พระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว (รัชกาลที่ 6)</strong> ทรงเป็นพระมหากษัตริย์พระองค์แรกที่ทรงปลูกฝัง<strong>อุดมการณ์ชาตินิยม</strong> โดยเน้นรูปแบบความเป็นไทยไว้ที่สถาบัน<strong>ชาติ ศาสนา พระมหากษัตริย์</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> ลำดับเหตุการณ์การเสียกรุง 2 ครั้ง (ปี พ.ศ., รัชกาล/กษัตริย์ที่ครองราชย์ขณะเสียกรุง, ผู้กอบกู้แต่ละครั้ง) มักออกเป็นชุดถามสลับกันไปมาให้สับสน ต้องจำคู่ให้แม่น: เสียกรุงครั้งที่ 1 (2112, พระมหินทราธิราช) → กอบกู้โดยพระนเรศวร / เสียกรุงครั้งที่ 2 (2310, พระเจ้าเอกทัศน์) → กอบกู้โดยพระเจ้าตากสิน นอกจากนี้ยังออกเรื่องปีสถาปนากรุงศรีอยุธยา และรัชกาลที่ปราบฮ่อ</p>\n<hr />\n<h2>อุดมการณ์ชาติและเอกลักษณ์ความเป็นไทย</h2>\n<p><strong>ความหมายของอุดมการณ์</strong></p>\n<ul>\n<li><strong>อุดมการณ์</strong> หมายถึง ความคิด ความเชื่อเกี่ยวกับเป้าหมายสูงสุดของชีวิต เป็นแบบแผนแนวทางในการดำเนินชีวิตที่ดีและถูกต้องซึ่งกลุ่มยอมรับร่วมกัน และช่วยยึดเหนี่ยวสมาชิกของกลุ่มไว้ด้วยกัน โดยเกี่ยวข้องกับความคิด จินตนาการ และความดีงาม</li>\n<li>หากคนในชาติยึดมั่นในอุดมการณ์เดียวกัน จะก่อให้เกิดความสามัคคี ความร่วมมือร่วมใจ และพลังอำนาจของชาติที่ยิ่งใหญ่</li>\n<li>สิ่งที่<strong>ไม่ใช่</strong>อุดมการณ์ของชาติ คือ \"ความคิดของตัวเอง\" เพราะอุดมการณ์ของชาติต้องเป็นความคิดร่วมของส่วนรวม ไม่ใช่ความคิดเฉพาะบุคคล</li>\n</ul>\n<p><strong>สถาบันหลักของชาติ</strong></p>\n<ul>\n<li>สิ่งสำคัญของชาติ 3 ประการ และสิ่งที่คนไทยทุกคนต้องรักษาไว้เหนือสิ่งอื่นใด คือ <strong>ชาติ ศาสนา พระมหากษัตริย์</strong></li>\n<li>การสร้างความภาคภูมิใจในความเป็นไทย คือการเป็นคนดี มีความสามัคคี และรักชาติ ศาสนา พระมหากษัตริย์</li>\n</ul>\n<p><strong>เอกลักษณ์และอัตลักษณ์ความเป็นไทย</strong></p>\n<ul>\n<li>เอกลักษณ์ความเป็นไทย ได้แก่ ธงชาติไทย เพลงชาติไทย และการไหว้</li>\n<li>อัตลักษณ์ของความเป็นคนไทยไม่รวมถึงการ \"มีหน้ามีตาในสังคม\" ซึ่งเป็นค่านิยมส่วนบุคคล ไม่ใช่อัตลักษณ์ร่วมของชาติ</li>\n</ul>\n<p><strong>หลักธรรมาภิบาล</strong></p>\n<ul>\n<li>หลักธรรมาภิบาล 6 ประการ (การบริหารกิจการบ้านเมืองที่ดี) ได้แก่ หลักนิติธรรม หลักคุณธรรม หลักความโปร่งใส หลักการมีส่วนร่วม หลักความรับผิดชอบ และหลักความคุ้มค่า — ไม่มี \"หลักความรู้ หลักความคิด\" รวมอยู่ด้วย</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> คำถามแนว \"ข้อใดไม่ใช่...\" (ไม่ใช่อุดมการณ์ของชาติ, ไม่ใช่อัตลักษณ์คนไทย, ไม่ใช่หลักธรรมาภิบาล) เป็นรูปแบบที่ออกซ้ำบ่อยมาก ต้องจำองค์ประกอบที่ถูกต้องให้แม่นเพื่อคัดตัวลวงออก และต้องจำ \"ชาติ ศาสนา พระมหากษัตริย์\" เป็นแกนกลางของแทบทุกคำถามในหมวดนี้</p>\n<hr />\n<h2>อุดมการณ์และจรรยาบรรณทหาร</h2>\n<p><strong>ความหมายและมาตรฐานของอุดมการณ์ทหาร</strong></p>\n<ul>\n<li><strong>อุดมการณ์ทหาร</strong> คือ มาตรฐานแห่งความดีงามอันสุดยอดในหน้าที่ของนักรบของชาติ ที่ทหารทุกนายต้องมุ่งมั่นอุทิศตนให้บรรลุ</li>\n<li>มาตรฐานแห่งความดีงามของทหารประกอบด้วย 4 ด้าน คือ <strong>ความจงรักภักดี, ความรับผิดชอบต่อหน้าที่, การยึดมั่นในเกียรติยศศักดิ์ศรีทหาร, และความเสียสละ</strong><ul>\n<li>ความจงรักภักดีของทหาร ต้องมีต่อ ชาติ ศาสนา พระมหากษัตริย์ และผู้บังคับบัญชา</li>\n<li>ความรับผิดชอบต่อหน้าที่ หมายถึงความรับผิดชอบต่อภารกิจ ต่อเพื่อนร่วมงาน ต่อผู้ใต้บังคับบัญชา และต่อประชาชน</li>\n<li>ความยึดมั่นในเกียรติยศและศักดิ์ศรีของทหาร หมายถึงการเป็นผู้มีวินัย มีความซื่อสัตย์ และมีคุณธรรม</li>\n</ul>\n</li>\n</ul>\n<p><strong>จรรยาบรรณและคำขวัญ</strong></p>\n<ul>\n<li>จรรยาบรรณของข้าราชการทหารมีทั้งหมด <strong>14 ข้อ</strong></li>\n<li>จรรยาบรรณของทหารอาชีพ สรุปสั้น ๆ คือ <strong>ชาติ เกียรติ วินัย กล้าหาญ</strong></li>\n<li>คำขวัญของกองทัพบก คือ <strong>\"เพื่อชาติ ศาสน์ กษัตริย์ และประชาชน\"</strong></li>\n<li>ทหารอาชีพพึงหลีกเลี่ยง: การเปิดเผยข้อมูลของทางราชการ, การเสพของมึนเมาเกินขนาด, การเสพยาเสพติด และต้องมีวินัยทางการเงิน</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จับคู่ \"ด้านของมาตรฐานความดีงาม\" กับคำอธิบายที่ตรงกัน (จงรักภักดี/รับผิดชอบ/เกียรติยศ/เสียสละ) และจำตัวเลข/ถ้อยคำเฉพาะให้แม่น เช่น จรรยาบรรณทหาร 14 ข้อ, คำขวัญกองทัพบก, และคำว่า \"ชาติ เกียรติ วินัย กล้าหาญ\" สำหรับทหารอาชีพ</p>\n<hr />\n<h2>จิตอาสาและจิตสาธารณะ</h2>\n<p><strong>ความหมายของจิตอาสา</strong></p>\n<ul>\n<li><strong>จิตอาสา</strong> หมายถึง จิตแห่งความดีงามทั้งปวงแก่เพื่อนมนุษย์ โดยเต็มใจ สมัครใจ พร้อมเสียสละเวลา แรงกาย แรงสติปัญญา เพื่อประโยชน์สาธารณะ <strong>โดยไม่หวังผลตอบแทน</strong> เป็นจิตที่ไม่นิ่งดูดายต่อปัญหาหรือความทุกข์ยากของผู้อื่น</li>\n<li>สิ่งที่<strong>ไม่ใช่</strong>ความหมายของจิตอาสา คือ \"การคิดผลประโยชน์ตอบแทน\" เพราะจิตอาสาต้องทำโดยไม่หวังสิ่งใดตอบแทน</li>\n</ul>\n<p><strong>ประเภทของจิตอาสา</strong></p>\n<ul>\n<li>จิตอาสาแบ่งออกเป็น <strong>3 ประเภท</strong> ได้แก่<ol>\n<li><strong>จิตอาสาพัฒนา</strong> — กิจกรรมจิตอาสาพระราชทานเพื่อพัฒนาท้องถิ่น เช่น บำเพ็ญสาธารณประโยชน์ อนุรักษ์ธรรมชาติและสิ่งแวดล้อม อำนวยความสะดวกและความปลอดภัยในชีวิตประจำวัน การขยายผลศาสตร์พระราชาและปรัชญาเศรษฐกิจพอเพียง</li>\n<li><strong>จิตอาสาภัยพิบัติ</strong></li>\n<li><strong>จิตอาสาเฉพาะกิจ</strong></li>\n</ol>\n</li>\n</ul>\n<p><strong>จิตสาธารณะ</strong></p>\n<ul>\n<li><strong>จิตสาธารณะ</strong> หมายถึง จิตสำนึกเพื่อส่วนรวม แสดงออกผ่านการช่วยเหลืองานด้วยความเต็มใจโดยไม่หวังสิ่งตอบแทน</li>\n<li>วิธีพัฒนาจิตสาธารณะที่ดีที่สุด คือ <strong>การพัฒนาที่ตัวเอง</strong> ก่อนเป็นอันดับแรก</li>\n</ul>\n<p><strong>ค่านิยมหลักของคนไทย</strong></p>\n<ul>\n<li>หน่วยงานที่เป็นผู้กำหนด<strong>ค่านิยมหลัก 12 ประการ</strong> คือ <strong>คสช. (คณะรักษาความสงบแห่งชาติ)</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกความแตกต่างระหว่าง \"จิตอาสา\" กับ \"จิตสาธารณะ\" และจำจำนวน/ชื่อประเภทของจิตอาสาทั้ง 3 ประเภทให้แม่น รวมถึงจับผิดตัวเลือกที่ขัดกับหลัก \"ไม่หวังผลตอบแทน\"</p>\n<hr />\n<h2>หลักธรรมทางพระพุทธศาสนาในชีวิตประจำวัน</h2>\n<p><strong>พรหมวิหาร 4 (ธรรมสำหรับผู้ใหญ่/ผู้ปกครอง)</strong></p>\n<ul>\n<li>พรหมวิหาร 4 ได้แก่ เมตตา กรุณา <strong>มุทิตา</strong> และอุเบกขา</li>\n<li><strong>ความริษยา</strong> (ไม่อยากให้ผู้อื่นได้ดี) จะดับได้ด้วยการเจริญ <strong>มุทิตา</strong> (ความยินดีเมื่อผู้อื่นได้ดี)</li>\n<li>การเจริญ<strong>เมตตา</strong>ให้มาก ๆ จะส่งผลให้ไม่คิดอาฆาตพยาบาทผู้อื่น</li>\n</ul>\n<p><strong>หัวใจเศรษฐี (ทิฏฐธัมมิกัตถประโยชน์ 4 / อุ อา กะ สะ)</strong></p>\n<ul>\n<li>คำสรุปที่นิยมท่องจำคือ \"ขยันหา รักษาดี มีกัลยาณมิตร ใช้ชีวิตพอเพียง\" ซึ่งตรงกับหลักธรรม<strong>หัวใจเศรษฐี</strong> ประกอบด้วย<ul>\n<li>อุฏฐานสัมปทา — ขยันหาทรัพย์</li>\n<li>อารักขสัมปทา — รักษาทรัพย์ที่หามาได้</li>\n<li>กัลยาณมิตตตา — คบคนดีเป็นมิตร</li>\n<li>สมชีวิตา — ใช้ชีวิตพอเพียง เหมาะสมกับรายได้</li>\n</ul>\n</li>\n</ul>\n<p><strong>สุขของผู้ครองเรือน (ฆราวาสธรรม/สุข 4)</strong></p>\n<ul>\n<li>ความสุขของผู้ครองเรือนมี 4 ประการ คือ <strong>อัตถิสุข</strong> (สุขจากการมีทรัพย์), <strong>โภคสุข</strong> (สุขจากการใช้จ่ายทรัพย์), <strong>อนวัชชสุข</strong> (สุขจากความประพฤติที่ไม่มีโทษ ไม่ผิดกฎหมาย ไม่ผิดศีลธรรม) และ<strong>อนณสุข</strong> (สุขจากความไม่เป็นหนี้)</li>\n<li>ดังนั้น \"สุขจากการกู้หนี้\" <strong>ไม่ใช่</strong>ความสุขของผู้ครองเรือน ตรงข้ามกับหลักอนณสุขที่เน้นความไม่เป็นหนี้</li>\n<li>คนที่มีความประพฤติดี ไม่ผิดกฎหมายและไม่ผิดศีลธรรม จัดเป็น <strong>อนวัชชสุข</strong> ซึ่งการรักษาศีล 5 ก็จัดอยู่ในความสุขข้อนี้ (ข้อที่ 3 ตามลำดับ อัตถิ-โภค-อนวัชช-อนณ)</li>\n</ul>\n<p><strong>สันโดษ</strong></p>\n<ul>\n<li><strong>ยถาลาภสันโดษ</strong> คือความพอใจในลาภ (สิ่งของ) ที่ตนมีอยู่ตามที่หามาได้ ไม่โลภอยากได้ของผู้อื่น</li>\n<li>หลักธรรมที่ถือเป็นภูมิคุ้มกันการทุจริตคือ <strong>สันโดษ</strong> (ความพอใจในสิ่งที่ตนมี ทำให้ไม่โลภแสวงหาโดยมิชอบ)</li>\n</ul>\n<p><strong>พฤติกรรมและวัฒนธรรม</strong></p>\n<ul>\n<li>พฤติกรรมที่ <strong>ไม่ใช่</strong>แบบอย่างที่มาจากพระพุทธศาสนา คือ การอวดดี ถือตัว (ขัดกับหลักความอ่อนน้อมถ่อมตนในพุทธศาสนา)</li>\n<li>วัฒนธรรมที่ถ่ายทอดออกมาเป็นศิลปะที่ไม่เป็นรูปธรรม (นามธรรม) คือ <strong>ดนตรี</strong> (ต่างจากศิลปะที่จับต้องได้ เช่น งานปั้น งานแกะสลัก)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> เน้นจับคู่ \"หลักธรรม\" กับ \"คำอธิบาย/คำสรุปยอดนิยม\" เช่น หัวใจเศรษฐี = ขยันหา รักษาดี มีกัลยาณมิตร ใช้ชีวิตพอเพียง, และมักถามแนว \"ข้อใดไม่ใช่/ไม่จัดเป็น...\" เพื่อทดสอบว่าจำองค์ประกอบครบทุกข้อหรือไม่ (เช่น สุข 4 ประการของผู้ครองเรือน)</p>\n<hr />\n<h2>กฎหมายและกระบวนการยุติธรรม</h2>\n<p><strong>ระบบศาลไทย</strong></p>\n<ul>\n<li>ประเทศไทยใช้ระบบ<strong>กฎหมายลายลักษณ์อักษร</strong> (Civil Law) ไม่ใช่ระบบกฎหมายจารีตประเพณี (Common Law)</li>\n<li><strong>ศาลยุติธรรม</strong> ของไทยมี 3 ชั้น คือ ศาลชั้นต้น ศาลอุทธรณ์ และศาลฎีกา — <strong>ศาลปกครองกลาง</strong> ไม่ใช่ศาลยุติธรรม แต่อยู่ในระบบศาลปกครองซึ่งเป็นคนละระบบ</li>\n<li>ศาลทหารในเวลาปกติ ประกอบด้วยศาลทหารชั้นต้น ศาลทหารกลาง และศาลทหารสูงสุด — \"ศาลประจำหน่วยทหาร\" <strong>ไม่ใช่</strong>ศาลทหารในเวลาปกติ</li>\n</ul>\n<p><strong>หมายจับ หมายค้น และการดำเนินคดี</strong></p>\n<ul>\n<li>อำนาจในการออกหมายค้นและหมายจับเป็นของ <strong>ศาล</strong> เท่านั้น</li>\n<li>หมายจับสามารถใช้บังคับได้ <strong>ทั่วราชอาณาจักร</strong></li>\n<li>ผู้มีสิทธิยื่นฟ้องคดีต่อศาล ได้แก่ <strong>ผู้เสียหาย</strong> และ <strong>พนักงานอัยการ</strong></li>\n<li>ในคดีอาญา ต้องสันนิษฐานไว้ก่อนว่าผู้ต้องหาหรือจำเลย <strong>เป็นผู้บริสุทธิ์</strong> จนกว่าจะมีคำพิพากษาถึงที่สุด (หลัก Presumption of Innocence)</li>\n</ul>\n<p><strong>โทษทางอาญาและการบรรลุนิติภาวะ</strong></p>\n<ul>\n<li>โทษทางอาญาตามประมวลกฎหมายอาญามี 5 สถาน คือ ประหารชีวิต จำคุก กักขัง ปรับ และริบทรัพย์สิน — <strong>\"จำขัง\" ไม่ใช่โทษทางอาญา</strong> (คำที่ถูกต้องคือ \"กักขัง\")</li>\n<li>วิธีการประหารชีวิตตามคำพิพากษาศาลยุติธรรมของไทยในปัจจุบัน คือ <strong>การฉีดสารพิษ (ฉีดยาให้ตาย)</strong></li>\n<li>บุคคลจะบรรลุนิติภาวะเมื่อมีอายุ <strong>20 ปีบริบูรณ์</strong> (หรือเมื่อสมรสโดยชอบด้วยกฎหมาย)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> คำถามแนว \"ข้อใดไม่ใช่...\" เกี่ยวกับประเภทศาลและประเภทโทษทางอาญา มักใช้คำใกล้เคียงหลอก (เช่น \"จำขัง\" แทน \"กักขัง\", \"ศาลปกครองกลาง\" ปนกับศาลยุติธรรม) ต้องอ่านตัวเลือกให้ละเอียด และจำหลักการพื้นฐาน เช่น อำนาจออกหมายเป็นของศาล และหลักสันนิษฐานความบริสุทธิ์</p>\n<hr />\n<h2>ภาษาอังกฤษ: คำศัพท์ (Vocabulary)</h2>\n<p>ข้อสอบเน้นคำศัพท์ที่ใช้ในชีวิตประจำวันและบริบทการทำงาน ควรจำความหมายดังนี้</p>\n<ul>\n<li><strong>best</strong> = ดีที่สุด (very good)</li>\n<li><strong>bank</strong> = สถานที่เก็บรักษาเงิน</li>\n<li><strong>regret</strong> = รู้สึกเสียใจ/สำนึกผิด (to feel sorry)</li>\n<li><strong>terrible</strong> = รุนแรง แย่มาก เช่น a terrible headache (ปวดหัวรุนแรง)</li>\n<li><strong>borrow</strong> = ยืม (ของ/เงิน จากผู้อื่นมาใช้)</li>\n<li><strong>worry (about)</strong> = กังวลใจ (เรื่องใดเรื่องหนึ่ง)</li>\n<li><strong>varies</strong> = แปรผัน เปลี่ยนแปลงไปตามเงื่อนไข (vary according to...)</li>\n<li><strong>seated</strong> = ถูกจัดให้นั่ง (please wait to be seated)</li>\n<li><strong>suspicious</strong> = สงสัย ไม่แน่ใจ ระแวง</li>\n<li><strong>terminate</strong> = ยกเลิก/บอกเลิก (เช่น สัญญาจ้าง terminate a contract)</li>\n<li><strong>complicated</strong> = ซับซ้อน (ใช้บรรยายลักษณะนิสัย/ไลฟ์สไตล์ที่ยุ่งยาก หรูหรา)</li>\n<li><strong>unexpectedly</strong> = อย่างไม่คาดคิด</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> เลือกคำศัพท์ให้ตรงกับคำนิยามภาษาอังกฤษที่ให้มา (Which word means...) และเลือกคำศัพท์ให้เหมาะกับบริบทประโยค (fill in the blank) ควรฝึกจำคำศัพท์เป็นกลุ่มความหมายและตัวอย่างประโยคใช้งานจริง</p>\n<hr />\n<h2>ภาษาอังกฤษ: ไวยากรณ์และโครงสร้างประโยค (Grammar)</h2>\n<p><strong>Tenses ที่ออกสอบบ่อย</strong></p>\n<ul>\n<li><strong>Present continuous เพื่อสิ่งที่กำลังจะเกิดขึ้น</strong>: \"The train is coming\" (เหตุการณ์ใกล้จะเกิดขึ้นแน่นอน)</li>\n<li><strong>Simple past</strong>: \"Bob lost in the tournament\", \"I called you yesterday, but you didn't answer\"</li>\n<li><strong>Past continuous</strong>: \"We were having a good time until Jane came in\" (เหตุการณ์กำลังดำเนินอยู่ ถูกขัดจังหวะด้วยเหตุการณ์อื่นในอดีต)</li>\n<li><strong>Present perfect continuous</strong>: \"Nick has been fixing that bicycle for 4 hours now\" (เน้นการกระทำที่ต่อเนื่องมาจนถึงปัจจุบัน มักใช้กับ for/since)</li>\n<li><strong>Reported speech (การเปลี่ยน will เป็น would)</strong>: \"She said that she would be there tomorrow morning\"</li>\n<li><strong>Zero conditional (ความจริงทั่วไป)</strong>: \"If you keep water in the freezer, it turns into ice\" (ใช้ present simple ทั้งสองประโยคย่อย เพราะเป็นข้อเท็จจริงที่เกิดขึ้นเสมอ)</li>\n</ul>\n<p><strong>โครงสร้างประโยคอื่น ๆ</strong></p>\n<ul>\n<li><strong>บุพบทบอกตำแหน่ง (preposition of place)</strong>: \"between\" ใช้เมื่อสิ่งหนึ่งอยู่ระหว่างสองสิ่ง เช่น \"My house is between the hospital and the school\"</li>\n<li><strong>Compound adjective</strong>: \"English-speaking people\" (คำคุณศัพท์ผสมจากภาษา + speaking)</li>\n<li><strong>Embedded/indirect question</strong>: \"Tell me what you did yesterday\" (เรียงคำแบบประโยคบอกเล่า ไม่ใช่คำถามตรง)</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์เติมคำในช่องว่างเพื่อทดสอบ tense ที่เหมาะสมกับ time signal ในประโยค (yesterday, now, for 4 hours, tomorrow) และโครงสร้างประโยคคำถามทางอ้อม (indirect question) ต้องสังเกตคำบ่งชี้เวลาให้แม่นเพื่อเลือก tense ที่ถูกต้อง</p>\n<hr />\n<h2>ภาษาอังกฤษ: บทสนทนา สำนวน และป้ายประกาศ (Functional Language &amp; Signs)</h2>\n<p><strong>การตีความป้าย/ประกาศ (Signs)</strong></p>\n<ul>\n<li>\"PETS ARE NOT ALLOWED HERE\" → มักพบใน<strong>ร้านอาหาร</strong> (at the restaurant)</li>\n<li>\"CAUTION: BEWARE OF THE ELEPHANT!\" → ความหมายคือ <strong>ต้องขับรถช้า ๆ</strong> (drive slowly)</li>\n<li>\"DO NOT DISTURB\" → หมายถึง <strong>ห้ามเคาะประตูหรือเข้าไปรบกวน</strong></li>\n</ul>\n<p><strong>สำนวนและมารยาททางสังคม (Functional expressions)</strong></p>\n<ul>\n<li>ขึ้นต้นประโยคขอความช่วยเหลือ/ถามทาง: <strong>\"Excuse me\"</strong></li>\n<li>ตอบเมื่อไม่รู้ทางเช่นกัน: <strong>\"I'm sorry. I'm a stranger here myself.\"</strong></li>\n<li>เสนอเครื่องดื่ม/ของกิน: <strong>\"Would you like...?\"</strong></li>\n<li>ปลอบใจผู้ป่วย/ผู้บาดเจ็บ: <strong>\"Hope you recover soon.\"</strong></li>\n<li>ขอโทษเมื่อทำผิดพลาด (เช่น เสิร์ฟเนื้อสัตว์ให้คนกินเจ): <strong>\"I'm terribly sorry! I'll change your plate for you.\"</strong></li>\n<li>\"I'll keep my fingers crossed\" = สำนวนอวยพรให้โชคดี มีความหมายเดียวกับ <strong>\"I wish you luck\"</strong></li>\n<li>เมื่อเห็นห้อง/ที่รกมาก บอกให้ทำความสะอาด: <strong>\"Clean up your mess right now\"</strong></li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> โจทย์แนว \"situational language\" ให้บริบทสถานการณ์มาแล้วถามว่าควรพูดอะไร/ป้ายนี้หมายถึงอะไร/ควรทำอะไร ต้องฝึกจำสำนวนสำเร็จรูป (idiomatic expressions) ที่ใช้ในสถานการณ์เฉพาะให้คุ้นเคย เพราะแปลตรงตัวจากคำศัพท์เพียงอย่างเดียวมักตอบผิด</p>\n<hr />\n<h2>ภาษาอังกฤษ: การอ่านจับใจความ (Reading Comprehension)</h2>\n<p>บทความสั้นในข้อสอบมักเป็นเรื่องราวในชีวิตประจำวัน ประกาศ หรือบทความให้ความรู้ โดยถามใจความสำคัญ/รายละเอียด/สถานที่/ที่มาของเหตุการณ์ ตัวอย่างแนวเนื้อหาที่พบ:</p>\n<ul>\n<li>บทความโฆษณาขนม (Khao Tan/ข้าวตัง) — ถามหาคุณค่าทางโภชนาการที่<strong>ไม่ได้กล่าวถึง</strong> ในบทความ (เช่น Iron ไม่ได้ถูกระบุไว้) ต้องอ่านละเอียดว่าบทความกล่าวถึงสารอาหารใดบ้างจริง ๆ</li>\n<li>บทความเล่าเรื่องงานกีฬาสี (sports day) — ถามใจความที่ตรงกับเนื้อเรื่อง เช่น ผู้เล่นแต่งกายด้วยชุดที่น่าสนใจ</li>\n<li>บทความงานปาร์ตี้คริสต์มาส — ถามรายละเอียดสิ่งที่ตัวละครสวมใส่ (ชุดสีขาว)</li>\n<li>บทความอธิบายการเกิดฝน (water cycle) — ถามใจความหลักของทั้งบทความ (เช่น \"where rain comes from\")</li>\n<li>บทความเกี่ยวกับความสำคัญของอาหารเช้า — ใจความหลักคือทุกคนควรกินอาหารเช้าทุกวัน</li>\n<li>ประกาศตามหาเด็กหาย (department store announcement) — ถามสถานที่ที่ประกาศนี้เกิดขึ้น (ห้างสรรพสินค้า)</li>\n<li>อีเมลตอบกลับลูกค้าจากศูนย์บริการ (AIS Call center) — ใจความหลักคือการขอบคุณลูกค้า</li>\n<li>บทความเกี่ยวกับพระราชพิธีวันสงกรานต์ที่พระที่นั่งอมรินทรวินิจฉัย — พระมหากษัตริย์ทรง<strong>ประกอบ (performs)</strong> พระราชพิธี</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> เน้นถามใจความสำคัญโดยรวม (main idea) ของย่อหน้า และรายละเอียดเฉพาะที่ปรากฏ/ไม่ปรากฏในเนื้อเรื่อง (detail/NOT-stated question) ต้องอ่านบทความทั้งหมดอย่างละเอียดก่อนตอบ ไม่ควรเดาจากคำที่คุ้นตาเพียงคำเดียว</p>"}, {"subject": 5, "subjectTitle": "วิชาส่งกำลังบำรุงและซ่อมบำรุง", "html": "<p>สรุปนี้สังเคราะห์จากคลังข้อสอบ 100 ข้อ (รหัสข้อ 860-959) โดยดึงเฉพาะความรู้ที่แฝงอยู่ในคำถามและเฉลยมาจัดกลุ่มเป็นหัวข้อความรู้ ไม่ใช่การท่องจำเป็นข้อ ๆ</p>\n<hr />\n<h2>1. โครงสร้างหน่วยงานส่งกำลังบำรุงระดับกองทัพบก</h2>\n<p>การส่งกำลังบำรุงของกองทัพบกเป็นความรับผิดชอบร่วมของหน่วยฝ่ายเสนาธิการ ฝ่ายยุทธบริการ และฝ่ายกิจการพิเศษ ดังนี้</p>\n<ul>\n<li><strong>กรมฝ่ายเสนาธิการ (ฝสธ.)</strong> ที่รับผิดชอบด้านส่งกำลังบำรุงมี 2 หน่วย คือ <strong>กรมข่าวทหารบก (ขว.ทบ.)</strong> และ <strong>กรมส่งกำลังบำรุงทหารบก (กบ.ทบ.)</strong> โดย ขว.ทบ. รับผิดชอบเฉพาะเรื่อง<strong>การควบคุมและแจกจ่ายแผนที่ทหารและภาพถ่ายทางอากาศ</strong> ให้หน่วยต่าง ๆ (ไม่ใช่งานข่าวกรองหรือเชลยศึกซึ่งเป็นภารกิจข่าวกรองทั่วไปของ ขว.ทบ. ในบทบาทอื่น)</li>\n<li><strong>กรมฝ่ายยุทธบริการ (ฝยบ.)</strong> มีทั้งหมด <strong>9 กรม</strong> ได้แก่ กช. (การทหารช่าง), สส. (การทหารสื่อสาร), พบ.ทบ. (การแพทย์ทหารบก), สพ.ทบ. (สรรพาวุธทหารบก), ขส.ทบ. (การขนส่งทหารบก), ยย.ทบ. (การยุทธโยธาทหารบก), พธ.ทบ. (พลาธิการทหารบก), กส.ทบ. (การสัตว์ทหารบก), วศ.ทบ. (วิทยาศาสตร์ทหารบก) — ต้องจำครบทั้ง 9 กรมนี้ เพราะข้อสอบมักสลับใส่หน่วยแปลกปลอม (เช่น ขว.ทบ., นรด., สห.ทบ.) ปนเข้ามาให้เลือกผิด</li>\n<li><strong>กรมฝ่ายกิจการพิเศษ (ฝกษ.)</strong> ที่รับผิดชอบงานส่งกำลังบำรุง ได้แก่ <strong>สก.ทบ. (กรมสวัสดิการทหารบก), สบ.ทบ. (กรมสารบรรณทหารบก)</strong> และหน่วยฝึกศึกษา/รักษาดินแดนที่เกี่ยวข้อง (นรด.) — ข้อสอบชอบเอาหน่วยฝ่ายกิจการพิเศษอื่นที่ไม่เกี่ยวกับส่งกำลังบำรุง (เช่น สห.ทบ., สตช.ทบ., สวพ.ทบ.) มาปน</li>\n</ul>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> จำแนกว่าหน่วยใดสังกัด ฝสธ./ฝยบ./ฝกษ. และแต่ละฝ่ายรับผิดชอบด้านส่งกำลังบำรุงเรื่องใดโดยเฉพาะ (โดยเฉพาะบทบาทเฉพาะของ ขว.ทบ. เรื่องแผนที่/ภาพถ่ายทางอากาศ) ต้องท่องจำรายชื่อ 9 กรมฝ่ายยุทธบริการให้ครบและไม่สลับกับหน่วยฝ่ายอื่น</p>\n<hr />\n<h2>2. หน่วยงานและการจัดหน่วยส่งกำลัง-ซ่อมบำรุงสายสื่อสาร (สส.)</h2>\n<p>เป็นหัวใจของวิชานี้ เพราะข้อสอบเน้นถามโครงสร้างเฉพาะของสายสื่อสารมากที่สุด</p>\n<p><strong>หน่วยงานหลักในกรมการทหารสื่อสาร (สส.):</strong></p>\n<ul>\n<li><strong>กคส.สส. (กองคลังสื่อสาร กรมการทหารสื่อสาร)</strong> — ทำหน้าที่<strong>ส่งกำลัง</strong> สป.สาย ส. ในระดับคลัง และเป็นหน่วยสนับสนุนด้านส่งกำลัง สป.สาย ส. ในระดับ ทบ. หน่วยนอกกองทัพภาคที่ตั้งถาวรในพื้นที่ ทภ.1 (8 จังหวัด ได้แก่ กรุงเทพฯ นครปฐม ปทุมธานี สมุทรสาคร สมุทรปราการ นนทบุรี อยุธยา นครนายก — ไม่รวมสระบุรี ลพบุรี ปราจีนบุรี) สามารถขอรับการสนับสนุนส่งกำลังโดยตรงจาก กคส.สส. ได้</li>\n<li><strong>กซสอ.สส.</strong> — เป็น นขต.สส. ระดับกอง ทำหน้าที่<strong>ซ่อมบำรุง</strong> สป.สาย ส. โดยเฉพาะ สป.นอก อจย. และเครื่องมืออิเล็กทรอนิกส์ในระดับคลัง</li>\n<li><strong>พัน.ส.ซบร.เขตหลัง</strong> — เป็น นขต.ทบ. ทำหน้าที่<strong>ซ่อมบำรุงระดับคลัง</strong> ภารกิจคือซ่อมบำรุงขั้นสนามและขั้นคลัง<strong>เฉพาะยุทโธปกรณ์สาย ส. ตาม อจย.เท่านั้น</strong> (ไม่ใช่ทุกสาย) ในยามสงครามมีอัตรา 3 กองร้อย และจะขยายเป็น 4 กองร้อยเมื่อมีหน่วยรบหลักมากกว่า 18 กองพล และสามารถจัดชุดซ่อมเคลื่อนที่สนับสนุนซ่อมบำรุงขั้นสนามให้ บชร.และ นขต.ทบ. ได้ไม่เกิน <strong>6 ชุด</strong></li>\n<li><strong>หน่วยซ่อมบำรุงสาย ส. ระดับ ทบ.</strong> โดยรวม คือ <strong>พัน.ส.ซบร.เขตหลัง + กซสอ.สส.</strong></li>\n</ul>\n<p><strong>การจัดหน่วยสายสื่อสารตามระดับ:</strong></p>\n<ul>\n<li>ระดับกองพล: หน่วยสนับสนุนด้านส่งกำลังและซ่อมบำรุง สป.สาย ส. คือ <strong>พัน.ส.พล. และ กรม สน.พล.</strong> ตอนส่งกำลังและตอนซ่อมบำรุงของ พัน.ส.พล. ควรตั้งใกล้ กอง สพบ.พล./กอง พธ.พล. หรือใกล้ชุดซ่อม</li>\n<li>ระดับกองทัพภาค: <strong>พัน.ส.ทภ.</strong> มีภารกิจปฏิบัติการสื่อสารให้ ทภ.และ นขต.เท่านั้น ส่วนงานส่งกำลังบำรุงสาย ส. เป็นหน้าที่ บชร.และ นขต. ดังนั้นการจัดหน่วยของ พัน.ส.ทภ. จึง<strong>ไม่มี \"ตอนซ่อมบำรุงสายสื่อสาร\"</strong> ต่างจาก พัน.ส.พล.</li>\n<li><strong>บชร. (กองบัญชาการช่วยรบ)</strong> จัดหน่วยส่งกำลังบำรุงให้ได้ <strong>1 ส่วนแยก/กองพล</strong> และจัดชุดซ่อมเคลื่อนที่สาย ส. สนับสนุนภารกิจกองทัพภาคได้ <strong>2 ชุด</strong></li>\n<li><strong>พัน.ซบร.บชร.</strong> รับผิดชอบซ่อมบำรุง สป.สาย ส. สนับสนุนกองทัพภาค โดยหน่วยในอัตราที่รับผิดชอบคือ <strong>กองร้อยซ่อมบำรุงยุทโธปกรณ์ที่ 1</strong></li>\n<li><strong>กรมการทหารสื่อสาร</strong> รับผิดชอบการส่งกำลังระดับคลังต่อ <strong>สป.2 และ สป.4 สาย ส.</strong></li>\n</ul>\n<p><strong>ฐานะของหน่วยใช้:</strong> หน่วยใช้ สป.สาย ส. หมายถึง <strong>ทุกหน่วยที่ได้รับประโยชน์จาก สป.สาย ส.</strong> (ไม่จำกัดเฉพาะระดับกองพันหรือกองร้อยขึ้นไป) เช่น กองพันทหารสื่อสารของกองทัพภาค (เช่น ส.พัน.23) ก็มีฐานะเป็น \"หน่วยใช้\" ในสายการส่งกำลัง สป.2 และ 4 สาย ส. ส่วน<strong>หน่วยสนับสนุนทั่วไป</strong> หมายถึงหน่วยสนับสนุนระดับ ทภ. คือ <strong>บชร.</strong></p>\n<p><strong>นิยามอื่น:</strong> สป.2 คือ สป.ตามอัตราที่อนุมัติให้หน่วยมีไว้ในครอบครอง ระบุใน <strong>อจย., อสอ. หรือบัญชีแบ่งมอบอื่น ๆ</strong> และ<strong>ตำบลส่งกำลัง (ตส.)</strong> คือ ที่ตั้งและปฏิบัติงาน<strong>ส่งกำลัง</strong>เท่านั้น (ไม่รวมซ่อมบำรุง ต่างจากคำว่า \"ตำบลซ่อมบำรุง\")</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกความแตกต่างระหว่างหน่วย \"ส่งกำลัง\" (กคส.สส.) กับหน่วย \"ซ่อมบำรุง\" (กซสอ.สส., พัน.ส.ซบร.เขตหลัง) ในแต่ละระดับ, จำนวนชุดซ่อมเคลื่อนที่/จำนวนกองร้อยที่เปลี่ยนแปลงตามเงื่อนไข, และความแตกต่างของการจัดหน่วยระหว่าง พัน.ส.พล. กับ พัน.ส.ทภ.</p>\n<hr />\n<h2>3. หลักนิยม นโยบาย และแนวความคิดการส่งกำลังบำรุงของกองทัพบก</h2>\n<p><strong>ที่มา:</strong> พ.ร.บ.จัดระเบียบราชการกระทรวงกลาโหม พ.ศ.2551 กำหนดให้ ทบ. เป็นส่วนราชการขึ้นตรงกับกองบัญชาการกองทัพไทย มีหน้าที่เตรียมกำลังและใช้กำลัง โดยมี ผบ.ทบ. รับผิดชอบ พันธกิจที่เกี่ยวข้องกับการส่งกำลังบำรุงโดยตรงคือ <strong>\"ความต่อเนื่องในการรบ\"</strong></p>\n<p><strong>เอกสารหลัก:</strong> คำสั่ง ทบ.ที่ 333/2562 ลง 29 ส.ค.62 คือคำสั่งที่กล่าวถึงภารกิจ นโยบาย แนวความคิด และความรับผิดชอบในการส่งกำลังบำรุง — เรียกว่า <strong>\"หลักนิยมการส่งกำลังบำรุง\"</strong> ของกองทัพบก ถือเป็นเสมือนหัวใจของงานส่งกำลังบำรุง</p>\n<p><strong>องค์ประกอบของหลักนิยมการส่งกำลังบำรุง:</strong></p>\n<ul>\n<li><strong>ภารกิจ</strong>: การสนับสนุนทางการส่งกำลังบำรุงแก่หน่วยต่าง ๆ ใน ทบ. เพื่อให้หน่วยสามารถทรงชีพยามปกติและปฏิบัติภารกิจสำเร็จตามแผนป้องกันชายแดน/แผนป้องกันประเทศ</li>\n<li><strong>นโยบาย</strong>: รวมการสนับสนุน, ความเชื่อถือได้, การได้ส่วนสัมพันธ์ (นโยบายไม่ได้ระบุว่า \"สนับสนุนจากข้างหน้าไปข้างหลัง\" — ทิศทางการสนับสนุนที่ถูกต้องคือจากข้างหลังไปข้างหน้า)</li>\n<li><strong>แนวความคิด</strong>: ใช้ระบบส่งกำลังบำรุงระบบเดียวกันทั้งยามปกติและยามสงครามให้มากที่สุดเท่าที่ทำได้, จัดสะสม สป.สำรองสงครามและเตรียมระดมสรรพกำลังไว้ให้พร้อม, จัดหน่วยส่งกำลังบำรุงให้เพียงพอและได้ส่วนสัมพันธ์กับหน่วยกำลังรบ (ไม่ใช่การมอบความรับผิดชอบให้ บชร.เป็นหน่วยดำเนินการสนับสนุนหน่วยใช้ในเขตพื้นที่ให้มากที่สุดเพียงหน่วยเดียว)</li>\n<li><strong>ความรับผิดชอบ</strong>: ความรับผิดชอบโดยทั่วไปเป็นของ <strong>ผบ.หน่วยทุกระดับ, หน่วยใช้, และหน่วยให้การสนับสนุน</strong></li>\n</ul>\n<p><strong>ปัจจัยสำคัญที่ทำให้การส่งกำลังบำรุงมีประสิทธิภาพและประสบผลสำเร็จ</strong> คือ <strong>คน เงิน และระบบที่เหมาะสม</strong> (ไม่ใช่ \"การทันเวลา\" ซึ่งเป็นผลลัพธ์ที่ตามมา ไม่ใช่ปัจจัยพื้นฐาน)</p>\n<p><strong>ขอบเขตของการส่งกำลังบำรุง</strong> หมายถึง <strong>การส่งกำลัง การซ่อมบำรุง การขนส่ง การบริการทางการแพทย์ และบริการอื่น ๆ</strong></p>\n<p><strong>วงรอบการส่งกำลัง (Logistics Cycle)</strong> ประกอบด้วย 5 ขั้นตอนต่อเนื่อง: <strong>ความต้องการ → การจัดหา → การแจกจ่าย → การจำหน่าย → การควบคุม</strong> (การควบคุมแทรกอยู่ตลอดทุกขั้นตอน)</p>\n<p><strong>การสนับสนุนการช่วยรบ</strong> ในการปฏิบัติการทางทหาร คือการสนับสนุนงานที่อยู่ในความรับผิดชอบของ <strong>สธ.4 (ส่งกำลังบำรุง), สธ.1 (กำลังพล) และ สธ.5 (กิจการพลเรือน)</strong> รวมกัน</p>\n<p><strong>จุดที่ข้อสอบชอบออก:</strong> แยกให้ออกระหว่าง \"ภารกิจ\" \"นโยบาย\" \"แนวความคิด\" \"ความรับผิดชอบ\" ว่าข้อความใดอยู่หมวดไหน และจำวงรอบการส่งกำลัง 5 ขั้นตอนให้แม่นตามลำดับ (ความต้องการ-จัดหา-แจกจ่าย-จำหน่าย-ควบคุม) เพราะข้อสอบมักสลับคำหรือใส่คำอื่นแทรก เช่น \"การเก็บรักษา\" \"การซ่อมบำรุง\" ปนเข้ามา</p>\n<hr />\n<h2>4. สิ่งอุปกรณ์ (สป.) ประเภทและความรับผิดชอบตามสายงาน</h2>\n<p><strong>สิ่งอุปกรณ์ประเภท 1 (เสบียงสนาม)</strong> ตามระเบียบ ทบ.ว่าด้วยการส่งกำลัง สป.1 ในสนาม พ.ศ.2535 หมายถึงเสบียงสนามทุกชนิดที่ใช้บริโภค แบ่งเป็น 5 ประเภทย่อย (ก, ข, ค, ง, จ) ที่ควรจำ:</p>\n<ul>\n<li><strong>เสบียงประเภท ค.</strong> = อาหารสำเร็จรูปจ่ายเป็นชุด รับประทานได้ทันทีโดยไม่ต้องหุงต้ม</li>\n<li>(ประเภทอื่น เช่น อาหารสดต้องหุงต้มก่อนบริโภคประจำวัน, อาหารกระป๋องเก็บได้นานต้องปรุงเล็กน้อยก่อนรับประทาน)</li>\n</ul>\n<p><strong>สิ่งอุปกรณ์ประเภท 5</strong> (กระสุน วัตถุระเบิด) อยู่ใ
