<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ สอบเลื่อนฐานะ จ.ส.อ. เป็นนายทหารสัญญาบัตร</title>
<style>
:root{
  /* ---- คลังสี: โทนทหาร (olive/khaki) แต่งแต้มความน่ารัก ---- */
  --bg:#eee6d2;
  --surface:#fffdf6;
  --surface-2:#f1e9d4;
  --border:#d9c9a3;
  --text:#3a3324;
  --text-muted:#8a7f60;
  --primary:#5c6b3a;
  --primary-dark:#3f4a27;
  --primary-soft:#e3e8cd;
  --good:#4a7c3f;
  --good-soft:#e6f1de;
  --bad:#bb4a35;
  --bad-soft:#fbe6dd;
  --warn:#cc9427;
  --warn-soft:#fbf0d6;
  --accent:#d98a3d;
  --radius:16px;
  --shadow:0 3px 0 rgba(63,74,39,.12), 0 6px 16px rgba(63,74,39,.08);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  color:var(--text);
  font-family:'Leelawadee UI','TH Sarabun New','Noto Sans Thai','Sarabun',Tahoma,'Segoe UI',sans-serif;
  line-height:1.55;
  min-height:100vh;
  background-color:var(--bg);
  /* เบา ๆ ลายพราง (camo) แบบน่ารัก ไม่แสบตา */
  background-image:
    radial-gradient(ellipse 180px 120px at 8% 12%, #d7cba3 40%, transparent 41%),
    radial-gradient(ellipse 140px 100px at 92% 8%, #c9c9a0 40%, transparent 41%),
    radial-gradient(ellipse 220px 150px at 78% 92%, #dcd0aa 40%, transparent 41%),
    radial-gradient(ellipse 160px 110px at 4% 88%, #cdc79f 40%, transparent 41%),
    radial-gradient(ellipse 200px 140px at 50% 50%, #e6dcbb 35%, transparent 40%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  background-size:100% 100%;
}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 64px;}
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;
  background:linear-gradient(135deg,var(--primary) 0%,#6f8047 55%,var(--primary) 100%);
  border-bottom:4px dashed #3f4a27;
  position:sticky;top:0;z-index:50;box-shadow:0 4px 14px rgba(40,48,20,.25);
}
header.top .brand{display:flex;align-items:center;gap:12px;font-weight:700;color:#fff;}
header.top .brand .dot{
  width:38px;height:38px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%, #f6d78a, var(--accent) 60%, #a85f1f 100%);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  border:2px solid #fff4de;box-shadow:0 2px 4px rgba(0,0,0,.25) inset, 0 2px 3px rgba(0,0,0,.3);
  animation:badgeWiggle 4.5s ease-in-out infinite;
}
@keyframes badgeWiggle{
  0%,100%{transform:rotate(-4deg);}
  50%{transform:rotate(4deg);}
}
header.top .brand > div{line-height:1.3;}
header.top .brand small{display:block;font-weight:500;color:#eef2df;font-size:.78rem;opacity:.92;}
h1{font-size:1.5rem;margin:0 0 6px;color:var(--primary-dark);}
h2{font-size:1.15rem;margin:0 0 10px;color:var(--primary-dark);}
h2::before{content:'★ ';color:var(--accent);}
p.lead{color:var(--text-muted);margin:0 0 20px;}
.card{
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);margin-bottom:18px;
  position:relative;
}
.card::before{
  content:'';position:absolute;top:10px;left:10px;right:10px;bottom:10px;
  border:1.5px dashed #e4d9b8;border-radius:calc(var(--radius) - 6px);
  pointer-events:none;opacity:.6;
}
.grid-subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;position:relative;}
.subject-item{
  display:flex;align-items:center;gap:10px;border:2px solid var(--border);border-radius:12px;
  padding:10px 12px;background:var(--surface-2);cursor:pointer;user-select:none;transition:.15s;
}
.subject-item:hover{border-color:var(--primary);transform:translateY(-1px);}
.subject-item.checked{background:var(--primary-soft);border-color:var(--primary);}
.subject-item input{width:17px;height:17px;accent-color:var(--primary);flex:none;}
.subject-item .meta{flex:1;min-width:0;}
.subject-item .meta .name{font-weight:700;font-size:.94rem;}
.subject-item .meta .name::before{content:'🎖️ ';}
.subject-item .meta .count{font-size:.78rem;color:var(--text-muted);}
.row-actions{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap;}
.btn{
  appearance:none;border:2px solid var(--border);background:var(--surface);color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:.92rem;font-weight:700;cursor:pointer;transition:.12s;
  box-shadow:0 2px 0 var(--border);
}
.btn:hover{border-color:var(--primary);color:var(--primary-dark);transform:translateY(-1px);}
.btn:active{transform:translateY(1px);box-shadow:none;}
.btn.small{padding:6px 12px;font-size:.82rem;}
.btn.primary{background:linear-gradient(135deg,var(--primary),#728148);border-color:var(--primary-dark);color:#fff;box-shadow:0 3px 0 var(--primary-dark);}
.btn.primary:hover{filter:brightness(1.08);color:#fff;}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--primary-dark);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-muted);box-shadow:none;}
.btn.danger{color:var(--bad);}
.btn.danger:hover{border-color:var(--bad);}
.mode-toggle{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.mode-card{
  flex:1;min-width:220px;border:2px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--surface-2);transition:.15s;
}
.mode-card:hover{transform:translateY(-1px);}
.mode-card.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 2px 0 var(--primary);}
.mode-card .title{font-weight:800;margin-bottom:3px;}
.mode-card .desc{font-size:.82rem;color:var(--text-muted);}
label.field-label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 6px;color:var(--primary-dark);}
.inline-fields{display:flex;gap:16px;flex-wrap:wrap;}
.field{flex:1;min-width:180px;}
select,input[type=number]{
  width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:10px;font-size:.92rem;
  background:var(--surface);color:var(--text);font-family:inherit;
}
.pill-select{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  border:2px solid var(--border);border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer;background:var(--surface-2);font-weight:600;transition:.12s;
}
.pill:hover{border-color:var(--primary);}
.pill.active{background:var(--primary);border-color:var(--primary-dark);color:#fff;font-weight:700;}
.summary-line{font-size:.9rem;color:var(--text-muted);margin-top:10px;}
.summary-line b{color:var(--text);}
.start-bar{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;}
.hidden{display:none !important;}

/* Quiz view */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.progress-wrap{flex:1;min-width:160px;}
.progress-bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:2px solid var(--border);}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.2s;}
.progress-label{font-size:.78rem;color:var(--text-muted);margin-top:4px;}
.timer{
  font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;padding:6px 14px;border-radius:10px;
  background:var(--surface-2);border:2px solid var(--border);
}
.timer::before{content:'⏱️ ';}
.timer.low{color:var(--bad);background:var(--bad-soft);border-color:var(--bad);animation:pulseWarn 1s infinite;}
@keyframes pulseWarn{0%,100%{opacity:1;}50%{opacity:.6;}}
.q-subject-tag{
  display:inline-block;font-size:.74rem;font-weight:800;color:var(--primary-dark);
  background:var(--primary-soft);padding:4px 12px;border-radius:999px;margin-bottom:10px;border:1.5px solid var(--primary);
}
.q-subject-tag::before{content:'🪖 ';}
.q-text{font-size:1.12rem;font-weight:700;margin:0 0 18px;white-space:pre-wrap;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{
  display:flex;gap:12px;align-items:flex-start;border:2px solid var(--border);border-radius:14px;
  padding:12px 14px;cursor:pointer;background:var(--surface-2);transition:.12s;
}
.option:hover{border-color:var(--primary);transform:translateY(-1px);}
.option .letter{
  flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;
}
.option .text{flex:1;padding-top:2px;}
.option.selected{border-color:var(--primary);background:var(--primary-soft);}
.option.selected .letter{background:var(--primary);border-color:var(--primary-dark);color:#fff;}
.option.correct{border-color:var(--good);background:var(--good-soft);}
.option.correct .letter{background:var(--good);border-color:var(--good);color:#fff;}
.option.correct .letter::after{content:'★';}
.option.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.option.incorrect .letter{background:var(--bad);border-color:var(--bad);color:#fff;}
.option.disabled{cursor:default;}
.option.disabled:hover{transform:none;}
.feedback-box{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.9rem;font-weight:700;border:1.5px dashed transparent;}
.feedback-box.good{background:var(--good-soft);color:var(--good);border-color:var(--good);}
.feedback-box.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap;}
.quiz-nav .right-group{display:flex;gap:8px;flex-wrap:wrap;}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;}
.qgrid button{
  width:34px;height:34px;border-radius:8px;border:2px solid var(--border);background:var(--surface-2);
  font-size:.78rem;font-weight:800;cursor:pointer;color:var(--text-muted);
}
.qgrid button.answered{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);}
.qgrid button.current{outline:2px solid var(--accent);outline-offset:1px;}
.qgrid button.flagged{position:relative;}
.qgrid button.flagged::after{content:'🚩';position:absolute;top:-9px;right:-6px;font-size:.7rem;}
details.navigator summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--primary-dark);margin-bottom:6px;}

/* Results */
.score-hero{text-align:center;padding:26px 10px 10px;}
.score-hero .medal{font-size:2.6rem;line-height:1;margin-bottom:4px;}
.score-hero .big{font-size:2.6rem;font-weight:800;color:var(--primary-dark);}
.score-hero .pct{font-size:1.1rem;color:var(--text-muted);margin-top:2px;}
.badge-pass{display:inline-block;margin-top:10px;padding:7px 18px;border-radius:999px;font-weight:800;font-size:.9rem;border:2px solid transparent;}
.badge-pass.pass{background:var(--good-soft);color:var(--good);border-color:var(--good);}
.badge-pass.fail{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);}
table.subject-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem;}
table.subject-table th,table.subject-table td{padding:8px 10px;border-bottom:1.5px dashed var(--border);text-align:left;}
table.subject-table th{color:var(--text-muted);font-weight:700;font-size:.8rem;}
.bar-cell{display:flex;align-items:center;gap:8px;}
.bar-cell .bar{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border);}
.bar-cell .bar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));}
.review-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.review-item{border:2px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--surface-2);}
.review-item .rq{font-weight:700;margin-bottom:8px;}
.review-item .ra-line{font-size:.86rem;margin-bottom:3px;}
.review-item .ra-line .tag{font-weight:800;}
.review-item.wrong{border-left:6px solid var(--bad);}
.review-item.right{border-left:6px solid var(--good);}
.review-item.unanswered{border-left:6px solid var(--warn);}

/* Players / scoreboard */
.player-card h2::before{content:'★ ';}
.player-roster{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.player-chip{
  border:2px solid var(--border);border-radius:12px;padding:8px 14px;background:var(--surface-2);cursor:pointer;
  transition:.12s;min-width:150px;
}
.player-chip:hover{border-color:var(--primary);transform:translateY(-1px);}
.player-chip.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 2px 0 var(--primary);}
.player-chip .pname{display:block;font-weight:800;font-size:.92rem;}
.player-chip .pmeta{display:block;font-size:.74rem;color:var(--text-muted);margin-top:2px;}
#newPlayerInput{background:var(--surface);color:var(--text);}
.server-status{font-size:.84rem;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:12px;border:1.5px dashed;}
.server-status.loading{color:var(--text-muted);border-color:var(--border);background:var(--surface-2);}
.server-status.ok{color:var(--good);border-color:var(--good);background:var(--good-soft);}
.server-status.err{color:var(--warn);border-color:var(--warn);background:var(--warn-soft);}
.compare-box{
  border:2px dashed var(--primary);border-radius:14px;padding:14px 16px;margin:16px 0;background:var(--primary-soft);
}
.compare-box.guest{border-color:var(--warn);background:var(--warn-soft);}
.compare-title{font-weight:800;margin-bottom:6px;color:var(--primary-dark);}
.compare-lines{display:flex;flex-direction:column;gap:4px;}
.compare-line{font-size:.9rem;font-weight:600;}
.compare-line.up{color:var(--good);}
.compare-line.down{color:var(--bad);}
.compare-line.same{color:var(--warn);}
table.leaderboard-table .rank-cell{font-size:1.2rem;text-align:center;width:44px;}
table.leaderboard-table tr.you-row{background:var(--primary-soft);}
.you-tag{
  display:inline-block;font-size:.68rem;font-weight:800;background:var(--primary);color:#fff;
  padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;
}
.stat-tile{
  background:var(--primary-soft);border-radius:12px;padding:10px 16px;min-width:96px;text-align:center;flex:1;
}
.stat-tile .stat-num{font-size:1.35rem;font-weight:900;color:var(--primary-dark);line-height:1.2;}
.stat-tile .stat-label{font-size:.72rem;color:var(--text-muted);font-weight:700;margin-top:2px;}
table.history-table td{font-size:.9rem;}
/* Auth (login/register) screen */
.auth-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--border);}
.auth-tab{padding:9px 18px;font-weight:800;font-size:.92rem;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.auth-tab:hover{color:var(--primary-dark);}
.auth-tab.active{color:var(--primary-dark);border-bottom-color:var(--primary);}
.auth-form{display:flex;flex-direction:column;gap:2px;max-width:380px;}
.auth-form input[type=text],.auth-form input[type=password]{
  width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-size:.94rem;
  background:var(--surface);color:var(--text);font-family:inherit;
}
.auth-form input:focus{outline:none;border-color:var(--primary);}
.demo-teaser{background:var(--surface-2);border-style:dashed;}
.pw-field{position:relative;}
.pw-field input{padding-right:42px !important;}
.pw-toggle{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:1.05rem;padding:6px 8px;
  color:var(--text-muted);line-height:1;
}
.pw-toggle:hover{color:var(--primary-dark);}
/* Header back/exit button — visible against the dark green header */
header.top #exitBtn{
  background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.55);
  color:#fff;
  font-weight:800;
  padding:8px 16px;
  box-shadow:none;
}
header.top #exitBtn:hover{
  background:rgba(255,255,255,.28);
  border-color:#fff;
  color:#fff;
  transform:translateY(-1px);
}
footer.foot{text-align:center;color:var(--text-muted);font-size:.78rem;margin-top:30px;}
footer.foot::before{content:'🎯 ';}
@media (max-width:600px){
  .wrap{padding:12px 10px 48px;}
  h1{font-size:1.25rem;}
  .score-hero .big{font-size:2.1rem;}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dot">⭐</span>
    <div>
      แบบทดสอบเตรียมสอบ จ.ส.อ. เลื่อนฐานะเป็นนายทหารสัญญาบัตร
      <small id="headerSub">พร้อมข้อสอบ</small>
    </div>
  </div>
  <button class="btn small ghost hidden" id="exitBtn">ออกไปหน้าตั้งค่า</button>
</header>

"subject": 1, "subjectTitle": "วิชาการสื่อสารประเภทวิทยุ", "count": 309}, {"subject": 2, "subjectTitle": "วิชาการสื่อสารประเภทสาย", "count": 300}, {"subject": 3, "subjectTitle": "วิชาทหารสื่อสาร", "count": 150}, {"subject": 4, "subjectTitle": "วิชาทั่วไป", "count": 100}, {"subject": 5, "subjectTitle": "วิชาส่งกำลังบำรุงและซ่อมบำรุง", "count": 100}, {"subject": 6, "subjectTitle": "วิชาฝ่ายอำนวยการ", "count": 50}, {"subject": 7, "subjectTitle": "วิชาคอมพิวเตอร์", "count": 100}, {"subject": 8, "subjectTitle": "วิชาไฟฟ้าและอิเล็กทรอนิกส์", "count": 118}, {"subject": 9, "subjectTitle": "วิชาระเบียบงานสารบรรณ", "count": 50}, {"subject": 10, "subjectTitle": "วิชาแบบธรรมเนียม", "count": 82}]}</script>
<script>
(function(){
"use strict";

var RAW = JSON.parse(document.getElementById('data-holder').textContent);
var DEMO = RAW.demo;               // ~30 free sample questions, WITH answers embedded (public by design)
var SUBJECT_META = RAW.subjectMeta; // [{subject,subjectTitle,count}] describing the FULL bank, for marketing copy

var app = document.getElementById('app');
var exitBtn = document.getElementById('exitBtn');
var headerSub = document.getElementById('headerSub');

// ---- global session state ----
var session = null; // built when quiz starts

// ============================================================
// SERVER (Google Apps Script Web App backed by a Google Sheet)
// The FULL question bank (1,359 ข้อ) lives on the server only — it is
// never shipped inside this HTML file, so opening "view source" cannot
// reveal the full question/answer set. Only a small public DEMO subset
// is embedded, for a free no-login trial. Everything past the demo
// requires logging in and talking to the server.
// ============================================================
var SERVER_URL = 'https://script.google.com/macros/s/AKfycbyMUjeV7vUYMV6iFd01ZSq_6LUsX5zuylUUVGzZV6_f5AaK57CDxbjDMbYMik5hklO9/exec';

function apiCall(action, payload, cb){
  payload = payload || {};
  payload.action = action;
  fetch(SERVER_URL, {method:'POST', body: JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(data){ cb(null, data); })
    .catch(function(err){ cb(err, null); });
}

// ---- auth state (in-memory only for this tab/page-load — this file
// has no server-independent storage, so logging in again is needed
// each time the file is reopened) ----
var auth = { username: null, token: null };

var STALE_SERVER_MSG = 'เซิร์ฟเวอร์ตอบกลับไม่ตรงรูปแบบที่คาดไว้ — เซิร์ฟเวอร์ (Apps Script) อาจยังเป็นโค้ดรุ่นเก่า ตรวจสอบว่าวางโค้ด Code.gs ชุดล่าสุดและกด Deploy เวอร์ชันใหม่แล้วจริงหรือยัง';

function doRegister(username, password, cb){
  apiCall('register', {username:username, password:password}, function(err, data){
    if(err || !data || !data.ok){ cb((data && data.error) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'); return; }
    if(!data.token || !data.username){ cb(STALE_SERVER_MSG); return; }
    auth.username = data.username; auth.token = data.token;
    cb(null, !!data.pending);
  });
}
function doLogin(username, password, cb){
  apiCall('login', {username:username, password:password}, function(err, data){
    if(err || !data || !data.ok){ cb((data && data.error) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'); return; }
    if(!data.token || !data.username){ cb(STALE_SERVER_MSG); return; }
    auth.username = data.username; auth.token = data.token;
    cb(null);
  });
}
function doLogout(){
  auth.username = null; auth.token = null;
  FULL_QUESTIONS = null; FULL_SUBJECTS = null;
  PLAYERS = []; currentPlayerName = null;
  session = null;
  authState.error=''; authState.mode='login'; authState.username='';
  renderAuthScreen();
}

// ---- Single Active Session handling ----
// Each account only ever has ONE valid session token stored on the server;
// logging in again (from another device/tab/person) immediately invalidates
// the previous one. When THIS tab's token gets invalidated that way, the
// server marks the error with errorCode:'session_invalid'. Whenever we see
// that, we stop whatever this tab was doing and bounce back to the login
// screen with a clear explanation, instead of leaving a half-broken screen
// showing generic errors.
function handleIfSessionKicked(data){
  if(data && data.errorCode === 'session_invalid'){
    var msg = data.error || 'เซสชันนี้สิ้นสุดการใช้งานแล้ว กรุณาเข้าสู่ระบบใหม่';
    auth.username = null; auth.token = null;
    FULL_QUESTIONS = null; FULL_SUBJECTS = null;
    PLAYERS = []; currentPlayerName = null;
    session = null;
    authState.error = msg; authState.mode='login'; authState.username='';
    authState.busy = false;
    renderAuthScreen();
    return true;
  }
  return false;
}

// ---- full question bank (fetched after login; answers are stripped
// server-side and only revealed per-question via checkAnswer, or after
// a whole exam is submitted via submitExam) ----
var FULL_QUESTIONS = null;
var FULL_SUBJECTS = null;

function fetchFullBank(cb){
  apiCall('getQuestions', {token:auth.token}, function(err, data){
    if(handleIfSessionKicked(data)){ return; }
    if(err || !data || !data.ok){ cb((data && data.error) || 'โหลดคลังข้อสอบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); return; }
    if(!Array.isArray(data.questions)){ cb(STALE_SERVER_MSG); return; }
    FULL_QUESTIONS = data.questions;
    var map = {};
    FULL_QUESTIONS.forEach(function(q){
      if(!map[q.subject]) map[q.subject] = {num:q.subject, title:q.subjectTitle, count:0};
      map[q.subject].count++;
    });
    FULL_SUBJECTS = Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.num-b.num;});
    setupState.selectedSubjects = FULL_SUBJECTS.map(function(s){return s.num;});
    cb(null);
  });
}
function checkAnswer(id, chosen, cb){
  apiCall('checkAnswer', {token:auth.token, id:id, chosen:chosen}, function(err, data){
    if(handleIfSessionKicked(data)){ return; }
    if(err || !data || !data.ok){ cb((data && data.error) || 'ตรวจคำตอบไม่สำเร็จ ลองใหม่อีกครั้ง', null); return; }
    cb(null, data);
  });
}
function submitExamToServer(payload, cb){
  payload.token = auth.token;
  apiCall('submitExam', payload, function(err, data){
    if(handleIfSessionKicked(data)){ return; }
    if(err || !data || !data.ok){ cb((data && data.error) || 'ส่งข้อสอบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', null); return; }
    cb(null, data);
  });
}

// ============================================================
// PLAYERS / SCOREBOARD — now sourced entirely from the server, keyed
// by the logged-in username. Practice mode never contributes attempts.
// ============================================================
var PLAYERS = [];        // {name, createdAt, attempts:[{ts,mode,subjects,subjectLabel,total,correct,pct,passPct,passed}]}
var currentPlayerName = null;

function getPlayer(name){
  return PLAYERS.find(function(p){ return p.name===name; }) || null;
}
function getCurrentPlayer(){
  return currentPlayerName ? getPlayer(currentPlayerName) : null;
}
function slugName(s){ return String(s).trim().replace(/\s+/g,' '); }
function bestAttempt(player){
  var examAttempts = player.attempts.filter(function(a){return a.mode==='exam';});
  if(!examAttempts.length) return null;
  return examAttempts.reduce(function(best,a){ return (!best || a.pct>best.pct) ? a : best; }, null);
}
function lastAttempt(player){
  var examAttempts = player.attempts.filter(function(a){return a.mode==='exam';});
  return examAttempts.length ? examAttempts[examAttempts.length-1] : null;
}
function downloadJSON(filename, obj){
  var blob = new Blob([JSON.stringify(obj,null,1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function exportPlayerProfile(player){
  downloadJSON('สถิติ-'+player.name+'.json', {
    app:'jsor-exam-quiz-profile', version:2,
    name:player.name, createdAt:player.createdAt, attempts:player.attempts
  });
}
function mergeAttemptsIntoPlayers(list){
  var byName = {};
  list.forEach(function(a){
    var name = slugName(a.playerName || '');
    if(!name) return;
    (byName[name] = byName[name] || []).push(a);
  });
  Object.keys(byName).forEach(function(name){
    var p = getPlayer(name);
    if(!p){ p = {name:name, createdAt:Date.now(), attempts:[]}; PLAYERS.push(p); }
    var haveTs = {};
    p.attempts.forEach(function(a){ haveTs[String(a.ts)]=true; });
    byName[name].forEach(function(a){
      if(!haveTs[String(a.ts)]){ p.attempts.push(a); haveTs[String(a.ts)]=true; }
    });
    p.attempts.sort(function(a,b){return a.ts-b.ts;});
  });
}
function fetchMyAttempts(cb){
  apiCall('getMyAttempts', {token:auth.token}, function(err, data){
    if(handleIfSessionKicked(data)){ return; } // auth screen already rendered; don't let the caller overwrite it with its own error UI
    if(err || !data || !data.ok){ cb && cb((data && data.error) || 'โหลดสถิติไม่สำเร็จ'); return; }
    if(!Array.isArray(data.attempts)){ cb && cb(STALE_SERVER_MSG); return; }
    PLAYERS = [];
    mergeAttemptsIntoPlayers(data.attempts || []);
    currentPlayerName = auth.username;
    if(!getPlayer(currentPlayerName)){
      PLAYERS.push({name:currentPlayerName, createdAt:Date.now(), attempts:[]});
    }
    cb && cb(null);
  });
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function wirePasswordToggle(inputId, toggleId){
  var input = document.getElementById(inputId);
  var toggle = document.getElementById(toggleId);
  if(!input || !toggle) return;
  toggle.onclick = function(e){
    e.preventDefault();
    if(input.type==='password'){ input.type='text'; toggle.textContent='🙈'; }
    else { input.type='password'; toggle.textContent='👁️'; }
  };
}

function bindAuthEvents(){
  document.querySelectorAll('[data-authmode]').forEach(function(tab){
    tab.onclick = function(){
      authState.mode = tab.getAttribute('data-authmode');
      authState.error = '';
      renderAuthScreen();

  });

  document.getElementById('adminLinkBtn').onclick = function(e){ e.preventDefault(); renderAdminLogin(); };
  wirePasswordToggle('authPassword','authPasswordToggle');
  wirePasswordToggle('authPassword2','authPassword2Toggle');

  function submit(){
    var uEl = document.getElementById('authUsername');
    var pEl = document.getElementById('authPassword');
    var username = uEl ? uEl.value.trim() : '';
    var password = pEl ? pEl.value : '';
    authState.username = username;
    if(!username || !password){ authState.error='กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบ'; renderAuthScreen(); return; }
    if(authState.mode==='register'){
      var p2El = document.getElementById('authPassword2');
      var password2 = p2El ? p2El.value : '';
      if(password!==password2){ authState.error='รหัสผ่านทั้งสองช่องไม่ตรงกัน'; renderAuthScreen(); return; }
    }
    authState.busy = true; authState.error=''; renderAuthScreen();
    var fn = authState.mode==='register' ? doRegister : doLogin;
    fn(username, password, function(err, pending){
      if(err){ authState.busy=false; authState.error=err; renderAuthScreen(); return; }
      authState.busy = false;
      if(pending){ renderPendingApproval(); return; }
      afterLoginSuccess();
    });
  }
  document.getElementById('authSubmitBtn').onclick = submit;
  ['authUsername','authPassword','authPassword2'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onkeydown = function(e){ if(e.key==='Enter') submit(); };
  });
}

function updateSummaryLine(){
  var el = document.getElementById('summaryLine');
  if(!el) return;
  var pool = poolSize();
  var n = resolveCount();
  var txt = 'จะทำทั้งหมด <b>'+Math.min(n,pool)+'</b> ข้อ จากคลัง <b>'+pool+'</b> ข้อในวิชาที่เลือก';
  if(pool===0) txt = '<b style="color:var(--bad)">กรุณาเลือกอย่างน้อย 1 วิชา</b>';
  el.innerHTML = txt;
  var startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.disabled = (pool===0);
}

function resolveCount(){
  var pool = poolSize();
  if(setupState.countChoice==='all') return pool;
  if(setupState.countChoice==='custom') return Math.max(1, Math.min(setupState.customCount||1, pool));
  return Math.min(parseInt(setupState.countChoice,10), pool);
}

    cb.onclick = function(e){
      e.stopPropagation();
      var num = parseInt(cb.getAttribute('data-subj-cb'),10);
      var idx = setupState.selectedSubjects.indexOf(num);
      if(cb.checked){ if(idx===-1) setupState.selectedSubjects.push(num); }

      cb.onclick({stopPropagation:function(){}, target:cb});

    card.onclick = function(){

    };

  document.querySelectorAll('#countPills .pill').forEach(function(p){

      renderSetup();
    };
  });

  if(customInput){
    customInput.oninput = function(){
      setupState.customCount = parseInt(customInput.value,10)||1;
      updateSummaryLine();
    };
  }
  document.querySelectorAll('[data-toggle]').forEach(function(p){
    p.onclick = function(){
      var t = p.getAttribute('data-toggle');
      if(t==='shuffleQ') setupState.shuffleQ = true;
      if(t==='orderQ') setupState.shuffleQ = false;
      if(t==='shuffleOpt') setupState.shuffleOpt = true;
      if(t==='orderOpt') setupState.shuffleOpt = false;
      renderSetup();
    };
  });
  var timeSelect = document.getElementById('timeSelect');
  if(timeSelect){
    timeSelect.onchange = function(){ setupState.timeChoice = timeSelect.value; };
  }
  var passInput = document.getElementById('passPctInput');
  if(passInput){
    passInput.oninput = function(){ setupState.passPct = parseInt(passInput.value,10)||60; };
  }
  document.getElementById('startBtn').onclick = function(){ startQuiz({source:'full'}); };
}

// QUIZ SESSION
// ============================================================
function buildSession(pool, cfg){
  // pool: array of question objects. cfg: {source, mode, count, shuffleQ,
  // shuffleOpt, timeLimitSec, passPct, subjectLabel}
  var list = pool.slice();
  if(cfg.shuffleQ) list = shuffle(list);
  var n = Math.min(cfg.count, list.length);
  var chosen = list.slice(0, n);

  var questions = chosen.map(function(q){
    var letters = ['A','B','C','D'];
    var order = cfg.shuffleOpt ? shuffle(letters) : letters;
    return {
      id: q.id,
      subject: q.subject,
      subjectTitle: q.subjectTitle,
      q: q.q,
      answerLetter: q.answer || null, // present for demo; revealed progressively for full bank
      optOrder: order,
      options: q.options
    };
  });

  session = {
    source: cfg.source,
    mode: cfg.mode,
    questions: questions,
    current: 0,
    answers: {}, // index -> chosen original-letter
    flagged: {},
    startedAt: Date.now(),
    timeLimitSec: cfg.timeLimitSec,
    passPct: cfg.passPct,
    subjectLabelOverride: cfg.subjectLabel || null,
    finished: false,
    timerId: null,
    checking: false,
    recorded: false,
    examSubmitted: false,
    examSubmitting: false
  };

  exitBtn.classList.remove('hidden');
  exitBtn.textContent = '✕ ออกจากแบบทดสอบ';
  exitBtn.onclick = function(){
    if(confirm('ต้องการออกจากแบบทดสอบตอนนี้หรือไม่? ความคืบหน้าจะไม่ถูกบันทึก')){
      stopTimer();
      if(session.source==='demo') renderAuthScreen(); else renderSetup();
    }
  };

  if(session.mode==='practice'){
    renderPractice();
  } else {
    renderExamQuestion();
    if(session.timeLimitSec) startTimer();
  }
}

function startQuiz(opts){
  if(opts.source==='demo'){
    buildSession(DEMO, {
      source:'demo', mode:opts.mode,
      count: DEMO.length, shuffleQ:true, shuffleOpt:true,
      timeLimitSec: opts.mode==='exam' ? 15*60 : null,
      passPct: 60
    });
  } else {
    var pool = FULL_QUESTIONS.filter(function(q){return setupState.selectedSubjects.indexOf(q.subject)!==-1;});
    var n = resolveCount();
    var subjNums = setupState.selectedSubjects.slice().sort(function(a,b){return a-b;});
    var subjectLabel = (subjNums.length===FULL_SUBJECTS.length) ? 'ทุกวิชา' :
      subjNums.map(function(num){
        var s = FULL_SUBJECTS.filter(function(x){return x.num===num;})[0];
        return s ? s.title.replace(/^วิชา/,'') : num;
      }).join(', ');
    buildSession(pool, {
      source:'full', mode:setupState.mode,
      count:n, shuffleQ:setupState.shuffleQ, shuffleOpt:setupState.shuffleOpt,
      timeLimitSec: (setupState.mode==='exam' && setupState.timeChoice!=='none') ? parseInt(setupState.timeChoice,10)*60 : null,
      passPct: setupState.passPct,
      subjectLabel: subjectLabel
    });
  }
}

function stopTimer(){
  if(session && session.timerId){ clearInterval(session.timerId); session.timerId=null; }
}

function startTimer(){
  session.deadline = Date.now() + session.timeLimitSec*1000;
  session.timerId = setInterval(function(){
    var remain = Math.max(0, Math.round((session.deadline - Date.now())/1000));
    updateTimerDisplay(remain);
    if(remain<=0){
      stopTimer();
      finishExam();
    }
  }, 1000);
  updateTimerDisplay(session.timeLimitSec);
}

function updateTimerDisplay(remainSec){
  var el = document.getElementById('timerDisplay');
  if(!el) return;
  var m = Math.floor(remainSec/60), s = remainSec%60;
  el.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  el.classList.toggle('low', remainSec<=60);
}

var reviewFilter = 'all';

function renderResults(){
  stopTimer();

  // Full-bank exam attempts must be scored & recorded server-side (the
  // client never has the answer key for these), so submit first and
  // only then render the results screen.
  if(session.mode==='exam' && session.source==='full' && !session.examSubmitted){
    if(session.examSubmitting) return;
    session.examSubmitting = true;
    headerSub.textContent = 'กำลังส่งข้อสอบ...';
    exitBtn.classList.add('hidden');
    app.innerHTML = '<div class="card"><h1>📮 กำลังส่งข้อสอบ...</h1>'+
      '<p class="lead">รอสักครู่ กำลังส่งคำตอบไปตรวจและบันทึกคะแนนที่เซิร์ฟเวอร์กลาง</p></div>';

    var answersPayload = session.questions.map(function(q,i){
      return { id:q.id, chosen: session.answers[i] || null };
    });
    var subjNums = [];
    session.questions.forEach(function(q){ if(subjNums.indexOf(q.subject)===-1) subjNums.push(q.subject); });
    subjNums.sort(function(a,b){return a-b;});

    submitExamToServer({
      mode:'exam', ts: Date.now(), subjects: subjNums,
      subjectLabel: session.subjectLabelOverride, passPct: session.passPct,
      answers: answersPayload
    }, function(err, data){
      session.examSubmitting = false;
      if(err){
        exitBtn.classList.remove('hidden');
        exitBtn.textContent = 'กลับไปหน้าตั้งค่า';
        exitBtn.onclick = function(){ session=null; renderSetup(); };
        app.innerHTML = '<div class="card"><h1>⚠️ ส่งข้อสอบไม่สำเร็จ</h1>'+
          '<p class="lead">'+escapeHtml(err)+' — คำตอบของคุณยังอยู่ครบ ลองส่งใหม่อีกครั้งได้เลย</p>'+
          '<button class="btn primary" id="retrySubmitBtn">🔄 ลองส่งข้อสอบอีกครั้ง</button></div>';
        document.getElementById('retrySubmitBtn').onclick = renderResults;
        return;
      }
      var byId = {};
      (data.review||[]).forEach(function(r){ byId[r.id]=r; });
      session.questions.forEach(function(q){
        if(byId[q.id]) q.answerLetter = byId[q.id].answer;
      });
      session.examSubmitted = true;
      session.serverScore = data; // {total,correct,pct,passPct,passed}
      renderResultsInner();
    });
    return;
  }

  renderResultsInner();
}

function renderResultsInner(){
  headerSub.textContent = 'สรุปผลการทำแบบทดสอบ';
  exitBtn.classList.remove('hidden');
  exitBtn.textContent = 'กลับไปหน้าตั้งค่า';
  exitBtn.onclick = function(){ session=null; renderExitToHome(); };

  var total = session.questions.length;
  var correctCount = 0;
  var bySubject = {};

  session.questions.forEach(function(q,i){
    var chosen = session.answers[i];
    var isCorrect = (q.answerLetter!=null) && chosen === q.answerLetter;
    if(isCorrect) correctCount++;
    if(!bySubject[q.subject]) bySubject[q.subject] = {title:q.subjectTitle, total:0, correct:0};
    bySubject[q.subject].total++;
    if(isCorrect) bySubject[q.subject].correct++;
  });

  var pct, passed, passPct;
  if(session.serverScore){
    correctCount = session.serverScore.correct;
    total = session.serverScore.total;
    pct = session.serverScore.pct;
    passPct = session.serverScore.passPct || session.passPct || 60;
    passed = session.serverScore.passed;
  } else {
    pct = total>0 ? Math.round((correctCount/total)*1000)/10 : 0;
    passPct = session.passPct || 60;
    passed = pct >= passPct;
  }

  // Record into local PLAYERS cache for immediate comparison UI. The
  // server already appended the attempt row during submitExam, so this
  // is purely a local mirror — no extra network call needed here, and
  // practice mode / demo mode never record anything (business rule:
  // only full-bank exam-mode attempts count).
  if(session.mode==='exam' && session.source==='full' && !session.recorded){
    session.recorded = true;
    var player = getCurrentPlayer();
    if(player){
      var prevBest = bestAttempt(player);
      var prevLast = lastAttempt(player);
      var attempt = {
        ts: Date.now(), mode:'exam', subjects: Object.keys(bySubject).map(Number),
        subjectLabel: session.subjectLabelOverride, total: total, correct: correctCount,
        pct: pct, passPct: passPct, passed: passed
      };
      player.attempts.push(attempt);
      session.compareInfo = {
        playerName: player.name,
        deltaVsLast: prevLast ? Math.round((pct - prevLast.pct)*10)/10 : null,
        deltaVsBest: prevBest ? Math.round((pct - prevBest.pct)*10)/10 : null,
        isNewBest: !prevBest || pct > prevBest.pct
      };
    }
  }

  var html = '<div class="card">';
  html += '<div class="score-hero">';
  var heroEmoji = (session.mode==='exam') ? (passed ? '🏆' : '🎖️') : (pct>=80 ? '🌟' : (pct>=50 ? '🎖️' : '🪖'));
  html += '<div class="medal">'+heroEmoji+'</div>';
  html += '<div class="big">'+correctCount+' / '+total+'</div>';
  html += '<div class="pct">คิดเป็น '+pct+'%</div>';
  if(session.mode==='exam'){
    html += '<div class="badge-pass '+(passed?'pass':'fail')+'">'+(passed?'🏅 ผ่านเกณฑ์ เก่งมาก! ('+passPct+'%)':'💪 ยังไม่ผ่านเกณฑ์ สู้ต่ออีกนิดนะ! ('+passPct+'%)')+'</div>';
  }
  html += '</div>';

  // ---- comparison / scoreboard block ----
  if(session.mode==='exam' && session.source==='full'){
    var ci = session.compareInfo;
    var activePlayer = getPlayer(ci ? ci.playerName : null);
    if(ci && activePlayer){
      html += '<div class="compare-box">';
      html += '<div class="compare-title">🪪 ผลของ '+escapeHtml(activePlayer.name)+'</div>';
      html += '<div class="compare-lines">';
      if(ci.deltaVsLast===null){
        html += '<div class="compare-line">🆕 นี่คือครั้งแรกที่ทำโหมดจำลองสอบของคุณ — ยินดีต้อนรับเข้าประจำการ!</div>';
      } else {
        var upLast = ci.deltaVsLast>0, sameLast = ci.deltaVsLast===0;
        html += '<div class="compare-line '+(upLast?'up':(sameLast?'same':'down'))+'">'+
          (upLast?'📈 ดีขึ้นกว่าครั้งก่อน':(sameLast?'➖ เท่ากับครั้งก่อน':'📉 ต่ำกว่าครั้งก่อน'))+
          ' '+(ci.deltaVsLast>0?'+':'')+ci.deltaVsLast+'%</div>';
      }
      if(ci.isNewBest && ci.deltaVsBest!==null){
        html += '<div class="compare-line up">🎉 ทำลายสถิติสูงสุดของตัวเอง! (+'+ci.deltaVsBest+'% จากสถิติเดิม)</div>';
      } else if(ci.isNewBest){
        html += '<div class="compare-line up">🌟 สถิติสูงสุดครั้งแรกของคุณ!</div>';
      } else if(ci.deltaVsBest!==null){
        html += '<div class="compare-line">🏅 สถิติสูงสุดของคุณอยู่ที่ '+(bestAttempt(activePlayer)?bestAttempt(activePlayer).pct:'-')+'% (ครั้งนี้ยังห่างอยู่ '+Math.abs(ci.deltaVsBest)+'%)</div>';
      }
      html += '<div class="compare-line up">✅ บันทึกคะแนนขึ้นเซิร์ฟเวอร์กลางแล้ว — เห็นได้จากทุกเครื่องที่ล็อกอินบัญชีนี้</div>';
      html += '</div>';
      html += '<div class="row-actions" style="margin-top:10px;">';
      html += '<button class="btn small primary" id="saveProfileBtn">💾 ดาวน์โหลดสำรองคะแนน</button>';
      html += '<button class="btn small" id="goHistoryBtn">📊 ดูประวัติการสอบ</button>';
      html += '</div>';
      html += '</div>';
    }
  } else if(session.source==='demo'){
    html += '<div class="compare-box guest">';
    html += '<div class="compare-line">🎯 นี่คือคะแนนจากชุดตัวอย่างฟรี — ไม่ถูกบันทึกในประวัติการสอบ สมัครสมาชิกเพื่อทำข้อสอบเต็ม '+totalBankCount()+' ข้อ พร้อมเก็บสถิติจริง</div>';
    html += '<div class="row-actions" style="margin-top:8px;"><button class="btn small primary" id="goRegisterBtn">📝 สมัครสมาชิกเลย</button></div>';
    html += '</div>';
  } else {
    html += '<div class="compare-box guest"><div class="compare-line">📘 นี่คือโหมดฝึกทำ — คะแนนจะไม่ถูกนับในประวัติการสอบ (นับเฉพาะโหมดจำลองสอบของบัญชีที่ล็อกอิน)</div></div>';
  }

  html += '<h2 style="margin-top:20px;">คะแนนแยกตามวิชา</h2>';
  html += '<table class="subject-table"><thead><tr><th>วิชา</th><th>คะแนน</th><th style="width:36%">สัดส่วน</th></tr></thead><tbody>';
  Object.keys(bySubject).sort(function(a,b){return a-b;}).forEach(function(k){
    var s = bySubject[k];
    var sp = Math.round((s.correct/s.total)*100);
    html += '<tr><td>'+escapeHtml(s.title)+'</td><td>'+s.correct+'/'+s.total+'</td>'+
      '<td><div class="bar-cell"><div class="bar"><div style="width:'+sp+'%"></div></div><span>'+sp+'%</span></div></td></tr>';
  });
  html += '</tbody></table>';

  html += '<div class="row-actions" style="margin-top:18px;">';
  html += '<button class="btn primary" id="retryBtn">🔄 ทำแบบทดสอบชุดใหม่</button>';
  html += '<button class="btn" id="reviewBtn">ดูเฉลยรายข้อ ↓</button>';
  html += '</div>';
  html += '</div>';

  // review section
  html += '<div class="card" id="reviewSection">';
  html += '<h2>เฉลยรายข้อ</h2>';
  html += '<div class="review-filters">';
  [['all','ทั้งหมด'],['wrong','ตอบผิด'],['right','ตอบถูก'],['unanswered','ยังไม่ตอบ']].forEach(function(f){
    html += '<div class="pill '+(reviewFilter===f[0]?'active':'')+'" data-filter="'+f[0]+'">'+f[1]+'</div>';
  });
  html += '</div>';
  html += '<div id="reviewList"></div>';
  html += '</div>';

  app.innerHTML = html;
  renderReviewList();

  document.getElementById('retryBtn').onclick = function(){
    session=null;
    if(FULL_QUESTIONS) renderSetup(); else renderAuthScreen();
  };
  document.getElementById('reviewBtn').onclick = function(){
    document.getElementById('reviewSection').scrollIntoView({behavior:'smooth'});
  };
  document.querySelectorAll('[data-filter]').forEach(function(p){
    p.onclick = function(){ reviewFilter = p.getAttribute('data-filter'); renderResultsInner(); document.getElementById('reviewSection').scrollIntoView(); };
  });
  var saveBtn = document.getElementById('saveProfileBtn');
  if(saveBtn){
    saveBtn.onclick = function(){
      var p = getPlayer(session.compareInfo.playerName);
      if(p) exportPlayerProfile(p);
    };
  }
  var goLb = document.getElementById('goHistoryBtn');
  if(goLb){ goLb.onclick = function(){ renderMyHistory(); }; }
  var goReg = document.getElementById('goRegisterBtn');
  if(goReg){ goReg.onclick = function(){ authState.mode='register'; authState.error=''; renderAuthScreen(); }; }
}

function renderReviewList(){
  var list = document.getElementById('reviewList');
  var html = '';
  session.questions.forEach(function(q,i){
    var chosen = session.answers[i];
    var status = !chosen ? 'unanswered' : (chosen===q.answerLetter ? 'right' : 'wrong');
    if(reviewFilter!=='all' && reviewFilter!==status) return;

    html += '<div class="review-item '+status+'">';
    html += '<div class="rq">'+(i+1)+'. '+escapeHtml(q.q)+' <span class="q-subject-tag">'+escapeHtml(q.subjectTitle)+'</span></div>';
    q.optOrder.forEach(function(letter,idx){
      var dl = ['A','B','C','D'][idx];
      var tagParts = [];
      if(letter===q.answerLetter) tagParts.push('เฉลย');
      if(letter===chosen) tagParts.push('คำตอบของคุณ');
      var color = letter===q.answerLetter ? 'var(--good)' : (letter===chosen ? 'var(--bad)' : 'var(--text)');
      var tagTxt = tagParts.length ? ' — <span class="tag" style="color:'+color+'">['+tagParts.join(', ')+']</span>' : '';
      html += '<div class="ra-line" style="color:'+(tagParts.length?color:'var(--text-muted)')+'">'+dl+'. '+escapeHtml(q.options[letter])+tagTxt+'</div>';
    });
    if(status==='unanswered'){
      html += '<div class="ra-line" style="margin-top:4px;color:var(--warn);font-weight:600;">ไม่ได้ตอบข้อนี้</div>';
    }
    if(!q.answerLetter){
      html += '<div class="ra-line" style="margin-top:4px;color:var(--text-muted);font-style:italic;">(ไม่ได้เปิดดูเฉลยข้อนี้ระหว่างฝึกทำ)</div>';
    }
    html += '</div>';
  });
  if(!html) html = '<p class="lead">ไม่มีข้อที่ตรงกับตัวกรองนี้</p>';
  list.innerHTML = html;
}

// ============================================================
// ADMIN PANEL (developer-only — separate from regular user login,
// gated by a secret admin key set inside the Apps Script backend)
// ============================================================
var adminAuth = { key: null };
var adminState = { error:'', busy:false };

function adminApiCall(action, extra, cb){
  var payload = extra || {};
  payload.adminKey = adminAuth.key;
  apiCall(action, payload, cb);
}

function fmtDateShort(v){
  var d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  var pad = function(n){return (n<10?'0':'')+n;};
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function renderAdminLogin(){
  exitBtn.classList.remove('hidden');
  exitBtn.textContent = '← กลับหน้าแรก';
  exitBtn.onclick = function(){ renderAuthScreen(); };
  headerSub.textContent = 'สำหรับผู้ดูแลระบบ';

  var html = '<div class="card auth-card">';
  html += '<h1>⚙️ เข้าสู่ระบบผู้ดูแล</h1>';
  html += '<p class="lead">กรอกรหัสลับผู้ดูแลระบบ (ตั้งไว้ในไฟล์ Apps Script ฝั่งเซิร์ฟเวอร์)</p>';
  html += '<div class="auth-form">';
  html += '<div class="field"><label class="field-label">รหัสลับผู้ดูแลระบบ</label>'+
    '<div class="pw-field"><input type="password" id="adminKeyInput" placeholder="ADMIN_KEY">'+
    '<button type="button" class="pw-toggle" id="adminKeyToggle" tabindex="-1">👁️</button></div></div>';
  html += '</div>';
  if(adminState.error){
    html += '<div class="server-status err" style="margin-top:12px;">⚠️ '+escapeHtml(adminState.error)+'</div>';
  }
  html += '<div class="start-bar" style="justify-content:flex-start;margin-top:16px;">';
  html += '<button class="btn primary" id="adminLoginBtn" style="padding:11px 26px;" '+(adminState.busy?'disabled':'')+'>'+
    (adminState.busy?'🔄 กำลังตรวจสอบ...':'เข้าสู่ระบบผู้ดูแล →')+'</button>';
  html += '</div></div>';
  app.innerHTML = html;
  wirePasswordToggle('adminKeyInput','adminKeyToggle');

  function submit(){
    var keyEl = document.getElementById('adminKeyInput');
    var key = keyEl ? keyEl.value : '';
    if(!key){ adminState.error='กรุณากรอกรหัสลับ'; renderAdminLogin(); return; }
    adminState.busy = true; adminState.error=''; renderAdminLogin();
    adminAuth.key = key;
    adminApiCall('adminListUsers', {}, function(err, data){
      adminState.busy = false;
      if(err || !data || !data.ok || !Array.isArray(data.users)){
        adminAuth.key = null;
        var msg = (data && data.error) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง';
        if(!err && data && data.ok && !Array.isArray(data.users)){
          msg = 'เซิร์ฟเวอร์ตอบกลับไม่ตรงรูปแบบที่คาดไว้ — เซิร์ฟเวอร์ (Apps Script) อาจยังเป็นโค้ดรุ่นเก่าที่ไม่รองรับหน้าแอดมิน ตรวจสอบว่าวางโค้ด Code.gs ชุดล่าสุดและกด Deploy เวอร์ชันใหม่แล้วจริงหรือยัง';
        }
        adminState.error = msg;
        renderAdminLogin();
        return;
      }
      renderAdminPanel(data.users);
    });
  }
  document.getElementById('adminLoginBtn').onclick = submit;
  document.getElementById('adminKeyInput').onkeydown = function(e){ if(e.key==='Enter') submit(); };
}

var adminTab = 'users';

function renderAdminPanel(users){
  exitBtn.classList.remove('hidden');
  exitBtn.textContent = '🚪 ออกจากหน้าแอดมิน';
  exitBtn.onclick = function(){ adminAuth.key=null; renderAuthScreen(); };
  headerSub.textContent = 'แผงควบคุมผู้ดูแลระบบ';

  var html = '<div class="card">';
  html += '<h1>⚙️ แผงควบคุมผู้ดูแลระบบ</h1>';
  html += '<p class="lead">จัดการบัญชีผู้ใช้และประวัติคะแนนของระบบ</p>';
  html += '<div class="auth-tabs">';
  html += '<div class="auth-tab '+(adminTab==='users'?'active':'')+'" data-admintab="users">ผู้ใช้ ('+users.length+')</div>';
  html += '<div class="auth-tab '+(adminTab==='attempts'?'active':'')+'" data-admintab="attempts">ประวัติคะแนน</div>';
  html += '</div>';

  if(adminState.error){
    html += '<div class="server-status err">⚠️ '+escapeHtml(adminState.error)+'</div>';
  }

  if(adminTab==='users'){
    if(!users.length){
      html += '<p class="lead" style="font-style:italic;">ยังไม่มีผู้สมัครสมาชิกเลย</p>';
    } else {
      html += '<table class="subject-table"><thead><tr><th>ชื่อผู้ใช้</th><th>สมัครเมื่อ</th><th>สถานะ</th><th>ผลสอบ</th><th>จัดการ</th></tr></thead><tbody>';
      users.forEach(function(u){
        html += '<tr>';
        html += '<td><b>'+escapeHtml(u.username)+'</b>'+(u.activeSession?' <span class="you-tag">ออนไลน์</span>':'')+'</td>';
        html += '<td>'+fmtDateShort(u.createdAt)+'</td>';
        html += '<td>'+(u.suspended?'<span style="color:var(--bad);font-weight:700;">⏸️ ยังไม่เปิดใช้งาน</span>':'<span style="color:var(--good);font-weight:700;">✅ เปิดใช้งานแล้ว</span>')+'</td>';
        html += '<td>'+(u.examCount>0 ? u.bestPct+'% ('+u.examCount+' ครั้ง)' : '-')+'</td>';
        html += '<td><div class="row-actions" style="margin:0;">'+
          '<button class="btn small" data-admin-action="resetpw" data-username="'+escapeHtml(u.username)+'">🔑 รีเซ็ตรหัส</button>'+
          '<button class="btn small" data-admin-action="'+(u.suspended?'unsuspend':'suspend')+'" data-username="'+escapeHtml(u.username)+'">'+(u.suspended?'✅ อนุมัติ/เปิดใช้งาน':'⛔ ระงับบัญชี')+'</button>'+
          '<button class="btn small danger" data-admin-action="delete" data-username="'+escapeHtml(u.username)+'">🗑️ ลบบัญชี</button>'+
          '</div></td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    app.innerHTML = html;
    bindAdminUsersEvents(users);
  } else {
    html += '</div>';
    app.innerHTML = html;
    app.innerHTML += '<div class="card" id="attemptsCard"><p class="lead">🔄 กำลังโหลดประวัติคะแนน...</p></div>';
    bindAdminTabEvents(users);
    adminApiCall('adminListAttempts', {}, function(err, data){
      var card = document.getElementById('attemptsCard');
      if(!card) return;
      if(err || !data || !data.ok || !Array.isArray(data.attempts)){
        card.innerHTML = '<p class="lead" style="color:var(--bad);">โหลดไม่สำเร็จ: '+escapeHtml((data&&data.error)||(data&&data.ok?STALE_SERVER_MSG:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'))+'</p>';
        return;
      }
      renderAdminAttemptsTable(card, data.attempts);
    });
    return;
  }
}

function bindAdminTabEvents(users){
  document.querySelectorAll('[data-admintab]').forEach(function(t){
    t.onclick = function(){ adminTab = t.getAttribute('data-admintab'); adminState.error=''; renderAdminPanel(users); };
  });
}

function bindAdminUsersEvents(users){
  bindAdminTabEvents(users);
  document.querySelectorAll('[data-admin-action]').forEach(function(btn){
    btn.onclick = function(){
      var action = btn.getAttribute('data-admin-action');
      var username = btn.getAttribute('data-username');
      if(action==='suspend'){
        if(!confirm('ระงับการใช้งานบัญชี "'+username+'" หรือไม่? ผู้ใช้จะถูกบังคับออกจากระบบทันทีและล็อกอินไม่ได้จนกว่าจะปลดระงับ')) return;
        adminApiCall('adminSuspendUser', {username:username, suspended:true}, function(err,data){ afterAdminAction(err,data); });
      } else if(action==='unsuspend'){
        adminApiCall('adminSuspendUser', {username:username, suspended:false}, function(err,data){ afterAdminAction(err,data); });
      } else if(action==='delete'){
        var wipe = confirm('ลบบัญชี "'+username+'" ออกจากระบบหรือไม่?\n\nกด "ตกลง" = ลบบัญชี (ประวัติคะแนนเดิมจะยังอยู่ในระบบ)\nกด "ยกเลิก" = ไม่ลบ');
        if(!wipe) return;
        var alsoWipeAttempts = confirm('ต้องการลบประวัติคะแนนของ "'+username+'" ทั้งหมดด้วยหรือไม่? (กด "ตกลง" = ลบด้วย, "ยกเลิก" = เก็บประวัติไว้)');
        adminApiCall('adminDeleteUser', {username:username, wipeAttempts:alsoWipeAttempts}, function(err,data){ afterAdminAction(err,data); });
      } else if(action==='resetpw'){
        var newPw = prompt('ตั้งรหัสผ่านใหม่ให้ "'+username+'" (อย่างน้อย 4 ตัวอักษร) — แจ้งรหัสนี้ให้ผู้ใช้ทางช่องทางที่ปลอดภัย:');
        if(!newPw) return;
        adminApiCall('adminResetPassword', {username:username, newPassword:newPw}, function(err,data){
          afterAdminAction(err,data, data&&data.ok ? 'ตั้งรหัสผ่านใหม่ให้ '+username+' เรียบร้อยแล้ว' : null);
        });
      }
    };
  });
}

function afterAdminAction(err, data, okAlert){
  if(err || !data || !data.ok){
    adminState.error = (data && data.error) || 'ดำเนินการไม่สำเร็จ ลองใหม่อีกครั้ง';
    adminApiCall('adminListUsers', {}, function(e2,d2){ renderAdminPanel((d2&&d2.users)||[]); });
    return;
  }
  adminState.error = '';
  if(okAlert) alert(okAlert);
  adminApiCall('adminListUsers', {}, function(e2,d2){ renderAdminPanel((d2&&d2.users)||[]); });
}

function renderAdminAttemptsTable(card, attempts){
  attempts = attempts.slice().sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  var html = '<h2>ประวัติคะแนนทั้งหมด ('+attempts.length+')</h2>';
  if(!attempts.length){
    html += '<p class="lead" style="font-style:italic;">ยังไม่มีประวัติการทำข้อสอบ</p>';
  } else {
    html += '<table class="subject-table"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>โหมด</th><th>คะแนน</th><th>ผล</th><th></th></tr></thead><tbody>';
    attempts.forEach(function(a){
      html += '<tr>';
      html += '<td>'+fmtDateShort(a.ts)+'</td>';
      html += '<td>'+escapeHtml(a.username)+'</td>';
      html += '<td>'+(a.mode==='exam'?'จำลองสอบ':a.mode)+'</td>';
      html += '<td>'+a.pct+'% ('+a.correct+'/'+a.total+')</td>';
      html += '<td>'+(a.passed?'✅ ผ่าน':'❌ ไม่ผ่าน')+'</td>';
      html += '<td><button class="btn small danger" data-del-ts="'+encodeURIComponent(a.ts)+'" data-del-user="'+escapeHtml(a.username)+'">🗑️ ลบ</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  card.innerHTML = html;
  card.querySelectorAll('[data-del-ts]').forEach(function(btn){
    btn.onclick = function(){
      if(!confirm('ลบประวัติคะแนนรายการนี้หรือไม่? ทำแล้วกู้คืนไม่ได้')) return;
      var ts = decodeURIComponent(btn.getAttribute('data-del-ts'));
      var username = btn.getAttribute('data-del-user');
      adminApiCall('adminDeleteAttempt', {ts:ts, username:username}, function(err,data){
        if(err || !data || !data.ok){ alert('ลบไม่สำเร็จ: '+((data&&data.error)||'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้')); return; }
        adminApiCall('adminListAttempts', {}, function(e2,d2){
          if(d2 && d2.ok) renderAdminAttemptsTable(card, d2.attempts);
        });
      });
    };
  });
}

// ---- server version check (helps diagnose "ยังไม่ได้ deploy โค้ดล่าสุด") ----
var EXPECTED_SERVER_VERSION = 'v6-fix-legacy-row-delete-2026-08-17';
var serverVersionInfo = { checked:false, ok:false, version:'' };
function checkServerVersion(){
  apiCall('ping', {}, function(err, data){
    serverVersionInfo.checked = true;
    if(!err && data && data.version){
      serverVersionInfo.version = data.version;
      serverVersionInfo.ok = (data.version === EXPECTED_SERVER_VERSION);
    } else {
      serverVersionInfo.version = '';
      serverVersionInfo.ok = false;
    }
    // re-render the footer notice if we're still sitting on the auth screen
    var el = document.getElementById('serverVersionNotice');
    if(el){ el.outerHTML = renderServerVersionNotice(); }
  });
}
function renderServerVersionNotice(){
  if(!serverVersionInfo.checked){
    return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:var(--text-muted);">🔄 กำลังตรวจสอบเวอร์ชันเซิร์ฟเวอร์...</p>';
  }
  if(serverVersionInfo.ok){
    return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:#2e7d32;">✅ เซิร์ฟเวอร์เป็นโค้ดล่าสุด ('+escapeHtml(serverVersionInfo.version)+')</p>';
  }
  if(serverVersionInfo.version){
    return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:#c62828;">⚠️ เซิร์ฟเวอร์ยังเป็นโค้ดรุ่นเก่า (เจอเวอร์ชัน "'+escapeHtml(serverVersionInfo.version)+'" ต้องการ "'+EXPECTED_SERVER_VERSION+'") — กรุณาวาง Code.gs ล่าสุดแล้ว Deploy เวอร์ชันใหม่อีกครั้ง</p>';
  }
  return '<p id="serverVersionNotice" style="text-align:center;margin-top:6px;font-size:.72rem;color:#c62828;">⚠️ ตรวจสอบเวอร์ชันเซิร์ฟเวอร์ไม่ได้ — เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ หรือโค้ดยังเก่ามากจนไม่รู้จัก action นี้</p>';
}

// ---- init ----
renderAuthScreen();
checkServerVersion();

})();

</script>
</body>
